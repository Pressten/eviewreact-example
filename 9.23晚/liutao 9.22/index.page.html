  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

const AppContext = createContext(null);

  const [isDark, setIsDark] = useState(false);
  const [activeTab, setActiveTab] = useState("device");
  const [selectedDevice, setSelectedDevice] = useState(null);
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);

    activeTab,
    setActiveTab,
    selectedDevice,
    setSelectedDevice,
    selectedRowKeys,
    setSelectedRowKeys,
    jumpToTab,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;

}

function lookupIcon(name) {

    ICONS[name] ||

// ---- icon-plus (联通) online flow, same as packages/previewpc ----
const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let defaultColorId = "";

const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))

    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||

async function resolveIconInfo(name) {

      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length

    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };

  if (!info) return "";

  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(

    );

  if (plus === false) {

      "svg",

        height: size,
        viewBox: "0 0 24 24",

        strokeLinecap: "round",

      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });

    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },

  });

      filters: DEVICE_TYPES.map((t) => ({ text: t.text, value: t.value })),
      onFilter: (value, record) => record.type === value,
      render: (type) => findTypeName(type),
    },
    {
      title: "IP地址",
      dataIndex: "ip",
      key: "ip",
      width: 130,
    },
    {
      title: "机房位置",
      dataIndex: "room",
      key: "room",
      width: 120,
    },
    {
      title: "状态",
      dataIndex: "status",
      key: "status",
      width: 100,
      filters: Object.entries(DEVICE_STATUS).map(([k, v]) => ({ text: v.text, value: k })),
      onFilter: (value, record) => record.status === value,
      render: (status) => {
        const s = DEVICE_STATUS[status];
        return <StatusTag text={s.text} tone={s.tone} />;
      },
    },
    {
      title: "告警数",
      dataIndex: "alarmCount",
      key: "alarmCount",
      width: 90,
      align: "right",
      sorter: (a, b) => a.alarmCount - b.alarmCount,
    },
    {
      title: "CPU",
      dataIndex: "cpu",
      key: "cpu",
      width: 80,
      align: "right",
      sorter: (a, b) => a.cpu - b.cpu,
      render: (v) => (v > 0 ? `${v}%` : "—"),
    },
    {
      title: "最后在线时间",
      dataIndex: "lastTime",
      key: "lastTime",
      width: 170,
      sorter: (a, b) => new Date(a.lastTime).getTime() - new Date(b.lastTime).getTime(),
    },
    {
      title: "操作",
      key: "action",
      width: 90,
      align: "center",
      render: (_, record) => (
        <div className="device-action-group">
          <Button
            type="text"
            shape="circle"
            size="small"
            icon={<Icon name="bell" size={14} />}
            onClick={() => jumpToTab("alarm", record)}
          />
          <Button
            type="text"
            shape="circle"
            size="small"
            icon={<Icon name="settings" size={14} />}
            onClick={() => jumpToTab("config", record)}
          />
        </div>
      ),
    },
  ];

  const rowSelection = {
    selectedRowKeys,
    onChange: (keys) => setSelectedRowKeys(keys),
  };

  const handleDelete = () => {
    if (selectedRowKeys.length === 0) {
      message.warning("请先选择要删除的设备");
      return;
    }
    Modal.confirm({
      title: "确认删除",
      content: `确定要删除选中的 ${selectedRowKeys.length} 台设备吗?此操作不可撤销。`,
      okText: "删除",
      okButtonProps: { danger: true },
      cancelText: "取消",
      onOk: () => {
        message.success(`已删除 ${selectedRowKeys.length} 台设备`);
        setSelectedRowKeys([]);
      },
    });
  };

  const handleExport = () => {
    message.success(`已导出 ${filteredData.length} 条设备数据`);
  };

  const handleAdvSearch = () => {
    setDrawerOpen(false);
    message.success("高级搜索条件已应用");
  };

  const handleAdvReset = () => {
    setAdvType(undefined);
    setAdvStatus(undefined);
  };

  return (
    <div className="device-table-view">
      <div className="table-toolbar">
        <div className="table-toolbar__search">
          <Input
            prefix={<Icon name="search" size={14} />}
            placeholder="搜索设备名称、ID 或 IP"
            value={keyword}
            onChange={(e) => setKeyword(e.target.value)}
            allowClear
          />
        </div>
        <div className="table-toolbar__actions">
          <Button icon={<Icon name="sliders-horizontal" size={14} />} onClick={() => setDrawerOpen(true)}>
            高级搜索
          </Button>
          <Button danger icon={<Icon name="trash-2" size={14} />} onClick={handleDelete}>
            删除
          </Button>
          <Button type="primary" icon={<Icon name="download" size={14} />} onClick={handleExport}>
            导出
          </Button>
        </div>
      </div>

      {selectedRowKeys.length > 0 && (
        <div className="table-selected-bar">
          <Icon name="circle-check-big" size={14} color="var(--primary)" />
          已选择 <strong>{selectedRowKeys.length}</strong> 项
          <Button type="link" size="small" onClick={() => setSelectedRowKeys([])}>
            取消选择
          </Button>
        </div>
      )}

      <Table
        rowKey="id"
        columns={columns}
        dataSource={filteredData}
        rowSelection={rowSelection}
        pagination={{
          pageSize: 10,
          showTotal: (total) => `共 ${total} 条`,
          showSizeChanger: true,
          pageSizeOptions: [10, 20, 50],
        }}
        scroll={{ x: 1100 }}
      />

      <Drawer
        title="高级搜索"
        open={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        width={380}
        extra={
          <div className="drawer-footer-actions">
            <Button onClick={handleAdvReset}>重置</Button>
            <Button type="primary" onClick={handleAdvSearch}>
              查询
            </Button>
          </div>
        }
      >
        <div className="adv-search-form">
          <div className="adv-search-form__item">
            <label>设备类型</label>
            <Select
              placeholder="请选择设备类型"
              value={advType}
              onChange={setAdvType}
              allowClear
              options={DEVICE_TYPES.map((t) => ({ label: t.text, value: t.value }))}
            />
          </div>
          <div className="adv-search-form__item">
            <label>运行状态</label>
            <Select
              placeholder="请选择运行状态"
              value={advStatus}
              onChange={setAdvStatus}
              allowClear
              options={Object.entries(DEVICE_STATUS).map(([k, v]) => ({
                label: v.text,
                value: k,
              }))}
            />
          </div>
        </div>
      </Drawer>
    </div>
  );
}
  Object.assign(__export, { DeviceTable });
})();

/* ===== src/views/alarm-list/index.jsx ===== */
(function () {
  const { Table, Button, Empty } = antd;
  const { useApp, Icon, alarmList, ALARM_LEVEL } = __export;
  const StatusTag = __export.StatusTag;
// Layer 4: 告警列表视图 — 展示选中设备的告警记录
// 通过表格内设备名称链接跳转至此,展示该设备关联告警

  const columns = [
    {

      key: "id",
      width: 120,
    },
    {
      title: "告警级别",
      dataIndex: "level",
      key: "level",

      filters: Object.entries(ALARM_LEVEL).map(([k, v]) => ({ text: v.text, value: k })),
      onFilter: (value, record) => record.level === value,
      render: (level) => {
        const l = ALARM_LEVEL[level];
        return <StatusTag text={l.text} tone={l.tone} />;
      },
    },
    {
      title: "告警标题",
      dataIndex: "title",
      key: "title",
    },
    {
      title: "描述",
      dataIndex: "desc",
      key: "desc",
      ellipsis: true,
    },
    {
      title: "关联设备",
      dataIndex: "deviceId",
      key: "deviceId",
      width: 130,
      render: (deviceId) => {
        const dev = alarmList.find((a) => a.deviceId === deviceId);
        return (
          <Button
            type="link"
            className="alarm-device-link"
            onClick={() => {
              const d = { id: deviceId, name: deviceId };
              jumpToTab("config", d);
            }}
          >
            {deviceId}
          </Button>
        );
      },
    },
    {
      title: "发生时间",
      dataIndex: "time",
      key: "time",
      width: 170,
      sorter: (a, b) => new Date(a.time).getTime() - new Date(b.time).getTime(),
    },
  ];

  return (
    <div className="alarm-list-view">
      {selectedDevice ? (
        <div className="alarm-list-view__header">
          <div className="alarm-list-view__device">
            <Icon name="server" size={16} color="var(--primary)" />
            <span className="alarm-list-view__device-name">{selectedDevice.name}</span>
            <span className="alarm-list-view__device-id">ID: {selectedDevice.id}</span>
          </div>
          <div className="alarm-list-view__actions">
            <Button
              icon={<Icon name="settings" size={14} />}
              onClick={() => jumpToTab("config", selectedDevice)}
            >
              查看配置
            </Button>
            <Button type="primary" onClick={() => setActiveTab("device")}>
              返回设备管理
            </Button>
          </div>
        </div>
      ) : (
        <div className="alarm-list-view__header">
          <div className="alarm-list-view__device">
            <Icon name="bell" size={16} color="var(--primary)" />
            <span>全部告警记录</span>
          </div>
        </div>
      )}

      {data.length > 0 ? (
        <Table
          rowKey="id"
          columns={columns}
          dataSource={data}
          pagination={{
            pageSize: 10,
            showTotal: (total) => `共 ${total} 条`,
          }}

      ) : (
        <Empty description="该设备暂无告警记录" />
      )}
    </div>
  );
}
  Object.assign(__export, { AlarmList });
})();

/* ===== app.jsx ===== */
(function () {
  const { ConfigProvider, Breadcrumb, Tabs } = antd;
  const { AppProvider, useApp } = __export;
  const zhCN = __export.zhCN;
  const HeaderBar = __export.HeaderBar;
  const DeviceTable = __export.DeviceTable;
  const AlarmList = __export.AlarmList;
  const ConfigPanel = __export.ConfigPanel;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (per-domain files, e.g. device.js / alarm.js)
//   Layer 3 reusable      → src/components/{name}/ (cross-view, e.g. status-tag / header-bar)
//   Layer 4 views         → src/views/{name}/      (one per tab/section, e.g. device-table / alarm-list)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.










function PageContent() {
  const { activeTab, setActiveTab, selectedDevice } = useApp();

  const breadcrumbItems = [
    { title: "首页" },
    { title: "设备管理" },
    {
      title: activeTab === "device" ? "设备列表" : activeTab === "alarm" ? "告警列表" : "配置管理",
    },
  ];

  const tabItems = [
    { key: "device", label: "设备管理", children: <DeviceTable /> },
    { key: "alarm", label: "告警列表", children: <AlarmList /> },
    { key: "config", label: "配置管理", children: <ConfigPanel /> },
  ];

  return (
    <main className="app-main">
      <Breadcrumb items={breadcrumbItems} className="app-breadcrumb" />
      <div className="page-title-row">
        <h1 className="page-title">设备管理中心</h1>
        {selectedDevice && activeTab !== "device" && (
          <span className="page-title-sub">当前设备:{selectedDevice.name}</span>
        )}
      </div>
      <Tabs
        activeKey={activeTab}
        onChange={setActiveTab}
        items={tabItems}
        className="app-tabs"
      />
    </main>
  );
}

function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN}>
        <div className="app-root">
          <HeaderBar />
          <PageContent />
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
