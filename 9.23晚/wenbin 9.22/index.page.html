  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

.hb-brand {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.hb-brand strong {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.hb-brand span {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

.hb-env {
  font: var(--font-body-s);
  color: var(--success);
  background: var(--success-container);
  padding: 2px 8px;
  border-radius: var(--radius-badge);
  white-space: nowrap;
}

.hb-search {
  margin-left: auto;
  width: 360px;
  flex-shrink: 1;
}

.hb-right {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-shrink: 0;
}

.hb-icon-btn {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  border-radius: var(--radius-base);
  color: var(--on-surface-variant);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}

.hb-icon-btn:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}

.hb-user {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius-base);
  color: var(--on-surface);
  font: var(--font-body-m);
  transition: background 0.15s ease;
}

.hb-user:hover {
  background: var(--surface-variant);
}

.hb-user-name {
  font: var(--font-body-m);
  color: var(--on-surface);
}

.hb-noti {
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hb-noti-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--divider);
  margin-bottom: 6px;
}

.hb-noti-item {
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: var(--radius-base);
  cursor: default;
}

.hb-noti-item:hover {
  background: var(--surface-variant);
}

.hb-noti-item.unread .hb-noti-main p {
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.hb-noti-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  margin-top: 6px;
  flex-shrink: 0;
}

.hb-noti-dot.tone-success {
  background: var(--success);
}

.hb-noti-dot.tone-error {
  background: var(--error);
}

.hb-noti-dot.tone-info {
  background: var(--info);
}

.hb-noti-dot.tone-neutral {
  background: var(--on-surface-variant);
}

.hb-noti-main {
  min-width: 0;
}

.hb-noti-main p {
  margin: 0;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.hb-noti-main span {
  display: block;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hb-noti-main i {
  font-style: normal;
  font: var(--font-caption-s);
  color: var(--text-placeholder);
}


.sb-aside {
  width: 248px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-highest);
  border-right: 1px solid var(--divider);
  position: sticky;
  top: 48px;
  height: calc(100vh - 48px);
  overflow-x: hidden;
  overflow-y: auto;
  transition: width 0.2s ease;
  padding: 8px;
  box-sizing: border-box;
}

.sb-aside.collapsed {
  width: 64px;
}

.sb-item-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.sb-collapse {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-inline);
  width: 100%;
  padding: 10px 0;
  border: none;
  background: transparent;
  border-radius: var(--radius-base);
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
  flex-shrink: 0;
}

.sb-collapse:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}


.ov-page {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
}

.ov-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--spacing-gutter);
}

.ov-grid-2 {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: var(--spacing-gutter);
}

.ov-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1.15fr 1fr;
  gap: var(--spacing-gutter);
  align-items: stretch;
}

.ov-gauge-info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--spacing-inline);
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-base);
  background: var(--surface-variant);
}

.ov-gauge-info div {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.ov-gauge-info span {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

.ov-gauge-info b {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.ov-tl {
  display: flex;
  flex-direction: column;
}

.ov-tl-item {
  position: relative;
  padding: 0 0 16px 20px;
}

.ov-tl-item:last-child {
  padding-bottom: 0;
}

.ov-tl-item::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 8px;
  bottom: -4px;
  width: 2px;
  background: var(--divider);
}

.ov-tl-item:last-child::before {
  display: none;
}

.ov-tl-dot {
  position: absolute;
  left: 0;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: var(--radius-full);
  border: 2px solid var(--surface-container-highest);
  box-sizing: content-box;
  background: var(--on-surface-variant);
}

.ov-tl-dot.tone-success {
  background: var(--success);
}

.ov-tl-dot.tone-error {
  background: var(--error);
}

.ov-tl-dot.tone-processing {
  background: var(--info);
}

.ov-tl-main p {
  margin: 0;
  font: var(--font-body-s);
  color: var(--on-surface);
  line-height: 1.5;
}

.ov-tl-main i {
  font-style: normal;
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

.ov-foot-note {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

@media (max-width: 1280px) {
  .ov-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .ov-grid-2,
  .ov-grid-3 {
    grid-template-columns: 1fr;
  }
}


.sec-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.sec-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
  padding: 14px var(--spacing-inset);
  border-bottom: 1px solid var(--divider);
  flex-wrap: wrap;
}

.sec-card-title {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  min-width: 0;
}

.sec-card-icon {
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}

.sec-card-text {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sec-card-sub {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.sec-card-extra {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.sec-card-body {
  padding: 16px var(--spacing-inset) var(--spacing-inset);
  flex: 1;
  min-width: 0;
}


.stat-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 20px;
  border: none;
  border-radius: var(--radius-container);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-card);
  cursor: pointer;
  text-align: left;
  font: var(--font-body-m);
  color: var(--on-surface);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-base);
}

.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.stat-brand .stat-icon {
  background: var(--primary-container);
  color: var(--primary-fixed);
}

.stat-info .stat-icon {
  background: var(--info-container);
  color: var(--info);
}

.stat-critical .stat-icon {
  background: var(--critical-container);
  color: var(--critical);
}

.stat-success .stat-icon {
  background: var(--success-container);
  color: var(--success);
}

.stat-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.stat-label {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.stat-value {
  font: var(--font-display-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  line-height: 1.25;
  white-space: nowrap;
}

.stat-value em {
  font-style: normal;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  margin-left: 4px;
}

.stat-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.stat-meta b {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-weight: var(--font-weight-medium);
}

.stat-meta b.stat-up {
  color: var(--success);
}

.stat-meta b.stat-down {
  color: var(--error);
}

.stat-meta i {
  font-style: normal;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


.mg-page {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
}

.mg-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-stack) var(--spacing-gutter);
  align-items: flex-end;
}

.mg-f-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mg-f-item > label {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.mg-fw .ant-input {
  width: 320px;
}

.mg-f-actions {
  display: flex;
  gap: var(--spacing-inline);
  margin-left: auto;
}

.mg-advanced {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease;
}

.mg-advanced.open {
  max-height: 200px;
}

.mg-advanced-inner {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-stack) var(--spacing-gutter);
  align-items: flex-end;
  margin-top: var(--spacing-stack);
  padding-top: var(--spacing-stack);
  border-top: 1px dashed var(--divider);
}

.mg-chips {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  min-height: 24px;
}

.mg-batch-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  border-radius: var(--radius-container);
  background: var(--primary-container);
  animation: mg-batch-in 0.22s ease;
}

@keyframes mg-batch-in {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.mg-batch-count {
  font: var(--font-body-m);
  color: var(--on-primary-container);
}

.mg-batch-count b {
  color: var(--primary-fixed);
  font-weight: var(--font-weight-semibold);
  margin: 0 2px;
}

.mg-name {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.mg-name-link {
  border: none;
  background: none;
  padding: 0;
  text-align: left;
  cursor: pointer;
  font: var(--font-body-m);
  color: var(--interactive-link);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 230px;
}

.mg-name-link:hover {
  color: var(--interactive-link-hover);
  text-decoration: underline;
}

.mg-name-meta {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.type-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 8px;
  border-radius: var(--radius-badge);
  background: var(--surface-variant);
  color: var(--on-surface);
  font: var(--font-body-s);
  white-space: nowrap;
}

.mg-owner {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mg-owner-text {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
  min-width: 0;
}

.mg-owner-text span {
  font: var(--font-body-s);
  color: var(--on-surface);
}

.mg-owner-text i {
  font-style: normal;
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

.mg-quality {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: default;
}

.mg-quality i {
  font-style: normal;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.mg-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.mg-qpop {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 240px;
}

.mg-qpop-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.mg-qpop-row > span {
  width: 48px;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  flex-shrink: 0;
}

.mg-qpop-row .ant-progress {
  flex: 1;
  margin: 0;
}

.mg-qpop-row i {
  font-style: normal;
  width: 28px;
  text-align: right;
  font: var(--font-body-s);
  color: var(--on-surface);
}

.mg-expanded {
  display: flex;
  gap: var(--spacing-gutter);
  align-items: flex-start;
}

.mg-exp-desc {
  flex: 1;
  min-width: 0;
}

.mg-exp-desc label {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.mg-exp-desc p {
  margin: 4px 0 8px;
  font: var(--font-body-m);
  color: var(--on-surface);
  line-height: 1.6;
}

.mg-exp-tags i {
  font-style: normal;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.mg-exp-meta {
  width: 320px;
  flex-shrink: 0;
}

.mg-modal-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.mg-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: var(--spacing-gutter);
}

.mg-form-grid .span-2 {
  grid-column: span 2;
}

.ex-body {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-top: 4px;
}

.ex-alert {
  border-radius: var(--radius-base);
}

.ex-block {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ex-block > label {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.ex-row2 {
  flex-direction: row;
  gap: var(--spacing-gutter);
  align-items: flex-end;
  flex-wrap: wrap;
}

.ex-row2 > div {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ex-est {
  font: var(--font-body-m);
  color: var(--on-surface);
  padding: 5px 0;
}

.ex-fmt {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.ex-fmt .ex-fmt-item {
  margin: 0;
  padding: 10px 12px;
  border: 1px solid var(--outline);
  border-radius: var(--radius-base);
  transition: border-color 0.15s ease, background 0.15s ease;
}

.ex-fmt .ex-fmt-item.active {
  border-color: var(--primary);
  background: var(--primary-container);
}

.ex-fmt-card {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--on-surface);
}

.ex-fmt-card b {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
}

.ex-fmt-card i {
  font-style: normal;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.ex-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-inline);
  padding-top: 4px;
}

.ex-running {
  align-items: center;
  padding: 20px 0 8px;
}

.ex-running-icon {
  color: var(--primary);
}

.ex-running p {
  margin: 0;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
}

.ex-file {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-base);
  background: var(--surface-variant);
  color: var(--primary);
}

.ex-file div {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.ex-file b {
  font: var(--font-body-m);
  color: var(--on-surface);
  word-break: break-all;
}

.ex-file span {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.dw-title {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.dw-title-name {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dw-extra {
  display: flex;
  gap: var(--spacing-inline);
}

.dw-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dw-footer-right {
  display: flex;
  gap: var(--spacing-inline);
}

.dw-body {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
}

.dw-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--spacing-inline);
}

.dw-stats > div {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 12px 8px;
  border-radius: var(--radius-base);
  background: var(--surface-variant);
  color: var(--primary);
}

.dw-stats b {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.dw-stats span {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.dw-code {
  font-family: monospace;
  font-size: 12px;
  background: var(--surface-variant);
  color: var(--primary-fixed-dim);
  padding: 1px 6px;
  border-radius: var(--radius-xs);
}

.dw-req {
  color: var(--error);
  font: var(--font-body-s);
}

.dw-opt {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.dw-logs {
  display: flex;
  flex-direction: column;
  padding-top: 4px;
}

.dw-log {
  position: relative;
  padding: 0 0 16px 20px;
}

.dw-log:last-child {
  padding-bottom: 0;
}

.dw-log::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 8px;
  bottom: -4px;
  width: 2px;
  background: var(--divider);
}

.dw-log:last-child::before {
  display: none;
}

.dw-log-dot {
  position: absolute;
  left: 0;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: var(--radius-full);
  background: var(--on-surface-variant);
}

.dw-log-dot.tone-success {
  background: var(--success);
}

.dw-log-dot.tone-error {
  background: var(--error);
}

.dw-log-dot.tone-info {
  background: var(--info);
}

.dw-log-main p {
  margin: 0;
  font: var(--font-body-m);
  color: var(--on-surface);
}

.dw-log-main span {
  display: block;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.dw-log-main i {
  font-style: normal;
  font: var(--font-caption-s);
  color: var(--text-placeholder);
}

.dw-tasks {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-stack);
  padding-top: 4px;
}

// ---- icon-plus (联通) online flow, same as packages/previewpc ----
const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url }
const svgCache = new Map(); // "name&variant&color" -> svg text

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (cached in iconInfoMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  try {
    const resp = await fetch(
      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length
    );
    const selected = selectBestIcon(entry?.icons || [], name);
    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };
    return iconInfoMap[name];
  } catch (e) {
    return null;
  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

function Icon({
  name,
  src,
  size = 16,
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
}) {
  const [plus, setPlus] = useState(plusState); // reuse already-probed result
  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${color}`) || ""
  );

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${color}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, color).then((s) => {
        if (!alive) return;
        svgCache.set(key, s);
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, color]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set

    return React.createElement("img", {
      src: src,
      width: size,
      height: size,
      className: className,
      alt: "",
      "aria-hidden": true,
      style: { ...style, display: "inline-block", verticalAlign: "middle" },

  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        style: { ...style, stroke: color || "currentColor" },

      className,
      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });

    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },
    dangerouslySetInnerHTML: { __html: svg },

/* ===== assets/shared/chart.jsx ===== */
(function () {
  const { useRef, useEffect, useState, forwardRef, useImperativeHandle } = React;
// Chart — HUICharts 的 React 封装(命令式 → 声明式)
// 底层: echarts + hui-charts.umd.js(全局 HUICharts),配置项 option 原样透传给 setSimpleOption。
// 暗色联动:自动监听 <html> 的 .dark class,切换 hdesign-light / hdesign-dark 主题并重建图表。
const Chart = forwardRef(function Chart(
  { name, option, className, style, onChartRendered },
  ref
) {
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const renderedRef = useRef(onChartRendered);
  renderedRef.current = onChartRendered;

  // .dark 切换 → 递增 tick 触发主 effect 重建(走同一条 init/dispose 路径)
  const [darkTick, setDarkTick] = useState(0);
  useEffect(() => {
    const mo = new MutationObserver(() => setDarkTick((t) => t + 1));
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    return () => mo.disconnect();
  }, []);

  useEffect(() => {
    const dom = containerRef.current;
    if (!dom || !window.HUICharts) return;

    const isDark = document.documentElement.classList.contains("dark");
    const chart = new HUICharts();
    chart.init(dom, { renderer: "svg"});
    chart.setSimpleOption(name, {
      theme: isDark ? "hdesign-dark" : "hdesign-light",
      ...option,
    });
    chart.render();
    chartRef.current = chart;
    if (renderedRef.current) renderedRef.current(chart);

    // 容器尺寸变化(侧栏折叠/窗口缩放/响应式) → 同步画布
    const ro = new ResizeObserver(() => {
      if (chartRef.current && !chartRef.current._disposed) chart.resize();
    });
    ro.observe(dom);

    return () => {
      ro.disconnect();
      try { chart.dispose(); } catch (e) { /* 容器已卸载时静默 */ }
      chartRef.current = null;
    };
    // JSON.stringify 作 dep:option 是 JSX 内联对象,内容不变则不重建
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [name, JSON.stringify(option), darkTick]);

  useImperativeHandle(ref, () => ({
    getEchartsInstance: () => (chartRef.current ? chartRef.current.getEchartsInstance() : null),
    resizeHandler: () => {
      if (chartRef.current) chartRef.current.resize();
    },
  }), []);

  const wrapperStyle = { width: "100%", height: "100%", ...style };
  return <div ref={containerRef} className={className} style={wrapperStyle} />;
});
  Object.assign(__export, { Chart });
})();

const fmtSize = (v) => (v >= 1024 ? `${(v / 1024).toFixed(1)} GB` : `${v} MB`);

function ManagementView() {
  const { datasets, setDatasets, setRecycleItems, globalKeyword } = useApp();
  const [draft, setDraft] = useState(() => ({ ...emptyFilter, keyword: globalKeyword }));
  const [applied, setApplied] = useState(() => ({ ...emptyFilter, keyword: globalKeyword }));
  const [advOpen, setAdvOpen] = useState(false);
  const [chips, setChips] = useState([]);

  useEffect(() => {
    if (globalKeyword) {
      setDraft((f) => ({ ...f, keyword: globalKeyword }));
      setApplied((f) => ({ ...f, keyword: globalKeyword }));
    }
  }, [globalKeyword]);

  const now = () => dayjs().format("YYYY-MM-DD HH:mm");

  const filtered = useMemo(() => {
    return datasets.filter((d) => {
      const k = applied.keyword.trim().toLowerCase();
      if (k && !(d.name.toLowerCase().includes(k) || d.id.toLowerCase().includes(k) || d.owner.includes(k) || d.type.includes(k) || (d.tags || []).some((t) => t.includes(k)))) return false;
      if (applied.type !== "all" && d.type !== applied.type) return false;
      if (applied.owner !== "all" && d.owner !== applied.owner) return false;
      if (applied.source !== "all" && d.source !== applied.source) return false;
      if (applied.status !== "all" && d.status !== applied.status) return false;
      if (applied.onlyMine && d.owner !== "陈志远") return false;
      if (applied.range && applied.range[0] && applied.range[1]) {
        const day = d.updated.slice(0, 10);
        if (day < applied.range[0] || day > applied.range[1]) return false;
      }
      if (d.quality < applied.minQuality) return false;
      if (d.records < applied.minRecords) return false;
      if (chips.length && !chips.every((c) => (d.tags || []).includes(c))) return false;
      return true;
    });

    const max = datasets.reduce((m, d) => Math.max(m, parseInt(d.id.slice(-4), 10) || 0), 0);
    const record = {
      id: `DS-2026-${String(max + 1).padStart(4, "0")}`,
      name: values.name,
      type: values.type,
      source: values.source,
      owner: values.owner,
      department: values.dept,
      records: 0,
      sizeMB: 0,

      fields: values.fields,
      synced: false,
      views: 0,
      desc: values.desc,
      tags: [],

      isPublic: values.isPublic,

    setDatasets((prev) => [record, ...prev]);

  function handleEdit(values) {
    setDatasets((prev) =>
      prev.map((d) =>
        d.id === editRecord.id
          ? {
              ...d,

              desc: values.desc,
              type: values.type,

              fields: values.fields,

              isPublic: values.isPublic,
              quality: values.qualityTarget / 20,
              updated: now(),
            }
          : d
      )
    );
    setEditRecord(null);
    message.success(`数据集「${values.name}」已更新`);
  }
}
  Object.assign(__export, { ManagementView });
})();

/* ===== src/views/sync-view/index.jsx ===== */
(function () {
  const { useEffect, useMemo, useRef, useState } = React;
  const { Button, Dropdown, Input, Modal, Progress, Segmented, Select, message } = antd;
  const { Icon, dailySync, seedTasks, sourceOptions, syncLogs } = __export;
  const Chart = __export.Chart;
  const SectionCard = __export.SectionCard;
  const StatusTag = __export.StatusTag;
const sourceIcons = { MySQL: "database", Kafka: "wifi", "REST API": "cloud", 文件上传: "upload", "OCR 采集": "scan-line" };

function SyncView() {
  const [tasks, setTasks] = useState(() => seedTasks.map((t) => ({ ...t })));
  const [kw, setKw] = useState("");
  const [src, setSrc] = useState("all");
  const [seg, setSeg] = useState("all");
  const [modal, contextHolder] = Modal.useModal();
  const notified = useRef(new Set());
  const timer = useRef(null);

  useEffect(() => {
    timer.current = setInterval(() => {
      setTasks((prev) =>
        prev.map((t) => {
          if (t.status !== "running") return t;
          const next = Math.min(100, t.progress + Math.round(1 + Math.random() * 3));
          if (next >= 100) {
            if (!notified.current.has(t.id)) {
              notified.current.add(t.id);
              message.success(`「${t.name}」本轮同步完成`);
            }
            return { ...t, progress: 100, status: "done" };
          }
          return { ...t, progress: next };
        })
      );
    }, 900);
    return () => clearInterval(timer.current);
  }, []);

  const filtered = useMemo(
    () =>
      tasks.filter((t) => {
        const k = kw.trim().toLowerCase();
        if (k && !t.name.toLowerCase().includes(k)) return false;
        if (src !== "all" && t.source !== src) return false;
        if (seg !== "all" && t.status !== seg) return false;
        return true;
      }),
    [tasks, kw, src, seg]
  );

  const setStatus = (id, status, reset) => {
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, status, progress: reset ? 0 : t.progress } : t)));
  };

  const removeTask = (t) => {
    modal.confirm({
      title: "删除同步任务",
      icon: <Icon name="triangle-alert" size={18} color="var(--warning)" />,
      content: `任务「${t.name}」删除后不可恢复，确定删除吗？`,
      okText: "删除任务",
      okButtonProps: { danger: true },
      onOk: () => {
        setTasks((prev) => prev.filter((x) => x.id !== t.id));
        message.warning(`任务「${t.name}」已删除`);
      },
    });
  };

  const moreMenu = (t) => ({
    items: [
      { key: "log", icon: <Icon name="file-text" size={14} />, label: "查看运行日志" },
      { key: "edit", icon: <Icon name="pencil" size={14} />, label: "编辑调度计划" },
      { type: "divider" },
      { key: "del", icon: <Icon name="trash-2" size={14} />, label: "删除任务", danger: true },
    ],
    onClick: ({ key }) => {
      if (key === "log") message.info(`「${t.name}」运行日志：近 3 次执行全部留痕，可联系管理员导出`);
      else if (key === "edit") message.info("演示操作：调度计划编辑器即将上线");
      else removeTask(t);
    },
  });

  const running = tasks.filter((t) => t.status === "running").length;
  const failed = tasks.filter((t) => t.status === "failed").length;

  return (
    <div className="sy-page">
      {contextHolder}
      <div className="page-head">
        <div>
          <h2>数据同步</h2>
          <p>
            共 {tasks.length} 个同步任务 · 运行中 {running} 个{failed > 0 ? ` · 失败 ${failed} 个待处理` : ""}
          </p>
        </div>
        <div className="page-head-actions">
          <Button icon={<Icon name="play" size={14} />} onClick={() => { setTasks((prev) => prev.map((t) => (t.status === "queued" ? { ...t, status: "running" } : t))); message.success("已启动全部排队任务"); }}>
            同步全部
          </Button>
          <Button type="primary" icon={<Icon name="plus" size={14} />} onClick={() => message.info("演示：任务编排器即将上线")}>
            新建同步任务
          </Button>
        </div>
      </div>

      <div className="sy-layout">
        <SectionCard icon="refresh-cw" title="任务列表" subtitle="运行中的任务将实时推进进度">
          <div className="sy-toolbar">
            <Input allowClear style={{ width: 240 }} value={kw} onChange={(e) => setKw(e.target.value)} prefix={<Icon name="search" size={14} />} placeholder="搜索任务名称" />
            <Select style={{ width: 150 }} value={src} onChange={setSrc} options={[{ value: "all", label: "全部来源" }, ...sourceOptions.map((v) => ({ value: v, label: v }))]} />
            <Segmented value={seg} onChange={setSeg} options={[{ label: "全部", value: "all" }, { label: "运行中", value: "running" }, { label: "失败", value: "failed" }]} />
          </div>
          <div className="sy-tasks">
            {filtered.map((t) => (
              <div className="sy-task" key={t.id}>
                <div className="sy-task-head">
                  <span className="sy-task-icon">
                    <Icon name={sourceIcons[t.source] || "server"} size={18} />
                  </span>
                  <div className="sy-task-info">
                    <b>{t.name}</b>
                    <span>
                      {t.source} · {t.schedule} · 上次执行 {t.lastRun}
                    </span>
                  </div>
                  <StatusTag status={t.status} />
                </div>
                <Progress percent={t.progress} size="small" status={t.status === "failed" ? "exception" : t.status === "done" ? "success" : "active"} />
                <div className="sy-task-foot">
                  <span>同步量 {t.records}</span>
                  <span>耗时/延迟 {t.latency}</span>
                  <div className="sy-task-actions">
                    {t.status === "running" ? (
                      <Button size="small" icon={<Icon name="pause" size={13} />} onClick={() => { setStatus(t.id, "queued"); message.info(`「${t.name}」已暂停`); }}>
                        暂停
                      </Button>
                    ) : (
                      <Button size="small" type="primary" ghost icon={<Icon name="play" size={13} />} onClick={() => { setStatus(t.id, "running", t.status === "done"); message.success(`「${t.name}」已启动`); }}>
                        {t.status === "failed" ? "重试" : t.status === "done" ? "重新运行" : "启动"}
                      </Button>
                    )}
                    <Dropdown menu={moreMenu(t)} trigger={["click"]}>
                      <Button size="small" type="text" icon={<Icon name="ellipsis" size={14} />} />
                    </Dropdown>
                  </div>
                </div>
              </div>
            ))}
            {filtered.length === 0 && (
              <div className="sy-empty">
                <Icon name="inbox" size={28} />
                <p>没有符合条件的任务</p>
              </div>
            )}
          </div>
        </SectionCard>

        <div className="sy-side">
          <SectionCard icon="chart-column" title="近 7 日同步量" subtitle="万条 / 日">
            <Chart name="BarChart" option={{ data: dailySync, xAxis: { data: "日期" }, yAxisTitle: "同步量 (万条)" }} style={{ height: 240 }} />
          </SectionCard>
          <SectionCard icon="file-text" title="运行日志">
            <div className="sy-logs">
              {syncLogs.map((l, i) => (
                <div className="sy-log" key={i}>
                  <span className={`sy-log-dot tone-${l.tone}`} />
                  <div>
                    <p>{l.title}</p>
                    <span>{l.desc}</span>
                    <i>{l.time}</i>
                  </div>
                </div>
              ))}
            </div>
          </SectionCard>
        </div>
      </div>
    </div>
  );
}
  Object.assign(__export, { SyncView });
})();

      render: (_, r) => (
        <div className="mg-actions">
          <Button size="small" type="link" icon={<Icon name="rotate-ccw" size={13} />} onClick={() => restore(r)}>
            恢复
          </Button>
          <Button size="small" type="link" danger icon={<Icon name="x" size={13} />} onClick={() => destroy(r)}>
            彻底删除
          </Button>
        </div>
      ),
    },
  ];

  return (
    <div className="rc-page">
      {contextHolder}
      <div className="page-head">
        <div>
          <h2>回收站</h2>
          <p>共 {recycleItems.length} 项数据 · 占用 {(totalMB / 1024).toFixed(2)} GB · 到期后自动彻底删除</p>
        </div>
        <div className="page-head-actions">
          <Button danger disabled={recycleItems.length === 0} icon={<Icon name="trash-2" size={14} />} onClick={clearAll}>
            清空回收站
          </Button>
        </div>
      </div>

      <Alert
        type="info"
        showIcon
        icon={<Icon name="info" size={16} />}
        message="回收站内的数据将保留 30 天，到期后自动彻底删除；恢复的数据集将回到「已下线」状态。"
        className="rc-alert"
      />

      <SectionCard icon="trash-2" title="已删除数据" subtitle={`共 ${filtered.length} 条结果`}>
        <div className="rc-toolbar">
          <Input allowClear style={{ width: 260 }} value={kw} onChange={(e) => setKw(e.target.value)} prefix={<Icon name="search" size={14} />} placeholder="搜索数据集名称 / ID" />
          <Select style={{ width: 150 }} value={type} onChange={setType} options={[{ value: "all", label: "全部类型" }, ...typeOptions.map((v) => ({ value: v, label: v }))]} />
        </div>
        <Table rowKey="id" columns={columns} dataSource={filtered} pagination={{ pageSize: 8, showTotal: (t) => `共 ${t} 条` }} />
      </SectionCard>
    </div>
  );
}
  Object.assign(__export, { RecycleView });
})();

/* ===== app.jsx ===== */
(function () {
  const { ConfigProvider } = antd;
  const { AppProvider, useApp } = __export;
  const zhCN = __export.zhCN;
  const HeaderBar = __export.HeaderBar;
  const SideBar = __export.SideBar;
  const OverviewView = __export.OverviewView;
  const ManagementView = __export.ManagementView;
  const SyncView = __export.SyncView;
  const RecycleView = __export.RecycleView;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (per-domain files, e.g. device.js / alarm.js)
//   Layer 3 reusable      → src/components/{name}/ (cross-view, e.g. status-tag / section-card)
//   Layer 4 views         → src/views/{name}/      (one per tab/section, e.g. device-table / header-bar)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.












function Shell() {
  const { activeMenu } = useApp();
  return (
    <div className="app-root">
      <HeaderBar />
      <div className="app-body">
        <SideBar />
        <main className="app-main" key={activeMenu}>
          {activeMenu === "overview" && <OverviewView />}
          {activeMenu === "management" && <ManagementView />}
          {activeMenu === "sync" && <SyncView />}
          {activeMenu === "recycle" && <RecycleView />}
        </main>
      </div>
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN} hashed={false}>
        <Shell />
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
