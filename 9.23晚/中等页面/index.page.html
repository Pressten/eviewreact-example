  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 页面根节点与内容区的 token 消费示例 */
.app-root {
  min-height: 100vh;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.page-main {
  padding: 0 var(--spacing-page) var(--spacing-page);
}

/* 内容容器：Level 1 卡片（有阴影则不加边框） */
.card-surface {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}


.page-header {
  padding: var(--spacing-page) var(--spacing-page) var(--spacing-section);
}

.page-header__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  flex-wrap: wrap;
}

.page-header__crumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.page-header__crumb-current {
  color: var(--on-surface);
}

.page-header__title {
  margin: 6px 0 0;
  font: var(--font-display-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.page-header__desc {
  margin: var(--spacing-inline) 0 0;
  max-width: 720px;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
}

.page-header__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.page-header__kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--spacing-gutter);
  margin-top: var(--spacing-page);
}

.kpi-card {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  padding: var(--spacing-gutter);
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}

.kpi-card__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: var(--radius-lg);
}

.kpi-card__icon--brand { background: var(--primary-container); color: var(--primary); }
.kpi-card__icon--success { background: var(--success-container); color: var(--success); }
.kpi-card__icon--critical { background: var(--critical-container); color: var(--critical); }
.kpi-card__icon--error { background: var(--error-container); color: var(--error); }

.kpi-card__body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.kpi-card__label {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.kpi-card__value {
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.kpi-card__unit {
  margin-left: 4px;
  font: var(--font-caption-m);
  font-style: normal;
  color: var(--on-surface-variant);
}

@media (max-width: 1024px) {
  .page-header__kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}


.data-tabs {
  padding: 0 var(--spacing-inset) var(--spacing-inset);
}

.tab-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.tab-label__count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  border-radius: var(--radius-full);
  background: var(--surface-variant);
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
  font-weight: var(--font-weight-medium);
}

.data-tabs .ant-tabs-tab-active .tab-label__count {
  background: var(--primary-container);
  color: var(--primary);
}


.metric-list {
  display: flex;
  flex-direction: column;
}

/* 表格工具区 */
.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  flex-wrap: wrap;
  margin-bottom: var(--spacing-stack);
}

.table-toolbar__filters,
.table-toolbar__extra {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-wrap: wrap;
}

.toolbar-search {
  width: 280px;
}

.toolbar-select {
  width: 148px;
}

.table-toolbar__count {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.table-toolbar__count em,
.selection-bar__text em {
  font-style: normal;
  font-weight: var(--font-weight-semibold);
  color: var(--primary);
}

/* 下钻提示 */
.table-hint {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px var(--spacing-stack);
  margin-bottom: var(--spacing-stack);
  border-radius: var(--radius-base);
  background: var(--info-container);
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

.table-hint svg {
  color: var(--primary);
  flex: none;
}

/* 选中态工具区 */
.selection-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
  flex-wrap: wrap;
  padding: 8px var(--spacing-stack);
  margin-bottom: var(--spacing-stack);
  border-radius: var(--radius-base);
  background: var(--primary-container);
}

.selection-bar__text {
  font: var(--font-caption-m);
  color: var(--on-primary-container);
}

.selection-bar__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

/* 表格内链接与数字 */
.cell-link {
  padding-inline: 0;
  height: auto;
  font: var(--font-body-m);
}

.num-cell {
  font-variant-numeric: tabular-nums;
  color: var(--on-surface);
}

.row-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}


.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-badge);
  font: var(--font-caption-m);
  white-space: nowrap;
}

/* 软色徽标：底色用 *-container，文字用主状态色 */
.status-tag--success { background: var(--success-container); color: var(--success); }
.status-tag--critical { background: var(--critical-container); color: var(--critical); }
.status-tag--warning { background: var(--warning-container); color: var(--on-warning-container); }
.status-tag--error { background: var(--error-container); color: var(--error); }
.status-tag--info { background: var(--info-container); color: var(--info); }
.status-tag--brand { background: var(--primary-container); color: var(--primary); }
.status-tag--neutral { background: var(--surface-variant); color: var(--on-surface-variant); }

/* 非语义分类色：血缘「下游」层级 */
.status-tag--violet { background: rgba(113, 90, 251, 0.12); color: var(--interactive-link-visited); }

.dark .status-tag--warning { color: var(--warning); }

  const { useState, useEffect, createContext, useContext } = React;
// Layer 1: 全局状态 — 主题模式与业务状态
// 换肤单轨驱动:isDark 只切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

  const [keyword, setKeyword] = useState("");
  const [domain, setDomain] = useState("all");
  const [frequency, setFrequency] = useState("all");
  const [status, setStatus] = useState("all");
  const [selectedKeys, setSelectedKeys] = useState([]);

  const dataSource = useMemo(() => {
    const kw = keyword.trim().toLowerCase();
    return metricList.filter((item) => {
      const hitKeyword =
        !kw ||
        item.name.toLowerCase().includes(kw) ||
        item.code.toLowerCase().includes(kw) ||
        item.source.toLowerCase().includes(kw);
      const hitDomain = domain === "all" || item.domain === domain;
      const hitFrequency = frequency === "all" || item.frequency === frequency;
      const hitStatus = status === "all" || item.status === status;
      return hitKeyword && hitDomain && hitFrequency && hitStatus;
    });
  }, [keyword, domain, frequency, status]);

  const resetFilters = () => {
    setKeyword("");
    setDomain("all");
    setFrequency("all");
    setStatus("all");

          {text}

/* ===== src/views/lineage-trace/index.jsx ===== */
(function () {
  const { useMemo, useState } = React;
  const { Button, Input, Select, Table, Tooltip } = antd;
  const { Icon, lineageList, levelOptions, nodeTypeOptions } = __export;
  const StatusTag = __export.StatusTag;
  const ContextBanner = __export.ContextBanner;
// Layer 4: 三级页签「血缘溯源」— 由采集明细下钻进入，展示上下游链路与节点明细
const LEVEL_META = [
  { key: "上游", tone: "info", desc: "数据来源节点" },
  { key: "当前", tone: "brand", desc: "当前加工节点" },
  { key: "下游", tone: "violet", desc: "消费与输出节点" },
];

function LineageTrace({ metric, record, onBack }) {
  const [keyword, setKeyword] = useState("");
  const [level, setLevel] = useState("all");
  const [nodeType, setNodeType] = useState("all");

  const dataSource = useMemo(() => {
    const kw = keyword.trim().toLowerCase();
    return lineageList.filter((item) => {
      const hitKeyword =
        !kw ||
        item.nodeName.toLowerCase().includes(kw) ||
        item.nodeCode.toLowerCase().includes(kw) ||
        item.tableName.toLowerCase().includes(kw);
      const hitLevel = level === "all" || item.level === level;
      const hitType = nodeType === "all" || item.nodeType === nodeType;
      return hitKeyword && hitLevel && hitType;
    });
  }, [keyword, level, nodeType]);

  const columns = [
    { title: "节点编码", dataIndex: "nodeCode", key: "nodeCode", width: 150 },
    {
      title: "血缘层级",
      dataIndex: "level",
      key: "level",
      width: 110,
      render: (value) => <StatusTag status={value} />,
    },
    {
      title: "节点类型",
      dataIndex: "nodeType",
      key: "nodeType",
      width: 100,
      render: (value) => <span className="type-chip">{value}</span>,
    },
    { title: "节点名称", dataIndex: "nodeName", key: "nodeName", width: 200 },
    { title: "物理表 / 接口", dataIndex: "tableName", key: "tableName", width: 230 },
    { title: "归属团队", dataIndex: "owner", key: "owner", width: 130 },
    {
      title: "数据量",
      dataIndex: "rows",
      key: "rows",
      width: 140,
      align: "right",
      sorter: (a, b) => a.rows - b.rows,
      render: (value) => (
        <span className="num-cell">{value === 0 ? "—" : value.toLocaleString("zh-CN")}</span>
      ),
    },
    { title: "时效", dataIndex: "latency", key: "latency", width: 100 },
    {
      title: "状态",
      dataIndex: "status",
      key: "status",
      width: 110,
      render: (value) => <StatusTag status={value} />,
    },
    { title: "更新时间", dataIndex: "updatedAt", key: "updatedAt", width: 170 },
    {
      title: "操作",
      key: "action",
      width: 96,
      fixed: "right",
      render: () => (
        <div className="row-actions">
          <Tooltip title="查看节点详情">
            <Button type="text" shape="circle" size="small" icon={<Icon name="maximize-2" size={14} />} />
          </Tooltip>
          <Tooltip title="分享链路">
            <Button type="text" shape="circle" size="small" icon={<Icon name="share-2" size={14} />} />
          </Tooltip>
        </div>
      ),
    },
  ];

  return (
    <div className="lineage-trace">
      <ContextBanner
        icon="git-branch"
        title={`血缘溯源 · ${metric ? metric.name : "全部指标"}`}
        crumb={
          record
            ? `批次 ${record.batch} · 任务 ${record.task} · 来源节点 ${record.node}`
            : "未选择批次，展示指标全量血缘节点"
        }
        fields={
          record
            ? [
                { label: "分区时间", value: record.partition },
                { label: "记录数", value: record.rows.toLocaleString("zh-CN") },
                { label: "质量分", value: record.quality.toFixed(1) },
              ]
            : []
        }
        onBack={onBack}
        backText="返回采集明细"
      />

      <div className="lineage-path">
        {LEVEL_META.map((meta, index) => {
          const nodes = lineageList.filter((n) => n.level === meta.key);
          return (
            <div className="lineage-path__group" key={meta.key}>
              <div className={`lineage-path__head lineage-path__head--${meta.tone}`}>
                <span className="lineage-path__head-name">{meta.key}节点</span>
                <span className="lineage-path__head-desc">{meta.desc}</span>
                <span className="lineage-path__head-num">{nodes.length}</span>
              </div>
              <div className="lineage-path__nodes">
                {nodes.slice(0, 3).map((node) => (
                  <span className="lineage-path__node" key={node.id} title={node.tableName}>
                    <span className="lineage-path__node-type">{node.nodeType}</span>
                    <span className="lineage-path__node-name">{node.nodeName}</span>
                  </span>
                ))}
                {nodes.length > 3 ? (
                  <span className="lineage-path__more">+{nodes.length - 3} 个节点</span>
                ) : null}
              </div>
              {index < LEVEL_META.length - 1 ? (
                <span className="lineage-path__arrow">
                  <Icon name="arrow-right" size={16} />
                </span>
              ) : null}
            </div>
          );
        })}
      </div>

      <div className="table-toolbar">
        <div className="table-toolbar__filters">
          <Input
            allowClear
            className="toolbar-search"
            prefix={<Icon name="search" size={14} />}
            placeholder="搜索节点名称、编码或物理表"
            value={keyword}
            onChange={(e) => setKeyword(e.target.value)}
          />
          <Select className="toolbar-select" options={levelOptions} value={level} onChange={setLevel} />
          <Select className="toolbar-select" options={nodeTypeOptions} value={nodeType} onChange={setNodeType} />
          <Button
            icon={<Icon name="rotate-ccw" size={14} />}
            onClick={() => {
              setKeyword("");
              setLevel("all");
              setNodeType("all");
            }}
          >
            重置
          </Button>
        </div>
        <div className="table-toolbar__extra">
          <span className="table-toolbar__count">
            共 <em>{dataSource.length}</em> 个血缘节点
          </span>
          <Button icon={<Icon name="network" size={14} />}>全屏血缘视图</Button>
          <Button icon={<Icon name="download" size={14} />}>导出</Button>
        </div>
      </div>

      <Table
        rowKey="id"
        size="middle"
        columns={columns}
        dataSource={dataSource}
        scroll={{ x: 1540 }}
        pagination={{
          pageSize: 10,
          showSizeChanger: true,
          showTotal: (total) => `共 ${total} 条`,
        }}
      />
    </div>
  );
}
  Object.assign(__export, { LineageTrace });
})();

/* ===== src/views/data-tabs/index.jsx ===== */
(function () {
  const { useState } = React;
  const { Tabs } = antd;
  const { Icon } = __export;
  const MetricList = __export.MetricList;
  const RecordDetail = __export.RecordDetail;
  const LineageTrace = __export.LineageTrace;
// Layer 4: 页签容器 — 承载三级下钻导航（指标清单 → 采集明细 → 血缘溯源）
function TabLabel({ icon, text, count }) {
  return (
    <span className="tab-label">
      <Icon name={icon} size={14} />
      <span>{text}</span>
      <span className="tab-label__count">{count}</span>
    </span>
  );
}

function DataTabs() {
  // 受控 activeKey：表格内链接通过 onDrill 直接改写页签，实现跨页签跳转
  const [activeKey, setActiveKey] = useState("list");
  const [metric, setMetric] = useState(null);
  const [record, setRecord] = useState(null);

  const drillToDetail = (row) => {
    setMetric(row);
    setRecord(null);
    setActiveKey("detail");
  };

  const drillToLineage = (row) => {
    setRecord(row);
    setActiveKey("lineage");
  };

  const items = [
    {
      key: "list",
      label: <TabLabel icon="list-checks" text="指标清单" count={24} />,
      children: <MetricList onDrill={drillToDetail} />,
    },
    {
      key: "detail",
      label: <TabLabel icon="table-2" text="采集明细" count={22} />,
      children: (
        <RecordDetail
          metric={metric}
          onDrill={drillToLineage}
          onBack={() => setActiveKey("list")}
        />
      ),
    },
    {
      key: "lineage",
      label: <TabLabel icon="git-branch" text="血缘溯源" count={16} />,
      children: (
        <LineageTrace metric={metric} record={record} onBack={() => setActiveKey("detail")} />
      ),
    },
  ];

  return (
    <section className="data-tabs card-surface">
      <Tabs activeKey={activeKey} onChange={setActiveKey} items={items} />
    </section>
  );
}
  Object.assign(__export, { DataTabs });
})();

/* ===== app.jsx ===== */
(function () {
  const { ConfigProvider } = antd;
  const { AppProvider } = __export;
  const zhCN = __export.zhCN;
  const PageHeader = __export.PageHeader;
  const DataTabs = __export.DataTabs;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (metrics / records / lineage)
//   Layer 3 reusable      → src/components/{name}/ (status-tag / context-banner)
//   Layer 4 views         → src/views/{name}/      (page-header / data-tabs / metric-list / record-detail / lineage-trace)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.








function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN}>
        <div className="app-root">
          <PageHeader />
          <main className="page-main">
            <DataTabs />
          </main>
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
