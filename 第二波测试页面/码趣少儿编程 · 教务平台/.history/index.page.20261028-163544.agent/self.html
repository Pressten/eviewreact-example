  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Segmented 组件样式（占位，待填充 token 映射） */

  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  transition: none;

/* 应用级布局 — 工作区装配 */
.app-root {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
  overflow: hidden;
}

.workspace {
  flex: 1;
  min-height: 0;
  display: flex;
}

.center-column {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
}

.list-region {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}

.batch-bar-slot {
  position: absolute;
  left: 50%;
  bottom: var(--spacing-gutter);
  transform: translateX(-50%);
  z-index: 5;
  pointer-events: auto;
  min-width: 22rem;
}
.batch-bar-slot:empty {
  display: none;
}

/* 删除确认弹窗 */
.del-modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-inline);
}
.del-modal-body {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-inline);
}
.del-modal-tip {
  margin: 0;
  font: var(--font-body-m);
  color: var(--on-surface);
}
.del-modal-tip strong {
  color: var(--error);
}
.del-modal-list {
  margin: 0;
  padding: var(--spacing-inline) var(--spacing-stack);
  list-style: none;
  background: var(--surface-variant);
  border-radius: var(--radius-container);
  max-height: 12rem;
  overflow: auto;
}
.del-modal-list li {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.25rem 0;
  font: var(--font-body-s);
  color: var(--on-surface);
}
.file-ext {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}


/* 顶部导航栏 */
.header-bar {
  height: 3rem;
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  padding: 0 var(--spacing-gutter);
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--divider);
  flex: none;
  position: relative;
  z-index: 10;
}

.header-left {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  flex: none;
}

.header-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
  text-decoration: none;
}
.brand-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--on-primary);
}
.brand-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

/* 主导航（原生 nav，选中项品牌色 + 2px 下划线） */
.header-nav {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}
.nav-item {
  position: relative;
  padding: 0.625rem 0.25rem;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: color 0.15s;
}
.nav-item:hover {
  color: var(--primary);
}
.nav-item--active {
  color: var(--primary);
  font-weight: var(--font-weight-medium);
  border-bottom-color: var(--primary);
}

/* 全局搜索 */
.header-search {
  flex: 1;
  max-width: 32rem;
}
.search-input.ant-input-affix-wrapper {
  background: var(--surface-variant);
  border-color: transparent;
  border-radius: var(--radius-full);
}
.search-input.ant-input-affix-wrapper:hover,
.search-input.ant-input-affix-wrapper-focused {
  border-color: var(--primary);
  background: var(--surface-container-highest);
}

.search-panel {
  width: 28rem;
  background: var(--surface-container-high);
  border-radius: var(--radius-overlay);
  box-shadow: var(--shadow-popover);
  padding: var(--spacing-stack) 0;
}
.search-section {
  padding: 0 var(--spacing-gutter);
}
.search-section + .search-section {
  margin-top: var(--spacing-stack);
  padding-top: var(--spacing-stack);
  border-top: 1px solid var(--divider);
}
.search-section-title {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface-variant);
  margin-bottom: var(--spacing-inline);
}
.search-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacing-inline);
}
.search-chip {
  display: inline-flex;
  align-items: center;
  padding: 0.25rem 0.625rem;
  font: var(--font-body-s);
  color: var(--on-surface);
  background: var(--surface-variant);
  border-radius: var(--radius-full);
  text-decoration: none;
  cursor: pointer;
}
.search-chip:hover {
  background: var(--primary-container);
  color: var(--primary);
}
.search-chip--hot::before {
  content: "";
  width: 0.375rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: var(--critical);
  margin-inline-end: 0.375rem;
}

/* 右侧：容量 + 通知 + 用户 */
.header-right {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex: none;
}

.capacity-indicator {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  padding: 0.25rem 0.625rem;
  border-radius: var(--radius-action);
  background: var(--surface-variant);
  color: var(--on-surface-variant);
}
.capacity-indicator--warn {
  background: var(--critical-container);
  color: var(--on-critical);
}
.capacity-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}
.capacity-bar-track {
  width: 5rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: var(--outline-variant);
  overflow: hidden;
}
.capacity-indicator--warn .capacity-bar-track {
  background: rgba(244, 132, 12, 0.25);
}
.capacity-bar-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--primary);
}
.capacity-indicator--warn .capacity-bar-fill {
  background: var(--critical);
}
.capacity-text {
  font: var(--font-caption-m);
  white-space: nowrap;
}

.icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border: none;
  background: transparent;
  color: var(--on-surface-variant);
  border-radius: var(--radius-action);
  cursor: pointer;
}
.icon-btn:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}
.icon-dot {
  position: absolute;
  top: 0.3rem;
  right: 0.3rem;
  width: 0.375rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: var(--error);
  border: 1px solid var(--surface-container-highest);
}

.user-area {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  padding: 0.25rem 0.5rem;
  border-radius: var(--radius-action);
  cursor: pointer;
}
.user-area:hover {
  background: var(--surface-variant);
}
.user-avatar {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  object-fit: cover;
}
.user-name {
  font: var(--font-body-m);
  color: var(--on-surface);
  white-space: nowrap;
}


/* 工具栏：面包屑 + 视图切换 + 排序 + 新建 */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: var(--spacing-inline) var(--spacing-gutter);
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--divider);
  flex: none;
}

.toolbar-left {
  min-width: 0;
}
.toolbar-left .ant-breadcrumb {
  font: var(--font-body-m);
}
.crumb-link {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  color: var(--on-surface-variant);
  cursor: pointer;
  text-decoration: none;
}
.crumb-link:hover {
  color: var(--primary);
}
.crumb-current {
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.toolbar-right {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex: none;
}
.seg-opt {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}

.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
  height: 2rem;
  padding: 0 0.75rem;
  border: 1px solid var(--outline);
  background: var(--surface-container-highest);
  color: var(--on-surface);
  border-radius: var(--radius-action);
  font: var(--font-body-m);
  cursor: pointer;
}
.tool-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}


/* 左侧目录树 */
.space-tree {
  width: 16.5rem;
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-highest);
  border-right: 1px solid var(--divider);
  overflow: hidden;
}

.space-tree-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem var(--spacing-gutter);
  flex: none;
}
.space-tree-title {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.icon-btn-mini {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border: none;
  background: transparent;
  color: var(--on-surface-variant);
  border-radius: var(--radius-action);
  cursor: pointer;
}
.icon-btn-mini:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}

.space-tree-search {
  padding: 0 var(--spacing-gutter) var(--spacing-inline);
  flex: none;
}

.space-tree-body {
  flex: 1;
  overflow: auto;
  padding: 0 0.5rem var(--spacing-gutter);
}

/* 节点内容 */
.tree-node {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
  width: 100%;
  padding-right: 0.25rem;
}
.tree-node-name {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  min-width: 0;
}
.tree-shared {
  display: inline-flex;
  color: var(--primary);
  flex: none;
}
.tree-name-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--on-surface);
}
.tree-node--active .tree-name-text {
  color: var(--primary);
  font-weight: var(--font-weight-medium);
}

.tree-node-meta {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  flex: none;
}
.tree-count {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  background: var(--surface-variant);
  padding: 0 0.3rem;
  border-radius: var(--radius-badge);
  min-width: 1.25rem;
  text-align: center;
}
.tree-node--active .tree-count {
  background: var(--primary-container);
  color: var(--primary);
}
.tree-node-more {
  display: none;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: var(--radius-action);
  color: var(--on-surface-variant);
  cursor: pointer;
}
.ant-tree-treenode:hover .tree-node-more,
.tree-node--active .tree-node-more {
  display: inline-flex;
}
.tree-node-more:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}


/* 文件列表区 */
.file-list {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 0 var(--spacing-gutter);
  display: flex;
  flex-direction: column;
}
.file-list-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 表格 */
.drive-table .ant-table {
  background: transparent;
}
.drive-table .ant-table-thead > tr > th {
  background: var(--surface-variant);
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface-variant);
}
.drive-table .ant-table-tbody > tr {
  cursor: pointer;
}
.drive-table .ant-table-tbody > tr > td {
  font: var(--font-body-m);
  color: var(--on-surface);
}

.file-name-cell {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}
.file-name-link {
  color: var(--on-surface);
  text-decoration: none;
  cursor: pointer;
}
.file-name-link:hover {
  color: var(--interactive-link-hover);
}
.file-name-link--active {
  color: var(--primary);
  font-weight: var(--font-weight-medium);
}
.file-ext {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.cell-muted {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}
.updater-cell {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.row-more {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: var(--radius-action);
  color: var(--on-surface-variant);
  cursor: pointer;
}
.row-more:hover {
  background: var(--surface-variant);
  color: var(--primary);
}

/* 网格视图 */
.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
  gap: var(--spacing-gutter);
  padding: var(--spacing-stack) 0;
}
.grid-card {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-inline);
  padding: var(--spacing-inline);
  background: var(--surface-container-highest);
  border: 1px solid var(--outline-variant);
  border-radius: var(--radius-container);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.grid-card:hover {
  border-color: var(--primary);
}
.grid-card--active {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-container);
}
.grid-card--checked {
  background: var(--primary-container);
  border-color: var(--primary);
}
.grid-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 1.5rem;
}
.grid-card-icon {
  display: flex;
  justify-content: center;
  padding: 0.5rem 0;
}
.grid-card-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.grid-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
}
.grid-card-foot {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  border-top: 1px solid var(--divider);
  padding-top: var(--spacing-inline);
}


/* 文件类型图标 — 软色块底 + 分类色图标（数据分类视觉丰富度） */
.file-type-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 0;
  flex: none;
}
.file-type-icon.ft-rounded {
  border-radius: var(--radius-md);
}
.file-type-icon.ft-rounded {
  padding: 0.5rem;
}

.ft-doc { color: var(--primary); background: var(--primary-container); }
.ft-sheet { color: var(--success); background: var(--success-container); }
.ft-slide { color: var(--critical); background: var(--critical-container); }
.ft-pdf { color: var(--error); background: var(--error-container); }
.ft-image { color: var(--info); background: var(--info-container); }
.ft-archive { color: var(--on-critical); background: var(--warning-container); }


/* 共享状态 Tag — 软色底 + 语义色字 */
.share-tag {
  border-radius: var(--radius-badge);
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  margin-inline-end: 0;
}

.share-tag--neutral {
  color: var(--on-surface-variant);
  background: var(--surface-variant);
  border-color: var(--outline-variant);
}
.share-tag--info {
  color: var(--info);
  background: var(--info-container);
  border-color: transparent;
}
.share-tag--success {
  color: var(--success);
  background: var(--success-container);
  border-color: transparent;
}


/* 头像组 — 身份色块（容器 token，consistent mapping） */
.avatar-stack {
  display: inline-flex;
  align-items: center;
}
.avatar-circle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
  font: var(--font-caption-m);
  font-weight: var(--font-weight-semibold);
  border: 2px solid var(--surface-container-highest);
  flex: none;
  user-select: none;
}

.av-1 { background: var(--primary-container); color: var(--primary); }
.av-2 { background: var(--success-container); color: var(--success); }
.av-3 { background: var(--critical-container); color: var(--on-critical); }
.av-4 { background: var(--info-container); color: var(--info); }

.avatar-more {
  background: var(--surface-variant);
  color: var(--on-surface-variant);
}


/* 右侧详情面板 */
.detail-panel {
  width: 18rem;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-stack);
  padding: var(--spacing-gutter);
  background: var(--surface-container-highest);
  border-left: 1px solid var(--divider);
  overflow: auto;
}
.detail-panel--empty {
  align-items: center;
  justify-content: center;
}
.detail-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-inline);
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

/* 预览卡 */
.detail-preview {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--spacing-inline);
  padding: var(--spacing-gutter) var(--spacing-stack);
  background: var(--surface-variant);
  border-radius: var(--radius-container);
}
.detail-preview-icon {
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-preview-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.detail-preview-tags {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
}
.detail-type-badge {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.detail-preview-actions {
  display: flex;
  gap: var(--spacing-inline);
  margin-top: var(--spacing-inline);
  flex-wrap: wrap;
  justify-content: center;
}

/* 区段 */
.detail-section {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-inline);
}
.detail-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.detail-link {
  color: var(--interactive-link);
  cursor: pointer;
  font: var(--font-body-s);
  text-decoration: none;
}
.detail-link:hover {
  color: var(--interactive-link-hover);
}

.detail-info {
  margin: 0;
  display: flex;
  flex-direction: column;
}
.info-row {
  display: flex;
  justify-content: space-between;
  gap: var(--spacing-inline);
  padding: 0.375rem 0;
  border-bottom: 1px solid var(--divider);
}
.info-row:last-child {
  border-bottom: none;
}
.info-row dt {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  flex: none;
}
.info-row dd {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-body-s);
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.detail-collab {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}
.collab-count {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* 时间轴 */
.detail-timeline {
  padding-inline-start: 0.125rem;
}
.detail-timeline .tl-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--primary);
}
.tl-content {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-body-s);
}
.tl-actor {
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}
.tl-action {
  color: var(--on-surface-variant);
}
.tl-time {
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
  margin-inline-start: auto;
}


/* 最近访问 */
.recent-access {
  flex: none;
  padding: var(--spacing-inline) var(--spacing-gutter);
  background: var(--surface-container-highest);
  border-top: 1px solid var(--divider);
}
.recent-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--spacing-inline);
}
.recent-title {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.recent-more {
  color: var(--interactive-link);
  cursor: pointer;
  font: var(--font-body-s);
  text-decoration: none;
}
.recent-more:hover {
  color: var(--interactive-link-hover);
}

.recent-list {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--spacing-inline);
}
.recent-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  padding: var(--spacing-inline);
  background: var(--surface-variant);
  border-radius: var(--radius-container);
  text-decoration: none;
  cursor: pointer;
  min-width: 0;
  transition: background 0.15s;
}
.recent-item:hover {
  background: var(--primary-container);
}
.recent-icon {
  flex: none;
}
.recent-body {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.recent-name {
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.recent-meta {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


/* 底部存储条 */
.storage-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  padding: var(--spacing-inline) var(--spacing-gutter);
  background: var(--surface-container-highest);
  border-top: 1px solid var(--divider);
  flex: none;
}
.storage-bar--warn {
  background: var(--critical-container);
}

.storage-info {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex: none;
  color: var(--on-surface);
}
.storage-label {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  white-space: nowrap;
}
.storage-warn {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-body-s);
  color: var(--on-critical);
}

.storage-meter {
  flex: 1;
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  min-width: 0;
}
.storage-meter .ant-progress {
  flex: 1;
  min-width: 12rem;
}
.storage-usage {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  white-space: nowrap;
}
.storage-usage strong {
  color: var(--on-surface);
  font-weight: var(--font-weight-semibold);
}
.storage-bar--warn .storage-usage strong {
  color: var(--on-critical);
}
.storage-pct {
  font-style: normal;
  color: var(--on-surface-variant);
}


/* 分享弹窗 */
.share-modal-title {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  font: var(--font-headline-m);
}
.share-modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-inline);
}

const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}

function getRootFontSize() {

  const fs = getComputedStyle(document.documentElement).fontSize;

function rgbToHex(rgb) {

  if (!m) return null;
  return "#" + [1, 2, 3].map(function (i) { return parseInt(m[i], 10).toString(16).padStart(2, "0"); }).join("").toUpperCase();
}

// #RGB / #RRGGBB -> [r,g,b]；非法输入返回 null
function hexToRgb(hex) {
  if (!hex) return null;
  let h = String(hex).replace(/^#/, "").trim();
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

// 两个 hex 颜色的欧氏距离（RGB 空间），用于 icon-plus 颜色就近匹配
function colorDistance(a, b) {

function toApiSize(size) {

  if (size != null) {
    const m = String(size).trim().match(/(-?\d+(?:\.\d+)?)\s*(rem|px)?/i);
    if (m) {
      n = Number(m[1]);

  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (结果缓存在 iconInfoMap；并发去重靠 iconInfoPromiseMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  // 同 name 并发请求共享同一个进行中 Promise，避免 N 个相同图标各发一次 getIconInfo
  if (iconInfoPromiseMap[name]) return iconInfoPromiseMap[name];
  const p = (async () => {
    try {
      const resp = await fetch(
        `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
      );
      const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
      const entry = (Array.isArray(data) ? data : [data]).find(
        (d) => d.icons?.length
      );
      const selected = selectBestIcon(entry?.icons || [], name);
      if (!selected?.url) return null;
      iconInfoMap[name] = { name: selected.name, url: selected.url };
      return iconInfoMap[name];
    } catch (e) {
      return null;
    }
  })();
  iconInfoPromiseMap[name] = p;
  // 落定后清除 in-flight 条目（失败也清除，允许下次重试，不永久缓存 rejected 结果）
  p.finally(() => {
    delete iconInfoPromiseMap[name];
  });
  return p;
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
// 结果缓存在 svgCache；并发去重靠 svgPromiseMap，相同 key 共享同一进行中 Promise
// key 含 size：不同尺寸取回的 SVG 不同，不可复用
function fetchSvg(name, variant, colorHex, size) {
  const key = `${name}&${variant}&${colorHex}&${size}`;
  if (svgCache.has(key)) return Promise.resolve(svgCache.get(key));
  if (svgPromiseMap.has(key)) return svgPromiseMap.get(key);
  const p = (async () => {
    const info = await resolveIconInfo(name);
    if (!info) return "";
    const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
    const colorId = resolveColorId(variant, colorHex);
    try {
      const resp = await fetch(
        `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=${toApiSize(size)}&style=${encodeURIComponent(
          styleValue
        )}&color=${encodeURIComponent(colorId)}&fileType=svg`
      );
      const data = await resp.json(); // { url, name, data } or array
      const item = Array.isArray(data) ? data[0] : data;
      return item?.data || ""; // raw SVG text, injected as-is
    } catch (e) {
      return "";
    }
  })();
  svgPromiseMap.set(key, p);
  // 落定后写入结果缓存并清除 in-flight 条目；空结果（失败）不缓存，允许下次重试
  p.then((s) => {
    if (s) svgCache.set(key, s);
  }).finally(() => {
    svgPromiseMap.delete(key);
  });
  return p;
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rootFontSize = getRootFontSize();
    const rem = size / rootFontSize;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
  onClick,
  title,
  id,
}) {
  const resolvedSize = resolveSize(size);
  const mergedStyle = onClick ? { cursor: "pointer", ...style } : style;
  const wrapRef = useRef(null);
  const [inheritedColor, setInheritedColor] = useState(null);
  const effectiveColor = color || inheritedColor;
  const [plus, setPlus] = useState(plusState); // reuse already-probed result

    // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才需要继承父元素颜色；
  // Lucide / img 模式颜色由 CSS（currentColor）或属性直接处理，不读计算色、不监听主题
  useLayoutEffect(function () {
    if (src || plus !== true || color) return;
    const el = wrapRef.current;
    if (!el) return; // 尚未挂载（首次 plus===null 返回 null）
    const hex = rgbToHex(getComputedStyle(el).color);
    if (hex && hex !== inheritedColor) setInheritedColor(hex);
  });

  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

  // 切换目录 / 删除后：若当前详情文件不在视图中，回退到首项
  useEffect(() => {
    if (filteredFiles.length && !filteredFiles.find((f) => f.id === selectedFileId)) {
      setSelectedFileId(filteredFiles[0].id);
    } else if (filteredFiles.length === 0) {
      setSelectedFileId(null);
    }
  }, [filteredFiles, selectedFileId]);

  const handleNew = (type) => {
    const labelMap = { folder: "文件夹", doc: "文档", sheet: "表格", slide: "演示", upload: "上传" };
    if (type === "upload") message.success("已打开文件选择器");
    else message.success(`已新建${labelMap[type] || type}`);
  };

  const handleNodeAction = (node, action) => {
    if (action === "delete") {
      message.warning(`目录「${node.name}」需在管理后台删除`);
    }
  };

  const confirmDelete = () => {
    if (!deleteTargets) return;
    const removedCount = deleteTargets.length;
    setFileList((prev) => prev.filter((f) => !deleteTargets.includes(f.id)));
    setSelectedRowKeys((prev) => prev.filter((k) => !deleteTargets.includes(k)));
    setDeleteTargets(null);
    message.success(`已删除 ${removedCount} 个文件，可在回收站恢复`);
  };

  const handleBatchMove = () => {
    message.info(`正在移动 ${selectedRowKeys.length} 个文件`);
  };
  const handleBatchDownload = () => {
    message.success(`已开始打包下载 ${selectedRowKeys.length} 个文件`);
    setSelectedRowKeys([]);
  };

  const deleteNames = deleteTargets
    ? deleteTargets.map((id) => fileList.find((f) => f.id === id)).filter(Boolean)
    : [];

  return (
    <AppProvider>
      <ConfigProvider
        locale={zhCN}
        wave={{ disabled: true }}
        renderEmpty={() => <Empty style={{ padding: "2rem 0" }} />}
        empty={{ image: "./assets/uploads/empty.svg" }}
        spin={{ indicator: <img src="./assets/uploads/loading.svg" alt="" className="custom-spin-indicator" /> }}
      >
        <div className="app-root">
          <HeaderBar />

          <div className="workspace">
            <SpaceTree
              selectedKey={treeSelectedKey}
              onSelect={setTreeSelectedKey}
              onNodeAction={handleNodeAction}
            />

            <main className="center-column">
              <Toolbar
                breadcrumb={breadcrumb}
                viewMode={viewMode}
                onViewChange={setViewMode}
                sortField={sortField}
                onSortChange={setSortField}
                onBreadcrumb={(key) => setTreeSelectedKey(key)}
                onNew={handleNew}
              />

              <div className="list-region">
                <FileList
                  files={filteredFiles}
                  viewMode={viewMode}
                  sortField={sortField}
                  selectedFileId={selectedFileId}
                  onSelectFile={setSelectedFileId}
                  selectedRowKeys={selectedRowKeys}
                  onSelectedRowKeysChange={setSelectedRowKeys}
                  onShare={setShareFile}
                  onDelete={(ids) => setDeleteTargets(ids)}
                />
                <div className="batch-bar-slot">
                  <BatchBar
                    count={selectedRowKeys.length}
                    onMove={handleBatchMove}
                    onDelete={() => setDeleteTargets([...selectedRowKeys])}
                    onDownload={handleBatchDownload}
                    onClear={() => setSelectedRowKeys([])}
                  />
                </div>
              </div>

              <RecentAccess onSelectFile={setSelectedFileId} />
            </main>

            <DetailPanel file={selectedFile} onShare={setShareFile} />
          </div>

          <StorageBar onExpand={() => message.info("正在跳转扩容套餐")} />

          <ShareModal open={!!shareFile} file={shareFile} onClose={() => setShareFile(null)} />

          <Modal
            title="确认删除"
            open={!!deleteTargets}
            onCancel={() => setDeleteTargets(null)}
            width={420}
            footer={
              <div className="del-modal-foot">
                <Button onClick={() => setDeleteTargets(null)}>取消</Button>
                <Button danger type="primary" onClick={confirmDelete}>删除</Button>
              </div>
            }
          >
            {deleteTargets && (
              <div className="del-modal-body">
                <p className="del-modal-tip">
                  将删除以下 <strong>{deleteTargets.length}</strong> 个文件，删除后可在回收站 30 天内恢复：
                </p>
                <ul className="del-modal-list">
                  {deleteNames.map((f) => (
                    <li key={f.id}>
                      <span>{f.name}</span>
                      <span className="file-ext">.{f.ext}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </Modal>
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
