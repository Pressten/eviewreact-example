  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Segmented 组件样式（占位，待填充 token 映射） */
.ant-segmented {
  border-radius: var(--radius-md);
  padding: 0.125rem;
  background: var(--color-fill);
  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  transition: none;

/* 应用级基础样式 — 页面骨架（左管理右预览的装修工作台布局） */
.app-root {
  min-height: 100vh;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.deco-app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
  overflow: hidden;
}

/* 主区：左侧滚动管理流 + 右侧固定预览面板 */
.deco-main {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  gap: var(--spacing-gutter);
  padding: var(--spacing-gutter);
  overflow: hidden;
}

.deco-left {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-gutter);
  overflow-y: auto;
  overflow-x: hidden;
}

/* 左侧下方三张卡片：素材库 / 数据看板 / 发布记录 */
.deco-cards {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: var(--spacing-gutter);
  align-items: stretch;
}

/* 通用卡片容器（div 而非组件） */
.deco-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: var(--spacing-4);
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.deco-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
  margin-bottom: var(--spacing-3);
}

.deco-card-title {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  min-width: 0;
}

.card-title-icon {
  color: var(--primary);
  flex: 0 0 auto;
}

.card-title-caption {
  font: var(--font-caption-m);
  font-weight: var(--font-weight-normal);
  color: var(--on-surface-variant);
  margin-left: var(--spacing-inline);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-head-caption {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  flex: 0 0 auto;
}


/* ① 顶部导航 */
.top-nav {
  flex: 0 0 auto;
  height: 3.5rem;
  display: flex;
  align-items: center;
  gap: var(--spacing-6);
  padding: 0 var(--spacing-5);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-t-sm);
  z-index: 20;
}

.top-nav-brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex: 0 0 auto;
}

.brand-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}

.brand-suffix {
  font: var(--font-caption-m);
  color: var(--primary);
  background: var(--primary-container);
  padding: 0.125rem 0.5rem;
  border-radius: var(--radius-full);
}

/* 自写导航：选中 2px 品牌下划线，未选中透明占位不跳动 */
.top-nav-menu {
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  height: 100%;
  flex: 0 0 auto;
}

  display: inline-flex;

  height: 100%;
  padding: 0 0.25rem;
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface-variant);
  border-bottom: 2px solid transparent;
  transition: color 0.2s;
}

.nav-item:hover {
  color: var(--color-brand);
}

.nav-item-active {
  color: var(--color-brand);
  border-bottom-color: var(--color-brand);
}

.top-nav-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  min-width: 0;
}

.store-switcher {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  max-width: 12rem;
  padding: 0.3125rem 0.75rem;
  border-radius: var(--radius-action);
  cursor: pointer;
  color: var(--on-surface);
  font: var(--font-body-m);
  transition: background 0.2s;
}

.store-switcher:hover {
  background: var(--color-hover);
}

.store-switcher-name {
  max-width: 8.5rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.store-caret,
.user-caret {
  color: var(--on-surface-variant);
}

.store-menu-item {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.store-menu-name {
  max-width: 10rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.store-menu-role {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

/* 发布状态 Tag */
.pub-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  margin: 0;
  font: var(--font-body-s);
  flex: 0 0 auto;
}

.pub-dot {
  width: 0.375rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: currentColor;
  flex: 0 0 auto;
}

.pub-dot-pulse {
  animation: pub-pulse 1.6s ease-in-out infinite;
}

@keyframes pub-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.3;
  }
}

.nav-tool-icon {
  color: var(--on-surface-variant);
}

.nav-tool-icon:hover {
  color: var(--color-brand);
}

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.25rem 0.5rem;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: background 0.2s;
}

.user-chip:hover {
  background: var(--color-hover);
}

.user-avatar {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  object-fit: cover;
}

.user-name {
  font: var(--font-body-m);
  color: var(--on-surface);
}


/* ② 页面页签栏 */
.page-tabs-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  padding: 0 var(--spacing-5);
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--divider);
  z-index: 10;
}

.page-tabs {
  flex: 1 1 0;
  min-width: 0;
}

.page-tabs .ant-tabs-nav {
  margin-bottom: 0;
}

.page-tabs .ant-tabs-tab {
  padding-top: 0.5rem;
  padding-bottom: 0.625rem;
}

.page-tab-label {
  padding-inline: 0.25rem;
  font-weight: var(--font-weight-medium);
}

.page-tabs-actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  margin-left: auto;
  flex: 0 0 auto;
}

.draft-hint {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  margin-right: 0.5rem;
}

.publish-summary {
  margin: 0 0 var(--spacing-3);
  font: var(--font-body-m);
  color: var(--on-surface);
}

.publish-summary em {
  font-style: normal;
  color: var(--critical);
  font-weight: var(--font-weight-semibold);
  padding: 0 0.125rem;
}

.publish-label {
  display: block;
  margin-bottom: 0.5rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}


/* ③ 楼层表格 + ④ 添加组件面板 */
.floor-section {
  gap: var(--spacing-3);
}

.floor-toolbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-wrap: wrap;
}

.toolbar-block-label {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.type-select {
  width: 12.5rem;
}

.toolbar-divider {
  width: 1px;
  height: 1.25rem;
  background: var(--divider);
  margin: 0 0.25rem;
}

.toolbar-hint {
  margin-left: auto;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* 组件名列 */
.floor-name-cell {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.floor-type-icon {
  width: 1.75rem;
  height: 1.75rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-base);
  flex: 0 0 auto;
}

.tone-info {
  background: var(--color-tag-bg-info);
  color: var(--color-tag-text-info);
}
.tone-error {
  background: var(--color-tag-bg-error);
  color: var(--color-tag-text-error);
}
.tone-success {
  background: var(--color-tag-bg-green);
  color: var(--color-tag-text-green);
}
.tone-purple {
  background: var(--color-tag-bg-purple);
  color: var(--color-tag-text-purple);
}
.tone-cyan {
  background: var(--color-tag-bg-cyan);
  color: var(--color-tag-text-cyan);
}
.tone-alert {
  background: var(--color-tag-bg-alert);
  color: var(--color-tag-text-alert);
}
.tone-indigo {
  background: var(--color-tag-bg-indigo);
  color: var(--color-tag-text-indigo);
}
.tone-warning {
  background: var(--color-tag-bg-warning);
  color: var(--color-tag-text-warning);
}
.tone-mint {
  background: var(--color-message-bg-success);
  color: var(--color-tag-text-success);
}
.tone-pink {
  background: var(--color-tag-bg-pink);
  color: var(--color-tag-text-pink);
}
.tone-orange {
  background: var(--color-tag-bg-alert);
  color: var(--color-tag-text-alert);
}
.tone-geekblue {
  background: var(--color-tag-bg-indigo);
  color: var(--color-tag-text-indigo);
}

.floor-name-link {
  color: var(--interactive-link);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.floor-name-link:hover {
  color: var(--interactive-link-hover);
}

.sort-number {
  font-variant-numeric: tabular-nums;
  color: var(--on-surface);
}

/* UV 占比列 */
.uv-cell {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.25rem;
}

.uv-value {
  font: var(--font-body-m);
  color: var(--on-surface);
  font-variant-numeric: tabular-nums;
}

.uv-bar {
  width: 6rem;
  height: 0.25rem;
  background: var(--surface-variant);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.uv-bar-fill {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: var(--radius-full);
}

.uv-empty {
  color: var(--text-disabled);
}

/* 操作列：纯图标，间距 1rem */
.floor-actions {
  display: inline-flex;
  align-items: center;
  gap: 1rem;
}

.op-icon {
  color: var(--on-surface-variant);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.op-icon:hover {
  color: var(--color-brand);
}

.op-icon-disabled {
  color: var(--text-disabled);
  cursor: not-allowed;
}

.op-icon-disabled:hover {
  color: var(--text-disabled);
}

.op-icon-danger:hover {
  color: var(--error);
}

.op-more {
  cursor: pointer;
}

/* 当前行（素材替换目标）与新增行高亮 */
.floor-table .floor-row-selected > td {
  background: var(--primary-container);
}

.floor-table .floor-row-selected:hover > td {
  background: var(--primary-container);
}

.floor-table .floor-row-highlight > td {
  animation: row-flash 2.6s ease-out;
}

@keyframes row-flash {
  0%,
  55% {
    background: var(--primary-container);
  }
  100% {
    background: transparent;
  }
}


/* ⑤ 买家端预览（右侧固定面板 + 手机壳） */
.preview-panel {
  flex: 0 0 25rem;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
  padding: var(--spacing-4) var(--spacing-4) var(--spacing-5);
  background: var(--surface-container-lowest);
  border-left: 1px solid var(--divider);
  overflow: hidden;
}

.preview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
}

.sync-tag {
  margin-left: var(--spacing-inline);
  flex: 0 0 auto;
}

.sync-time {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  flex: 0 0 auto;
}

.sync-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: var(--radius-full);
  background: var(--success);
  animation: sync-pulse 1.6s ease-in-out infinite;
}

@keyframes sync-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}

.preview-toolbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacing-inline);
  padding: 0 0.25rem;
}

.preview-page-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.preview-caption {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* 手机壳 */
.phone {
  flex: 1 1 0;
  min-height: 0;
  width: 21rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-highest);
  border-radius: 1.75rem;
  box-shadow: var(--shadow-md);
  padding: 0.375rem 0.375rem 0.75rem;
}

.phone-notch {
  height: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0.875rem;
  flex: 0 0 auto;
}

.notch-time {
  font: var(--font-caption-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.notch-sensors {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}

.sensor-pill {
  width: 0.75rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: var(--on-surface);
  opacity: 0.8;
}

.sensor-pill-wide {
  width: 1rem;
}

.sensor-battery {
  width: 1.125rem;
  height: 0.5625rem;
  border: 1px solid var(--on-surface-variant);
  border-radius: var(--radius-xs);
  position: relative;
  opacity: 0.8;
}

.sensor-battery::before {
  content: "";
  position: absolute;
  inset: 0.0625rem 0.3125rem 0.0625rem 0.0625rem;
  background: var(--on-surface-variant);
  border-radius: 0.0625rem;
}

/* 滚动屏幕 */
.preview-screen {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  background: var(--surface-container-lowest);
  border-radius: 1.375rem;
  position: relative;
}

.pf-bottom-gap {
  display: block;
  height: 0.75rem;
}

/* 店招 */
.pf-store-header {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.875rem 0.875rem 1rem;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
  color: var(--on-primary);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

.pf-store-logo {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: var(--radius-full);
  object-fit: cover;
  flex: 0 0 auto;
}

.pf-store-info {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
  min-width: 0;
}

.pf-store-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
}

.pf-store-stats {
  font: var(--font-caption-s);
  opacity: 0.85;
}

.pf-store-follow {
  margin-left: auto;
  border: none;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, 0.22);
  color: var(--on-primary);
  font: var(--font-caption-m);
  padding: 0.25rem 0.75rem;
  cursor: pointer;
  flex: 0 0 auto;
}

/* ── 楼层通用 ── */
.pf-floor {
  position: relative;
  overflow: hidden;
}

.pf-floor-badge {
  position: absolute;
  top: 0.25rem;
  right: 0.25rem;
  z-index: 3;
  min-width: 1.125rem;
  height: 1.125rem;
  padding: 0 0.25rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--inverse-surface);
  color: var(--inverse-on-surface);
  font: var(--font-caption-s);
  border-radius: var(--radius-full);
  opacity: 0.55;
}

.pf-floor-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  padding: 0.625rem 0.75rem 0.375rem;
}

.pf-title-more {
  font: var(--font-caption-m);
  font-weight: var(--font-weight-normal);
  color: var(--interactive-link);
}

/* 背景风格（样式页签） */
.pf-theme-default {
  background: var(--surface-container-highest);
}

.pf-theme-brand {
  background: linear-gradient(135deg, var(--primary-container), var(--surface-container-highest) 70%);
}

.pf-theme-promo {
  background: var(--error-container);
}

.pf-theme-dark {
  background: var(--inverse-surface);
}

.pf-theme-dark .pf-floor-title,
.pf-theme-dark .pf-seckill-name,
.pf-theme-dark .pf-imagetext-title {
  color: var(--inverse-on-surface);
}

/* 轮播 */
.pf-carousel-track .pf-slide {
  height: 9.5rem;
  overflow: hidden;
}

.pf-slide-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 秒杀 */
.pf-seckill-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.625rem 0.75rem 0.375rem;
}

.pf-seckill-title {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-body-m);
  font-weight: var(--font-weight-bold);
  color: var(--error);
  white-space: nowrap;
}

.pf-seckill-cd {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.pf-cd {
  display: inline-flex;
  align-items: center;
  gap: 0.1875rem;
}

.pf-cd-box {
  min-width: 1.25rem;
  height: 1.25rem;
  padding: 0 0.125rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--on-surface);
  color: var(--surface-container-highest);
  font: var(--font-caption-m);
  font-weight: var(--font-weight-semibold);
  font-variant-numeric: tabular-nums;
  border-radius: var(--radius-xs);
}

.pf-cd-over {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.pf-seckill-products {
  display: flex;
  gap: 0.5rem;
  padding: 0.375rem 0.75rem 0.75rem;
}

.pf-seckill-item {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.pf-seckill-item img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: var(--radius-md);
}

.pf-seckill-name {
  font: var(--font-caption-m);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pf-seckill-price {
  display: flex;
  align-items: baseline;
  gap: 0.25rem;
}

.pf-price {
  font: var(--font-body-m);
  font-weight: var(--font-weight-bold);
  color: var(--error);
}

.pf-origin {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
  text-decoration: line-through;
}

.pf-grab {
  align-self: flex-start;
  border: none;
  background: var(--error);
  color: var(--on-error);
  font: var(--font-caption-m);
  border-radius: var(--radius-full);
  padding: 0.125rem 0.625rem;
  cursor: pointer;
}

/* 商品推荐瀑布 */
.pf-waterfall {
  columns: 2;
  column-gap: 0.5rem;
  padding: 0.375rem 0.75rem 0.75rem;
}

.pf-product-card {
  break-inside: avoid;
  margin-bottom: 0.5rem;
  background: var(--surface-container-lowest);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.pf-product-img {
  position: relative;
}

.pf-product-img img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.pf-product-badge {
  position: absolute;
  top: 0.375rem;
  left: 0.375rem;
  background: var(--error);
  color: var(--on-error);
  font: var(--font-caption-s);
  padding: 0.0625rem 0.375rem;
  border-radius: var(--radius-full);
}

.pf-product-name {
  font: var(--font-caption-m);
  color: var(--on-surface);
  padding: 0.375rem 0.5rem 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.5em;
}

.pf-product-meta {
  display: flex;
  align-items: baseline;
  gap: 0.25rem;
  flex-wrap: wrap;
  padding: 0.25rem 0.5rem 0.5rem;
}

.pf-sold {
  margin-left: auto;
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

/* 图文卡片 */
.pf-imagetext {
  display: flex;
  gap: 0.625rem;
  padding: 0.75rem;
}

.pf-imagetext > img {
  width: 6.5rem;
  height: 4.875rem;
  object-fit: cover;
  border-radius: var(--radius-md);
  flex: 0 0 auto;
}

.pf-imagetext-body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.pf-imagetext-title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.pf-imagetext-sub {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pf-imagetext-link {
  margin-top: auto;
  align-self: flex-start;
  font: var(--font-caption-m);
  color: var(--interactive-link);
}

/* 视频模块 */
.pf-video {
  position: relative;
}

.pf-video > img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
}

.pf-play {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 2.5rem;
  height: 2.5rem;
  border: none;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, 0.9);
  color: var(--error);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.pf-video-meta {
  position: absolute;
  left: 0.5rem;
  bottom: 0.5rem;
  background: rgba(25, 25, 25, 0.6);
  color: var(--inverse-on-surface);
  font: var(--font-caption-s);
  padding: 0.125rem 0.5rem;
  border-radius: var(--radius-full);
}

/* 优惠券 */
.pf-coupon-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: 0.375rem 0.75rem 0.75rem;
}

.pf-coupon-ticket {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.5rem 0.625rem;
  background: var(--error-container);
  border: 1px dashed var(--error);
  border-radius: var(--radius-md);
}

.pf-coupon-amount {
  display: inline-flex;
  align-items: baseline;
  color: var(--error);
  font-weight: var(--font-weight-bold);
  font-size: var(--font-size-2xl);
  line-height: var(--line-height-xs);
  min-width: 4.5rem;
}

.pf-coupon-amount em {
  font-style: normal;
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  margin-right: 0.125rem;
}

.pf-coupon-info {
  display: flex;

  const [isDark, setIsDark] = useState(false);

    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

// ══════════════════════════════════════════════════
const DecoContext = createContext(null);

// 排序号连续重排：1..n，永不断档
function renumber(floors) {
  return floors.map((f, i) => ({ ...f, sort: i + 1 }));
}

function pageKeyOfFloor(pages, floorId) {
  return Object.keys(pages).find((k) => pages[k].floors.some((f) => f.id === floorId));
}

function bumpVersion(version) {
  const nums = version.replace("V", "").split(".").map(Number);
  return `V${nums[0]}.${nums[1] + 1}.0`;
}

function makeRecord(extra) {
  return {
    id: `rec-${Date.now()}`,
    operator: "李婉晴",
    time: dayjs().format("YYYY-MM-DD HH:mm:ss"),
    ...extra,
  };
}

// 通用：在楼层所在页应用 floorsMutator，并递增该页草稿数
function patchPageOfFloor(state, floorId, floorsMutator) {
  const pageKey = pageKeyOfFloor(state.pages, floorId);
  if (!pageKey) return state;
  const page = state.pages[pageKey];
  const floors = renumber(floorsMutator(page.floors));
  return {
    ...state,
    pages: {
      ...state.pages,
      [pageKey]: { ...page, floors, draftCount: page.draftCount + 1 },
    },
    syncAt: Date.now(),
  };
}

function decorationReducer(state, action) {
  switch (action.type) {
    // ② 页签切换 → 表格与预览联动
    case "SET_PAGE":
      return { ...state, activePageKey: action.pageKey };

    // ⑥ 点击表格行 → 设为素材替换目标
    case "SELECT_FLOOR":
      return { ...state, selectedFloorId: action.floorId };

    // ③ 编辑组件配置 Modal
    case "OPEN_EDIT":
      return { ...state, editingFloorId: action.floorId, selectedFloorId: action.floorId };
    case "CLOSE_EDIT":
      return { ...state, editingFloorId: null };

    // ④ 添加组件 → 新行插入表格顶部并高亮
    case "ADD_FLOOR": {
      const page = state.pages[state.activePageKey];
      const floor = createFloor(action.typeKey, state.addCounter + 1);
      return {
        ...state,
        addCounter: state.addCounter + 1,
        pages: {
          ...state.pages,
          [page.key]: {
            ...page,
            floors: renumber([floor, ...page.floors]),
            draftCount: page.draftCount + 1,
          },
        },
        highlightFloorId: floor.id,
        selectedFloorId: floor.id,
        syncAt: Date.now(),
      };
    }

    // ③ 上移 / 下移 → 即时生效，预览顺序同步
    case "MOVE_FLOOR": {
      const page = state.pages[state.activePageKey];
      const idx = page.floors.findIndex((f) => f.id === action.floorId);
      const target = idx + action.dir;
      if (idx < 0 || target < 0 || target >= page.floors.length) return state;
      const floors = [...page.floors];
      const [moved] = floors.splice(idx, 1);
      floors.splice(target, 0, moved);
      return {
        ...state,
        pages: {
          ...state.pages,
          [page.key]: { ...page, floors: renumber(floors), draftCount: page.draftCount + 1 },
        },
        syncAt: Date.now(),
      };
    }

    // 更多下拉：置顶
    case "TOP_FLOOR":
      return patchPageOfFloor(state, action.floorId, (floors) => {
        const idx = floors.findIndex((f) => f.id === action.floorId);
        if (idx <= 0) return floors;
        const next = [...floors];
        const [moved] = next.splice(idx, 1);
        next.unshift(moved);
        return next;
      });

    // 更多下拉：复制组件（插入到自身之后）
    case "COPY_FLOOR":
      return patchPageOfFloor(state, action.floorId, (floors) => {
        const idx = floors.findIndex((f) => f.id === action.floorId);
        if (idx < 0) return floors;
        const source = floors[idx];
        const copy = {
          ...source,
          id: `f-copy-${Date.now()}`,
          name: `${source.name} 副本`,
          uvShare: 0,
          config: { ...source.config },
        };
        const next = [...floors];
        next.splice(idx + 1, 0, copy);
        return next;
      });

    // ③ 启停切换 → 预览显隐
    case "TOGGLE_FLOOR":
      return patchPageOfFloor(state, action.floorId, (floors) =>
        floors.map((f) => (f.id === action.floorId ? { ...f, status: !f.status } : f))
      );

    // ③ 删除（单个）
    case "DELETE_FLOOR":
      return patchPageOfFloor(state, action.floorId, (floors) => floors.filter((f) => f.id !== action.floorId));

    // ③ 批量删除
    case "BATCH_DELETE": {
      const ids = new Set(action.floorIds);
      const page = state.pages[state.activePageKey];
      const floors = renumber(page.floors.filter((f) => !ids.has(f.id)));
      const selectedStillHere = floors.some((f) => f.id === state.selectedFloorId);
      return {
        ...state,
        pages: {
          ...state.pages,
          [page.key]: { ...page, floors, draftCount: page.draftCount + 1 },
        },
        selectedFloorId: selectedStillHere ? state.selectedFloorId : floors[0] ? floors[0].id : null,
        syncAt: Date.now(),
      };
    }

    // ③ 编辑保存（内容 + 样式）
    case "UPDATE_FLOOR":
      return patchPageOfFloor(state, action.floorId, (floors) =>
        floors.map((f) =>
          f.id === action.floorId
            ? { ...f, name: action.patch.name, config: { ...f.config, ...action.patch.config } }
            : f
        )

    // ⑥ 替换素材 → 预览图更新
    case "REPLACE_IMAGE":

}

// name -> { name, url } via getIconInfo (结果缓存在 iconInfoMap；并发去重靠 iconInfoPromiseMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  // 同 name 并发请求共享同一个进行中 Promise，避免 N 个相同图标各发一次 getIconInfo
  if (iconInfoPromiseMap[name]) return iconInfoPromiseMap[name];
  const p = (async () => {
    try {
      const resp = await fetch(
        `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
      );
      const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
      const entry = (Array.isArray(data) ? data : [data]).find(
        (d) => d.icons?.length
      );
      const selected = selectBestIcon(entry?.icons || [], name);
      if (!selected?.url) return null;
      iconInfoMap[name] = { name: selected.name, url: selected.url };
      return iconInfoMap[name];
    } catch (e) {
      return null;
    }
  })();
  iconInfoPromiseMap[name] = p;
  // 落定后清除 in-flight 条目（失败也清除，允许下次重试，不永久缓存 rejected 结果）
  p.finally(() => {
    delete iconInfoPromiseMap[name];
  });
  return p;
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
// 结果缓存在 svgCache；并发去重靠 svgPromiseMap，相同 key 共享同一进行中 Promise
// key 含 size：不同尺寸取回的 SVG 不同，不可复用
function fetchSvg(name, variant, colorHex, size) {
  const key = `${name}&${variant}&${colorHex}&${size}`;
  if (svgCache.has(key)) return Promise.resolve(svgCache.get(key));
  if (svgPromiseMap.has(key)) return svgPromiseMap.get(key);
  const p = (async () => {
    const info = await resolveIconInfo(name);
    if (!info) return "";
    const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
    const colorId = resolveColorId(variant, colorHex);
    try {
      const resp = await fetch(
        `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=${toApiSize(size)}&style=${encodeURIComponent(
          styleValue
        )}&color=${encodeURIComponent(colorId)}&fileType=svg`
      );
      const data = await resp.json(); // { url, name, data } or array
      const item = Array.isArray(data) ? data[0] : data;
      return item?.data || ""; // raw SVG text, injected as-is
    } catch (e) {
      return "";
    }
  })();
  svgPromiseMap.set(key, p);
  // 落定后写入结果缓存并清除 in-flight 条目；空结果（失败）不缓存，允许下次重试
  p.then((s) => {
    if (s) svgCache.set(key, s);
  }).finally(() => {
    svgPromiseMap.delete(key);
  });
  return p;
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rootFontSize = getRootFontSize();
    const rem = size / rootFontSize;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
  onClick,
  title,
  id,
}) {
  const resolvedSize = resolveSize(size);
  const mergedStyle = onClick ? { cursor: "pointer", ...style } : style;
  const wrapRef = useRef(null);
  const [inheritedColor, setInheritedColor] = useState(null);
  const effectiveColor = color || inheritedColor;
  const [plus, setPlus] = useState(plusState); // reuse already-probed result

    // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才需要继承父元素颜色；
  // Lucide / img 模式颜色由 CSS（currentColor）或属性直接处理，不读计算色、不监听主题
  useLayoutEffect(function () {
    if (src || plus !== true || color) return;
    const el = wrapRef.current;
    if (!el) return; // 尚未挂载（首次 plus===null 返回 null）
    const hex = rgbToHex(getComputedStyle(el).color);
    if (hex && hex !== inheritedColor) setInheritedColor(hex);
  });

  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

// ── 倒计时 hook：每秒刷新 ──
function useCountdown(endsAt) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const timer = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(timer);
  }, []);
  const diff = dayjs(endsAt).valueOf() - now;
  if (!endsAt || diff <= 0) return null;
  const total = Math.floor(diff / 1000);
  const parts = [
    Math.floor(total / 3600),
    Math.floor((total % 3600) / 60),
    total % 60,
  ];
  return parts.map((n) => String(n).padStart(2, "0"));
}

function CountdownBoxes({ endsAt }) {
  const parts = useCountdown(endsAt);
  if (!parts) return <span className="pf-cd-over">活动已结束</span>;

// 点击素材卡选中，替换按钮将素材替换到「当前编辑组件」（表格中点击行选择目标）








function MaterialLib() {
  const { state, dispatch, selectedFloor } = useDecoration();
  const [selectedMaterialId, setSelectedMaterialId] = useState("mat-01");

  // 引用次数：扫描所有页面所有楼层的 imageId / imageIds
  const refCounts = useMemo(() => {
    const counts = {};
    MATERIALS.forEach((m) => {
      counts[m.id] = 0;
    });
    Object.values(state.pages).forEach((page) => {
      page.floors.forEach((floor) => {
        const ids = Array.isArray(floor.config.imageIds)
          ? floor.config.imageIds
          : floor.config.imageId
            ? [floor.config.imageId]
            : [];
        ids.forEach((id) => {
          if (counts[id] !== undefined) counts[id] += 1;
        });
      });
    });
    return counts;
  }, [state.pages]);

  const handleReplace = (material) => {
    if (!selectedFloor) {
      message.warning("请先在左侧表格中点击选择目标组件");
      return;
    }
    if (!IMAGE_FLOOR_TYPES.includes(selectedFloor.type)) {
      message.warning(`「${selectedFloor.name}」为${findType(selectedFloor.type).label}，不支持替换图片素材`);
      return;
    }
    dispatch({ type: "REPLACE_IMAGE", floorId: selectedFloor.id, materialId: material.id });
    message.success(`已将「${selectedFloor.name}」配图替换为「${material.name}」，预览已同步`);
  };

  return (
    <div className="deco-card material-lib">
      <div className="deco-card-head">
        <div className="deco-card-title">
          <Icon name="image" size="1.25rem" className="card-title-icon" />

          <span className="card-title-caption">共 {MATERIALS.length} 张 · 引用次数与楼层实时一致</span>
        </div>
        <span className="material-target">

/* ===== assets/shared/chart.jsx ===== */
(function () {
  const { useRef, useEffect, useState, forwardRef, useImperativeHandle } = React;
// Chart — HUICharts 的 React 封装(命令式 → 声明式)
// 底层: echarts + hui-charts.umd.js(全局 HUICharts),配置项 option 原样透传给 setSimpleOption。
// 暗色联动:自动监听 <html> 的 .dark class,切换 hdesign-light / hdesign-dark 主题并重建图表。
const Chart = forwardRef(function Chart(
  { name, option, className, style, onChartRendered },
  ref
) {
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const renderedRef = useRef(onChartRendered);
  renderedRef.current = onChartRendered;

  // .dark 切换 → 递增 tick 触发主 effect 重建(走同一条 init/dispose 路径)
  const [darkTick, setDarkTick] = useState(0);
  useEffect(() => {
    const mo = new MutationObserver(() => setDarkTick((t) => t + 1));
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    return () => mo.disconnect();
  }, []);

  useEffect(() => {
    const dom = containerRef.current;
    if (!dom || !window.HUICharts) return;

    const isDark = document.documentElement.classList.contains("dark");
    const chart = new HUICharts();
    chart.init(dom, { renderer: "svg"});
    chart.setSimpleOption(name, {
      theme: isDark ? "hdesign-dark" : "hdesign-light",
      a2ui: true,
      ...option,
    });
    chart.render();
    chartRef.current = chart;
    if (renderedRef.current) renderedRef.current(chart);

    // 容器尺寸变化(侧栏折叠/窗口缩放/响应式) → 同步画布
    const ro = new ResizeObserver(() => {
      if (chartRef.current && !chartRef.current._disposed) chart.resize();
    });
    ro.observe(dom);

    return () => {
      ro.disconnect();
      try { chart.dispose(); } catch (e) { /* 容器已卸载时静默 */ }
      chartRef.current = null;
    };
    // JSON.stringify 作 dep:option 是 JSX 内联对象,内容不变则不重建
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [name, JSON.stringify(option), darkTick]);

  useImperativeHandle(ref, () => ({
    getEchartsInstance: () => (chartRef.current ? chartRef.current.getEchartsInstance() : null),
    resizeHandler: () => {
      if (chartRef.current) chartRef.current.resize();
    },
  }), []);

  const wrapperStyle = { width: "100%", height: "100%", ...style };
  return <div ref={containerRef} className={className} style={wrapperStyle} />;
});
  Object.assign(__export, { Chart });
})();

const STYLE_FIELDS = [

  { key: "spacing", label: "上下间距（px）", kind: "number", min: 0, max: 40 },
];

const MATERIAL_OPTIONS = MATERIALS.map((m) => ({
  value: m.id,
  label: `${m.name}（${m.width}×${m.height}）`,
}));

const DATETIME_PATTERN = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/;

function EditFloorModal() {
  const { editingFloor, dispatch } = useDecoration();
  const [draft, setDraft] = useState(null);
  const [errors, setErrors] = useState({});
  const [tabKey, setTabKey] = useState("content");

  // 打开弹窗时以当前楼层初始化表单
  useEffect(() => {
    if (editingFloor) {
      setDraft({ name: editingFloor.name, config: { ...editingFloor.config } });
      setErrors({});
      setTabKey("content");
    }
  }, [editingFloor]);

  const open = !!editingFloor;
  const typeInfo = editingFloor ? findType(editingFloor.type) : null;

  const setName = (value) => {
    setDraft((d) => ({ ...d, name: value }));
    setErrors((e) => ({ ...e, name: undefined }));
  };

  const setField = (key, value) => {
    setDraft((d) => ({ ...d, config: { ...d.config, [key]: value } }));
    setErrors((e) => ({ ...e, [key]: undefined }));
  };

  const handleSave = () => {
    const errs = {};
    if (!draft.name.trim()) errs.name = "请输入组件名称";

    (CONTENT_FIELDS[editingFloor.type] || []).forEach((f) => {
      const value = draft.config[f.key];
      if (f.required && (value === undefined || value === null || String(value).trim() === "")) {
        errs[f.key] = `请输入${f.label}`;
        return;
      }
      if (
        f.kind === "datetime" &&
        value &&
        (!DATETIME_PATTERN.test(String(value).trim()) || !dayjs(String(value).trim()).isValid())
      ) {
        errs[f.key] = "时间格式：YYYY-MM-DD HH:mm，如 2026-10-31 20:00";
      }
    });

    if (Object.keys(errs).length > 0) {
      setErrors(errs);
      const hasContentError = errs.name || (CONTENT_FIELDS[editingFloor.type] || []).some((f) => errs[f.key]);
      if (hasContentError) setTabKey("content");
      message.warning("请按提示修正表单后再保存");
      return;
    }

    dispatch({
      type: "UPDATE_FLOOR",
      floorId: editingFloor.id,
      patch: { name: draft.name.trim(), config: draft.config },
    });
    dispatch({ type: "CLOSE_EDIT" });
    message.success("组件配置已保存，买家端预览已同步");
  };

  const renderControl = (field) => {
    const value = draft.config[field.key];
    const errorState = errors[field.key] ? "error" : undefined;
    switch (field.kind) {
      case "text":
        return (
          <Input
            id={`ef-${field.key}`}
            value={value ?? ""}
            maxLength={field.maxLength || 40}
            status={errorState}
            onChange={(e) => setField(field.key, e.target.value)}
            placeholder={`请输入${field.label}`}
            style={{ width: "100%" }}
          />
        );
      case "datetime":
        return (
          <Input
            id={`ef-${field.key}`}
            value={value ?? ""}
            status={errorState}
            onChange={(e) => setField(field.key, e.target.value)}
            placeholder="如 2026-10-31 20:00"
            style={{ width: "11rem" }}
          />
        );
      case "number":
        return (
          <InputNumber
            id={`ef-${field.key}`}
            mode="spinner"
            variant="outlined"
            style={{ width: "8rem" }}
            min={field.min}
            max={field.max}
            value={value ?? 0}
            status={errorState}
            onChange={(v) => setField(field.key, v ?? 0)}
          />
        );
      case "switch":
        return <Switch checked={!!value} onChange={(v) => setField(field.key, v)} />;
      case "select":
        return (
          <Select
            style={{ width: "11rem" }}
            options={field.options}
            value={value}
            onChange={(v) => setField(field.key, v)}
          />
        );
      case "materials":
        return field.multiple ? (
          <Select
            mode="multiple"
            style={{ width: "100%" }}
            value={value ?? []}
            onChange={(v) => setField(field.key, v)}
            options={MATERIAL_OPTIONS}
            placeholder="选择素材（第 1 张为首屏图）"
          />
        ) : (
          <Select
            style={{ width: "100%" }}
            value={value}
            onChange={(v) => setField(field.key, v)}
            options={MATERIAL_OPTIONS}
            placeholder="选择素材"
          />
        );
      default:
        return null;
    }
  };

  const renderField = (field, valueSource) => {
    const isName = field.key === "__name";
    const error = isName ? errors.name : errors[field.key];
    return (
      <div className="ef-field" key={field.key}>
        <label className={`ef-label ${field.required || isName ? "ef-label-required" : ""}`} htmlFor={isName ? "ef-name" : `ef-${field.key}`}>
          {field.label}
        </label>
        <div className="ef-control">
          {isName ? (
            <Input
              id="ef-name"
              value={draft.name}
              maxLength={20}
              status={error ? "error" : undefined}
              onChange={(e) => setName(e.target.value)}
              placeholder="请输入组件名称"
              style={{ width: "100%" }}
            />
          ) : (
            renderControl(field)
          )}
          {error && <div className="ef-error">{error}</div>}
        </div>
      </div>
    );
  };

  const nameField = { key: "__name", label: "组件名称", required: true };

  return (
    <Modal
      open={open}
      title={editingFloor ? `编辑组件 · ${editingFloor.name}` : "编辑组件"}
      width={560}
      okText="保存配置"
      cancelText="取消"
      onOk={draft ? handleSave : undefined}
      onCancel={() => dispatch({ type: "CLOSE_EDIT" })}
      destroyOnClose
    >
      {editingFloor && draft && (
        <div className="ef-body">
          <div className="ef-meta">
            <Tag color={typeInfo.tagColor}>{typeInfo.label}</Tag>
            <span className="ef-meta-text">
              {editingFloor.status ? "启用中" : "已停用"} · 排序号 {editingFloor.sort} · 近 7 天 UV 占比{" "}
              {editingFloor.uvShare > 0 ? `${editingFloor.uvShare.toFixed(1)}%` : "暂无数据"}
            </span>
          </div>
          <Tabs
            className="ef-tabs"
            activeKey={tabKey}
            onChange={setTabKey}
            items={[
              {
                key: "content",
                label: (
                  <span className="ef-tab-label">
                    <Icon name="file-text" size="0.875rem" />
                    内容配置
                  </span>
                ),
                children: (
                  <div className="ef-pane">
                    {renderField(nameField, "name")}
                    {(CONTENT_FIELDS[editingFloor.type] || []).map((f) => renderField(f, "config"))}
                  </div>
                ),
              },
              {
                key: "style",
                label: (
                  <span className="ef-tab-label">
                    <Icon name="paint-roller" size="0.875rem" />
                    样式设置
                  </span>
                ),
                children: <div className="ef-pane">{STYLE_FIELDS.map((f) => renderField(f, "style"))}</div>,
              },
            ]}
          />
        </div>
      )}
    </Modal>
  );
}
  Object.assign(__export, { EditFloorModal });
