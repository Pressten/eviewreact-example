  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 页面骨架的 token 消费示例 */
.app-root {
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.app-body {
  flex: 1;
  min-height: 0;
  display: flex;
}

.app-main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: var(--spacing-page);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
}

.page-head {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
}

.page-head__title {
  margin: 0;
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.page-head__desc {
  margin: 0;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
}


.header-bar {
  flex: none;
  height: 3rem;
  display: flex;
  align-items: center;
  gap: var(--spacing-6);
  padding: 0 var(--spacing-4);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-sm);
  position: relative;
  z-index: 10;
}

.header-bar__brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

.header-bar__logo {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-base);
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.header-bar__name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

.header-bar__nav {
  flex: 1;
  min-width: 0;
}

.header-bar__nav .ant-menu-horizontal {
  border-bottom: none;
  line-height: 3rem;
  background: transparent;
}

.header-bar__tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-1);
  flex: none;
}

.header-bar__user {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  height: 2rem;
  padding: 0 var(--spacing-2);
  border: none;
  border-radius: var(--radius-base);
  background: transparent;
  cursor: pointer;
  color: var(--on-surface);
  font: var(--font-body-m);
}

.header-bar__user:hover {
  background: var(--surface-variant);
}

.header-bar__avatar {
  width: 1.5rem;
  height: 1.5rem;
  border-radius: var(--radius-full);
  object-fit: cover;
  flex: none;
}

.header-bar__caret {
  color: var(--on-surface-variant);
}


.side-nav {
  flex: none;
  width: 15.5rem;
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-r-sm);
  display: flex;
  flex-direction: column;
  transition: width 0.2s ease;
  position: relative;
  z-index: 5;
}

.side-nav.is-collapsed {
  width: 3rem;
}

.side-nav__scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--spacing-3) 0;
}

.side-nav__caption {
  padding: 0 var(--spacing-4) var(--spacing-2);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  letter-spacing: 0.05em;
}

.side-nav__scroll .ant-menu-inline {
  border-inline-end: none;
  background: transparent;
}

.side-nav.is-collapsed .side-nav__scroll .ant-menu-inline-collapsed {
  width: 3rem;
}

.side-nav__foot {
  flex: none;
  padding: var(--spacing-2);
  border-top: var(--border-width-thin) solid var(--divider);
}


.filter-panel__grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 2rem;
  row-gap: 1rem;
}

.filter-panel__span2 {
  grid-column: span 2;
}

.filter-panel__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-inline);
  margin-top: var(--spacing-4);
  padding-top: var(--spacing-4);
  border-top: var(--border-width-thin) solid var(--divider);
}

@media (max-width: 1440px) {
  .filter-panel__grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}


.page-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}

.page-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: var(--spacing-4) var(--spacing-6);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.page-card__heading {
  display: flex;
  align-items: baseline;
  gap: var(--spacing-2);
  min-width: 0;
}

.page-card__title {
  margin: 0;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.page-card__subtitle {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.page-card__extra {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

.page-card__body {
  padding: var(--spacing-6);
}


.form-field {
  min-width: 0;
}

.form-field--stack {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.form-field--inline {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  align-items: center;
  column-gap: 2rem;
}

.form-field__label {
  position: relative;
  text-align: left;
  color: var(--on-surface-variant);
  font: var(--font-body-m);
  white-space: nowrap;
}

.form-field__label.is-required::before {
  content: "*";
  position: absolute;
  left: -0.5rem;
  color: var(--error);
  font: var(--font-body-m);
}

.form-field--inline .form-field__label {
  color: var(--on-surface);
}

.form-field__control {
  position: relative;
  min-width: 0;
}

.form-field__control > .ant-input-affix-wrapper,

.form-field__control > .ant-input-textarea,

.form-field__error {

  top: 100%;
  left: 0;
  margin-top: 0.25rem;
  font: var(--font-caption-m);
  color: var(--error);
}

  gap: 0.375rem;

  const { useState, useEffect, useCallback, createContext, useContext } = React;

// 换肤单轨驱动:isDark 只切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
const AppContext = createContext(null);

const EMPTY_FILTERS = { keyword: "", type: undefined, status: undefined, dept: undefined, range: null };

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const [activeNav, setActiveNav] = useState("datasource");
  const [list, setList] = useState(INITIAL_DATASOURCES);
  const [filters, setFilters] = useState(EMPTY_FILTERS);
  const [editor, setEditor] = useState({ open: false, mode: "create", record: null });
  const [removing, setRemoving] = useState({ open: false, ids: [] });

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const upsertRecord = useCallback((record) => {
    setList((prev) => {
      const hit = prev.some((item) => item.id === record.id);
      if (hit) {
        return prev.map((item) => (item.id === record.id ? { ...item, ...record } : item));
      }
      return [record, ...prev];
    });
  }, []);

  const removeRecords = useCallback((ids) => {
    setList((prev) => prev.filter((item) => !ids.includes(item.id)));
  }, []);

  const setStatuses = useCallback((ids, status) => {
    setList((prev) =>
      prev.map((item) => (ids.includes(item.id) ? { ...item, status, updatedAt: stamp() } : item))
    );
  }, []);

  const switchStatus = useCallback((id) => {
    setList((prev) =>
      prev.map((item) =>
        item.id === id
          ? {
              ...item,
              status: item.status === "offline" ? "online" : "offline",
              updatedAt: stamp(),
            }
          : item
      )
    );
  }, []);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
    collapsed,
    toggleCollapsed: () => setCollapsed((c) => !c),
    activeNav,
    setActiveNav,
    list,
    upsertRecord,
    removeRecords,
    switchStatus,
    setStatuses,
    nextId: buildId(list),
    filters,
    applyFilters: (next) => setFilters(next),
    resetFilters: () => setFilters(EMPTY_FILTERS),
    emptyFilters: EMPTY_FILTERS,
    editor,
    openEditor: (mode, record) => setEditor({ open: true, mode, record: record || null }),
    closeEditor: () => setEditor((s) => ({ ...s, open: false })),
    removing,
    openRemoving: (ids) => setRemoving({ open: true, ids }),
    closeRemoving: () => setRemoving((s) => ({ ...s, open: false })),
  };

}

function buildId(list) {
  const year = new Date().getFullYear();
  let max = 0;
  list.forEach((item) => {
    const num = Number(String(item.id).split("-").pop());
    if (!Number.isNaN(num) && num > max) max = num;
  });
  return `DS-${year}-${String(max + 1).padStart(4, "0")}`;
}

function stamp() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, stamp, useApp });
})();

/* ===== src/views/datasource-table/index.jsx ===== */
(function () {
  const { useMemo, useState, useEffect } = React;
  const { Table, Button, Dropdown, Tooltip, Segmented, message } = antd;
  const { Icon, useApp, formatRows } = __export;
  const PageCard = __export.PageCard;
  const StatusTag = __export.StatusTag;
const CURRENT_USER = "张伟";
const PAGE_SIZE = 10;

// Layer 4: 数据源列表 — 工具区 + 数据表格 + 内置分页
function DatasourceTable() {
  const { list, filters, setStatuses, openEditor, openRemoving } = useApp();
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [view, setView] = useState("all");
  const [current, setCurrent] = useState(1);
  const [pageSize, setPageSize] = useState(PAGE_SIZE);

  useEffect(() => {
    setCurrent(1);
  }, [filters, view]);

  const rows = useMemo(() => {
    const keyword = (filters.keyword || "").trim().toLowerCase();
    return list.filter((item) => {
      if (view === "mine" && item.owner !== CURRENT_USER) return false;
      if (filters.type && item.type !== filters.type) return false;
      if (filters.status && item.status !== filters.status) return false;
      if (filters.dept && item.dept !== filters.dept) return false;
      if (filters.range && filters.range.length === 2) {
        const start = filters.range[0].format("YYYY-MM-DD");
        const end = filters.range[1].format("YYYY-MM-DD");
        if (item.createdAt < start || item.createdAt > end) return false;
      }
      if (keyword) {
        const haystack = `${item.name} ${item.id} ${item.address} ${item.owner}`.toLowerCase();
        if (!haystack.includes(keyword)) return false;
      }
      return true;
    });
  }, [list, filters, view]);

  const clearSelection = () => setSelectedRowKeys([]);

  const handleBulkStatus = (status, label) => {
    setStatuses(selectedRowKeys, status);
    message.success(`已${label} ${selectedRowKeys.length} 个数据源`);
    clearSelection();
  };

  const handleRowAction = (key, record) => {
    if (key === "detail") {
      openEditor("edit", record);
      return;
    }
    if (key === "copy") {
      message.success(`已复制「${record.name}」的连接配置`);
      return;
    }
    if (key === "log") {
      message.success(`「${record.name}」的同步日志已开始导出`);
      return;
    }
    if (key === "delete") {
      openRemoving([record.id]);
    }
  };

  const columns = [
    {
      title: "数据源名称",
      dataIndex: "name",
      key: "name",
      width: 240,
      fixed: "left",
      render: (value, record) => (
        <a className="ds-link" onClick={() => openEditor("edit", record)}>
          {value}
        </a>
      ),
    },
    {
      title: "类型",
      dataIndex: "type",
      key: "type",
      width: 116,
      render: (value) => <span className="ds-type">{value}</span>,
    },
    { title: "归属部门", dataIndex: "dept", key: "dept", width: 150 },
    { title: "负责人", dataIndex: "owner", key: "owner", width: 96 },
    {
      title: "数据表数",
      dataIndex: "tables",
      key: "tables",
      width: 116,
      align: "right",
      sorter: (a, b) => a.tables - b.tables,
    },
    {
      title: "数据量",
      dataIndex: "rows",
      key: "rows",
      width: 124,
      align: "right",
      sorter: (a, b) => a.rows - b.rows,
      render: (value) => formatRows(value),
    },
    { title: "更新频率", dataIndex: "freq", key: "freq", width: 108 },
    {
      title: "运行状态",
      dataIndex: "status",
      key: "status",
      width: 118,
      render: (value) => <StatusTag status={value} />,
    },
    {
      title: "最近更新时间",
      dataIndex: "updatedAt",
      key: "updatedAt",
      width: 172,
      render: (value) => <span className="ds-muted">{value}</span>,
    },
    {
      title: "操作",
      key: "action",
      width: 148,
      align: "left",
      render: (_, record) => (
        <div className="ds-actions">
          <Tooltip title="编辑">
            <Button
              type="text"
              shape="circle"
              size="small"
              icon={<Icon name="pencil" size="0.875rem" />}
              onClick={() => openEditor("edit", record)}
            />
          </Tooltip>
          <Tooltip title={record.status === "offline" ? "上线" : "下线"}>
            <Button
              type="text"
              shape="circle"
              size="small"
              icon={<Icon name="power" size="0.875rem" />}
              onClick={() => {
                setStatuses([record.id], record.status === "offline" ? "online" : "offline");
                message.success(record.status === "offline" ? "数据源已上线" : "数据源已下线");
              }}
            />
          </Tooltip>
          <Dropdown
            trigger={["click"]}
            placement="bottomRight"
            menu={{
              items: [
                { key: "detail", label: "查看详情" },
                { key: "copy", label: "复制配置" },
                { key: "log", label: "导出同步日志" },
                { type: "divider" },
                { key: "delete", label: "删除数据源", danger: true },
              ],
              onClick: ({ key }) => handleRowAction(key, record),
            }}
          >
            <Button
              type="text"
              shape="circle"
              size="small"
              icon={<Icon name="ellipsis" size="0.875rem" />}
            />
          </Dropdown>
        </div>
      ),
    },
  ];

  const hasSelection = selectedRowKeys.length > 0;

  return (
    <PageCard
      title="数据源列表"
      subtitle={`已接入 ${list.length} 个数据源`}
      className="table-card"
      bodyClassName="table-card__body"
      extra={
        <>
          <Segmented
            value={view}
            onChange={setView}
            options={[
              { label: "全部数据源", value: "all" },
              { label: "我负责的", value: "mine" },
            ]}
          />
          <Button
            type="primary"
            icon={<Icon name="plus" size="0.875rem" />}
            onClick={() => openEditor("create")}
          >
            新建数据源
          </Button>
        </>
      }
    >
      <div className="table-toolbar">
        <div className="table-toolbar__info">
          {hasSelection ? `已选 ${selectedRowKeys.length} 项` : `共 ${rows.length} 条记录`}
        </div>
        <div className="table-toolbar__actions">
          {hasSelection ? (
            <>
              <a className="ds-link ds-link--plain" onClick={clearSelection}>
                取消选择
              </a>
              <Button size="small" onClick={() => handleBulkStatus("online", "上线")}>
                批量上线
              </Button>
              <Button size="small" onClick={() => handleBulkStatus("offline", "下线")}>
                批量下线
              </Button>
              <Button size="small" danger onClick={() => openRemoving(selectedRowKeys)}>
                批量删除
              </Button>
            </>
          ) : null}
        </div>
      </div>

      <Table
        rowKey="id"
        size="middle"
        columns={columns}
        dataSource={rows}
        scroll={{ x: 1560 }}
        rowSelection={{
          selectedRowKeys,
          onChange: (keys) => setSelectedRowKeys(keys),
        }}
        pagination={{
          current,
          pageSize,
          showSizeChanger: true,
          pageSizeOptions: ["10", "20", "50"],
          showTotal: (total) => `共 ${total} 条记录`,
          onChange: (page, size) => {
            setCurrent(page);
            setPageSize(size);
          },
        }}
      />
    </PageCard>
  );
}
  Object.assign(__export, { DatasourceTable });
})();

/* ===== src/views/datasource-modal/index.jsx ===== */
(function () {
  const { useState, useEffect } = React;
  const { Modal, Input, Select, Segmented, InputNumber, Button, message } = antd;
  const { useApp, stamp, TYPE_OPTIONS, DEPT_OPTIONS, FREQ_OPTIONS } = __export;
  const FormField = __export.FormField;
const { TextArea } = Input;

const STATUS_SEGMENTS = [
  { label: "已上线", value: "online" },
  { label: "草稿", value: "draft" },
  { label: "已下线", value: "offline" },
];

const BLANK = {
  name: "",
  type: undefined,
  dept: undefined,
  owner: "",
  freq: "天级",
  address: "",
  status: "online",
  tables: 0,
  desc: "",
};

// Layer 4: 新建 / 编辑数据源弹窗 — H5 表单骨架 + 受控校验
function DatasourceModal() {
  const { editor, closeEditor, upsertRecord, nextId, list } = useApp();
  const [form, setForm] = useState(BLANK);
  const [errors, setErrors] = useState({});
  const isEdit = editor.mode === "edit";

  useEffect(() => {
    if (!editor.open) return;
    if (isEdit && editor.record) {
      setForm({ ...BLANK, ...editor.record });
    } else {
      setForm({ ...BLANK, id: nextId, createdAt: stamp().slice(0, 10), owner: "张伟" });
    }
    setErrors({});
  }, [editor.open, editor.mode, editor.record]);

  const patch = (key, value) => {
    setForm((prev) => ({ ...prev, [key]: value }));
    setErrors((prev) => (prev[key] ? { ...prev, [key]: undefined } : prev));
  };

  const validate = () => {
    const next = {};
    const name = form.name.trim();
    if (!name) {
      next.name = "请输入数据源名称";
    } else if (list.some((item) => item.name === name && item.id !== form.id)) {
      next.name = "该数据源名称已存在";
    }
    if (!form.type) next.type = "请选择数据源类型";
    if (!form.dept) next.dept = "请选择归属部门";
    if (!form.owner.trim()) next.owner = "请输入负责人";
    if (!form.address.trim()) next.address = "请输入连接地址";
    return next;
  };

  const handleSubmit = () => {
    const next = validate();
    setErrors(next);
    if (Object.keys(next).length > 0) return;
    upsertRecord({
      ...form,
      name: form.name.trim(),
      owner: form.owner.trim(),
      address: form.address.trim(),
      updatedAt: stamp(),
    });
    message.success(isEdit ? "数据源已保存" : "数据源已创建");
    closeEditor();
  };

  return (
    <Modal
      open={editor.open}
      title={isEdit ? "编辑数据源" : "新建数据源"}
      width={680}
      maskClosable={false}
      onCancel={closeEditor}
      footer={[
        <Button key="cancel" onClick={closeEditor}>
          取消
        </Button>,
        <Button key="submit" type="primary" onClick={handleSubmit}>
          {isEdit ? "保存" : "创建"}
        </Button>,
      ]}
    >
      <div className="ds-form">
        <FormField
          label="数据源名称"
          htmlFor="ds-name"
          required
          error={errors.name}
          className="ds-form__full"
        >
          <Input
            id="ds-name"
            value={form.name}
            placeholder="如：门店交易明细库"
            status={errors.name ? "error" : undefined}
            onChange={(e) => patch("name", e.target.value)}
          />
        </FormField>

        <FormField label="数据源类型" htmlFor="ds-type" required error={errors.type}>
          <Select
            id="ds-type"
            value={form.type}
            placeholder="请选择类型"
            options={TYPE_OPTIONS}
            status={errors.type ? "error" : undefined}
            onChange={(value) => patch("type", value)}
          />
        </FormField>

        <FormField label="归属部门" htmlFor="ds-dept" required error={errors.dept}>
          <Select
            id="ds-dept"
            value={form.dept}
            placeholder="请选择归属部门"
            options={DEPT_OPTIONS}
            status={errors.dept ? "error" : undefined}
            onChange={(value) => patch("dept", value)}
          />
        </FormField>

        <FormField label="负责人" htmlFor="ds-owner" required error={errors.owner}>
          <Input
            id="ds-owner"
            value={form.owner}
            placeholder="请输入负责人姓名"
            status={errors.owner ? "error" : undefined}
            onChange={(e) => patch("owner", e.target.value)}
          />
        </FormField>

        <FormField label="更新频率" htmlFor="ds-freq">
          <Select
            id="ds-freq"
            value={form.freq}
            options={FREQ_OPTIONS}
            onChange={(value) => patch("freq", value)}
          />
        </FormField>

        <FormField
          label="连接地址"
          htmlFor="ds-address"
          required
          error={errors.address}
          className="ds-form__full"
        >
          <Input
            id="ds-address"
            value={form.address}
            placeholder="如：10.62.18.31:3306/retail_trade 或 https://open.api.internal/v1/assets"
            status={errors.address ? "error" : undefined}
            onChange={(e) => patch("address", e.target.value)}
          />
        </FormField>

        <FormField label="运行状态" htmlFor="ds-status">
          <Segmented
            id="ds-status"
            block
            value={form.status}
            options={STATUS_SEGMENTS}
            onChange={(value) => patch("status", value)}
          />
        </FormField>

        <FormField label="数据表数量" htmlFor="ds-tables">
          <InputNumber
            id="ds-tables"
            min={0}
            max={9999}
            value={form.tables}
            onChange={(value) => patch("tables", value || 0)}
          />
        </FormField>

        <FormField label="数据源描述" htmlFor="ds-desc" className="ds-form__full">
          <TextArea
            id="ds-desc"
            rows={3}
            maxLength={120}
            showCount
            value={form.desc}
            placeholder="简要说明该数据源的业务含义与使用范围"
            onChange={(e) => patch("desc", e.target.value)}
          />
        </FormField>
      </div>
    </Modal>
  );
}
  Object.assign(__export, { DatasourceModal });
})();

/* ===== src/views/confirm-modal/index.jsx ===== */
(function () {
  const { Modal, Button, message } = antd;
  const { Icon, useApp } = __export;
// Layer 4: 删除数据源二次确认弹窗
function ConfirmModal() {
  const { removing, closeRemoving, removeRecords, list } = useApp();
  const targets = list.filter((item) => removing.ids.includes(item.id));
  const preview = targets.slice(0, 5);

  const handleConfirm = () => {
    removeRecords(removing.ids);
    closeRemoving();
    message.success(`已删除 ${removing.ids.length} 个数据源`);
  };

  return (
    <Modal
      open={removing.open}
      title="删除数据源"
      width={480}
      onCancel={closeRemoving}
      footer={[
        <Button key="cancel" onClick={closeRemoving}>
          取消
        </Button>,
        <Button key="delete" danger type="primary" onClick={handleConfirm}>
          删除
        </Button>,
      ]}
    >
      <div className="confirm-body">
        <span className="confirm-body__icon">
          <Icon name="triangle-alert" size="1.25rem" />
        </span>
        <div className="confirm-body__text">
          <p className="confirm-body__title">
            本次将删除 {removing.ids.length} 个数据源，删除后关联的同步任务将一并停止且不可恢复。
          </p>
          <ul className="confirm-body__list">
            {preview.map((item) => (
              <li key={item.id}>
                <span>{item.name}</span>
                <span className="confirm-body__id">{item.id}</span>
              </li>
            ))}
            {targets.length > preview.length ? (
              <li className="confirm-body__more">等共 {targets.length} 个数据源</li>
            ) : null}
          </ul>
        </div>
      </div>
    </Modal>
  );
}
  Object.assign(__export, { ConfirmModal });
})();

/* ===== app.jsx ===== */
(function () {

  const DatasourceTable = __export.DatasourceTable;

  const ConfirmModal = __export.ConfirmModal;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (per-domain files, e.g. datasource.js)
//   Layer 3 reusable      → src/components/{name}/ (cross-view, e.g. page-card / form-field / status-tag)
//   Layer 4 views         → src/views/{name}/      (one per tab/section, e.g. header-bar / datasource-table)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.












function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN}>
        <div className="app-root">
          <HeaderBar />
          <div className="app-body">
            <SideNav />
            <main className="app-main">
              <div className="page-head">
                <Breadcrumb
                  items={[{ title: "首页" }, { title: "数据管理" }, { title: "数据源管理" }]}
                />
                <h1 className="page-head__title">数据源管理</h1>
                <p className="page-head__desc">
                  统一纳管全域数据源接入信息，维护连接配置、归属部门与同步状态。
                </p>
              </div>
              <FilterPanel />
              <DatasourceTable />
            </main>
          </div>
          <DatasourceModal />
          <ConfirmModal />
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();

root.render(React.createElement(__export.App));
