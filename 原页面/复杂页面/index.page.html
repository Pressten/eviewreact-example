  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

}

}

/* Button 组件样式（token 映射） */
.ant-btn {
  font-size: var(--font-size-md);
  border-radius: var(--radius-base);
  font-weight: var(--font-weight-normal);
  min-width: calc(var(--spacing-4) * 5.5);

  gap: 4px;
}
.ant-btn.ant-btn-color-default {
  color: var(--color-text-primary);
}

  color: var(--color-text-primary);
  border-color: var(--gray-90);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:not(:disabled):active {
  color: var(--color-text-primary);
  border-color: var(--border-primary);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:disabled {
  color: var(--color-text-disabled);
  background-color: var(--gray-10);
}

  color: var(--gray-0);
  background-color: var(--color-brand);

  color: var(--gray-0);
  background-color: var(--brand-40);

  color: var(--gray-0);
  background-color: var(--brand-60);

  color: var(--gray-0);
  background-color: var(--brand-20);

  color: var(--gray-0);

  color: var(--gray-0);
  background-color: var(--red-40);

  color: var(--gray-0);
  background-color: var(--red-60);

.ant-btn.ant-btn-dangerous:disabled {

/* 应用级基础样式 — 页面骨架与通用卡片容器 */

.app-root {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

/* ── 主体骨架：侧边导航 + 内容区 ── */
.app-body {
  display: flex;
  flex: 1;
  min-height: 0;
}

.app-main {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: var(--spacing-page);
  background: var(--surface-container-lowest);
}

.app-main__stack {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
}

/* ── 页头：标题 + 主操作 ── */
.app-page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  margin-bottom: var(--spacing-6);
}

.app-page-head__text {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-0-5);
  min-width: 0;
}

.app-page-head__crumb {
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

.app-page-head__title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
}

.app-page-head__desc {
  margin: 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.app-page-head__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

.app-page-head__btn {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
  height: 32px;
  padding: 0 var(--spacing-4);
  border: var(--border-width-thin) solid var(--outline);
  border-radius: var(--radius-action);
  background: var(--surface-container-highest);
  color: var(--on-surface);
  font: var(--font-body-m);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}

.app-page-head__btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.app-page-head__btn--primary {
  border-color: transparent;
  background: var(--primary);
  color: var(--on-primary);
  font-weight: var(--font-weight-medium);
}

.app-page-head__btn--primary:hover {
  background: var(--primary-hover);
  color: var(--on-primary);
}

/* ── 通用内容卡片（Level 1：最高层容器 + 卡片阴影，不加描边） ── */
.panel-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}

.panel-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding-bottom: var(--spacing-4);
  margin-bottom: var(--spacing-4);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.panel-card__titles {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-0-5);
  min-width: 0;
}

.panel-card__title {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
}

.panel-card__desc {
  margin: 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.panel-card__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

@media (max-width: 1024px) {
  .app-main {
    padding: var(--spacing-4);
  }

  .app-page-head {
    flex-direction: column;
    align-items: flex-start;
  }
}


.header-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  height: 48px;
  flex: none;
  padding: 0 var(--spacing-4) 0 var(--spacing-3);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-t-sm);
  position: relative;
  z-index: 20;
}

/* ── 品牌区 ── */
.header-bar__brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

.header-bar__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-md);
  background: var(--primary-fixed);
  color: var(--on-primary-fixed);
}

.header-bar__names {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
  min-width: 0;
}

.header-bar__title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

.header-bar__sub {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

/* ── 全局工具区 ── */
.header-bar__tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

.header-bar__search {
  width: 220px;
}

.header-bar__lang {
  flex: none;
}

.header-bar__divider {
  width: var(--border-width-thin);
  height: 20px;
  background: var(--divider);
  margin: 0 var(--spacing-1);
}

.header-bar__user {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  padding-left: var(--spacing-1);
}

.header-bar__avatar {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-full);
  object-fit: cover;
  background: var(--surface-variant);
}

.header-bar__user-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.header-bar__user-text strong {
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  white-space: nowrap;
}

.header-bar__user-text em {
  font: var(--font-caption-s);
  font-style: normal;
  color: var(--on-surface-variant);
  white-space: nowrap;
}

@media (max-width: 1280px) {
  .header-bar__search,
  .header-bar__user-text {
    display: none;
  }
}


.side-nav {
  display: flex;
  flex-direction: column;
  flex: none;
  width: 248px;
  height: 100%;
  padding: var(--spacing-2) 0 var(--spacing-3);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-r-sm);
  transition: width 0.18s ease;
  overflow: hidden auto;
}

.side-nav.is-collapsed {
  width: 48px;
}

.side-nav__menu {
  flex: 1;
}

.side-nav__footer {
  display: flex;

  const { useState, useEffect, createContext, useContext } = React;
// Layer 1: 全局状态 — 皮肤模式、界面语言、侧边栏折叠
// 换肤单轨驱动：isDark 只切换 <html> 的 .dark class；
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随，无需 React 参与换肤。
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);
  const [lang, setLang] = useState("zh");
  const [collapsed, setCollapsed] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  useEffect(() => {
    document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");
  }, [lang]);

  const value = {
    isDark,
    lang,
    collapsed,
    setLang,
    toggleDark: () => setIsDark((d) => !d),
    toggleCollapsed: () => setCollapsed((c) => !c),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

function StrategyModal({ open, record, onClose }) {
  const [form] = Form.useForm();
  const intl = useIntl();
  const t = (id, fallback) => intl.formatMessage({ id, defaultMessage: fallback || id });

  const enableNow = Form.useWatch("enableNow", form) !== false;

  useEffect(() => {
    if (!open) return;
    if (record) {
      form.setFieldsValue({
        name: record.name,
        deviceType: record.deviceType,
        intervalSec: record.intervalSec,
        level: record.level,
        enableNow: record.status === "enabled",
      });
    } else {
      form.resetFields();
    }
  }, [open, record]);

  const submit = async (asDraft) => {
    if (!asDraft) {
      try {
        await form.validateFields();
      } catch (err) {
        return;
      }
    }
    message.success(
      asDraft ? t("toast.draft") : record ? t("toast.updated") : t("toast.created")

    onClose();
  };

  return (
    <Modal
      open={open}
      onCancel={onClose}
      width={680}
      title={
        <span className="strategy-modal__title">
          <Icon name="circle-plus" size={16} />
          {record ? t("modal.title.edit") : t("modal.title.new")}
        </span>
      }
      footer={[
        <Button key="cancel" onClick={onClose}>
          {t("modal.cancel")}
        </Button>,
        <Button key="draft" onClick={() => submit(true)}>
          {t("modal.draft")}
        </Button>,
        <Button key="ok" type="primary" onClick={() => submit(false)}>
          {t("modal.ok")}
        </Button>,
      ]}
    >
      <p className="strategy-modal__desc">{t("modal.desc")}</p>

      <Form
        form={form}
        layout="vertical"
        requiredMark
        initialValues={{ enableNow: true, level: "warning", intervalSec: 60, flap: true }}
      >
        <StrategyFields advanced={false} />

        <div className="switch-row">
          <div className="switch-row__text">
            <span className="switch-row__label">{t("modal.enableNow")}</span>
            <span className="switch-row__desc">{t("modal.enableNowDesc")}</span>
          </div>
          <Form.Item name="enableNow" valuePropName="checked" noStyle>
            <Switch />
          </Form.Item>
        </div>

        <p className="strategy-modal__status">
          <Icon name={enableNow ? "circle-check" : "pencil-line"} size={12} />
          {enableNow ? t("opt.status.enabled") : t("opt.status.draft")}
        </p>
      </Form>
    </Modal>
  );
}
  Object.assign(__export, { StrategyModal });
})();

/* ===== app.jsx ===== */
(function () {
  const { useEffect, useState } = React;
  const { ConfigProvider } = antd;
  const { IntlProvider } = ReactIntl;
  const { AppProvider, useApp, messages, Icon } = __export;
  const zhCN = __export.zhCN;
  const HeaderBar = __export.HeaderBar;
  const SideNav = __export.SideNav;
  const StrategyForm = __export.StrategyForm;
  const StrategyTable = __export.StrategyTable;
  const StrategyModal = __export.StrategyModal;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: 皮肤 / 语言 / 侧边栏折叠)
//   Layer 2 mock data     → src/mock/              (strategy.js: 选项集 + 策略清单)
//   Layer 3 reusable      → src/components/        (status-tag / strategy-fields)
//   Layer 4 views         → src/views/             (header-bar / side-nav / strategy-form / strategy-table / strategy-modal)
//   Layer 5 layout        → app.jsx                (Provider + 根容器装配)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.
















function Shell() {
  const { lang } = useApp();
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);

  // 语言切换需同步 dayjs（antd 文案由 ConfigProvider locale 驱动）
  useEffect(() => {
    dayjs.locale(lang === "zh" ? "zh-cn" : "en");
  }, [lang]);

  const openModal = (record) => {
    setEditing(record || null);
    setModalOpen(true);
  };

  return (
    <IntlProvider locale={lang === "zh" ? "zh-CN" : "en-US"} messages={messages[lang]}>
      <ConfigProvider locale={lang === "zh" ? zhCN : undefined}>
        <div className="app-root">
          <HeaderBar />

          <div className="app-body">
            <SideNav />

            <main className="app-main">
              <div className="app-page-head">
                <div className="app-page-head__text">
                  <span className="app-page-head__crumb">
                    {lang === "zh" ? "首页 / 策略配置 / 参数配置" : "Home / Strategy / Parameters"}
                  </span>
                  <h1 className="app-page-head__title">
                    {lang === "zh" ? "策略配置" : "Strategy Configuration"}
                  </h1>
                  <p className="app-page-head__desc">
                    {lang === "zh"
                      ? "按设备类型下发采集与告警策略，保存后 5 分钟内自动生效。"
                      : "Deliver collection and alarm strategies per device type. Changes take effect within 5 minutes."}
                  </p>
                </div>
                <div className="app-page-head__actions">
                  <button type="button" className="app-page-head__btn" onClick={() => openModal(null)}>
                    <Icon name="download" size={14} />
                    {lang === "zh" ? "导入配置" : "Import"}
                  </button>
                  <button
                    type="button"
                    className="app-page-head__btn app-page-head__btn--primary"
                    onClick={() => openModal(null)}
                  >
                    <Icon name="plus" size={14} />
                    {lang === "zh" ? "新建策略" : "New Strategy"}
                  </button>
                </div>
              </div>

              <div className="app-main__stack">
                <StrategyForm onOpenModal={() => openModal(null)} />
                <StrategyTable onEdit={openModal} />
              </div>
            </main>
          </div>

          <StrategyModal open={modalOpen} record={editing} onClose={() => setModalOpen(false)} />
        </div>
      </ConfigProvider>
    </IntlProvider>
  );
}

function App() {
  return (
    <AppProvider>
      <Shell />
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
