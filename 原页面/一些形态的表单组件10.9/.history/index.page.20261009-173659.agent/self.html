  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 页面根节点与共享版式 */
.app-root {
  min-height: 100vh;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.page {
  max-width: 1600px;
  margin: 0 auto;
  padding: var(--spacing-page);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* 页头 */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
}

.page-title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
}

.page-desc {
  margin: 0.25rem 0 0;
  color: var(--on-surface-variant);
  font: var(--font-body-m);
}

/* 内容卡片（版式容器，非组件） */
.card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: var(--spacing-inset);
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  margin-bottom: 1.5rem;
}

.card-title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
}

.card-sub {
  margin: 0.25rem 0 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.card-head__hint {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  flex: none;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.card-head__hint .req {
  color: var(--error);
  font-style: normal;
}


.rule-form .form-body {
  max-width: 46rem;
}

.form-col {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.form-field {
  display: grid;
  grid-template-columns: 8rem 1fr;
  column-gap: 1rem;
  align-items: start;
}

.form-field--compact {
  grid-template-columns: 7rem 1fr;
}

/* 标签：左对齐，行高与 medium 控件（2rem）对齐 */
.form-label {
  position: relative;
  line-height: 2rem;
  color: var(--on-surface-variant);
  font: var(--font-body-m);
}

/* 必填星号：悬挂在标签左侧，垂直居中，不占排版 */
.form-label.required::before {
  content: "*";
  position: absolute;
  left: -0.5rem;
  top: 1rem;
  transform: translateY(-50%);
  color: var(--error);
  font: var(--font-body-m);
}

.form-control {
  position: relative;
  min-width: 0;
}

/* 校验文案：覆盖在控件正下方，不占位、不顶布局 */
.form-error {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 0.25rem;
  font: var(--font-caption-m);
  color: var(--error);
}

.form-inline {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.form-inline__note {
  flex: none;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

/* 高级策略开关行：说明在行首，开关在行尾 */
.form-switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem 1rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
}

.form-switch-row__text {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
}

.form-switch-row__label {
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
}

.form-switch-row__desc {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

/* 子表单：嵌套内层区域 */
.sub-form {
  padding: 1rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
}

.sub-form__head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
}

.sub-form__body {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-inline);
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: var(--border-width-thin) solid var(--divider);
}


.table-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--spacing-gutter);
  margin-bottom: 1rem;
}

.table-toolbar__filters {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-wrap: wrap;
}

.table-toolbar__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.table-toolbar__count {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.table-toolbar__count em {
  font-style: normal;
  font-weight: var(--font-weight-semibold);
  color: var(--primary);
}

/* 数据列中的链接式内容 */
.cell-link {
  color: var(--interactive-link);
  cursor: pointer;
  text-decoration: none;
}

.cell-link:hover {
  color: var(--interactive-link-hover);
  text-decoration: underline;
}

.cell-metric {
  color: var(--on-surface);
  font: var(--font-body-m);
}

/* 操作列：纯图标，间距 1rem，hover 品牌色 */
.row-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
  color: var(--on-surface-variant);
}

.row-actions svg,
.row-actions span {
  color: inherit;

// 级联路径 → 文本（如 ["east","jiangsu","nanjing"] → "华东 / 江苏省 / 南京"）
function regionText(path) {
  const labels = [];
  let level = regions;
  for (const v of path) {
    const node = level?.find((n) => n.value === v);
    if (!node) break;
    labels.push(node.label);
    level = node.children;
  }
  return labels.join(" / ");
}

    channelLabels: chs.map(channelLabel),
    enabled,
    updatedAt,
  };
});

            onClick={() => messageApi.info(`复制规则：${row.id}`)}
          />
          <Icon
            name="trash-2"
            size="0.875rem"
            title="删除规则"
            onClick={() => messageApi.warning(`删除规则：${row.id}`)}
          />
        </div>
      ),
    },
  ];

  const rowSelection = {
    selectedRowKeys: selectedKeys,
    onChange: (keys) => setSelectedKeys(keys),
  };

  return (
    <section className="rule-table card">
      {contextHolder}
      <header className="card-head">
        <div className="card-head__title">
          <h2 className="card-title">告警规则列表</h2>
          <p className="card-sub">
            共 {data.length} 条规则，其中已启用 {data.filter((r) => r.enabled).length} 条
          </p>
        </div>
      </header>

      <div className="table-toolbar">
        <div className="table-toolbar__filters">
          <Input
            style={{ width: "17rem" }}
            size="small"
            placeholder="搜索规则名称、编号或监控对象"
            value={keyword}
            onChange={(e) => setKeyword(e.target.value)}
            allowClear
            suffix={<Icon name="search" size="0.875rem" />}
          />
          <Select
            style={{ width: "9rem" }}
            size="small"
            placeholder="告警级别"
            value={levelFilter}
            onChange={setLevelFilter}
            options={alarmLevels.map((l) => ({ value: l.value, label: levelText(l.value) }))}
            allowClear
          />
          <Select
            style={{ width: "9rem" }}
            size="small"
            placeholder="通知渠道"
            value={channelFilter}
            onChange={setChannelFilter}
            options={channels}
            allowClear
          />
        </div>
        <div className="table-toolbar__actions">
          {selectedKeys.length > 0 && (
            <span className="table-toolbar__count">
              已选 <em>{selectedKeys.length}</em> 项
            </span>
          )}
          <Button
            size="small"
            icon={<Icon name="refresh-cw" size="0.875rem" />}
            onClick={() => {
              setKeyword("");
              setLevelFilter(undefined);
              setChannelFilter(undefined);
              setSelectedKeys([]);
              messageApi.success("已刷新列表");
            }}
          >
            刷新
          </Button>
          <Button
            size="small"
            type="primary"
            icon={<Icon name="plus" size="0.875rem" />}
            onClick={() => messageApi.info("前往上方表单新建规则")}
          >
            新建规则
          </Button>
        </div>
      </div>

      <Table
        rowKey="id"
        size="middle"
        columns={columns}
        dataSource={data}
        rowSelection={rowSelection}
        scroll={{ x: 1180 }}
        pagination={{
          pageSize: 8,
          showSizeChanger: true,
          showTotal: (total) => `共 ${total} 条`,
        }}
      />
    </section>
  );
}
  Object.assign(__export, { RuleTable });
})();

/* ===== app.jsx ===== */
(function () {
  const { ConfigProvider, Button } = antd;
  const { Icon, AppProvider, useApp } = __export;
  const zhCN = __export.zhCN;
  const RuleForm = __export.RuleForm;
  const RuleTable = __export.RuleTable;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (per-domain files, e.g. rule.js)
//   Layer 3 reusable      → src/components/{name}/ (cross-view, e.g. level-tag)
//   Layer 4 views         → src/views/{name}/      (one per section, e.g. rule-form / rule-table)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)









function PageHeader() {
  const { isDark, toggleDark } = useApp();
  return (
    <header className="page-header">
      <div className="page-header__text">
        <h1 className="page-title">告警规则配置</h1>
        <p className="page-desc">统一维护设备告警的触发条件与通知策略，规则保存后即刻对所选分组生效。</p>
      </div>
      <Button icon={<Icon name={isDark ? "sun" : "moon"} size="0.875rem" />} onClick={toggleDark}>
        {isDark ? "浅色模式" : "深色模式"}
      </Button>
    </header>
  );
}

function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN}>
        <div className="app-root">
          <div className="page">
            <PageHeader />
            <RuleForm />
            <RuleTable />
          </div>
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
