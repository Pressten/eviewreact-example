  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 页面根节点、导航骨架与内容流 */
.app-root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.app-body {
  flex: 1;
  display: flex;
  align-items: stretch;
  min-height: 0;
}

/* 内容区：自上而下 —— 表单 → 表格 */
.app-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-gutter);
  padding: var(--spacing-page);
}

@media (max-width: 900px) {
  .app-sider {
    display: none;
  }
}


.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  height: 48px;
  padding: 0 var(--spacing-page);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-sm);
}

.app-header__left {
  display: flex;
  align-items: stretch;
  gap: var(--spacing-page);
  height: 100%;
  min-width: 0;
}

.app-header__brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.app-header__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-action);
  background: var(--primary-container);
  color: var(--primary);
}

.app-header__title {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

/* ── 原生顶部导航 ── */
.topnav {
  display: flex;
  align-items: stretch;
  height: 100%;
}

.topnav__item {
  display: inline-flex;
  align-items: center;
  padding: 0 var(--spacing-4);
  border-bottom: var(--border-width-thick) solid transparent;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.topnav__item:hover {
  color: var(--primary);
}

.topnav__item.is-active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: var(--font-weight-medium);
}

.app-header__tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.app-header__icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border: none;
  border-radius: var(--radius-action);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}

.app-header__icon-btn:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}

.app-header__divider {
  width: var(--border-width-thin);
  height: 1.25rem;
  background: var(--divider);
}

.app-header__user {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.app-header__avatar {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  object-fit: cover;
}

.app-header__username {
  font: var(--font-body-m);
  color: var(--on-surface);
}


.app-sider {
  position: sticky;
  top: 48px;
  align-self: flex-start;
  flex: none;
  width: 248px;
  height: calc(100vh - 48px);
  overflow-y: auto;
  padding: var(--spacing-3) 0;
  background: var(--surface-container-highest);
  border-right: var(--border-width-thin) solid var(--divider);
}


.tf-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: var(--spacing-inset);
}

.tf-card__head {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-stack);
  padding-bottom: var(--spacing-inset);
  margin-bottom: var(--spacing-inset);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.tf-card__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: var(--radius-action);
  background: var(--primary-container);
  color: var(--primary);
}

.tf-card__title {
  margin: 0;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.tf-card__subtitle {
  margin: 0.25rem 0 0;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.tf-form {
  display: flex;
  flex-direction: column;
  max-width: 44rem;
}

.tf-body {
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}

.tf-group {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.tf-group__title {
  margin: 0;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

/* ── 字段：标签居左、逐行对齐 ── */
.tf-field {
  position: relative;
  display: grid;
  grid-template-columns: 8rem minmax(0, 1fr);
  align-items: center;
  column-gap: var(--spacing-4);
}

.tf-label {
  position: relative;
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.tf-label--required::before {
  content: "*";
  position: absolute;
  left: -0.5rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--error);
  font: var(--font-body-m);
}

.tf-control {
  position: relative;
  display: flex;
  flex-direction: column;
}

.tf-error {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 0.25rem;
  font: var(--font-caption-m);
  color: var(--error);
}

.tf-field--reveal {
  animation: tf-reveal 0.24s ease;
}

@keyframes tf-reveal {
  from {
    opacity: 0;
    transform: translateY(-0.25rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ── 开关行 ── */
.tf-toggle {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  padding: var(--spacing-3) var(--spacing-4);
  border-radius: var(--radius-container);
  background: var(--surface-variant);
}

.tf-toggle__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-action);
  background: var(--surface-container-highest);
  color: var(--primary);
}

.tf-toggle__text {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
  flex: 1;
  min-width: 0;
}

.tf-toggle__title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.tf-toggle__desc {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.tf-toggle--inner {
  background: var(--surface-container-highest);
}

.tf-toggle--inner .tf-toggle__icon {
  background: var(--surface-variant);
}

/* ── 子表单面板（Level 2 内嵌区域） ── */
.tf-subpanel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: var(--spacing-4);
  border-radius: var(--radius-container);
  background: var(--surface-variant);
  animation: tf-reveal 0.24s ease;
}

/* ── 操作区 ── */
.tf-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-inline);
  padding-top: var(--spacing-inset);
  margin-top: var(--spacing-inset);
  border-top: var(--border-width-thin) solid var(--divider);
}


.rt-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: var(--spacing-inset);
}

.rt-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  flex-wrap: wrap;
  margin-bottom: var(--spacing-gutter);
}

.rt-toolbar__title {
  display: flex;
  align-items: baseline;
  gap: var(--spacing-stack);
}

.rt-card__title {
  margin: 0;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.rt-count {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.rt-toolbar__tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
}

.rt-selection {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  height: 2rem;
  padding: 0 var(--spacing-3);
  border-radius: var(--radius-action);
  background: var(--primary-container);
  color: var(--on-primary-container);
  font: var(--font-body-s);
}

.rt-selection a {
  color: var(--interactive-link);
  cursor: pointer;
  text-decoration: none;
}

.rt-selection a:hover {
  color: var(--interactive-link-hover);
}

.rt-search {
  width: 15rem;
}

/* ── 单元格 ── */
.rt-link {
  color: var(--interactive-link);
  cursor: pointer;
  text-decoration: none;
  font: var(--font-body-m);
}

.rt-link:hover {
  color: var(--interactive-link-hover);
}

.rt-plain {
  font: var(--font-body-m);
  color: var(--on-surface);
}

.rt-plain--muted {
  color: var(--on-surface-variant);
}

.rt-num {
  font: var(--font-body-m);
  color: var(--on-surface);
  font-variant-numeric: tabular-nums;
}

.rt-actions {
  display: flex;
  align-items: center;
  gap: 0.25rem;
}


.soft-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  height: 1.5rem;
  padding: 0 var(--spacing-2);
  border-radius: var(--radius-badge);
  font: var(--font-body-s);
  white-space: nowrap;
}

.soft-tag--success {
  color: var(--success);
  background: var(--success-container);
}

.soft-tag--error {
  color: var(--error);
  background: var(--error-container);
}

.soft-tag--critical {
  color: var(--critical);
  background: var(--critical-container);
}

.soft-tag--info {
  color: var(--info);
  background: var(--info-container);
}

.soft-tag--brand {
  color: var(--primary);
  background: var(--primary-container);
}

.soft-tag--neutral {
  color: var(--on-surface-variant);
  background: var(--surface-variant);
}

// Layer 1: 全局状态 — 主题模式与业务状态
// 换肤单轨驱动:isDark 只切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });

    ICONS[name.replace(/-([a-z])/g, (_m, c) => c.toUpperCase())] ||
    null
  );
}

// ---- icon-plus (联通) online flow, same as packages/previewpc ----
const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url }
const svgCache = new Map(); // "name&variant&color" -> svg text

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (cached in iconInfoMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  try {
    const resp = await fetch(
      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length
    );
    const selected = selectBestIcon(entry?.icons || [], name);
    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };
    return iconInfoMap[name];
  } catch (e) {
    return null;
  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rem = size / 16;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
}) {
  const resolvedSize = resolveSize(size);
  const [plus, setPlus] = useState(plusState); // reuse already-probed result
  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${color}`) || ""
  );

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${color}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, color).then((s) => {
        if (!alive) return;
        svgCache.set(key, s);
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, color]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      style: { ...style, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        style: { ...style, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      className,
      "aria-hidden": true,
      style: { ...style, width: resolvedSize, height: resolvedSize },
    });
  }
  
  return React.createElement("span", {
    className,
    "aria-hidden": true,
    style: { ...style, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

              <label className="tf-label tf-label--required" htmlFor="tf-endpoint">
                连接地址
              </label>
              <div className="tf-control">
                <Input
                  id="tf-endpoint"
                  placeholder="mqtt://10.20.31.7:1883 或 /dev/ttyS0"
                  prefix={<Icon name="link" size="0.875rem" />}
                  value={form.endpoint}
                  status={errors.endpoint ? "error" : undefined}
                  onChange={(e) => setField("endpoint", e.target.value)}
                />
                {errors.endpoint && <span className="tf-error">{errors.endpoint}</span>}
              </div>
            </div>
          </div>

          <div className="tf-group">
            <h3 className="tf-group__title">采集策略</h3>

            <div className="tf-field">
              <label className="tf-label" htmlFor="tf-frequency">
                采集频率
              </label>
              <div className="tf-control">
                <Select
                  id="tf-frequency"
                  style={{ width: "100%" }}
                  value={form.frequency}
                  options={frequencyOptions}
                  onChange={(v) => setField("frequency", v)}
                />
              </div>
            </div>

            <div className="tf-field">
              <label className="tf-label" htmlFor="tf-points">
                采集点位
              </label>
              <div className="tf-control">
                <Select
                  id="tf-points"
                  mode="multiple"
                  allowClear
                  placeholder="选择需要采集的物理量"
                  style={{ width: "100%" }}
                  value={form.points}
                  options={pointOptions}
                  onChange={(v) => setField("points", v)}
                />
              </div>
            </div>

            <div className="tf-field">
              <label className="tf-label" htmlFor="tf-format">
                数据格式
              </label>
              <div className="tf-control">
                <Select
                  id="tf-format"
                  style={{ width: "100%" }}
                  value={form.format}
                  options={formatOptions}
                  onChange={(v) => setField("format", v)}
                />
              </div>
            </div>
          </div>

          <div className="tf-group">
            <h3 className="tf-group__title">扩展能力</h3>

            <ToggleRow
              icon="bell-ring"
              title="启用告警通知"
              desc="数值越界时按所选渠道实时推送"
              checked={form.alarmEnabled}
              onChange={(v) => setField("alarmEnabled", v)}
            />
            {form.alarmEnabled && (
              <div className="tf-subpanel">
                <div className="tf-field">
                  <label className="tf-label" htmlFor="tf-threshold">
                    告警阈值
                  </label>
                  <div className="tf-control">
                    <InputNumber
                      id="tf-threshold"
                      mode="spinner"
                      variant="outlined"
                      min={0}
                      max={9999}
                      style={{ width: "100%" }}
                      value={form.alarmThreshold}
                      addonAfter="单位值"
                      onChange={(v) => setField("alarmThreshold", v)}
                    />
                  </div>
                </div>

                <div className="tf-field">
                  <span className="tf-label">通知方式</span>
                  <div className="tf-control">
                    <Segmented
                      block
                      value={form.notifyChannel}
                      onChange={(v) => setField("notifyChannel", v)}
                      options={[
                        { label: "邮件", value: "email", icon: <Icon name="mail" size="0.875rem" /> },
                        { label: "短信", value: "sms", icon: <Icon name="message-square" size="0.875rem" /> },
                        { label: "Webhook", value: "webhook", icon: <Icon name="webhook" size="0.875rem" /> },
                      ]}
                    />
                  </div>
                </div>

                <div className="tf-field">
                  <label className="tf-label tf-label--required" htmlFor="tf-receivers">
                    接收人
                  </label>
                  <div className="tf-control">
                    <Input
                      id="tf-receivers"
                      placeholder="多个邮箱/手机号用逗号分隔"
                      value={form.receivers}
                      status={errors.receivers ? "error" : undefined}
                      onChange={(e) => setField("receivers", e.target.value)}
                    />
                    {errors.receivers && <span className="tf-error">{errors.receivers}</span>}
                  </div>
                </div>

                {form.notifyChannel === "webhook" && (
                  <div className="tf-field tf-field--reveal">
                    <label className="tf-label tf-label--required" htmlFor="tf-webhook">
                      回调地址
                    </label>
                    <div className="tf-control">
                      <Input
                        id="tf-webhook"
                        placeholder="https://alert.example.com/hook/iot"
                        prefix={<Icon name="webhook" size="0.875rem" />}
                        value={form.webhookUrl}
                        status={errors.webhookUrl ? "error" : undefined}
                        onChange={(e) => setField("webhookUrl", e.target.value)}
                      />
                      {errors.webhookUrl && <span className="tf-error">{errors.webhookUrl}</span>}
                    </div>
                  </div>
                )}
              </div>
            )}

            <ToggleRow
              icon="settings-2"
              title="开启高级采集模式"
              desc="自定义超时、重试与传输压缩策略"
              checked={form.advancedEnabled}
              onChange={(v) => setField("advancedEnabled", v)}
            />
            {form.advancedEnabled && (
              <div className="tf-subpanel">
                <div className="tf-field">
                  <label className="tf-label" htmlFor="tf-timeout">
                    请求超时
                  </label>
                  <div className="tf-control">
                    <InputNumber
                      id="tf-timeout"
                      mode="spinner"
                      variant="outlined"
                      min={100}
                      max={60000}
                      step={100}
                      style={{ width: "100%" }}
                      value={form.timeout}
                      addonAfter="ms"
                      onChange={(v) => setField("timeout", v)}
                    />
                  </div>
                </div>

                <div className="tf-field">
                  <label className="tf-label" htmlFor="tf-retries">
                    重试次数
                  </label>
                  <div className="tf-control">
                    <InputNumber
                      id="tf-retries"
                      mode="spinner"
                      variant="outlined"
                      min={0}
                      max={10}
                      style={{ width: "100%" }}
                      value={form.retries}
                      addonAfter="次"
                      onChange={(v) => setField("retries", v)}
                    />
                  </div>
                </div>

                <div className="tf-toggle tf-toggle--inner">
                  <span className="tf-toggle__icon">
                    <Icon name="minimize-2" size="1rem" />
                  </span>
                  <div className="tf-toggle__text">
                    <span className="tf-toggle__title">启用传输压缩</span>
                    <span className="tf-toggle__desc">降低带宽占用，适合高频大数据量场景</span>
                  </div>
                  <Switch
                    checked={form.compress}
                    size="small"
                    onChange={(v) => setField("compress", v)}
                  />
                </div>

                {form.compress && (
                  <div className="tf-field tf-field--reveal">
                    <label className="tf-label" htmlFor="tf-backup">
                      备用地址
                    </label>
                    <div className="tf-control">
                      <Input
                        id="tf-backup"
                        placeholder="主链路异常时自动切换"
                        value={form.backupEndpoint}
                        onChange={(e) => setField("backupEndpoint", e.target.value)}
                      />
                    </div>
                  </div>
                )}
              </div>
            )}

            <ToggleRow
              icon="archive"
              title="自动归档历史数据"
              desc="按保留周期转入冷存储，释放在线库压力"
              checked={form.archiveEnabled}
              onChange={(v) => setField("archiveEnabled", v)}
            />
            {form.archiveEnabled && (
              <div className="tf-subpanel">
                <div className="tf-field">
                  <label className="tf-label tf-label--required" htmlFor="tf-retention">
                    保留天数
                  </label>
                  <div className="tf-control">
                    <InputNumber
                      id="tf-retention"
                      mode="spinner"
                      variant="outlined"
                      min={1}
                      max={3650}
                      style={{ width: "100%" }}
                      value={form.retentionDays}
                      addonAfter="天"
                      status={errors.retentionDays ? "error" : undefined}
                      onChange={(v) => setField("retentionDays", v)}
                    />
                    {errors.retentionDays && <span className="tf-error">{errors.retentionDays}</span>}
                  </div>
                </div>

                <div className="tf-field">
                  <label className="tf-label" htmlFor="tf-storage">
                    存储位置
                  </label>
                  <div className="tf-control">
                    <Select
                      id="tf-storage"
                      style={{ width: "100%" }}
                      value={form.storage}
                      options={storageOptions}
                      onChange={(v) => setField("storage", v)}
                    />
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>

        <div className="tf-actions">
          <Button icon={<Icon name="rotate-ccw" size="0.875rem" />} onClick={handleReset}>
            重置
          </Button>
          <Button
            type="primary"
            htmlType="submit"
            icon={<Icon name="save" size="0.875rem" />}
          >
            保存规则
          </Button>
        </div>
      </form>
    </section>
  );
}
  Object.assign(__export, { RuleForm });
})();

/* ===== src/components/soft-tag/index.jsx ===== */
(function () {
  const { Icon } = __export;
// Layer 3: 通用软色标签（状态 / 属性标记）



function SoftTag({ tone, icon, children }) {
  return (
    <span className={`soft-tag soft-tag--${tone || "neutral"}`}>
      {icon ? <Icon name={icon} size="0.75rem" /> : null}
      <span>{children}</span>
    </span>
  );
}
  Object.assign(__export, { SoftTag });
})();

/* ===== src/views/rule-table/index.jsx ===== */
(function () {
  const { useState, useMemo } = React;
  const { Table, Input, Select, Button } = antd;
  const { Icon, dataSourceOptions, sourceLabel } = __export;
  const SoftTag = __export.SoftTag;
// Layer 4: 采集规则列表（表格 + 检索/筛选/批量操作）







const STATUS_TONE = { running: "success", stopped: "neutral", error: "error" };
const STATUS_LABEL = { running: "运行中", stopped: "已停用", error: "异常" };

function RuleTable({ data }) {
  const [keyword, setKeyword] = useState("");
  const [sourceFilter, setSourceFilter] = useState(undefined);
  const [selectedKeys, setSelectedKeys] = useState([]);
  const [refreshAt, setRefreshAt] = useState("");

  const filtered = useMemo(() => {
    const kw = keyword.trim().toLowerCase();
    return data.filter((row) => {
      const hitKw =
        !kw ||
        row.name.toLowerCase().includes(kw) ||
        row.id.toLowerCase().includes(kw);
      const hitSource = !sourceFilter || row.source === sourceFilter;
      return hitKw && hitSource;
    });
  }, [data, keyword, sourceFilter]);

  const clearSelection = () => setSelectedKeys([]);

  const columns = [
    {
      title: "规则名称",
      dataIndex: "name",
      key: "name",
      width: 200,
      render: (text) => (
        <a href="#rule" className="rt-link" onClick={(e) => e.preventDefault()}>
          {text}
        </a>
      ),
    },
    {
      title: "规则 ID",
      dataIndex: "id",
      key: "id",
      width: 120,
      render: (value) => <span className="rt-plain rt-plain--muted">{value}</span>,
    },
    {
      title: "数据源",
      dataIndex: "source",
      key: "source",
      width: 140,
      render: (value) => <span className="rt-plain">{sourceLabel(value)}</span>,
    },
    {
      title: "采集频率",
      dataIndex: "frequencyLabel",
      key: "frequencyLabel",
      width: 100,
      render: (value) => <span className="rt-plain">{value}</span>,
    },
    {
      title: "点位",
      dataIndex: "points",
      key: "points",
      width: 90,
      align: "right",
      render: (value) => <span className="rt-num">{value}</span>,
    },
    {
      title: "状态",
      dataIndex: "status",
      key: "status",
      width: 110,
      render: (value) => <SoftTag tone={STATUS_TONE[value]}>{STATUS_LABEL[value]}</SoftTag>,
    },
    {
      title: "告警",
      dataIndex: "alarm",
      key: "alarm",
      width: 110,
      render: (value) =>
        value === "on" ? (
          <SoftTag tone="brand" icon="bell-ring">
            已开启
          </SoftTag>
        ) : (
          <SoftTag tone="neutral">未开启</SoftTag>
        ),
    },
    {
      title: "更新时间",
      dataIndex: "updatedAt",
      key: "updatedAt",
      width: 160,
      render: (value) => <span className="rt-plain rt-plain--muted">{value}</span>,
    },
    {
      title: "操作",
      key: "action",
      width: 120,
      align: "left",
      render: (_text, record) => (
        <div className="rt-actions">
          <Button
            type="text"
            shape="circle"
            size="small"
            title="编辑规则"
            icon={<Icon name="square-pen" size="0.875rem" />}
          />
          <Button
            type="text"
            shape="circle"
            size="small"
            title={record.status === "running" ? "停用规则" : "启用规则"}
            icon={<Icon name={record.status === "running" ? "circle-pause" : "play"} size="0.875rem" />}
          />
          <Button
            type="text"
            shape="circle"
            size="small"
            danger
            title="删除规则"
            icon={<Icon name="trash-2" size="0.875rem" />}
          />
        </div>
      ),
    },
  ];

  return (
    <section className="rt-card">
      <header className="rt-toolbar">
        <div className="rt-toolbar__title">
          <h2 className="rt-card__title">已配置规则</h2>
          <span className="rt-count">共 {filtered.length} 条</span>
        </div>

        <div className="rt-toolbar__tools">
          {selectedKeys.length > 0 && (
            <div className="rt-selection">
              <span>已选 {selectedKeys.length} 项</span>
              <a href="#batch" onClick={(e) => e.preventDefault()}>
                批量停用
              </a>
              <a href="#clear" onClick={(e) => { e.preventDefault(); clearSelection(); }}>
                取消选择
              </a>
            </div>
          )}
          <Input
            className="rt-search"
            allowClear
            placeholder="搜索规则名称或 ID"
            value={keyword}
            suffix={<Icon name="search" size="0.875rem" />}
            onChange={(e) => setKeyword(e.target.value)}
          />
          <Select
            className="rt-filter"
            allowClear
            placeholder="数据源"
            style={{ width: "10rem" }}
            value={sourceFilter}
            options={dataSourceOptions}
            onChange={(v) => setSourceFilter(v)}
          />
          <Button
            type="text"
            shape="circle"
            title={refreshAt ? `最近刷新 ${refreshAt}` : "刷新列表"}
            icon={<Icon name="refresh-cw" size="0.875rem" />}
            onClick={() => setRefreshAt("刚刚")}
          />
        </div>
      </header>

      <Table
        rowKey="id"
        size="middle"
        columns={columns}
        dataSource={filtered}
        rowSelection={{
          selectedRowKeys: selectedKeys,
          onChange: (keys) => setSelectedKeys(keys),
        }}
        pagination={{
          pageSize: 8,
          showSizeChanger: false,
          showTotal: (total) => `共 ${total} 条规则`,
        }}
        scroll={{ x: 1140 }}
      />
    </section>
  );
}
  Object.assign(__export, { RuleTable });
})();

/* ===== app.jsx ===== */
(function () {
  const { useState } = React;
  const { ConfigProvider } = antd;
  const { AppProvider, ruleList } = __export;
  const zhCN = __export.zhCN;
  const AppHeader = __export.AppHeader;
  const AppSidebar = __export.AppSidebar;
  const RuleForm = __export.RuleForm;
  const RuleTable = __export.RuleTable;
// App entry — 采集规则配置（顶部导航 + 侧边导航 + 表单向下列 + 表格）
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: 主题模式)
//   Layer 2 mock data     → src/mock/rules.js      (采集规则 mock + 选项字典)
//   Layer 3 reusable      → src/components/soft-tag/
//   Layer 4 views         → src/views/app-header | app-sidebar | rule-form | rule-table
//   Layer 5 layout        → app.jsx












function App() {
  const [rules, setRules] = useState(ruleList);

  const handleCreate = (rule) => {
    setRules((prev) => [rule, ...prev]);
  };

  return (
    <AppProvider>
      <ConfigProvider locale={zhCN}>
        <div className="app-root">
          <AppHeader />
          <div className="app-body">
            <AppSidebar />
            <main className="app-content">
              <RuleForm onCreate={handleCreate} />
              <RuleTable data={rules} />
            </main>
          </div>
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
