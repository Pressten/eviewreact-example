  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 页面骨架的 token 消费示例 */
.app-root {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
  overflow: hidden;
}

.app-body {
  flex: 1 1 auto;
  display: flex;
  align-items: stretch;
  min-height: 0;
}

.app-main {
  flex: 1 1 auto;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

.app-main ::-webkit-scrollbar {
  width: 0.5rem;
  height: 0.5rem;
}

.app-main ::-webkit-scrollbar-thumb {
  border-radius: var(--radius-full);
  background: var(--outline-variant);
}


.top-bar {
  height: 3rem;
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  padding: 0 var(--spacing-gutter);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-r-sm);
  position: relative;
  z-index: 20;
}

/* --- 品牌区 --- */
.top-bar__brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  min-width: 14.5rem;
  flex: none;
}

.top-bar__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--on-primary);
  flex: none;
}

.top-bar__brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.top-bar__brand-name {
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
}

.top-bar__brand-sub {
  color: var(--on-surface-variant);
  font: var(--font-caption-s);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* --- 主导航(手写 JSX,不使用 Menu) --- */
.top-bar__nav {
  display: flex;
  align-items: center;
  gap: var(--spacing-0-5);
  height: 100%;
  flex: 1 1 auto;
  min-width: 0;
}

.top-nav-item {
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
}

.top-nav-item__trigger {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1-5);
  height: 2rem;
  padding: 0 var(--spacing-stack);
  border: none;
  border-radius: var(--radius-action);
  background: transparent;
  color: var(--on-surface-variant);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}

.top-nav-item__trigger:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}

.top-nav-item.is-active .top-nav-item__trigger {
  background: var(--primary-container);
  color: var(--primary);
}

.top-nav-item.is-active::after {
  content: "";
  position: absolute;
  left: var(--spacing-stack);
  right: var(--spacing-stack);
  bottom: 0;
  height: var(--border-width-thick);
  border-radius: var(--radius-full);
  background: var(--primary);
}

.top-nav-item__panel {
  position: absolute;
  top: calc(100% - 0.25rem);
  left: 0;
  min-width: 15.5rem;
  padding: var(--spacing-1-5);
  border-radius: var(--radius-overlay);
  background: var(--surface-container-high);
  box-shadow: var(--shadow-popover);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-0-5);
  animation: nav-panel-in 0.14s ease;
}

@keyframes nav-panel-in {
  from {
    opacity: 0;
    transform: translateY(-0.25rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.top-nav-child {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.125rem;
  padding: var(--spacing-1-5) var(--spacing-stack);
  border: none;
  border-radius: var(--radius-action);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.top-nav-child:hover {
  background: var(--surface-variant);
}

.top-nav-child__label {
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
}

.top-nav-child__desc {
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

/* --- 工具区 --- */
.top-bar__tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-1-5);
  flex: none;
}

.top-bar__search {
  width: 15rem;
}

.icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border: none;
  border-radius: var(--radius-action);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}

.icon-btn:hover {
  background: var(--surface-variant);
  color: var(--primary);
}

.icon-btn__dot {
  position: absolute;
  top: 0.375rem;
  right: 0.375rem;
  width: 0.5rem;
  height: 0.5rem;
  border-radius: var(--radius-full);
  background: var(--error);
  box-shadow: 0 0 0 2px var(--surface-container-highest);
}

.top-bar__divider {
  width: var(--border-width-thin);
  height: 1.25rem;
  background: var(--divider);
}

.user-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
  height: 2.25rem;
  padding: 0 var(--spacing-1-5) 0 0.25rem;
  border: none;
  border-radius: var(--radius-action);
  background: transparent;
  cursor: pointer;
  color: var(--on-surface-variant);
  transition: background 0.16s ease;
}

.user-chip:hover {
  background: var(--surface-variant);
}

.user-chip__avatar {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  object-fit: cover;
  flex: none;
}

.user-chip__text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  line-height: 1.2;
}

.user-chip__name {
  color: var(--on-surface);
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
}

.user-chip__role {
  color: var(--on-surface-variant);
  font: var(--font-caption-s);
}

/* --- 通知面板 --- */
.notify-panel {
  width: 20rem;
}

.notify-panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: var(--spacing-1-5);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.notify-panel__title {
  color: var(--on-surface);

  font-weight: var(--font-weight-semibold);
}

.notify-panel__more {
  color: var(--interactive-link);
  font: var(--font-body-s);
  cursor: pointer;
}

.notify-panel__list {
  margin: 0;
  padding: 0;
  list-style: none;
  max-height: 18rem;
  overflow-y: auto;
}

.notify-item {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-stack);
  padding: var(--spacing-stack) 0;
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.notify-item:last-child {
  border-bottom: none;
}

.notify-item__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-md);
  flex: none;
}

.notify-item__main {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
  min-width: 0;
}

.notify-item__title {
  color: var(--on-surface);
  font: var(--font-body-m);
}

.notify-item__time {
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

/* --- 用户面板 --- */
.user-panel {
  width: 13.5rem;
}

.user-panel__profile {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  padding-bottom: var(--spacing-stack);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.user-panel__avatar {
  width: 2.25rem;
  height: 2.25rem;
  border-radius: var(--radius-full);
  object-fit: cover;
}

.user-panel__name {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
}

.user-panel__role {
  margin: 0.125rem 0 0;
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

.user-panel__links {
  display: flex;
  flex-direction: column;
  padding-top: var(--spacing-1-5);
  gap: 0.125rem;
}

.user-panel__link {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  padding: var(--spacing-1-5) var(--spacing-1-5);
  border-radius: var(--radius-action);
  color: var(--on-surface);
  font: var(--font-body-m);
  cursor: pointer;
}

.user-panel__link:hover {
  background: var(--surface-variant);
  color: var(--primary);
}

.user-panel__link--danger {
  color: var(--error);
}


.side-nav {
  width: 15.5rem;
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-r-sm);
  transition: width 0.18s ease;
  overflow: hidden;
  z-index: 10;
}

.side-nav--collapsed {
  width: 3rem;
}

.side-nav__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
  padding: var(--spacing-stack) var(--spacing-stack) var(--spacing-1-5);
  min-height: 2.75rem;
}

.side-nav--collapsed .side-nav__top {
  justify-content: center;
  padding: var(--spacing-stack) 0 var(--spacing-1-5);
}

.side-nav__caption {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1-5);
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.side-nav__toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border: none;
  border-radius: var(--radius-action);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  flex: none;
}

.side-nav__toggle:hover {
  background: var(--surface-variant);
  color: var(--primary);
}

.side-nav__menu {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 var(--spacing-1-5) var(--spacing-stack);
}

.side-nav--collapsed .side-nav__menu {
  padding: 0 0.25rem var(--spacing-stack);
}

.side-nav__foot {
  flex: none;
  padding: var(--spacing-stack) var(--spacing-stack) var(--spacing-gutter);
  border-top: var(--border-width-thin) solid var(--divider);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-stack);
}

.quota {
  padding: var(--spacing-stack);
  border-radius: var(--radius-container);
  background: var(--surface-variant);
}

.quota__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: var(--spacing-1-5);
}

.quota__title {
  color: var(--on-surface);
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
}

.quota__value {
  color: var(--primary);
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
}

.quota__desc {
  margin: var(--spacing-1-5) 0 0;
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

.side-nav__help {
  display: flex;
  align-items: center;
  gap: var(--spacing-1-5);
  color: var(--interactive-link);
  font: var(--font-body-s);
  cursor: pointer;
}


.wo-page {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-gutter);
  padding: var(--spacing-page);
  min-width: 0;
}

.wo-page__steps {
  padding: var(--spacing-inset) var(--spacing-inset) var(--spacing-4);
  border-radius: var(--radius-container);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-card);
}

.wo-page__body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 22rem;
  gap: var(--spacing-gutter);
  align-items: start;
  min-width: 0;
}

@media (max-width: 1440px) {
  .wo-page__body {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- 提交结果 ---------- */
.submit-result {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.submit-result__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 3rem;
  height: 3rem;
  border-radius: var(--radius-full);
  background: var(--success-container);
  color: var(--success);
}

.submit-result__title {
  margin: var(--spacing-stack) 0 0;
  color: var(--on-surface);
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
}

.submit-result__list {
  width: 100%;
  margin: var(--spacing-gutter) 0 0;
  padding: var(--spacing-gutter);
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-stack);
  border-radius: var(--radius-container);
  background: var(--surface-variant);
}

.submit-result__list li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacing-gutter);
}

.submit-result__list span {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  flex: none;
}

.submit-result__list strong {
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  text-align: right;
}

/* ---------- 模板弹窗 ---------- */
.tpl-tip {
  margin: 0 0 var(--spacing-stack);
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.tpl-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1-5);
}

.tpl-item__btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  padding: var(--spacing-stack);
  border: var(--border-width-thin) solid var(--outline-variant);
  border-radius: var(--radius-container);
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.tpl-item__btn:hover {
  border-color: var(--primary);
  background: var(--primary-container);
}

.tpl-item__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  flex: none;
  border-radius: var(--radius-md);
  background: var(--primary-container);
  color: var(--primary);
}

.tpl-item__main {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
  min-width: 0;
  flex: 1 1 auto;
}

.tpl-item__name {
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
}

.tpl-item__desc {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}


.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  flex-wrap: wrap;
}

.page-head__main {
  min-width: 0;
}

.page-head__title-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  margin-top: var(--spacing-1-5);
}

.page-head__title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-display-s);
  font-weight: var(--font-weight-semibold);
}

.page-head__badge {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  height: 1.5rem;
  padding: 0 var(--spacing-inline);
  border-radius: var(--radius-base);
  background: var(--surface-variant);
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.page-head__desc {
  margin: var(--spacing-1-5) 0 0;
  color: var(--on-surface-variant);
  font: var(--font-body-m);
}

.page-head__desc em {
  color: var(--error);
  font-style: normal;
}

.page-head__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-wrap: wrap;
}


.wo-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
  min-width: 0;
}

/* ---------- 表单网格 ---------- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--spacing-gutter) var(--spacing-inset);
}

@media (max-width: 1200px) {
  .form-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- 巡检明细 ---------- */
.inspect {
  border-radius: var(--radius-container);
  background: var(--surface-variant);
  padding: var(--spacing-stack);
  overflow-x: auto;
}

.inspect__head,
.inspect__row {
  display: grid;
  grid-template-columns:
    2.25rem
    minmax(11rem, 1.5fr)
    minmax(9.5rem, 1.2fr)
    minmax(7rem, 0.85fr)
    minmax(10.5rem, 1fr)
    minmax(11rem, 1.3fr)
    9.5rem;
  gap: var(--spacing-stack);
  align-items: flex-start;
  min-width: 62rem;
}

.inspect__head {
  padding: 0 0 var(--spacing-1-5);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.inspect__col {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1);
}

.inspect__col .ant-select,
.inspect__col .ant-input,
.inspect__col .ant-input-number {
  width: 100%;
}

.inspect__head .inspect__col {
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
  font-weight: var(--font-weight-medium);
}

.inspect__col--no {
  align-items: center;
}

.inspect__col--op {
  flex-direction: row;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: var(--spacing-inline);
}

.inspect__no {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: var(--radius-base);
  background: var(--surface-container-highest);
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

.inspect__row {
  padding: var(--spacing-stack) 0;
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.inspect__row:last-of-type {
  border-bottom: none;
}

.inspect__pair {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 4.75rem;
  gap: var(--spacing-1-5);
  align-items: center;
}

.inspect__empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-inline);
  padding: var(--spacing-8) 0;
  color: var(--on-surface-variant);
  font: var(--font-body-m);
}

.inspect__empty p {
  margin: 0;
}

.inspect__add {
  margin-top: var(--spacing-stack);
}

/* ---------- 附件 ---------- */
.attach {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-stack);
}

.attach__drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-1-5);
  padding: var(--spacing-6) var(--spacing-gutter);
  border: var(--border-width-thin) dashed var(--outline);
  border-radius: var(--radius-container);
  background: var(--surface-variant);
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: border-color 0.16s ease, color 0.16s ease;
}

.attach__drop:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.attach__drop-title {
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
}

.attach__drop-hint {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.attach__actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
}

.attach__actions a {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  color: var(--interactive-link);
  font: var(--font-body-s);
  cursor: pointer;
}

.attach__count {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.attach__list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1-5);
}

.attach-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  padding: var(--spacing-1-5) var(--spacing-stack);
  border-radius: var(--radius-base);
  background: var(--surface-variant);
}

.attach-item__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  flex: none;
  border-radius: var(--radius-base);
  background: var(--surface-container-highest);
  color: var(--primary);
}

.attach-item__main {
  display: flex;
  align-items: baseline;
  gap: var(--spacing-inline);
  min-width: 0;
  flex: 1 1 auto;
}

.attach-item__name {
  color: var(--on-surface);
  font: var(--font-body-m);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.attach-item__size {
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
  flex: none;
}

.attach-item__remove {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.5rem;
  height: 1.5rem;
  flex: none;
  border: none;
  border-radius: var(--radius-base);
  background: transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
}

.attach-item__remove:hover {
  background: var(--error-container);
  color: var(--error);
}

.attach__empty {
  margin: 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

/* ---------- 确认项 ---------- */
.ack-list {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1-5);
}

.ack-list .ant-checkbox-group {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1-5);
}

.ack-list .ant-checkbox-wrapper {
  color: var(--on-surface);
  font: var(--font-body-m);
  align-items: flex-start;
  line-height: 1.5;
}

.ack-list .ant-checkbox-wrapper .ant-checkbox {
  margin-top: 0.1875rem;
}

/* ---------- 底部操作条 ---------- */
.form-footbar {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  flex-wrap: wrap;
  padding: var(--spacing-stack) var(--spacing-inset);
  border-radius: var(--radius-container);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-md);
}

.form-footbar__status {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  flex-wrap: wrap;
}

.form-footbar__text {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.form-footbar__text strong {
  color: var(--primary);
  font-weight: var(--font-weight-semibold);
}

.form-footbar__link {
  color: var(--interactive-link);
  font: var(--font-body-s);
  cursor: pointer;
}

.form-footbar__ok {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  color: var(--success);
  font: var(--font-body-s);
}

.form-footbar__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}


.field-row {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1-5);
  min-width: 0;
}

.field-row--full {
  grid-column: 1 / -1;
}

.field-row__label {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-0-5);
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
}

.field-row__req {
  color: var(--error);
  font: var(--font-body-m);
  line-height: 1;
}

.field-row__control {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-wrap: wrap;
}

/* 独占一行的复合控件(确认项列表 / 附件区) */
.field-row__control > .ack-list,
.field-row__control > .attach {
  flex: 1 1 100%;
}

.field-row__control > .ant-input,
.field-row__control > .ant-input-affix-wrapper,
.field-row__control > .ant-picker,
.field-row__control > .ant-input-number,
.field-row__control > .ant-select {
  width: 100%;
}

.field-row__control > .ant-select-auto-complete {
  width: 100%;
}

.field-row__error {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-1);
  margin: 0;
  color: var(--error);
  font: var(--font-body-s);
}

.field-row__error svg {
  margin-top: 0.25rem;
  flex: none;
}

.field-row__help {
  margin: 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}


.panel-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.panel-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: var(--spacing-inset) var(--spacing-inset) 0;
}

.panel-card__head-main {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-stack);
  min-width: 0;
}

.panel-card__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  flex: none;
  border-radius: var(--radius-md);
  background: var(--primary-container);
  color: var(--primary);
}

.panel-card__titles {
  min-width: 0;
}

.panel-card__title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
}

.panel-card__subtitle {
  margin: 0.125rem 0 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.panel-card__extra {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex: none;
}

.panel-card__body {
  padding: var(--spacing-inset);
  min-width: 0;
}

/* 无标题时内边距收窄 */
.panel-card > .panel-card__body:first-child {
  padding-top: var(--spacing-inset);
}


.status-tag {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  padding: 0 var(--spacing-inline);
  height: 1.5rem;
  border-radius: var(--radius-base);
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  white-space: nowrap;
  background: var(--surface-variant);
  color: var(--on-surface-variant);
}

.status-tag--small {
  height: 1.25rem;
  padding: 0 var(--spacing-1-5);
  font-size: var(--font-size-sm);
}

.status-tag__dot {
  width: 0.375rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: currentColor;
  flex: none;
}

.status-tag--brand {
  background: var(--primary-container);
  color: var(--primary);
}

.status-tag--info {
  background: var(--info-container);
  color: var(--info);
}

.status-tag--success {
  background: var(--success-container);
  color: var(--success);
}

.status-tag--warning {
  background: var(--warning-container);
  color: var(--on-warning-container);
}

.status-tag--critical {
  background: var(--critical-container);
  color: var(--critical);
}

.status-tag--error {
  background: var(--error-container);
  color: var(--error);
}

.status-tag--neutral {
  background: var(--surface-variant);
  color: var(--on-surface-variant);
}


.form-aside {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
  min-width: 0;
}

/* ---------- 校验进度 ---------- */
.check-progress {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-stack);
  padding-bottom: var(--spacing-gutter);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.check-progress__num {
  color: var(--on-surface);
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
}

.check-progress__tip {
  margin: 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  text-align: center;
}

.check-list {
  margin: var(--spacing-gutter) 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
}

.check-item__btn {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-inline);
  padding: var(--spacing-1-5);
  border: none;
  border-radius: var(--radius-action);
  background: transparent;
  color: var(--error);
  text-align: left;

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);
  const [navCollapsed, setNavCollapsed] = useState(false);
  const [activeTopNav, setActiveTopNav] = useState("workorder");

    toggleNav: () => setNavCollapsed((c) => !c),
    activeTopNav,
    setActiveTopNav,
    activeSideKey,
    setActiveSideKey,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

  const { Input, Select, Radio, InputNumber, DatePicker, Switch, Checkbox, Button, Tooltip, Progress } = antd;
  const { Icon, orderTypes, priorityOptions, priorityMeta, stationOptions, ownerOptions, ccOptions, deviceOptions, inspectionItemOptions, resultOptions, resultMeta, unitOptions, ackOptions, metaOf } = __export;
  const FieldRow = __export.FieldRow;
  const PanelCard = __export.PanelCard;
  const StatusTag = __export.StatusTag;
const FILE_KIND_ICON = {
  image: "file-text",
  sheet: "table",
  log: "file-clock",
  doc: "file-check",
};

// Layer 4: 工单填报表单 — 纯 H5 骨架 + antd 输入组件受控使用
function WorkorderForm({
  form,
  errors,
  checks,
  setField,
  setItem,
  addItem,
  removeItem,
  addFiles,
  addSampleFile,
  removeFile,
  toggleAck,
  scrollTo,
  onSubmit,
  onSaveDraft,
  onReset,
}) {
  const fileRef = useRef(null);
  const itemErrors = errors.itemErrors || [];
  const doneCount = checks.filter((c) => c.ok).length;
  const percent = Math.round((doneCount / checks.length) * 100);

  const handleDrop = (e) => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  };

  return (
    <div className="wo-form">
      {/* ========== 1. 基础信息 ========== */}
      <PanelCard
        className="wo-form__section"
        icon="file-text"
        title="基础信息"
        subtitle="工单归属、责任人与计划作业窗口"
        extra={<StatusTag tone="brand" label="第 1 步 / 共 3 步" size="small" />}
      >
        <div className="form-grid" id="wo-section-basic">
          <FieldRow
            label="工单标题"
            required
            full
            htmlFor="wo-title"
            error={errors.title}
            help="建议格式：设备编号 + 现象，例如「DEV-AC-0209 回风温度持续偏高」"
          >
            <Input
              id="wo-title"
              value={form.title}
              maxLength={60}
              showCount
              status={errors.title ? "error" : undefined}
              placeholder="请输入工单标题"
              onChange={(e) => setField("title", e.target.value)}
            />
          </FieldRow>

          <FieldRow label="工单类型" required htmlFor="wo-type" error={errors.type}>
            <Select
              id="wo-type"
              value={form.type}
              options={orderTypes}
              allowClear
              status={errors.type ? "error" : undefined}
              placeholder="请选择工单类型"
              onChange={(v) => setField("type", v)}
            />
          </FieldRow>

          <FieldRow
            label="优先级"
            required
            htmlFor="wo-priority"
            error={errors.priority}
            help={`当前：${metaOf(priorityMeta, form.priority).label}优先级`}
          >
            <Radio.Group
              value={form.priority}
              optionType="button"
              buttonStyle="solid"
              options={priorityOptions}
              onChange={(e) => setField("priority", e.target.value)}
            />
          </FieldRow>

          <FieldRow label="所属站点" required htmlFor="wo-station" error={errors.station}>
            <Select
              id="wo-station"
              value={form.station}
              options={stationOptions}
              showSearch
              optionFilterProp="label"
              status={errors.station ? "error" : undefined}
              placeholder="请选择机房 / 站点"
              onChange={(v) => setField("station", v)}
            />
          </FieldRow>

          <FieldRow label="现场责任人" required htmlFor="wo-owner" error={errors.owner}>
            <Select
              id="wo-owner"
              value={form.owner}
              options={ownerOptions}
              showSearch
              optionFilterProp="label"
              status={errors.owner ? "error" : undefined}
              placeholder="请选择现场责任人"
              onChange={(v) => setField("owner", v)}
            />
          </FieldRow>

          <FieldRow label="联系电话" required htmlFor="wo-phone" error={errors.phone}>
            <Input
              id="wo-phone"
              value={form.phone}
              maxLength={11}
              prefix={<Icon name="phone" size="0.875rem" />}
              status={errors.phone ? "error" : undefined}
              placeholder="请输入 11 位手机号"
              onChange={(e) => setField("phone", e.target.value.replace(/\D/g, ""))}
            />
          </FieldRow>

          <FieldRow label="抄送人" htmlFor="wo-cc" help="提交后同步推送至抄送人">
            <Select
              id="wo-cc"
              mode="multiple"
              value={form.ccPersons}
              options={ccOptions}
              maxTagCount="responsive"
              placeholder="选择需要同步的同事"
              onChange={(v) => setField("ccPersons", v)}
            />
          </FieldRow>

          <FieldRow
            label="计划开始与结束时间"
            required
            full
            htmlFor="wo-range"
            error={errors.range}
            help="作业窗口需与客户协商一致，最长不超过 30 天"
          >
            <DatePicker.RangePicker
              id="wo-range"
              value={form.range}
              showTime
              format="YYYY-MM-DD HH:mm"
              placeholder={["计划开始时间", "计划结束时间"]}
              status={errors.range ? "error" : undefined}
              onChange={(v) => setField("range", v)}
            />
          </FieldRow>

          <FieldRow
            label="预计工时（小时）"
            required
            htmlFor="wo-duration"
            error={errors.duration}
            help="含路途与现场准备时间"
          >
            <InputNumber
              id="wo-duration"
              mode="spinner"
              variant="outlined"
              value={form.duration}
              min={0}
              max={72}
              step={0.5}
              precision={1}
              status={errors.duration ? "error" : undefined}
              placeholder="0.5 – 72"
              onChange={(v) => setField("duration", v)}
            />
          </FieldRow>

          <FieldRow label="作业完成后需客户确认" htmlFor="wo-ack-switch" help="开启后客户将收到完工确认链接">
            <Switch
              id="wo-ack-switch"
              checked={form.needCustomerAck}
              checkedChildren="需确认"
              unCheckedChildren="免确认"
              onChange={(v) => setField("needCustomerAck", v)}
            />
          </FieldRow>
        </div>
      </PanelCard>

      {/* ========== 2. 巡检明细 ========== */}
      <PanelCard
        className="wo-form__section"
        icon="scan-line"
        title="巡检明细"
        subtitle={`已添加 ${form.items.length} 条巡检记录，逐台设备登记实测值`}
        extra={
          <>
            {errors.items ? <StatusTag tone="error" icon label={errors.items} size="small" /> : null}
            <Button size="small" icon={<Icon name="plus" size="0.875rem" />} onClick={addItem}>
              添加巡检项
            </Button>
          </>
        }
      >
        <div className="inspect" id="wo-items">
          <div className="inspect__head">
            <span className="inspect__col inspect__col--no">#</span>
            <span className="inspect__col">设备</span>
            <span className="inspect__col">巡检项</span>
            <span className="inspect__col">巡检结果</span>
            <span className="inspect__col">实测值 / 单位</span>
            <span className="inspect__col">处置说明</span>
            <span className="inspect__col inspect__col--op">操作</span>
          </div>

          {form.items.length === 0 ? (
            <div className="inspect__empty">
              <Icon name="inbox" size="1.5rem" />
              <p>暂无巡检明细，请点击「添加巡检项」开始登记</p>
            </div>
          ) : null}

          {form.items.map((row, i) => {
            const rowErr = itemErrors[i] || {};
            return (
              <div className="inspect__row" key={row.id}>
                <span className="inspect__col inspect__col--no">
                  <span className="inspect__no">{i + 1}</span>
                </span>

                <div className="inspect__col">
                  <Select
                    id={`wo-item-${i}-device`}
                    value={row.device}
                    options={deviceOptions}
                    showSearch
                    optionFilterProp="label"
                    size="small"
                    placeholder="选择设备"
                    status={rowErr.device ? "error" : undefined}
                    onChange={(v) => setItem(i, "device", v)}
                  />
                  {rowErr.device ? <p className="field-row__error">{rowErr.device}</p> : null}
                </div>

                <div className="inspect__col">
                  <Select
                    id={`wo-item-${i}-item`}
                    value={row.item}
                    options={inspectionItemOptions}
                    size="small"
                    placeholder="选择巡检项"
                    status={rowErr.item ? "error" : undefined}
                    onChange={(v) => setItem(i, "item", v)}
                  />
                  {rowErr.item ? <p className="field-row__error">{rowErr.item}</p> : null}
                </div>

                <div className="inspect__col">
                  <Select
                    id={`wo-item-${i}-result`}
                    value={row.result}
                    options={resultOptions}
                    size="small"
                    placeholder="结果"
                    status={rowErr.result ? "error" : undefined}
                    onChange={(v) => setItem(i, "result", v)}
                  />
                  {rowErr.result ? <p className="field-row__error">{rowErr.result}</p> : null}
                </div>

                <div className="inspect__col">
                  <div className="inspect__pair">
                    <InputNumber
                      id={`wo-item-${i}-value`}
                      mode="spinner"
                      variant="outlined"
                      size="small"
                      value={row.value}
                      status={rowErr.value ? "error" : undefined}
                      placeholder="实测值"
                      onChange={(v) => setItem(i, "value", v)}
                    />
                    <Select
                      value={row.unit}
                      options={unitOptions}
                      size="small"
                      onChange={(v) => setItem(i, "unit", v)}
                    />
                  </div>
                  {rowErr.value ? <p className="field-row__error">{rowErr.value}</p> : null}
                </div>

                <div className="inspect__col">
                  <Input
                    id={`wo-item-${i}-note`}
                    value={row.note}
                    size="small"
                    placeholder={row.result === "abnormal" ? "异常必填：处置动作" : "可选：现场备注"}
                    status={rowErr.note ? "error" : undefined}
                    onChange={(e) => setItem(i, "note", e.target.value)}
                  />
                  {rowErr.note ? <p className="field-row__error">{rowErr.note}</p> : null}
                </div>

                <div className="inspect__col inspect__col--op">
                  {row.result ? (
                    <StatusTag
                      tone={metaOf(resultMeta, row.result).tone}
                      label={metaOf(resultMeta, row.result).label}
                      size="small"
                    />
                  ) : null}
                  <Tooltip title={form.items.length === 1 ? "至少保留一条巡检明细" : "删除该行"}>
                    <Button
                      shape="circle"
                      size="small"
                      disabled={form.items.length === 1}
                      icon={<Icon name="trash-2" size="0.875rem" />}
                      onClick={() => removeItem(i)}
                    />
                  </Tooltip>
                </div>
              </div>
            );
          })}
        </div>

        <Button
          type="dashed"
          block
          className="inspect__add"
          icon={<Icon name="plus" size="0.875rem" />}
          onClick={addItem}
        >
          添加巡检项
        </Button>
      </PanelCard>

      {/* ========== 3. 补充说明与附件 ========== */}
      <PanelCard
        className="wo-form__section"
        icon="paperclip"
        title="补充说明与附件"
        subtitle="现场描述与佐证材料将随工单一起流转"
        extra={<StatusTag tone="brand" label="第 3 步 / 共 3 步" size="small" />}
      >
        <div className="form-grid">
          <FieldRow
            label="问题描述"
            required
            full
            htmlFor="wo-description"
            error={errors.description}
            help={`${String(form.description || "").length} / 500 字，建议包含现象、影响范围、已采取措施`}
          >
            <Input.TextArea
              id="wo-description"
              value={form.description}
              rows={4}
              maxLength={500}
              status={errors.description ? "error" : undefined}
              placeholder="例如：IDC-3 机房 3 号列头柜回风温度连续 2 小时高于 32℃，已临时开启备用精密空调，需现场核查冷通道封闭情况。"
              onChange={(e) => setField("description", e.target.value)}
            />
          </FieldRow>

          <FieldRow
            label="现场附件"
            full
            htmlFor="wo-file"
            error={errors.attachments}
            help={`已上传 ${form.attachments.length} / 5 个；高优先级或存在异常项时至少 1 个`}
          >
            <div className="attach">
              <div
                className="attach__drop"
                onClick={() => fileRef.current && fileRef.current.click()}
                onDragOver={(e) => e.preventDefault()}
                onDrop={handleDrop}
              >
                <Icon name="upload" size="1.5rem" />
                <span className="attach__drop-title">点击选择文件，或将文件拖拽到此处</span>
                <span className="attach__drop-hint">支持 jpg / png / pdf / xlsx / log，单个文件不超过 20MB</span>
              </div>
              <input
                id="wo-file"
                ref={fileRef}
                type="file"
                multiple
                hidden
                onChange={(e) => addFiles(e.target.files)}
              />

              <div className="attach__actions">
                <a onClick={addSampleFile}>
                  <Icon name="file-check" size="0.875rem" /> 追加一份示例附件
                </a>
                <span className="attach__count">共 {form.attachments.length} 个文件</span>
              </div>

              {form.attachments.length ? (
                <ul className="attach__list">
                  {form.attachments.map((f, i) => (
                    <li className="attach-item" key={`${f.name}-${i}`}>
                      <span className="attach-item__icon">
                        <Icon name={FILE_KIND_ICON[f.kind] || "file-text"} size="1rem" />
                      </span>
                      <span className="attach-item__main">
                        <span className="attach-item__name">{f.name}</span>
                        <span className="attach-item__size">{f.size}</span>
                      </span>
                      <button
                        type="button"
                        className="attach-item__remove"
                        onClick={() => removeFile(i)}
                      >
                        <Icon name="x" size="0.875rem" />
                      </button>
                    </li>
                  ))}
                </ul>
              ) : (
                <p className="attach__empty">尚未上传附件</p>
              )}
            </div>
          </FieldRow>

          <FieldRow label="提交前确认" required full htmlFor="wo-acks" error={errors.acks}>
            <div className="ack-list" id="wo-acks">
              <Checkbox.Group
                value={form.acks}
                options={ackOptions}
                onChange={toggleAck}
              />
            </div>
          </FieldRow>
        </div>
      </PanelCard>

      {/* ========== 底部操作条 ========== */}
      <div className="form-footbar">
        <div className="form-footbar__status">
          <Progress
            percent={percent}
            size="small"
            showInfo={false}
            strokeColor={percent === 100 ? "var(--success)" : "var(--primary)"}
            style={{ width: "8rem" }}
          />
          <span className="form-footbar__text">
            校验通过 <strong>{doneCount}</strong> / {checks.length} 项
          </span>
          {percent < 100 ? (
            <a className="form-footbar__link" onClick={() => scrollTo("wo-acks")}>
              查看未通过项
            </a>
          ) : (
            <span className="form-footbar__ok">
              <Icon name="circle-check" size="0.875rem" />
              校验全部通过，可提交
            </span>
          )}
        </div>
        <div className="form-footbar__actions">
          <Button icon={<Icon name="rotate-ccw" size="0.875rem" />} onClick={onReset}>
            重置
          </Button>
          <Button icon={<Icon name="save" size="0.875rem" />} onClick={onSaveDraft}>
            保存草稿
          </Button>
          <Button type="primary" icon={<Icon name="send" size="0.875rem" />} onClick={onSubmit}>
            提交工单
          </Button>
        </div>
      </div>
    </div>
  );
}
  Object.assign(__export, { WorkorderForm });
})();

/* ===== src/views/form-aside/index.jsx ===== */
(function () {
  const { Progress, Timeline, Tooltip } = antd;
  const { Icon, guidelines, recentOrders, orderStatusMeta, priorityMeta, approvalNodes, metaOf } = __export;
  const PanelCard = __export.PanelCard;
  const StatusTag = __export.StatusTag;
// Layer 4: 表单右侧辅助区 — 校验进度 / 填报指引 / 最近工单 / 审批流程
function FormAside({ checks, onJump, onOpenOrder }) {
  const doneCount = checks.filter((c) => c.ok).length;
  const percent = Math.round((doneCount / checks.length) * 100);
  const pending = checks.filter((c) => !c.ok);

  const timelineItems = approvalNodes.map((node, i) => ({
    color: i === 0 ? "var(--primary)" : "var(--outline)",
    children: (
      <div className="apv-node">
        <span className={`apv-node__title ${i === 0 ? "is-current" : ""}`}>{node.title}</span>
        <span className="apv-node__desc">{node.desc}</span>
        <span className="apv-node__time">{node.time}</span>
      </div>
    ),
  }));

  return (
    <aside className="form-aside">
      <PanelCard
        icon="badge-check"
        title="填报校验"
        subtitle={`已通过 ${doneCount} / ${checks.length} 项`}
      >
        <div className="check-progress">
          <Progress
            type="circle"
            percent={percent}
            size={88}
            strokeColor={percent === 100 ? "var(--success)" : "var(--primary)"}
            format={(p) => <span className="check-progress__num">{p}%</span>}
          />
          <p className="check-progress__tip">
            {percent === 100
              ? "校验全部通过，可提交工单"
              : `还有 ${pending.length} 项需要完善后才能提交`}
          </p>
        </div>

        <ul className="check-list">
          {checks.map((c) => (
            <li className={`check-item ${c.ok ? "is-ok" : ""}`} key={c.key}>
              <button type="button" className="check-item__btn" onClick={() => onJump(c.target)}>
                <Icon name={c.ok ? "circle-check" : "circle-alert"} size="1rem" />
                <span className="check-item__main">
                  <span className="check-item__label">{c.label}</span>
                  <span className="check-item__hint">{c.hint}</span>
                </span>
                <Icon name="chevron-right" size="0.875rem" />
              </button>
            </li>
          ))}
        </ul>
      </PanelCard>

      <PanelCard icon="info" title="填报指引" subtitle="来自《机房巡检作业规范 v3.2》">
        <ol className="guide-list">
          {guidelines.map((g, i) => (
            <li className="guide-item" key={g}>
              <span className="guide-item__no">{i + 1}</span>
              <span className="guide-item__text">{g}</span>
            </li>
          ))}
        </ol>
        <a className="aside-link">
          查看完整规范
          <Icon name="arrow-right" size="0.875rem" />
        </a>
      </PanelCard>

      <PanelCard
        icon="clock"
        title="最近工单"
        subtitle="我参与的近 12 条工单"
        extra={<a className="aside-link aside-link--sm">全部</a>}
      >
        <ul className="order-list">
          {recentOrders.map((o) => (
            <li className="order-item" key={o.id}>
              <button type="button" className="order-item__btn" onClick={() => onOpenOrder(o.id)}>
                <span className="order-item__top">
                  <span className="order-item__title">{o.title}</span>
                  <StatusTag
                    tone={metaOf(orderStatusMeta, o.status).tone}
                    label={metaOf(orderStatusMeta, o.status).label}
                    size="small"
                  />
                </span>
                <span className="order-item__meta">
                  <span className="order-item__id">{o.id}</span>
                  <span className="order-item__dot" />
                  <span>{o.station}</span>
                  <span className="order-item__dot" />
                  <span>{o.time}</span>
                  <span className="order-item__dot" />
                  <span className={`order-item__prio is-${o.priority}`}>
                    {metaOf(priorityMeta, o.priority).label}优先级
                  </span>
                </span>
              </button>
            </li>
          ))}
        </ul>
      </PanelCard>

      <PanelCard icon="shield-check" title="审批流程" subtitle="提交后自动流转">
        <Timeline items={timelineItems} />
        <div className="aside-note">
          <Tooltip title="如需加急，请在提交后联系值班经理">
            <span className="aside-note__text">
              <Icon name="siren" size="0.875rem" />
              紧急工单可申请绿色通道，30 分钟内响应
            </span>
          </Tooltip>
        </div>
      </PanelCard>
    </aside>
  );
}
  Object.assign(__export, { FormAside });
})();

/* ===== src/views/workorder-page/validate.js ===== */
(function () {
// 工单校验规则 — 提交时统一校验,结果写入 errors 对象

const ITEM_FIELDS = ["device", "item", "result", "value", "note"];

function isEmptyValue(v) {
  return v === null || v === undefined || String(v).trim() === "";
}

function needsAttachment(form) {
  return (
    form.priority === "urgent" ||
    form.priority === "high" ||
    form.items.some((row) => row.result === "abnormal")
  );
}

function validateItems(form, errors) {
  const itemErrors = form.items.map((row) => {
    const e = {};
    if (!row.device) e.device = "请选择设备";
    if (!row.item) e.item = "请选择巡检项";
    if (!row.result) e.result = "请选择巡检结果";
    if (isEmptyValue(row.value)) e.value = "请填写实测值";
    if (row.result === "abnormal" && !String(row.note || "").trim()) {
      e.note = "判定为异常时必须填写处置说明";
    }
    return e;
  });

  if (!form.items.length) {
    errors.items = "至少添加一条巡检明细";
  } else if (itemErrors.some((e) => Object.keys(e).length)) {
    errors.items = "巡检明细存在未填写或不合规的字段，请逐行修正";
  }
  return itemErrors;
}

function runValidation(form) {
  const errors = {};
  const title = String(form.title || "").trim();
  const desc = String(form.description || "").trim();

  if (!title) errors.title = "请填写工单标题";
  else if (title.length < 6) errors.title = "工单标题至少 6 个字符，建议包含设备名称与现象";
  else if (title.length > 60) errors.title = "工单标题不超过 60 个字符";

  if (!form.type) errors.type = "请选择工单类型";
  if (!form.station) errors.station = "请选择所属站点";
  if (!form.owner) errors.owner = "请指定现场责任人";

  const phone = String(form.phone || "").trim();
  if (!phone) errors.phone = "请填写联系电话，便于现场联络";
  else if (!/^1[3-9]\d{9}$/.test(phone)) errors.phone = "手机号格式不正确，应为 1 开头的 11 位数字";

  const range = form.range;
  if (!range || !range[0] || !range[1]) errors.range = "请选择计划开始与结束时间";
  else if (!range[1].isAfter(range[0])) errors.range = "计划结束时间必须晚于开始时间";
  else if (range[0].add(30, "day").isBefore(range[1])) {
    errors.range = "计划周期不得超过 30 天，超出请拆分多张工单";
  }

  if (isEmptyValue(form.duration)) errors.duration = "请填写预计工时";
  else if (form.duration < 0.5) errors.duration = "预计工时不少于 0.5 小时";
  else if (form.duration > 72) errors.duration = "预计工时不超过 72 小时，超出请拆分多张工单";

  const itemErrors = validateItems(form, errors);

  if (!desc) errors.description = "请描述现场现象、影响范围与已采取的措施";
  else if (desc.length < 10) errors.description = "问题描述至少 10 个字符，避免只写“已处理”";
  else if (desc.length > 500) errors.description = "问题描述不超过 500 个字符";

  if (form.attachments.length > 5) {
    errors.attachments = "附件最多上传 5 个，请合并或先删除部分文件";
  } else if (needsAttachment(form) && !form.attachments.length) {
    errors.attachments = "当前优先级或巡检结果要求必须上传现场附件";
  }

  if (!form.acks.length) errors.acks = "请至少勾选一项确认事项后再提交";
  else if (!form.acks.includes("safety")) errors.acks = "必须确认已阅读《机房作业安全须知》";

  if (itemErrors.some((e) => Object.keys(e).length)) errors.itemErrors = itemErrors;

  return errors;
}

function hasErrors(errors) {
  const flat = Object.keys(errors).some((k) => k !== "itemErrors" && !!errors[k]);
  const rows = !!(errors.itemErrors && errors.itemErrors.some((e) => e && Object.keys(e).length));
  return flat || rows;
}

const FIELD_ORDER = [
  ["title", "wo-title"],
  ["type", "wo-type"],
  ["station", "wo-station"],
  ["owner", "wo-owner"],
  ["phone", "wo-phone"],
  ["range", "wo-range"],
  ["duration", "wo-duration"],
  ["items", "wo-items"],
  ["description", "wo-description"],
  ["attachments", "wo-attachments"],
  ["acks", "wo-acks"],
];

function firstErrorId(errors) {
  if (errors.itemErrors) {
    for (let i = 0; i < errors.itemErrors.length; i += 1) {
      const row = errors.itemErrors[i];
      if (!row) continue;
      const field = ITEM_FIELDS.find((f) => row[f]);
      if (field) return `wo-item-${i}-${field}`;
    }
  }
  for (let i = 0; i < FIELD_ORDER.length; i += 1) {
    if (errors[FIELD_ORDER[i][0]]) return FIELD_ORDER[i][1];
  }
  return null;
}

// 校验进度面板 —— 六项分组校验
function computeChecks(form) {
  const title = String(form.title || "").trim();
  const phone = String(form.phone || "").trim();
  const desc = String(form.description || "").trim();
  const range = form.range;

  const basicOk =
    title.length >= 6 &&
    !!form.type &&
    !!form.station &&
    !!form.owner &&
    /^1[3-9]\d{9}$/.test(phone);

  const scheduleOk =
    !!range &&
    !!range[0] &&
    !!range[1] &&
    range[1].isAfter(range[0]) &&
    !isEmptyValue(form.duration) &&
    form.duration >= 0.5 &&
    form.duration <= 72;

  const itemsOk =
    form.items.length > 0 &&
    form.items.every(
      (row) =>
        row.device &&
        row.item &&
        row.result &&
        !isEmptyValue(row.value) &&
        (row.result !== "abnormal" || String(row.note || "").trim())
    );

  const attachOk = form.attachments.length <= 5 && (!needsAttachment(form) || form.attachments.length > 0);

  return [
    { key: "basic", label: "基础信息与联系人", ok: basicOk, target: "wo-title", hint: "标题 / 类型 / 站点 / 责任人 / 手机号" },
    { key: "schedule", label: "计划时间与工时", ok: scheduleOk, target: "wo-range", hint: "结束晚于开始，工时 0.5–72 小时" },
    { key: "items", label: "巡检明细", ok: itemsOk, target: "wo-items", hint: "每行需填写设备 / 巡检项 / 结果 / 实测值" },
    { key: "desc", label: "问题描述", ok: desc.length >= 10 && desc.length <= 500, target: "wo-description", hint: "10–500 字的现场描述" },
    { key: "attach", label: "附件材料", ok: attachOk, target: "wo-attachments", hint: "高优先级或异常项必须上传附件" },
    { key: "ack", label: "提交确认", ok: form.acks.includes("safety"), target: "wo-acks", hint: "需确认机房作业安全须知" },
  ];
}
  Object.assign(__export, { isEmptyValue, needsAttachment, runValidation, hasErrors, firstErrorId, computeChecks });
})();

const KIND_BY_EXT = {
  jpg: "image",
  jpeg: "image",
  png: "image",
  xlsx: "sheet",
  xls: "sheet",
  csv: "sheet",
  log: "log",
  pdf: "doc",
  docx: "doc",
};

function formatSize(bytes) {
  if (!bytes && bytes !== 0) return "—";
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

function guessKind(name) {
  const ext = String(name).split(".").pop().toLowerCase();
  return KIND_BY_EXT[ext] || "doc";
}

let itemSeq = 3;

// Layer 4: 工单填报页面 — 状态编排 + 表单 + 校验 + 侧栏
function WorkorderPage() {
  const [form, setForm] = useState(makeInitialForm);
  const [errors, setErrors] = useState({});
  const [draftSaved, setDraftSaved] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [successOpen, setSuccessOpen] = useState(false);
  const [templateOpen, setTemplateOpen] = useState(false);
  const [orderNo, setOrderNo] = useState("");
  const [messageApi, contextHolder] = message.useMessage();

  const checks = useMemo(() => computeChecks(form), [form]);
  const doneCount = checks.filter((c) => c.ok).length;

  const stepFlags = useMemo(() => {
    const ok = (keys) => keys.every((k) => checks.find((c) => c.key === k).ok);
    const g0 = ok(["basic", "schedule"]);
    const g1 = ok(["items", "desc", "attach"]);
    return { g0, g1, g2: ok(["ack"]) };
  }, [checks]);

  const currentStep = !stepFlags.g0 ? 0 : !stepFlags.g1 ? 1 : 2;

  const stationLabel = (stationOptions.find((s) => s.value === form.station) || {}).label;
  const ownerLabel = (ownerOptions.find((o) => o.value === form.owner) || {}).label;
  const typeLabel = (orderTypes.find((t) => t.value === form.type) || {}).label;
  const priorityLabel = (priorityOptions.find((p) => p.value === form.priority) || {}).label;

  const clearKey = (key, prev) => {
    if (!prev[key]) return prev;
    const next = { ...prev };
    delete next[key];
    return next;
  };

  const setField = (key, value) => {
    setForm((prev) => ({ ...prev, [key]: value }));
    setErrors((prev) => clearKey(key, prev));
    setDraftSaved(false);
  };

  const setItem = (index, field, value) => {
    setForm((prev) => ({
      ...prev,
      items: prev.items.map((row, i) => (i === index ? { ...row, [field]: value } : row)),
    }));
    setErrors((prev) => {
      const row = prev.itemErrors ? prev.itemErrors[index] : null;
      if (!row || !row[field]) return prev;
      const itemErrors = prev.itemErrors.map((e, i) => (i === index ? { ...e, [field]: undefined } : e));
      const next = { ...prev, itemErrors };
      if (!itemErrors.some((e) => e && Object.keys(e).some((k) => !!e[k]))) delete next.items;
      return next;
    });
    setDraftSaved(false);
  };

  const addItem = () => {
    itemSeq += 1;
    setForm((prev) => ({
      ...prev,
      items: [
        ...prev.items,
        { id: itemSeq, device: undefined, item: undefined, result: undefined, value: null, unit: "℃", note: "" },
      ],
    }));
    setErrors({});
    setDraftSaved(false);
  };

  const removeItem = (index) => {
    setForm((prev) => ({ ...prev, items: prev.items.filter((row, i) => i !== index) }));
    setErrors({});
    setDraftSaved(false);
    messageApi.info("已删除该条巡检明细");
  };

  const addFiles = (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const mapped = files.map((f) => ({
      name: f.name,
      size: formatSize(f.size),
      kind: guessKind(f.name),
    }));
    setForm((prev) => ({ ...prev, attachments: [...prev.attachments, ...mapped].slice(0, 5) }));
    setErrors((prev) => clearKey("attachments", prev));
    setDraftSaved(false);
    messageApi.success(`已添加 ${mapped.length} 个附件`);
  };

  const addSampleFile = () => {
    const sample = filePool[form.attachments.length % filePool.length];
    setForm((prev) => ({ ...prev, attachments: [...prev.attachments, sample].slice(0, 5) }));
    setErrors((prev) => clearKey("attachments", prev));
    setDraftSaved(false);
  };

  const removeFile = (index) => {
    setForm((prev) => ({ ...prev, attachments: prev.attachments.filter((f, i) => i !== index) }));
    setDraftSaved(false);
  };

  const toggleAck = (values) => {
    setForm((prev) => ({ ...prev, acks: values }));
    setErrors((prev) => clearKey("acks", prev));
    setDraftSaved(false);
  };

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    const input = el.matches("input, textarea") ? el : el.querySelector("input, textarea");
    if (input) setTimeout(() => input.focus({ preventScroll: true }), 340);
  };

  const handleSubmit = () => {
    const nextErrors = runValidation(form);
    setErrors(nextErrors);
    if (hasErrors(nextErrors)) {
      const flatCount = Object.keys(nextErrors).filter((k) => k !== "itemErrors" && nextErrors[k]).length;
      const rowCount = nextErrors.itemErrors
        ? nextErrors.itemErrors.filter((e) => e && Object.keys(e).some((k) => !!e[k])).length
        : 0;
      messageApi.error(`校验未通过：${flatCount + rowCount} 处字段需要修正，请检查标红位置`);
      const targetId = firstErrorId(nextErrors);
      if (targetId) setTimeout(() => scrollTo(targetId), 80);
      return;
    }
    setSubmitting(true);
    setTimeout(() => {
      setSubmitting(false);
      setOrderNo(`WO-${dayjs().format("YYYYMMDD")}-${Math.floor(Math.random() * 900) + 100}`);
      setSuccessOpen(true);
      setDraftSaved(true);
    }, 900);
  };

  const handleSaveDraft = () => {
    setDraftSaved(true);
    messageApi.success("草稿已保存，可在「工单中心 - 工单列表 - 草稿」中继续编辑");
  };

  const handleReset = () => {
    setForm(makeInitialForm());
    setErrors({});
    setDraftSaved(false);
    messageApi.info("表单已重置为初始状态");
  };

  const applyTemplate = (tpl) => {
    itemSeq += tpl.patch.items.length;
    setForm((prev) => ({
      ...prev,
      ...tpl.patch,
      items: tpl.patch.items.map((row, i) => ({ ...row, id: itemSeq - tpl.patch.items.length + i + 1 })),
    }));
    setErrors({});
    setTemplateOpen(false);
    setDraftSaved(false);
    messageApi.success(`已套用模板「${tpl.name}」，请核对后补充标题与联系电话`);
  };

  return (
    <div className="wo-page">
      {contextHolder}

      <PageHeader
        draftSaved={draftSaved}
        onSaveDraft={handleSaveDraft}
        onOpenTemplate={() => setTemplateOpen(true)}
        onSubmit={handleSubmit}
      />

      <div className="wo-page__steps">
        <Steps
          current={currentStep}
          onChange={(i) => scrollTo(SECTION_TARGETS[i])}
          items={[
            { title: "基础信息", description: stepFlags.g0 ? "已完成" : "待完善" },
            { title: "巡检明细", description: stepFlags.g1 ? "已完成" : "待完善" },
            { title: "确认提交", description: stepFlags.g2 ? "已完成" : "待完善" },
          ]}
        />
      </div>

      <div className="wo-page__body">
        <WorkorderForm
          form={form}
          errors={errors}
          checks={checks}
          setField={setField}
          setItem={setItem}
          addItem={addItem}
          removeItem={removeItem}
          addFiles={addFiles}
          addSampleFile={addSampleFile}
          removeFile={removeFile}
          toggleAck={toggleAck}
          scrollTo={scrollTo}
          onSubmit={handleSubmit}
          onSaveDraft={handleSaveDraft}
          onReset={handleReset}
        />

        <FormAside
          checks={checks}
          onJump={scrollTo}
          onOpenOrder={(id) => messageApi.info(`已打开工单 ${id} 的详情抽屉`)}
        />
      </div>

      <Modal
        open={successOpen}
        title="工单已提交"
        okText="查看工单详情"
        cancelText="继续填报下一张"
        onOk={() => setSuccessOpen(false)}
        onCancel={() => {
          setSuccessOpen(false);
          setForm(makeInitialForm());
          setErrors({});
          setDraftSaved(false);
        }}
      >
        <div className="submit-result">
          <span className="submit-result__icon">
            <Icon name="circle-check" size="2rem" />
          </span>
          <p className="submit-result__title">工单 {orderNo} 已进入审批流程</p>
          <ul className="submit-result__list">
            <li>
              <span>工单标题</span>
              <strong>{form.title}</strong>
            </li>
            <li>
              <span>工单类型 / 优先级</span>
              <strong>
                {typeLabel} · {priorityLabel}
              </strong>
            </li>
            <li>
              <span>所属站点</span>
              <strong>{stationLabel}</strong>
            </li>
            <li>
              <span>现场责任人</span>
              <strong>{ownerLabel}</strong>
            </li>
            <li>
              <span>巡检明细 / 附件</span>
              <strong>
                {form.items.length} 条记录 · {form.attachments.length} 个附件
              </strong>
            </li>
            <li>
              <span>预计下发时间</span>
              <strong>班组审核通过后 30 分钟内</strong>
            </li>
          </ul>
        </div>
      </Modal>

      <Modal
        open={templateOpen}
        title="套用填报模板"
        footer={null}
        onCancel={() => setTemplateOpen(false)}
        width={560}
      >
        <p className="tpl-tip">选择模板后将覆盖巡检明细与描述内容，已填写的基础信息会保留。</p>
        <ul className="tpl-list">
          {TEMPLATES.map((tpl) => (
            <li className="tpl-item" key={tpl.key}>
              <button type="button" className="tpl-item__btn" onClick={() => applyTemplate(tpl)}>
                <span className="tpl-item__icon">
                  <Icon name={tpl.icon} size="1.25rem" />
                </span>
                <span className="tpl-item__main">
                  <span className="tpl-item__name">{tpl.name}</span>
                  <span className="tpl-item__desc">{tpl.desc}</span>
                </span>
                <Icon name="chevron-right" size="1rem" />
              </button>
            </li>
          ))}
        </ul>
      </Modal>
    </div>
  );
}
  Object.assign(__export, { WorkorderPage });
})();
