  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}

  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;

}

}

}

/* ============ 页面骨架 ============ */
.app-root {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--surface-container-lowest);
}
.app-main {
  flex: 1;
  min-height: 0;
  padding: var(--spacing-section) var(--spacing-page) var(--spacing-page);
}
.app-grid {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  grid-template-rows: minmax(21rem, auto) minmax(23rem, 1fr) minmax(15rem, auto);
  grid-template-areas:
    "funnel todo"
    "board board"
    "team customers";
  gap: var(--spacing-section);
  height: 100%;
}
.app-funnel { grid-area: funnel; }
.app-todo { grid-area: todo; }
.app-board { grid-area: board; }
.app-team { grid-area: team; }
.app-cust { grid-area: customers; }
.app-funnel, .app-todo, .app-board, .app-team, .app-cust {
  min-width: 0;
  min-height: 0;
}
.app-body-flex {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}
.app-body-board {
  padding: 0.875rem 1rem;
}

/* 自定义 spin 指示器旋转动画 */
.custom-spin-indicator {
  width: 1rem;
  height: 1rem;
  animation: custom-spin-rotate 1s linear infinite;
}
@keyframes custom-spin-rotate {
  to { transform: rotate(360deg); }
}


.hdr {
  height: 3rem;
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  padding: 0 var(--spacing-page);
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--outline-variant);
  position: sticky;
  top: 0;
  z-index: 20;
  flex-shrink: 0;
}
.hdr__brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}
.hdr__logo {
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-md);
  background: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.hdr__name {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  letter-spacing: 0.02em;
}
.hdr__ver {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
  background: var(--surface-variant);
  padding: 0.0625rem 0.375rem;
  border-radius: var(--radius-xs);
}

.hdr__nav {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  margin-left: 1.5rem;
  flex: 1;
}
.hdr__nav-item {
  position: relative;
  display: inline-flex;
  align-items: center;
  padding: 0 0.75rem;
  height: 3rem;
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface-variant);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color 0.15s ease;
}
.hdr__nav-item:hover {
  color: var(--primary);
}
.hdr__nav-item.is-active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: var(--font-weight-semibold);
}

.hdr__right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}
.hdr__team {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  height: 2rem;
  padding: 0 0.625rem;
  border-radius: var(--radius-action);
  background: var(--primary-container);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.15s ease;
}
.hdr__team:hover {
  background: var(--primary-fixed);
  color: var(--on-primary-fixed);
}
.hdr__team:hover .hdr__team-name,
.hdr__team:hover :global(svg) {
  color: var(--on-primary-fixed);
}
.hdr__team-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: var(--radius-full);
}
.hdr__team-name {
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.hdr__icon-btn {
  width: 2rem;
  height: 2rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-action);
  background: transparent;
  border: 1px solid transparent;
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.hdr__icon-btn:hover {
  background: var(--surface-variant);
  color: var(--on-surface);
}
.hdr__user {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  height: 2rem;
  padding: 0 0.25rem 0 0.25rem;
  border-radius: var(--radius-action);
  background: transparent;
  border: none;
  cursor: pointer;
}
.hdr__user:hover {
  background: var(--surface-variant);
}
.hdr__user-av {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  background: var(--primary);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
}
.hdr__user-name {
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}


.goal {
  display: grid;
  grid-template-columns: 12rem 1fr 1.4fr;
  gap: var(--spacing-gutter);
  align-items: center;
  padding: 1rem var(--spacing-page);
  background: linear-gradient(135deg, var(--primary-container) 0%, var(--surface-container-highest) 70%);
  border-bottom: 1px solid var(--outline-variant);
}
.goal__brand {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-width: 0;
}
.goal__brand-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.goal__dot {
  width: 0.625rem;
  height: 0.625rem;
  border-radius: var(--radius-full);
}
.goal__title {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
}
.goal__sub {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.goal__tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--spacing-inline);
}
.goal__tile {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0 0.75rem;
  border-left: 1px solid var(--outline-variant);
  min-width: 0;
}
.goal__tile:first-child {
  border-left: none;
  padding-left: 0;
}
.goal__tile-label {
  display: flex;
  align-items: center;
  gap: 0.3125rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.goal__tile-value {
  font: var(--font-display-s);
  font-weight: var(--font-weight-bold);
  line-height: 1.2;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.goal__bar-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  min-width: 0;
}
.goal__bar-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
}
.goal__bar-label {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.goal__bar-figures {
  display: flex;
  align-items: baseline;
  gap: 0.375rem;
}
.goal__bar-rate {
  font: var(--font-headline-l);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
}
.goal__bar-sep {
  color: var(--on-surface-variant);
}
.goal__bar-forecast {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.goal__bar-gap {
  margin-left: 0.5rem;
  padding: 0.0625rem 0.5rem;
  font: var(--font-caption-m);
  color: var(--on-error-container);
  background: var(--error-container);
  border-radius: var(--radius-badge);
  white-space: nowrap;
}
.goal__bar-track {
  position: relative;
  height: 0.625rem;
  background: var(--surface-variant);
  border-radius: var(--radius-full);
  overflow: visible;
}
.goal__bar-signed {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  background: linear-gradient(90deg, var(--primary) 0%, var(--primary-hover) 100%);
  border-radius: var(--radius-full);
  transition: width 0.4s ease;
}
.goal__bar-forecast-mark {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 2;
}
.goal__bar-flag {
  width: 0.25rem;
  height: 1.25rem;
  background: var(--critical);
  border-radius: var(--radius-xs);
  display: block;
  box-shadow: 0 0 0 2px var(--surface-container-highest);
}
.goal__hidden-prog {
  display: none;
}


.funnel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  min-height: 0;
  height: 100%;
}
.funnel__total {
  display: flex;
  align-items: baseline;
  gap: 0.625rem;
  padding: 0.75rem 1rem;
  background: var(--surface-variant);
  border-radius: var(--radius-md);
}
.funnel__total-label {
  font: var(--font-body-m);
  color: var(--on-surface-variant);
}
.funnel__total-value {
  font: var(--font-display-s);
  font-weight: var(--font-weight-bold);
  color: var(--primary);
}
.funnel__total-sub {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  margin-left: auto;
}
.funnel__bars {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  flex: 1;
  min-height: 0;
}
.funnel__row {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.funnel__bar-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  padding: 0.625rem 0.75rem;
  border-radius: var(--radius-md);
  cursor: pointer;
  border: 1.5px solid transparent;
  background: var(--surface-container-low);
  transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
}
.funnel__bar-wrap:hover {
  background: var(--surface-variant);
}
.funnel__bar-wrap.is-active {
  border-color: var(--primary);
  background: var(--primary-container);
}
.funnel__bar-wrap.is-dim {
  opacity: 0.45;
}
.funnel__bar-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.funnel__stage-dot {
  width: 0.625rem;
  height: 0.625rem;
  border-radius: var(--radius-full);
}
.funnel__stage-label {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.funnel__stage-count {
  margin-left: auto;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.funnel__bar-track {
  position: relative;
  height: 0.625rem;
  background: var(--surface-variant);
  border-radius: var(--radius-full);

(function () {
  const { useState, useEffect, createContext, useContext } = React;
// Layer 1: 全局状态 — 主题模式 + 作战室业务状态
// 换肤单轨驱动:isDark 只切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);
  // 作战室全局筛选态
  const [team, setTeam] = useState("huadong");            // 大区
  const [productLine, setProductLine] = useState("all");  // 产品线
  const [dept, setDept] = useState("all");                // 部门
  const [timeRange, setTimeRange] = useState("quarter");  // 时间范围
  const [funnelStage, setFunnelStage] = useState(null);   // 漏斗阶段联动看板

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  // 团队切换全局联动:重置漏斗阶段筛选
  const switchTeam = (t) => {
    setTeam(t);
    setFunnelStage(null);
  };

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
    team, setTeam: switchTeam,
    productLine, setProductLine,
    dept, setDept,
    timeRange, setTimeRange,
    funnelStage, setFunnelStage,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

  return s.replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase();
}

function lookupIcon(name) {
  if (!name) return null;

    ICONS[name] ||
    ICONS[camelToKebab(name)] ||

const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url } (结果缓存)
const iconInfoPromiseMap = {}; // name -> 进行中 Promise (in-flight 去重)
const svgCache = new Map(); // "name&variant&color&size" -> svg text (结果缓存)
const svgPromiseMap = new Map(); // "name&variant&color&size" -> 进行中 Promise (in-flight 去重)

// 动态获取当前 rem 基准 px（html font-size 随视口媒体查询变化：12/14/16/20px）
function getRootFontSize() {
  if (typeof document === "undefined") return 16;

  return parseFloat(fs) || 16;
}

// 将 getComputedStyle 返回的 rgb()/rgba() 字符串转为 #RRGGBB，用于 icon-plus API 颜色匹配
function rgbToHex(rgb) {
  if (!rgb) return null;

  if (!m) return null;
  return "#" + [1, 2, 3].map(function (i) { return parseInt(m[i], 10).toString(16).padStart(2, "0"); }).join("").toUpperCase();
}

// #RGB / #RRGGBB -> [r,g,b]；非法输入返回 null
function hexToRgb(hex) {
  if (!hex) return null;
  let h = String(hex).replace(/^#/, "").trim();
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);

// 两个 hex 颜色的欧氏距离（RGB 空间），用于 icon-plus 颜色就近匹配
function colorDistance(a, b) {
  const ra = hexToRgb(a);
  const rb = hexToRgb(b);
  if (!ra || !rb) return Infinity;

const API_SIZES = [12, 14, 16, 20, 24, 32, 36, 40, 48, 60];

      n = Number(m[1]);
      if (m[2] && m[2].toLowerCase() === "rem") n = n * getRootFontSize();

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",

function getStyleValue(styleKey) {

    // 2. 就近匹配：取与目标色 RGB 距离最小的 color（多色值取其中最近的）
    let best = null;

      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))

    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]

// name -> { name, url } via getIconInfo (结果缓存在 iconInfoMap；并发去重靠 iconInfoPromiseMap)

  const { Badge, Dropdown } = antd;
  const { Icon, useApp, teams, teamMap, opportunities } = __export;

  { key: "warroom", label: "作战室", active: true },
  { key: "customer", label: "客户", active: false },

  { key: "contract", label: "合同", active: false },
  { key: "report", label: "报表", active: false },
];

const userMenu = {
  items: [
    { key: "profile", label: "个人中心" },
    { key: "settings", label: "偏好设置" },
    { type: "divider" },
    { key: "logout", label: "退出登录", danger: true },
  ],
  onClick: () => {},
};

function HeaderBar() {
  const { team, setTeam, isDark, toggleDark } = useApp();
  const currentTeam = teamMap[team];
  const oppCount = opportunities.filter((o) => o.team === team).length;

  const teamMenu = {
    items: teams.map((t) => ({ key: t.key, label: t.name })),
    onClick: ({ key }) => setTeam(key),
    selectable: true,
    selectedKeys: [team],
  };

  return (
    <header className="hdr">
      <div className="hdr__brand">
        <span className="hdr__logo">
          <Icon name="radar" size="1.5rem" color="#FFFFFF" />
        </span>
        <span className="hdr__name">销售作战室</span>
        <span className="hdr__ver">v3.2</span>
      </div>

      <nav className="hdr__nav">
        {navItems.map((it) => (
          <a key={it.key} className={`hdr__nav-item ${it.active ? "is-active" : ""}`}>
            {it.label}
            {it.badge && (
              <Badge count={oppCount} size="small" color="#E02128" offset={[4, -2]} />
            )}
          </a>
        ))}
      </nav>

      <div className="hdr__right">
        <Dropdown menu={teamMenu} trigger={["click"]} placement="bottomRight">
          <button className="hdr__team" type="button">
            <span className="hdr__team-dot" style={{ background: currentTeam.color }} />
            <span className="hdr__team-name">{currentTeam.name}</span>
            <Icon name="chevron-down" size="0.875rem" color="var(--on-surface-variant)" />
          </button>
        </Dropdown>

        <button className="hdr__icon-btn" type="button" title={isDark ? "切换浅色" : "切换深色"} onClick={toggleDark}>
          <Icon name={isDark ? "sun" : "moon"} size="1.125rem" />
        </button>

        <button className="hdr__icon-btn" type="button" title="通知中心">
          <Badge dot color="#E02128">
            <Icon name="bell" size="1.125rem" />
          </Badge>
        </button>

        <Dropdown menu={userMenu} trigger={["click"]} placement="bottomRight">
          <button className="hdr__user" type="button">
            <span className="hdr__user-av">陈</span>
            <span className="hdr__user-name">陈经理</span>
            <Icon name="chevron-down" size="0.875rem" color="var(--on-surface-variant)" />
          </button>
        </Dropdown>
      </div>
    </header>
  );
}
  Object.assign(__export, { HeaderBar });
})();

/* ===== src/mock/selectors.js ===== */
(function () {
  const { salespeople, ownerMap, opportunities, deals, teamMap, stages } = __export;
function getOwner(id) { return ownerMap[id]; }
function getTeam(key) { return teamMap[key]; }

// 商机筛选 — 团队 / 产品线 / 部门 / 漏斗阶段联动
function filterOpps({ team, productLine = "all", dept = "all", funnelStage = null }) {
  return opportunities.filter((o) => {
    if (o.team !== team) return false;
    if (productLine !== "all" && o.productLine !== productLine) return false;
    if (dept !== "all") {
      const owner = ownerMap[o.owner];
      if (!owner || owner.dept !== dept) return false;
    }
    if (funnelStage && o.stage !== funnelStage) return false;
    return true;
  });
}

const ANCHOR = new Date("2026-10-21");
function inTimeRange(closeDate, range) {
  const d = new Date(closeDate);
  if (range === "quarter") {
    return d.getFullYear() === 2026 && d.getMonth() >= 9 && d.getMonth() <= 11; // Q4
  }
  if (range === "month") {
    return d.getFullYear() === 2026 && d.getMonth() === 9; // 10 月
  }
  if (range === "week") {
    const t = d.getTime();
    return t >= new Date("2026-10-19").getTime() && t <= new Date("2026-10-25").getTime();
  }
  return true;
}

// 成交订单筛选 — 团队 / 产品线 / 部门 / 时间范围
function filterDeals({ team, productLine = "all", dept = "all", timeRange = "quarter" }) {
  return deals.filter((d) => {
    if (d.team !== team) return false;
    if (productLine !== "all" && d.productLine !== productLine) return false;
    if (dept !== "all") {
      const owner = ownerMap[d.owner];
      if (!owner || owner.dept !== dept) return false;
    }
    if (!inTimeRange(d.closeDate, timeRange)) return false;
    return true;
  });
}

function filterSalespeople({ team, dept = "all" }) {
  return salespeople.filter((s) => s.team === team && (dept === "all" || s.dept === dept));
}

// 销售漏斗聚合 — 各阶段金额/单数/占比 + 阶段间转化率
function buildFunnel(opps) {
  const total = opps.reduce((sum, o) => sum + o.amount, 0);
  const rows = stages.map((st) => {
    const stageOpps = opps.filter((o) => o.stage === st.key);
    const amount = stageOpps.reduce((s, o) => s + o.amount, 0);
    const count = stageOpps.length;
    return {
      ...st,
      amount,
      count,
      pct: total > 0 ? (amount / total) * 100 : 0,
      opps: stageOpps,
    };
  });
  const conv = rows.map((r, i) => {
    if (i === 0) return null;
    const prev = rows[i - 1].amount;
    return prev > 0 ? (r.amount / prev) * 100 : 0;
  });
  return { rows, total, conv };
}

// 重点客户榜 — 成交订单按金额排序取前 N
function topCustomers(dealsArr, n = 8) {
  return [...dealsArr]
    .sort((a, b) => b.amount - a.amount)
    .slice(0, n)
    .map((d, i) => ({
      rank: i + 1,
      customer: d.customer,
      amount: d.amount,
      owner: ownerMap[d.owner],
      closeDate: d.closeDate,
      productLine: d.productLine,
    }));
}

// 团队业绩行 — 销售签约额/单数/目标达成率/排名
function teamRows(salespeopleFiltered, dealsFiltered) {
  return salespeopleFiltered
    .map((s) => {
      const myDeals = dealsFiltered.filter((d) => d.owner === s.id);
      const signed = myDeals.reduce((sum, d) => sum + d.amount, 0);
      const count = myDeals.length;
      const rate = s.target > 0 ? (signed / s.target) * 100 : 0;
      return { ...s, signed, dealCount: count, rate };
    })
    .sort((a, b) => b.signed - a.signed)
    .map((r, i) => ({ ...r, rank: i + 1 }));
}

// 本季目标条 — 已签约/待审批/预测达成/差额
function buildGoal(teamKey) {
  const team = teamMap[teamKey];
  const teamOpps = opportunities.filter((o) => o.team === teamKey);
  const teamDeals = deals.filter((d) => d.team === teamKey);
  const target = salespeople.filter((s) => s.team === teamKey).reduce((s, p) => s + p.target, 0);
  const signed = teamDeals.reduce((s, d) => s + d.amount, 0);
  const pending = team ? team.pending : 0;
  const signingAmount = teamOpps.filter((o) => o.stage === "signing").reduce((s, o) => s + o.amount, 0);
  const forecast = Math.round(signed + pending * 0.85 + signingAmount * 0.9);
  const forecastRate = target > 0 ? (forecast / target) * 100 : 0;
  const signedRate = target > 0 ? (signed / target) * 100 : 0;
  const gap = target - forecast;
  return { target, signed, pending, forecast, forecastRate, signedRate, gap, signingAmount, team };
}
  Object.assign(__export, { getOwner, getTeam, filterOpps, filterDeals, filterSalespeople, buildFunnel, topCustomers, teamRows, buildGoal });
})();

    setFunnelStage(funnelStage === key ? null : key);

  return (

                <div className="funnel__bar-track">

                </div>
                <div className="funnel__bar-figures">
                  <span className="funnel__amount" style={{ color: row.color }}>{fmtMoney(row.amount)}</span>
                  <span className="funnel__pct">{fmtPct(row.pct)}</span>
                </div>
              </div>
              {conv !== null && conv !== undefined && (
                <div className="funnel__conv">
                  <Icon name="arrow-down" size="0.75rem" color="var(--on-surface-variant)" />
                  <span className="funnel__conv-text">阶段转化 {fmtPct(conv)}</span>
                </div>

            </div>
          );

      </div>

      <div className="funnel__hint">
        <Icon name="mouse-pointer-click" size="0.875rem" color="var(--primary)" />
        <span>点击阶段筛选看板对应列 · {funnelStage ? "已筛选 · 再点取消" : "当前展示全部阶段"}</span>
      </div>
    </div>
  );
}
  Object.assign(__export, { SalesFunnel });
})();

  owner: undefined,
  productLine: "solution",
};

function NewOppModal({ open, onClose, onCreated, team }) {
  const [form, setForm] = useState(EMPTY);
  const [errors, setErrors] = useState({});

  const salesOpts = filterSalespeople({ team }).map((s) => ({
    value: s.id,

    { value: "software", label: "软件订阅" },
  ];

  const set = (key, val) => {
    setForm((f) => ({ ...f, [key]: val }));
    setErrors((e) => ({ ...e, [key]: undefined }));
  };

  const validate = () => {
    const e = {};
    if (!form.customer || !form.customer.trim()) e.customer = "请输入客户名称";
    if (!form.amount || form.amount <= 0) e.amount = "请输入有效金额";
    if (!form.stage) e.stage = "请选择商机阶段";
    if (!form.closeDate) e.closeDate = "请选择预计成交日期";
    if (!form.owner) e.owner = "请选择负责人";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = () => {
    if (!validate()) return;
    const owner = form.owner;
    const ownerPerson = salesOpts.find((s) => s.value === owner);
    const newOpp = {
      id: `new-${Date.now()}`,
      customer: form.customer.trim(),

      team,

    setErrors({});

    setForm(EMPTY);

        <div className="nom__grid">

            <label className="form-label required" htmlFor="nom-customer">客户名称</label>
            <div className="form-field">
              <Input
                id="nom-customer"
                placeholder="请输入客户名称"
                value={form.customer}
                onChange={(e) => set("customer", e.target.value)}
                status={errors.customer ? "error" : undefined}
                maxLength={40}
              />
              {errors.customer && <div className="form-error">{errors.customer}</div>}
            </div>
          </div>

          <div className="nom__field">
            <label className="form-label required" htmlFor="nom-amount">商机金额(万元)</label>
            <div className="form-field">
              <InputNumber
                id="nom-amount"
                mode="spinner"
                variant="outlined"
                placeholder="请输入金额"
                value={form.amount}

              <Select

                value={form.stage}
                onChange={(v) => set("stage", v)}
                options={stageOpts}
                status={errors.stage ? "error" : undefined}
                style={{ width: "100%" }}
              />
              {errors.stage && <div className="form-error">{errors.stage}</div>}
            </div>
          </div>

          <div className="nom__field">
            <label className="form-label required" htmlFor="nom-close">预计成交日期</label>
            <div className="form-field">
              <DatePicker
                id="nom-close"
                value={form.closeDate}
                onChange={(v) => set("closeDate", v)}
                status={errors.closeDate ? "error" : undefined}
                style={{ width: "100%" }}
                placeholder="选择日期"
              />
              {errors.closeDate && <div className="form-error">{errors.closeDate}</div>}
            </div>
          </div>

          <div className="nom__field">
            <label className="form-label required" htmlFor="nom-owner">负责人</label>
            <div className="form-field">
              <Select
                id="nom-owner"
                placeholder="请选择负责人"

          <Segmented value={view} onChange={setView} options={viewOpts} />
          <Button

            icon={<Icon name="plus" size="0.875rem" color="#FFFFFF" />}

          <ListView opps={opps} onSelect={setSelectedOpp} />

      <NewOppModal
        open={modalOpen}
        onClose={() => setModalOpen(false)}
        onCreated={handleCreated}
        team={team}
      />
      <DetailDrawer opp={selectedOpp} onClose={() => setSelectedOpp(null)} />
    </div>
  );
}
  Object.assign(__export, { OppBoard });
})();

(function () {
  const { useState } = React;
  const { Checkbox, Tag, message } = antd;
  const { Icon, useApp, todos, ownerMap, actionTypes } = __export;
function MyTodo() {
  const { team } = useApp();
  const [done, setDone] = useState({});

  const list = todos.filter((t) => ownerMap[t.owner] && ownerMap[t.owner].team === team);
  const pending = list.filter((t) => !done[t.id]);
  const completed = list.filter((t) => done[t.id]);

  const handleCheck = (todo, checked) => {
    setDone((prev) => ({ ...prev, [todo.id]: checked }));
    if (checked) {
      message.success(`已完成「${todo.customer} · ${todo.label}」跟进任务`);
    }
  };

  return (
    <div className="todo">
      <div className="todo__summary">
        <div className="todo__summary-item">
          <span className="todo__summary-num todo__summary-num--pending">{pending.length}</span>
          <span className="todo__summary-label">待跟进</span>
        </div>
        <span className="todo__summary-sep" />
        <div className="todo__summary-item">
          <span className="todo__summary-num todo__summary-num--done">{completed.length}</span>
          <span className="todo__summary-label">已完成</span>
        </div>
        <div className="todo__summary-date">
          <Icon name="calendar-check" size="0.875rem" color="var(--on-surface-variant)" />
          今日 · 2026-10-21
        </div>
      </div>

      <div className="todo__list">
        {pending.length > 0 && (
          <div className="todo__group">
            <div className="todo__group-label">待跟进 · {pending.length}</div>
            {pending.map((t) => (
              <TodoRow key={t.id} todo={t} checked={!!done[t.id]} onCheck={handleCheck} />
            ))}
          </div>
        )}
        {completed.length > 0 && (
          <div className="todo__group">
            <div className="todo__group-label todo__group-label--done">已完成 · {completed.length}</div>
            {completed.map((t) => (
              <TodoRow key={t.id} todo={t} checked={!!done[t.id]} onCheck={handleCheck} />
            ))}
          </div>
        )}
        {pending.length === 0 && completed.length === 0 && (
          <div className="todo__empty">暂无今日跟进任务</div>
        )}
      </div>
    </div>
  );
}

function TodoRow({ todo, checked, onCheck }) {
  const owner = ownerMap[todo.owner];
  const action = actionTypes[todo.action] || { label: todo.label, color: "#2070F3" };
  return (
    <div className={`todo__row ${checked ? "is-done" : ""}`}>
      <Checkbox checked={checked} onChange={(e) => onCheck(todo, e.target.checked)}>
        <span className="todo__customer">{todo.customer}</span>
      </Checkbox>
      <div className="todo__row-right">
        <Tag color={action.color} bordered={false} className="todo__action-tag">{todo.label}</Tag>
        <span className="todo__time">
          <Icon name="clock" size="0.75rem" color="var(--on-surface-variant)" />
          {todo.plannedAt}
        </span>
        {owner && <span className="todo__owner" title={owner.name} style={{ color: owner.color }}>{owner.name}</span>}
      </div>
      <div className="todo__note">{todo.note}</div>
    </div>
  );
}
  Object.assign(__export, { MyTodo });
})();

(function () {
  const { Table, Progress, Tag } = antd;
  const { Icon, useApp, filterDeals, filterSalespeople, teamRows, timeRangeMap, fmtMoney } = __export;
  const OwnerAvatar = __export.OwnerAvatar;
const rankChangeMap = {
  up:    { icon: "trending-up",   color: "var(--success)" },
  down:  { icon: "trending-down", color: "var(--error)" },
  flat:  { icon: "minus",         color: "var(--on-surface-variant)" },
};

function rankState(change) {
  if (change > 0) return { ...rankChangeMap.up, label: `↑${change}` };
  if (change < 0) return { ...rankChangeMap.down, label: `↓${-change}` };
  return { ...rankChangeMap.flat, label: "持平" };
}

function TeamTable() {
  const { team, productLine, dept, timeRange } = useApp();
  const salesFiltered = filterSalespeople({ team, dept });
  const deals = filterDeals({ team, productLine, dept, timeRange });
  const rows = teamRows(salesFiltered, deals);

  const columns = [
    {
      title: "排名",
      dataIndex: "rank",
      key: "rank",
      width: 64,
      align: "center",
      render: (v) => <span className="tt__rank-num">#{v}</span>,
    },
    {
      title: "销售",
      dataIndex: "name",
      key: "name",
      width: 200,
      render: (_, r) => (
        <div className="tt__person">
          <OwnerAvatar person={r} size="2rem" />
          <div className="tt__person-info">
            <span className="tt__person-name">{r.name}</span>
            <Tag bordered={false} className="tt__dept-tag">{r.deptName}</Tag>
          </div>
        </div>
      ),
    },
    {
      title: "签约额",
      dataIndex: "signed",
      key: "signed",
      align: "right",
      width: 130,
      sorter: (a, b) => a.signed - b.signed,
      render: (v) => <span className="tt__signed">{fmtMoney(v)}</span>,
    },
    {
      title: "单数",
      dataIndex: "dealCount",
      key: "dealCount",
      align: "right",
      width: 80,
      sorter: (a, b) => a.dealCount - b.dealCount,
      render: (v) => <span>{v} 单</span>,
    },
    {
      title: "平均成交周期",
      dataIndex: "avgCycle",
      key: "avgCycle",
      align: "right",
      width: 120,
      sorter: (a, b) => a.avgCycle - b.avgCycle,
      render: (v) => <span>{v} 天</span>,
    },
    {
      title: "目标达成",
      dataIndex: "rate",
      key: "rate",
      width: 200,
      sorter: (a, b) => a.rate - b.rate,
      render: (rate, r) => {
        const low = rate < 50;
        const over = rate >= 100;
        return (
          <div className="tt__prog">
            <Progress
              percent={Math.min(rate, 100)}
              size="small"
              status={over ? "success" : low ? "exception" : "active"}
              strokeColor={low ? "var(--error)" : over ? "var(--success)" : undefined}
              format={() => ""}
            />
            <span className={`tt__prog-rate ${low ? "is-warn" : ""} ${over ? "is-over" : ""}`}>
              {rate.toFixed(0)}%
              <span className="tt__prog-target">/ {fmtMoney(r.target)}</span>
            </span>
          </div>
        );
      },
    },
    {
      title: "环比变动",
      dataIndex: "rankChange",
      key: "rankChange",
      align: "center",
      width: 110,
      render: (change) => {
        const s = rankState(change);
        return (
          <span className="tt__change" style={{ color: s.color }}>
            <Icon name={s.icon} size="0.875rem" />
            {s.label}
          </span>
        );
      },
    },
  ];

  return (
    <div className="tt">
      <div className="tt__meta">
        <span className="tt__range">{timeRangeMap[timeRange]} · 团队业绩</span>
        <span className="tt__hint">
          <Icon name="info" size="0.75rem" color="var(--on-surface-variant)" />
          达成率低于 50% 显示警示色
        </span>
      </div>
      <div className="tt__table-wrap">
        <Table
          rowKey="id"
          columns={columns}
          dataSource={rows}
          size="middle"
          pagination={false}
          sortDirections={["ascend", "descend", "ascend"]}
          showSorterTooltip={false}
          className="tt__antd"
        />
      </div>
    </div>
  );
}
  Object.assign(__export, { TeamTable });
})();

  Object.assign(__export, { SectionCard });

// App entry — 销售作战室 (B2B Pipeline War Room)
// 分层: context(全局态) → mock(数据) → components(复用) → views(分区) → app(布局)













// 幂等挂载守卫:预览宿主会对页面做预渲染+预编译注入,可能把含 createRoot 的应用
// 代码重复写入多份。React 18 对同一 #root 多次 createRoot 会破坏事件代理 → 点击失效。
// 此守卫拦截 ReactDOM.createRoot,保证全局仅首次对 #root 真正挂载,后续重复调用
// 降级为空操作 root,从而无论注入几份都能单次挂载、交互正常。
(function () {
  if (typeof window === "undefined" || window.__odMountGuard) return;
  window.__odMountGuard = true;
  if (typeof ReactDOM === "undefined" || typeof ReactDOM.createRoot !== "function") return;
  var rawCreateRoot = ReactDOM.createRoot;
  ReactDOM.createRoot = function (container) {
    if (container && container.nodeType === 1 && container.id === "root") {
      if (window.__odAppMounted) {
        return { render: function () {}, unmount: function () {}, update: function () {} };
      }
      window.__odAppMounted = true;
    }
    return rawCreateRoot.call(ReactDOM, container);
  };
})();
