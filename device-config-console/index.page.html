  ========================================================================== */

  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --content-placeholder: var(--color-text-placeholder);
  --content-disabled: var(--color-text-disabled);
  --content-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── outlineWidth / outlineOffset ── */
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Button 组件样式（token 映射） */
.ant-btn {
  font-size: var(--font-size-md);
  border-radius: var(--radius-base);
  font-weight: var(--font-weight-normal);
  min-width: calc(var(--spacing-4) * 5.5);
  box-shadow: none;
  gap: 4px;
}
.ant-btn.ant-btn-color-default {
  color: var(--color-text-primary);
}
.ant-btn.ant-btn-color-default:not(:disabled):hover {
  color: var(--color-text-primary);
  border-color: var(--gray-90);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:not(:disabled):active {
  color: var(--color-text-primary);
  border-color: var(--border-primary);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:disabled {
  color: var(--color-text-disabled);
  background-color: var(--gray-10);
}
.ant-btn.ant-btn-color-primary {
  color: var(--gray-0);
  background-color: var(--color-brand);
}
.ant-btn.ant-btn-color-primary:not(:disabled):hover {
  color: var(--gray-0);
  background-color: var(--brand-40);
}
.ant-btn.ant-btn-color-primary:not(:disabled):active {
  color: var(--gray-0);
  background-color: var(--brand-60);
}
.ant-btn.ant-btn-color-primary:disabled {
  color: var(--gray-0);
  background-color: var(--brand-20);
  border-color: var(--brand-20);
}
.ant-btn.ant-btn-dangerous {
  color: var(--gray-0);
  background-color: var(--red-50);
}
.ant-btn.ant-btn-dangerous:not(:disabled):hover {
  color: var(--gray-0);
  background-color: var(--red-40);
}
.ant-btn.ant-btn-dangerous:not(:disabled):active {
  color: var(--gray-0);
  background-color: var(--red-60);
}
.ant-btn.ant-btn-dangerous:disabled {
  color: var(--gray-0);
  background-color: var(--red-10);
  border-color: var(--red-10);
}
.ant-btn.ant-btn-sm {
  height: 28px;
}
.ant-btn.ant-btn-lg {
  height: 36px;
  padding: var(--spacing-0) var(--spacing-5);
  min-width: 96px;
  font-size: var(--font-size-md);
}
.ant-btn.ant-btn-icon-only {
  width: 32px !important;
  height: 32px !important;
  min-width: auto !important;
  border: none !important;
  background-color: transparent !important;
  padding: var(--spacing-0);
}
.ant-btn.ant-btn-icon-only .anticon {
  font-size: var(--font-size-2xl);
}
.ant-btn.ant-btn-icon-only.ant-btn-sm {
  width: 24px !important;
  height: 24px !important;
}
.ant-btn.ant-btn-icon-only.ant-btn-sm .anticon {
  font-size: var(--font-size-md);
}
.ant-btn.ant-btn-icon-only:hover,
.ant-btn.ant-btn-icon-only:focus {
  background-color: transparent !important;
}
.ant-btn.ant-btn-icon-only.ant-btn-color-default:hover {
  color: var(--brand-40);
}
.ant-btn.ant-btn-icon-only.ant-btn-color-default:active {
  color: var(--brand-50);
}
.ant-btn.ant-btn-variant-link {
  min-width: unset;
  line-height: 22px;
  padding: var(--spacing-0);
  border: none;
  background-color: transparent;
  color: var(--color-brand);
}
.ant-btn.ant-btn-variant-link:not(:disabled):hover {
  color: var(--brand-40);
}
.ant-btn.ant-btn-variant-link:not(:disabled):active {
  color: var(--brand-60);
}
.dark .ant-btn.ant-btn-color-default {
  border-color: var(--gray-50);
  background-color: rgb(from var(--gray-100) r g b / 0);
}
.dark .ant-btn.ant-btn-color-default:not(:disabled):hover {
  background-color: rgb(from var(--gray-100) r g b / 0);
  border-color: var(--gray-05);
}
.dark .ant-btn.ant-btn-color-default:not(:disabled):active {
  color: var(--color-text-primary);
  border-color: var(--brand-40);
  background-color: rgb(from var(--gray-100) r g b / 0);
}
.dark .ant-btn.ant-btn-color-default:disabled {
  background-color: rgb(from var(--gray-05) r g b / 0.2);
  border-color: var(--gray-60);
}
.dark .ant-btn.ant-btn-color-primary:not(:disabled):hover {
  background-color: var(--brand-40);
}
.dark .ant-btn.ant-btn-color-primary:not(:disabled):active {
  background-color: var(--brand-60);
}
.dark .ant-btn.ant-btn-color-primary:disabled {
  color: rgb(from var(--gray-05) r g b / 0.3);
  background-color: var(--brand-70);
  border-color: var(--brand-70);
}
.dark .ant-btn.ant-btn-color-dangerous {
  background-color: var(--red-40);
}
.dark .ant-btn.ant-btn-color-dangerous:not(:disabled):hover {
  background-color: var(--red-30);
}
.dark .ant-btn.ant-btn-color-dangerous:not(:disabled):active {
  background-color: var(--red-50);
}
.dark .ant-btn.ant-btn-color-dangerous:disabled {
  color: var(--gray-0);
  background-color: var(--red-80);
  border-color: var(--red-80);
}
.dark .ant-btn.ant-btn-variant-link {
  color: var(--brand-30);
}
.dark .ant-btn.ant-btn-variant-link:not(:disabled):hover {
  color: var(--brand-20);
}
.dark .ant-btn.ant-btn-variant-link:not(:disabled):active {
  color: var(--brand-40);
}
.dark .ant-btn.ant-btn-icon-only {
  color: var(--gray-10);
}
.dark .ant-btn.ant-btn-icon-only:hover .anticon {
  color: var(--brand-20);
}
.dark .ant-btn.ant-btn-icon-only:active .anticon {
  color: var(--brand-40);
}

/* Checkbox 组件样式（token 映射，转换自根目录 checkbox.css） */
.ant-checkbox-wrapper {
  color: var(--color-text-primary);
  font-size: var(--font-size-md);
}
.ant-checkbox-wrapper:not(.ant-checkbox-wrapper-checked):hover .ant-checkbox {
  border-color: var(--brand-40);
}
.ant-checkbox-wrapper:not(.ant-checkbox-wrapper-checked) .ant-checkbox-disabled.ant-checkbox {
  background-color: rgb(from var(--gray-100) r g b / 0.05);
  border-color: var(--gray-20);
}
.ant-checkbox-wrapper:not(.ant-checkbox-wrapper-checked) .ant-checkbox {
  border-color: var(--gray-40);
  background-color: var(--gray-0);
}
.ant-checkbox-wrapper.ant-checkbox-wrapper-checked:hover .ant-checkbox {
  background-color: var(--brand-40);
}
.ant-checkbox-wrapper.ant-checkbox-wrapper-checked .ant-checkbox {
  background-color: var(--brand-50);
  border-color: none;
}
.dark .ant-checkbox-wrapper:not(.ant-checkbox-wrapper-checked) .ant-checkbox {
  border-color: var(--gray-50);
  background-color: var(--gray-100);
}

/* Tag 组件样式（占位，待填充 token 映射） */
.ant-tag {
  border-color: transparent;
  padding: 0 8px;
  line-height: 24px;
  background-color: var(--color-tag-bg-none);
  color: var(--color-text-primary);
}
.ant-tag.ant-tag-processing {
  border-color: transparent;
  background-color: var(--color-tag-bg-info);
  color: var(--color-tag-text-info);
}
.ant-tag.ant-tag-error {
  border-color: transparent;
  background-color: var(--color-tag-bg-error);
  color: var(--color-tag-text-error);
}
.ant-tag.ant-tag-warning {
  border-color: transparent;
  background-color: var(--color-tag-bg-warning);
  color: var(--color-tag-text-warning);
}
.ant-tag.ant-tag-gold {
  border-color: transparent;
  background-color: var(--color-tag-bg-alert);
  color: var(--color-tag-text-alert);
}
.ant-tag.ant-tag-success {
  border-color: transparent;
  background-color: var(--color-tag-bg-success);
  color: var(--color-tag-text-success);
}
.ant-tag.ant-tag-green {
  border-color: transparent;
  background-color: var(--color-tag-bg-green);
  color: var(--color-tag-text-green);
}
.ant-tag.ant-tag-has-color {
  border-color: transparent;
  background-color: var(--color-tag-bg-rose);
  color: var(--color-tag-text-rose);
}
.ant-tag.ant-tag-pink {
  border-color: transparent;
  background-color: var(--color-tag-bg-pink);
  color: var(--color-tag-text-pink);
}
.ant-tag.ant-tag-purple {
  border-color: transparent;
  background-color: var(--color-tag-bg-purple);
  color: var(--color-tag-text-purple);
}
.ant-tag.ant-tag-geekblue {
  border-color: transparent;
  background-color: var(--color-tag-bg-indigo);
  color: var(--color-tag-text-indigo);
}
.ant-tag.ant-tag-cyan {
  border-color: transparent;
  background-color: var(--color-tag-bg-cyan);
  color: var(--color-tag-text-cyan);
}
.ant-tag.ant-tag-disabled {
  background-color: var(--color-tag-bg-none);
  color: var(--color-tag-text-none);
}
.ant-tag.ant-tag-disabled .anticon {
  color: var(--color-tag-text-none);
}
.ant-tag > .anticon + span,
.ant-tag > span + .anticon {
  margin-left: 4px;
}
.ant-tag .anticon {
  color: var(--color-text-primary);
}

/* ============================================================================
   antd token 对齐层
   antd 5 组件在运行时注入样式(优先级高于本文件),且其默认品牌色/亮色底纹不随
   四层 token 翻转。本层用 !important 做确定性覆盖,使 antd 组件的颜色、底色与
   暗色模式全部跟随 token(ant.css 重置层仅覆盖 Button/Checkbox/Tag)。
   ========================================================================== */

/* ---------- Switch ---------- */
.ant-switch {
  background: var(--content-placeholder) !important;
}
.ant-switch.ant-switch-checked {
  background: var(--primary) !important;
}
.ant-switch.ant-switch-checked:hover {
  background: var(--primary-hover) !important;
}

/* ---------- Menu ---------- */
.ant-menu-light.ant-menu-inline,
.ant-menu-light.ant-menu-vertical {
  background: transparent !important;
  border-inline-end: none !important;
}
.ant-menu-light .ant-menu-item,
.ant-menu-light .ant-menu-submenu-title {
  color: var(--on-surface) !important;
  border-radius: var(--radius-base) !important;
}
.ant-menu-light .ant-menu-item:hover,
.ant-menu-light .ant-menu-submenu-title:hover {
  background: var(--surface-variant) !important;
  color: var(--on-surface) !important;
}
.ant-menu-light .ant-menu-item-selected {
  background: var(--primary-container) !important;
  color: var(--primary) !important;
  font-weight: var(--font-weight-medium) !important;
}
.ant-menu-light .ant-menu-item-selected .ant-menu-item-icon,
.ant-menu-light .ant-menu-item-selected .anticon {
  color: var(--primary) !important;
}
.ant-menu-light .ant-menu-submenu-selected > .ant-menu-submenu-title {
  color: var(--primary) !important;
}
.ant-menu-light .ant-menu-sub .ant-menu-item {
  color: var(--on-surface-variant) !important;
}
.ant-menu-light .ant-menu-sub .ant-menu-item-selected {
  color: var(--primary) !important;
}
.ant-menu-light.ant-menu-horizontal {
  background: transparent !important;
  border-bottom: none !important;
}
.ant-menu-horizontal .ant-menu-item {
  color: var(--on-surface-variant) !important;
}
.ant-menu-horizontal .ant-menu-item:hover {
  color: var(--on-surface) !important;
}
.ant-menu-horizontal .ant-menu-item-selected {
  color: var(--primary) !important;
  font-weight: var(--font-weight-medium) !important;
}
.ant-menu-horizontal .ant-menu-item::after {
  border-bottom-color: transparent !important;
}
.ant-menu-horizontal .ant-menu-item-selected::after {
  border-bottom-color: var(--primary) !important;
}

/* ---------- Form ---------- */
.ant-form-item .ant-form-item-label > label {
  color: var(--on-surface) !important;
  font: var(--font-body-m) !important;
  font-weight: var(--font-weight-medium) !important;
  height: auto !important;
}
.ant-form-item .ant-form-item-label > label.ant-form-item-required::before {
  color: var(--error) !important;
}
.ant-form-item .ant-form-item-explain-error {
  color: var(--error) !important;
  font: var(--font-body-s) !important;
}
.ant-form-item .ant-form-item-extra {
  color: var(--on-surface-variant) !important;
  font: var(--font-caption-m) !important;
}

/* ---------- Input / InputNumber / Select 触发器 ---------- */
.ant-input,
.ant-input-affix-wrapper,
.ant-input-number,
.ant-select .ant-select-selector,
.ant-picker {
  background: var(--surface-container-highest) !important;
  border-color: var(--outline) !important;
  color: var(--on-surface) !important;
}
.ant-input::placeholder,
.ant-input-number-input::placeholder,
.ant-select .ant-select-selection-placeholder {
  color: var(--content-placeholder) !important;
}
.ant-input:hover,
.ant-input-affix-wrapper:hover,
.ant-input-number:hover,
.ant-select:not(.ant-select-disabled):hover .ant-select-selector {
  border-color: var(--primary) !important;
}
.ant-input:focus,
.ant-input-focused,
.ant-input-affix-wrapper-focused,
.ant-input-number-focused,
.ant-select-focused .ant-select-selector {
  border-color: var(--selected) !important;
  box-shadow: 0 0 0 2px var(--primary-container) !important;
}
.ant-input-number .ant-input-number-input,
.ant-select .ant-select-selection-item {
  color: var(--on-surface) !important;
}
.ant-select .ant-select-arrow,
.ant-select .ant-select-clear,
.ant-input-affix-wrapper .anticon,
.ant-input-number .ant-input-number-handler .anticon {
  color: var(--on-surface-variant) !important;
}
.ant-form-item-has-error .ant-input,
.ant-form-item-has-error .ant-input-affix-wrapper,
.ant-form-item-has-error .ant-input-number,
.ant-form-item-has-error .ant-select .ant-select-selector {
  border-color: var(--error) !important;
}
.ant-form-item-has-error .ant-input:focus,
.ant-form-item-has-error .ant-input-affix-wrapper-focused,
.ant-form-item-has-error .ant-input-number-focused,
.ant-form-item-has-error .ant-select-focused .ant-select-selector {
  border-color: var(--error) !important;
  box-shadow: 0 0 0 2px var(--error-container) !important;
}

/* ---------- Radio.Group(solid 按钮组) ---------- */
.ant-radio-button-wrapper {
  background: var(--surface-container-highest) !important;
  border-color: var(--outline) !important;
  color: var(--on-surface-variant) !important;
}
.ant-radio-button-wrapper:not(:first-child)::before {
  background: var(--outline) !important;
}
.ant-radio-button-wrapper-checked {
  background: var(--primary) !important;
  border-color: var(--primary) !important;
  color: var(--on-primary) !important;
  box-shadow: none !important;
}
.ant-radio-button-wrapper-checked::before {
  background: var(--primary) !important;
}

/* ---------- Checkbox ---------- */
.ant-checkbox .ant-checkbox-inner {
  background: var(--surface-container-highest) !important;
  border-color: var(--outline) !important;
}
.ant-checkbox-checked .ant-checkbox-inner,
.ant-checkbox-indeterminate .ant-checkbox-inner::after {
  background: var(--primary) !important;
  border-color: var(--primary) !important;
}

/* ---------- Table ---------- */
.ant-table-wrapper .ant-table {
  background: transparent !important;
  color: var(--on-surface) !important;
}
.ant-table-wrapper .ant-table-thead > tr > th {
  background: var(--surface-variant) !important;
  color: var(--on-surface-variant) !important;
  border-bottom: 1px solid var(--divider) !important;
  font: var(--font-body-m) !important;
  font-weight: var(--font-weight-medium) !important;
}
.ant-table-wrapper .ant-table-thead > tr > th::before {
  display: none !important;
}
.ant-table-wrapper .ant-table-tbody > tr > td {
  border-bottom: 1px solid var(--divider) !important;
  color: var(--on-surface) !important;
  font: var(--font-body-m) !important;
}
.ant-table-wrapper .ant-table-tbody > tr.ant-table-row:hover > td,
.ant-table-wrapper .ant-table-tbody > tr > td.ant-table-cell-row-hover {
  background: var(--surface-variant) !important;
}
.ant-table-wrapper .ant-table-tbody > tr.ant-table-row-selected > td {
  background: var(--primary-container) !important;
}
.ant-table-wrapper .ant-table-placeholder:hover > td {
  background: transparent !important;
}
.ant-table-wrapper .ant-table-column-sorter {
  color: var(--on-surface-variant) !important;
}
.ant-table-wrapper .ant-table-pagination {
  color: var(--on-surface-variant) !important;
}
.ant-empty .ant-empty-description {
  color: var(--on-surface-variant) !important;
}
.dark .ant-empty .ant-empty-image {
  opacity: 0.45;
}

/* ---------- Pagination ---------- */
.ant-pagination .ant-pagination-total-text,
.ant-pagination .ant-pagination-options-quick-jumper {
  color: var(--on-surface-variant) !important;
}
.ant-pagination .ant-pagination-item {
  background: transparent !important;
  border-color: transparent !important;
}
.ant-pagination .ant-pagination-item a {
  color: var(--on-surface) !important;
}
.ant-pagination .ant-pagination-item-active {
  background: var(--primary-container) !important;
  border-color: var(--primary) !important;
}
.ant-pagination .ant-pagination-item-active a {
  color: var(--primary) !important;
}
.ant-pagination .ant-pagination-prev .ant-pagination-item-link,
.ant-pagination .ant-pagination-next .ant-pagination-item-link {
  background: transparent !important;
  border-color: var(--outline) !important;
  color: var(--on-surface) !important;
}
.ant-pagination .ant-pagination-disabled .ant-pagination-item-link {
  color: var(--content-disabled) !important;
}

/* ---------- 浮层:Select 下拉 / Dropdown ---------- */
.ant-select-dropdown,
.ant-dropdown .ant-dropdown-menu {
  background: var(--surface-container-high) !important;
  box-shadow: var(--shadow-popover) !important;
  border-radius: var(--radius-overlay) !important;
}
.ant-select-dropdown .ant-select-item {
  color: var(--on-surface) !important;
  border-radius: var(--radius-base) !important;
}
.ant-select-dropdown .ant-select-item-option-active:not(.ant-select-item-option-disabled) {
  background: var(--surface-variant) !important;
}
.ant-select-dropdown .ant-select-item-option-selected:not(.ant-select-item-option-disabled) {
  background: var(--primary-container) !important;
  color: var(--primary) !important;
  font-weight: var(--font-weight-medium) !important;
}
.ant-dropdown .ant-dropdown-menu-item {
  color: var(--on-surface) !important;
  border-radius: var(--radius-base) !important;
}
.ant-dropdown .ant-dropdown-menu-item:hover {
  background: var(--surface-variant) !important;
}
.ant-dropdown .ant-dropdown-menu-item-selected {
  background: var(--primary-container) !important;
  color: var(--primary) !important;
}
.ant-dropdown .ant-dropdown-menu-item-danger {
  color: var(--error) !important;
}
.ant-dropdown .ant-dropdown-menu-item-divider {
  background: var(--divider) !important;
}

/* ---------- Tooltip ---------- */
.ant-tooltip .ant-tooltip-inner {
  background: var(--inverse-surface) !important;
  color: var(--inverse-on-surface) !important;
  border-radius: var(--radius-base) !important;
  font: var(--font-body-s) !important;
  box-shadow: none !important;
}
.ant-tooltip .ant-tooltip-arrow::before,
.ant-tooltip .ant-tooltip-arrow::after {
  background: var(--inverse-surface) !important;
}
.dark .ant-tooltip .ant-tooltip-inner {
  background: var(--surface-container-high) !important;
  color: var(--on-surface) !important;
  box-shadow: var(--shadow-popover) !important;
}
.dark .ant-tooltip .ant-tooltip-arrow::before,
.dark .ant-tooltip .ant-tooltip-arrow::after {
  background: var(--surface-container-high) !important;
}

/* ---------- Modal ---------- */
.ant-modal .ant-modal-content {
  background: var(--surface-container-highest) !important;
  border-radius: var(--radius-overlay) !important;
  box-shadow: var(--shadow-modal) !important;
  color: var(--on-surface) !important;
  padding: var(--spacing-inset) !important;
}
.ant-modal .ant-modal-header {
  background: transparent !important;
  margin-bottom: var(--spacing-gutter) !important;
}
.ant-modal .ant-modal-title {
  color: var(--on-surface) !important;
  font: var(--font-headline-m) !important;
  font-weight: var(--font-weight-semibold) !important;
}
.ant-modal .ant-modal-close {
  background: transparent !important;
  color: var(--on-surface-variant) !important;
  border-radius: var(--radius-base) !important;
}
.ant-modal .ant-modal-close:hover {
  background: var(--surface-variant) !important;
  color: var(--on-surface) !important;
}
.ant-modal .ant-modal-footer {
  margin-top: var(--spacing-inset) !important;
  padding-top: var(--spacing-gutter) !important;
  border-top: 1px solid var(--divider) !important;
}

/* ---------- 全局提示 Message ---------- */
.ant-message .ant-message-notice-content {
  background: var(--surface-container-highest) !important;
  color: var(--on-surface) !important;
  box-shadow: var(--shadow-popover) !important;
  border-radius: var(--radius-base) !important;
  font: var(--font-body-m) !important;
}
.ant-message .anticon {
  color: var(--success) !important;
}

/* ---------- Breadcrumb / Badge ---------- */
.ant-breadcrumb,
.ant-breadcrumb .ant-breadcrumb-link,
.ant-breadcrumb .ant-breadcrumb-link a {
  color: var(--on-surface-variant) !important;
  font: var(--font-body-s) !important;
}
.ant-breadcrumb .ant-breadcrumb-separator {
  color: var(--content-placeholder) !important;
}
.ant-breadcrumb li:last-child .ant-breadcrumb-link {
  color: var(--on-surface) !important;
}
.ant-badge .ant-badge-count {
  background: var(--error) !important;
  box-shadow: 0 0 0 1px var(--surface-container-highest) !important;
  font: var(--font-caption-s) !important;
}


/* Layer 5: 应用级布局骨架 — 固定外壳(顶部导航 + 侧边导航 + 内部滚动内容区) */
.app-shell.ant-layout {
  height: 100vh;
  overflow: hidden;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.app-body.ant-layout {
  height: calc(100vh - 48px);
  background: var(--surface-container-lowest);
}

.app-content.ant-layout-content {
  min-width: 0;
  padding: var(--spacing-page);
  overflow-y: auto;
  background: var(--surface-container-lowest);
}

.app-content.ant-layout-content::-webkit-scrollbar,
.app-sider-menu.ant-menu::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

.app-content.ant-layout-content::-webkit-scrollbar-track,
.app-sider-menu.ant-menu::-webkit-scrollbar-track {
  background: transparent;
}

.app-content.ant-layout-content::-webkit-scrollbar-thumb,
.app-sider-menu.ant-menu::-webkit-scrollbar-thumb {
  border-radius: var(--radius-full);
  background: var(--color-scrollbar);
}

.app-content.ant-layout-content::-webkit-scrollbar-thumb:hover,
.app-sider-menu.ant-menu::-webkit-scrollbar-thumb:hover {
  background: var(--color-scrollbar-hover);
}


/* Layer 4: 顶部导航栏 — 高度 48px,仅承载全局导航与全局工具 */
.app-header.ant-layout-header {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  height: 48px;
  padding: 0 var(--spacing-gutter);
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--divider);
  color: var(--on-surface);
  line-height: normal;
  flex: none;
}

.header-left {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  flex: none;
}

.header-right {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  min-width: 0;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: var(--radius-md);
  background: var(--primary-fixed);
  color: var(--on-primary-fixed);
}

.brand-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

/* 一级导航:占据中间弹性空间,高度与 Header 对齐 */
.app-topnav.ant-menu-horizontal {
  flex: 1 1 auto;
  min-width: 0;
  height: 48px;
  line-height: 47px;
  border-bottom: none;
  background: transparent;
}

.app-topnav.ant-menu-horizontal .ant-menu-item,
.app-topnav.ant-menu-horizontal .ant-menu-submenu {
  line-height: 47px;
}

.header-btn.ant-btn {
  padding: 0 var(--spacing-inline);
}

.header-btn-inner {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.header-btn-text {
  font: var(--font-body-m);
  white-space: nowrap;
}

.header-divider {
  width: 1px;
  height: 20px;
  background: var(--divider);
  flex: none;
}

.header-user.ant-btn {
  height: 36px;
  padding: 0 var(--spacing-stack) 0 4px;
}

.header-user-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  line-height: 1.2;
}

.header-user-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.header-user-role {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

@media (max-width: 1279px) {
  .header-user-meta {
    display: none;
  }
  .header-btn-text {
    display: none;
  }
}


/* Layer 4: 侧边导航 */
.app-sider.ant-layout-sider {
  background: var(--surface-container-highest);
  border-right: 1px solid var(--divider);
  flex: none;
}

.app-sider .ant-layout-sider-children {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.app-sider-menu.ant-menu {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: var(--spacing-inline) var(--spacing-inline) 0;
  font: var(--font-body-m);
}

.app-sider-menu.ant-menu-inline .ant-menu-item,
.app-sider-menu.ant-menu-inline .ant-menu-submenu-title {
  height: 36px;
  line-height: 36px;
  margin: 2px 0;
}

.app-sider-menu.ant-menu-inline-collapsed {
  padding-inline: var(--spacing-inline);
}

.app-sider-foot {
  display: flex;
  align-items: center;
  gap: var(--spacing-stack);
  flex: none;
  padding: var(--spacing-stack) var(--spacing-gutter);
  border-top: 1px solid var(--divider);
}

.foot-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: var(--radius-full);
  background: var(--success);
}

.foot-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.foot-title {
  font: var(--font-body-s);
  color: var(--on-surface);
  white-space: nowrap;
}

.foot-meta {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.app-sider.ant-layout-sider-collapsed .foot-text {
  display: none;
}

.app-sider.ant-layout-sider-collapsed .app-sider-foot {
  justify-content: center;
  padding-inline: 0;
}


/* Layer 4: 设备配置页主体 */
.page {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
  max-width: 1600px;
}

.page-head {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-stack);
}

.page-head-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
}

.page-head-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.page-title {
  margin: 0;
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.page-desc {
  margin: 0;
  max-width: 640px;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.page-actions {
  flex: none;
}


/* Layer 4: 采集策略表单区 */
.full-width {
  width: 100%;
}

.bound-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 var(--spacing-inline);
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--on-primary-container);
  font: var(--font-caption-m);
  font-weight: var(--font-weight-medium);
  white-space: nowrap;
}

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);
  const [lang, setLang] = useState("zh");

  useEffect(() => {

  useEffect(() => {
    document.documentElement.setAttribute("lang", lang === "zh" ? "zh-CN" : "en");

    isDark,
    toggleDark: () => setIsDark((d) => !d),
    lang,
    setLang,
    collapsed,
    toggleCollapsed: () => setCollapsed((c) => !c),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url }
const svgCache = new Map(); // "name&variant&color" -> svg text

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (cached in iconInfoMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  try {
    const resp = await fetch(
      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length
    );
    const selected = selectBestIcon(entry?.icons || [], name);
    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };
    return iconInfoMap[name];
  } catch (e) {
    return null;
  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

function Icon({
  name,
  src,
  size = 16,
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
}) {
  const [plus, setPlus] = useState(plusState); // reuse already-probed result
  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${color}`) || ""
  );

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${color}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, color).then((s) => {
        if (!alive) return;
        svgCache.set(key, s);
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, color]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      width: size,
      height: size,
      className: className,
      alt: "",
      "aria-hidden": true,
      style: { ...style, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        style: { ...style, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      className,
      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });
  }
  
  return React.createElement("span", {
    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

(function () {

// Layer 4: 设备配置清单 — 工具栏(搜索/筛选/刷新) + 复选表格 + 行内操作
function DeviceTable({ onEdit }) {
  const intl = useIntl();

  const t = (id, fallback, values) =>
    intl.formatMessage({ id: id, defaultMessage: fallback }, values);
  const label = (id, fallback) => <FormattedMessage id={id} defaultMessage={fallback} />;

  const stats = useMemo(() => summarize(rows), [rows]);

  const data = useMemo(() => {
    const kw = keyword.trim().toLowerCase();
    return rows.filter((row) => {
      if (statusFilter !== "all" && row.status !== statusFilter) return false;
      if (!kw) return true;
      return (
        row.name.toLowerCase().includes(kw) ||
        row.code.toLowerCase().includes(kw) ||
        t(row.policy, row.policy).toLowerCase().includes(kw)
      );
    });
  }, [rows, keyword, statusFilter, intl]);

  const statusOptions = [{ value: "all", label: t("table.filter.status", "全部状态") }].concat(

    setLoading(true);
    window.setTimeout(() => {
      setLoading(false);
      message.success(t("table.refreshed", "列表已刷新"));
    }, 600);
  };

  const disableRows = (codes) => {
    if (!codes.length) return;
    setRows((prev) =>
      prev.map((row) => (codes.indexOf(row.code) >= 0 ? { ...row, status: "disabled" } : row))
    );
    setSelectedKeys([]);
    message.success(t("table.disabled.toast", "设备已停用"));
  };

  const rowMenu = (record) => ({
    items: [
      {
        key: "copy",
        icon: <Icon name="copy" size={14} />,
        label: label("table.action.copy", "复制配置"),
      },
      { type: "divider" },
      {
        key: "disable",
        danger: true,
        icon: <Icon name="power" size={14} />,
        label: label("table.action.disable", "停用设备"),
      },
    ],
    onClick: ({ key }) => {
      if (key === "copy") {
        message.success(t("table.copied", "配置已复制"));
      } else if (key === "disable") {
        disableRows([record.code]);
      }
    },
  });

  const columns = [
    {

      dataIndex: "name",
      key: "name",

        <div className="device-cell">
          <span className="device-icon">
            <Icon name={TYPE_ICON[record.type]} size={14} />
          </span>
          <span className="cell-strong">{value}</span>
        </div>
      ),
    },
    {
      title: label("table.col.code", "设备编号"),
      dataIndex: "code",
      key: "code",
      render: (value) => <span className="cell-mono">{value}</span>,
    },
    {
      title: label("table.col.type", "设备类型"),
      dataIndex: "type",
      key: "type",
      render: (value) => t(value, value),
    },
    {
      title: label("table.col.site", "所属站点"),
      dataIndex: "site",
      key: "site",
      render: (value) => t(value, value),
    },
    {
      title: label("table.col.firmware", "固件版本"),
      dataIndex: "firmware",
      key: "firmware",
      render: (value) => <span className="cell-mono">{value}</span>,
    },
    {
      title: label("table.col.policy", "采集策略"),
      dataIndex: "policy",
      key: "policy",
      render: (value) => t(value, value),
    },
    {
      title: label("table.col.status", "状态"),
      dataIndex: "status",
      key: "status",
      render: (value) => <StatusTag status={value} />,
    },
    {
      title: label("table.col.lastReport", "最后上报"),
      dataIndex: "lastReport",
      key: "lastReport",
      render: (value) => <span className="cell-muted">{dayjs(value).format("MM-DD HH:mm")}</span>,
    },
    {
      title: label("table.col.actions", "操作"),
      key: "actions",
      align: "right",
      render: (_, record) => (
        <Space size={4}>
          <Button type="link" size="small" onClick={() => onEdit(record)}>
            {label("table.action.edit", "编辑")}
          </Button>
          <Dropdown menu={rowMenu(record)} trigger={["click"]} placement="bottomRight">
            <Button
              type="link"
              size="small"
              aria-label={t("table.action.more", "更多操作")}
              icon={<Icon name="ellipsis" size={14} />}
            />
          </Dropdown>
        </Space>
      ),
    },
  ];

  return (
    <SectionCard
      title={label("table.title", "设备配置清单")}
      subtitle={t("table.subtitle", "共 {total} 台设备，在线 {online} 台，告警 {alarm} 台", {
        total: stats.total,
        online: stats.online,
        alarm: stats.alarm,
      })}
    >
      <div className="table-toolbar">
        <Input
          className="table-search"
          allowClear
          value={keyword}
          onChange={(e) => setKeyword(e.target.value)}
          prefix={<Icon name="search" size={14} />}
          placeholder={t("table.search.placeholder", "搜索设备名称或编号")}
        />
        <Select
          className="table-filter"
          value={statusFilter}
          onChange={setStatusFilter}
          options={statusOptions}
        />
        <Button icon={<Icon name="refresh-cw" size={14} />} loading={loading} onClick={refresh}>
          {label("table.refresh", "刷新")}
        </Button>
      </div>

      {selectedKeys.length > 0 ? (
        <div className="selection-bar">
          <span className="selection-count">
            {t("table.selected", "已选择 {count} 项", { count: selectedKeys.length })}

          <Button
            size="small"
            icon={<Icon name="download" size={14} />}
            onClick={() => {
              message.success(t("table.exported", "已导出所选配置"));
              setSelectedKeys([]);
            }}
          >
            {label("table.bulkExport", "导出所选")}
          </Button>
          <Button
            size="small"
            danger
            icon={<Icon name="power" size={14} />}
            onClick={() => disableRows(selectedKeys)}
          >
            {label("table.bulkDisable", "批量停用")}
          </Button>
          <Button size="small" type="text" onClick={() => setSelectedKeys([])}>
            {label("table.clearSelection", "取消选择")}
          </Button>
        </div>
      ) : null}

      <Table
        rowKey="code"
        size="middle"
        className="device-table"
        columns={columns}
        dataSource={data}
        loading={loading}
        locale={{ emptyText: t("table.empty", "没有匹配的设备") }}
        rowSelection={{
          selectedRowKeys: selectedKeys,
          onChange: setSelectedKeys,
          columnWidth: 48,
        }}
        pagination={{
          pageSize: 8,
          pageSizeOptions: [8, 16, 32],
          showSizeChanger: true,
          showTotal: (total) => t("table.total", "共 {total} 条记录", { total: total }),
        }}
      />
    </SectionCard>
  );
}
  Object.assign(__export, { DeviceTable });
})();

(function () {

// Layer 4: 设备配置弹窗 — 新增 / 编辑设备并绑定采集策略(单一焦点,单列表单)
function ConfigModal({ open, record, onCancel }) {
  const intl = useIntl();
  const [form] = Form.useForm();
  const [enabled, setEnabled] = useState(true);
  const isEdit = Boolean(record);

  const t = (id, fallback, values) =>
    intl.formatMessage({ id: id, defaultMessage: fallback }, values);
  const label = (id, fallback) => <FormattedMessage id={id} defaultMessage={fallback} />;
  const toOptions = (list) =>
    list.map((item) => ({
      value: item.value,
      label: item.label || t(item.msgId, item.fallback),
    }));

  useEffect(() => {
    if (!open) return;
    if (record) {
      const nextEnabled = record.status !== "disabled";
      form.setFieldsValue({
        name: record.name,
        code: record.code,
        type: record.type,
        site: record.site,
        firmware: record.firmware,
        policy: record.policy,
        enabled: nextEnabled,
        remark: "",
      });
      setEnabled(nextEnabled);
    } else {
      form.resetFields();
      setEnabled(true);
    }

    form
      .validateFields()
      .then(() => {
        message.success(
          t(
            isEdit ? "modal.updated" : "modal.created",
            isEdit ? "设备配置已更新" : "设备配置已创建"
          )
        );
        onCancel();
      })
      .catch(() => {});

  const requiredRule = [{ required: true, message: t("modal.required", "此项为必填") }];

    <Modal
      className="config-modal"
      open={open}

      onOk={handleOk}
      onCancel={onCancel}
      okText={t("modal.ok", "确定")}

        <span className="modal-title">
          <Icon name={isEdit ? "square-pen" : "plus"} size={16} />
          {label(

        </span>
      }

      <Form form={form} layout="vertical" initialValues={deviceFormInitialValues}>
        <Form.Item name="name" label={label("modal.name", "设备名称")} rules={requiredRule}>
          <Input placeholder={t("modal.name.placeholder", "请输入设备名称")} />
        </Form.Item>
        <Form.Item name="code" label={label("modal.code", "设备编号")} rules={requiredRule}>
          <Input placeholder={t("modal.code.placeholder", "例如 GW-SH-0201")} />
        </Form.Item>
        <Form.Item name="type" label={label("modal.type", "设备类型")} rules={requiredRule}>
          <Select options={toOptions(deviceTypeOptions)} />
        </Form.Item>
        <Form.Item name="site" label={label("modal.site", "所属站点")} rules={requiredRule}>
          <Select options={toOptions(siteOptions)} showSearch optionFilterProp="label" />
        </Form.Item>
        <Form.Item name="firmware" label={label("modal.firmware", "固件版本")}>
          <Select options={firmwareOptions} />
        </Form.Item>
        <Form.Item name="policy" label={label("modal.policy", "采集策略模板")} rules={requiredRule}>
          <Select options={toOptions(policyTemplates)} />
        </Form.Item>

        <div className="modal-switch">
          <div className="modal-switch-text">
            <div className="modal-switch-title">{label("modal.enabled", "保存后立即启用")}</div>
            <div className="modal-switch-desc">
              {label("modal.enabled.desc", "启用后设备将按所选策略开始上报数据")}

          </div>
          <Form.Item name="enabled" valuePropName="checked" noStyle>

          </Form.Item>
        </div>

        <Form.Item name="remark" label={label("modal.remark", "备注")} className="modal-remark">
          <Input.TextArea
            rows={2}
            placeholder={t("modal.remark.placeholder", "可选，记录设备位置或负责人信息")}

//   Layer 5 布局骨架   → app.jsx          (本文件: 组装 Provider + antd Layout)
//
// 样式约定: antd 组件承载布局与交互;自定义样式写在 CSS 文件中,颜色/阴影/圆角
// 一律使用 token(var(--primary) / var(--shadow-card) / var(--radius-*))。
// 切语言三件套同步: IntlProvider(locale/messages) + ConfigProvider(locale) + dayjs.locale()。














// 页面标题 — 构建时写入产物 <title>
const APP_TITLE = "ICT 设备运维平台 · 设备配置";

function App() {
  return (
    <AppProvider>
      <AppShell />
    </AppProvider>
  );
}

function AppShell() {
  const { lang } = useApp();
  const isZh = lang === "zh";

  useEffect(() => {
    dayjs.locale(isZh ? "zh-cn" : "en");
  }, [isZh]);

  return (
    <IntlProvider locale={isZh ? "zh-CN" : "en"} messages={messages[lang]}>
      <ConfigProvider locale={isZh ? zhCN : antdEnUS}>
        <Layout className="app-shell">
          <HeaderBar />
          <Layout className="app-body" hasSider>
            <SideMenu />
            <Layout.Content className="app-content">
              <ConsolePage />
            </Layout.Content>
          </Layout>
        </Layout>
      </ConfigProvider>
    </IntlProvider>
  );
}
  Object.assign(__export, { App, APP_TITLE });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
