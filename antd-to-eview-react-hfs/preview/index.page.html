  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 页面骨架与共享面板卡片 */
.app-root {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.page-body {
  flex: 1;
  width: 100%;
  max-width: 1600px;
  margin: 0 auto;
  padding: var(--spacing-section) var(--spacing-page) 40px;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
}

/* 内容卡片(Level 1 容器) */
.panel-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: 16px 20px 8px;
}

.panel-title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
}

.panel-hint {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 4px 0 0;
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

@media (max-width: 1280px) {
  .stat-overview {
    grid-template-columns: repeat(3, 1fr);
  }

  .chart-panel {
    grid-template-columns: 1fr;
  }
}


.header-bar {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  height: 48px;
  padding: 0 var(--spacing-page) 0 20px;
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-card);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-brand {

// Layer 1: 全局状态 — 主题模式 + 图表/表格联动状态
// 换肤单轨驱动:isDark 只切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
//
// 联动状态:
//   regionFilter / statusFilter — 由 KPI 卡片、柱状图、饼图、筛选 chips 双向驱动,作用于表格与交叉图表
//   selectedDeviceCode         — 由表格行点击驱动,作用于趋势折线图
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);
  const [regionFilter, setRegionFilter] = useState(null);
  const [statusFilter, setStatusFilter] = useState(null);
  const [selectedDeviceCode, setSelectedDeviceCode] = useState(null);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const toggleRegionFilter = (region) => {
    setRegionFilter((prev) => (prev === region ? null : region));
  };

  const toggleStatusFilter = (statusKey) => {
    setStatusFilter((prev) => (prev === statusKey ? null : statusKey));
  };

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
    regionFilter,
    statusFilter,
    selectedDeviceCode,
    setRegionFilter,
    setStatusFilter,
    toggleRegionFilter,
    toggleStatusFilter,
    setSelectedDeviceCode,
    clearFilters: () => {
      setRegionFilter(null);
      setStatusFilter(null);
      setSelectedDeviceCode(null);
    }
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

  lined: "border",

  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {

function resolveColorId(variant, colorHex) {

      c.value.split(",").map((v) => v.trim()).includes(colorHex)

      height: size,

  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",

        "aria-hidden": true,

    return React.createElement("span", {
      className,
      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });

    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },
    dangerouslySetInnerHTML: { __html: svg },
  });

// Layer 2: 设备监控域 mock 数据(确定性伪随机,保证每次构建数据一致)

function createRandom(seed) {
  let s = seed >>> 0;
  return function next() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

const REGIONS = ["华北", "华东", "华南", "西南", "西北", "东北"];

const STATUS_LIST = [
  { key: "running", label: "运行中", tone: "success", icon: "circle-check-big" },
  { key: "alarm", label: "告警", tone: "error", icon: "triangle-alert" },
  { key: "stopped", label: "停机", tone: "critical", icon: "power" },
  { key: "offline", label: "离线", tone: "neutral", icon: "wifi-off" }
];

const STATUS_MAP = STATUS_LIST.reduce((acc, item) => {
  acc[item.key] = item;
  return acc;
}, {});

const DEVICE_TYPES = [
  { key: "wind", label: "风机", icon: "wind" },
  { key: "pv", label: "光伏逆变器", icon: "sun" },
  { key: "ess", label: "储能装置", icon: "battery-charging" },
  { key: "env", label: "环境监测仪", icon: "thermometer" },
  { key: "camera", label: "视频监控", icon: "video" }
];

const DEVICE_TYPE_MAP = DEVICE_TYPES.reduce((acc, item) => {
  acc[item.key] = item;
  return acc;
}, {});

const SITES = {
  华北: ["华北风电场", "京北光伏电站"],
  华东: ["华东储能电站", "申城光伏基地"],
  华南: ["岭南风电场", "深圳湾储能站"],
  西南: ["蜀山风电场", "蓉城光伏电站"],
  西北: ["戈壁风电基地", "敦煌光伏电站"],
  东北: ["松辽风电场", "长春光伏基地"]
};

const OWNERS = ["王建国", "李明", "张伟", "刘洋", "陈静", "赵磊", "孙悦", "周涛", "吴敏", "郑浩"];

// 固定状态配比:14 运行 / 6 告警 / 4 停机 / 4 离线,保证状态多样性
const STATUS_PLAN = [
  "running", "running", "alarm", "running", "stopped", "running", "offline", "running",
  "alarm", "running", "running", "stopped", "running", "alarm", "offline", "running",
  "running", "alarm", "running", "stopped", "running", "running", "alarm", "offline",
  "running", "running", "alarm", "running"
];

function buildDevices() {
  const rand = createRandom(20260923);
  const list = [];
  for (let i = 0; i < 28; i++) {
    const region = REGIONS[i % REGIONS.length];
    const type = DEVICE_TYPES[(i * 3 + 1) % DEVICE_TYPES.length];
    const site = SITES[region][i % 2];
    const unit = String.fromCharCode(65 + (i % 6)) + ((i % 9) + 1);
    const status = STATUS_PLAN[i % STATUS_PLAN.length];
    const statusMeta = STATUS_MAP[status];

    let loadRate = 0;
    if (status === "running") loadRate = Math.round((42 + rand() * 50) * 10) / 10;
    if (status === "alarm") loadRate = Math.round((58 + rand() * 36) * 10) / 10;

    let alarmCount = 0;
    if (status === "alarm") alarmCount = 2 + Math.floor(rand() * 8);
    else if (status === "running" && rand() < 0.3) alarmCount = 1;

    const maintainDays = 5 + Math.floor(rand() * 120);

    list.push({
      deviceCode: "DEV-" + (1001 + i),
      deviceName: site + " " + unit + " 机组",
      region: region,
      deviceType: type.key,
      status: status,
      statusLabel: statusMeta.label,
      loadRate: loadRate,
      alarmCount: alarmCount,
      owner: OWNERS[i % OWNERS.length],
      lastMaintain: dayjs().subtract(maintainDays, "day").format("YYYY-MM-DD")
    });
  }
  return list;
}

const DEVICES = buildDevices();

// —— 联动统计 ——

function countByStatus(devices) {
  return STATUS_LIST.map((item) => ({
    key: item.key,
    label: item.label,
    value: devices.filter((d) => d.status === item.key).length
  }));
}

function countByRegion(devices) {
  return REGIONS.map((region) => ({
    region: region,
    value: devices.filter((d) => d.region === region).length
  }));
}

// —— 趋势数据 ——

function getRecentDayLabels() {
  const labels = [];
  for (let i = 6; i >= 0; i--) {
    labels.push(dayjs().subtract(i, "day").format("MM-DD"));
  }
  return labels;
}

function getOverallTrend() {
  const rand = createRandom(70301);
  return getRecentDayLabels().map((day) => ({
    日期: day,
    平均负载率: Math.round((52 + rand() * 12) * 10) / 10,
    峰值负载率: Math.round((78 + rand() * 16) * 10) / 10
  }));
}

function getDeviceTrend(device) {
  const seed = parseInt(device.deviceCode.replace("DEV-", ""), 10) * 97;
  const rand = createRandom(seed);
  return getRecentDayLabels().map((day) => {
    let value = 0;
    if (device.status === "running") {
      value = Math.round((55 + rand() * 28) * 10) / 10;
    } else if (device.status === "alarm") {
      // 告警设备:偶发负载尖峰
      const spike = rand() < 0.3;
      value = Math.round((spike ? 88 + rand() * 8 : 60 + rand() * 22) * 10) / 10;
    } else {
      value = Math.round(rand() * 4 * 10) / 10;
    }
    return { 日期: day, 负载率: value };
  });
}
  Object.assign(__export, { countByStatus, countByRegion, getRecentDayLabels, getOverallTrend, getDeviceTrend, REGIONS, STATUS_LIST, STATUS_MAP, DEVICE_TYPES, DEVICE_TYPE_MAP, DEVICES });

/* ===== assets/shared/chart.jsx ===== */
(function () {
  const { useRef, useEffect, useState, forwardRef, useImperativeHandle } = React;
// Chart — HUICharts 的 React 封装(命令式 → 声明式)
// 底层: echarts + hui-charts.umd.js(全局 HUICharts),配置项 option 原样透传给 setSimpleOption。
// 暗色联动:自动监听 <html> 的 .dark class,切换 hdesign-light / hdesign-dark 主题并重建图表。
const Chart = forwardRef(function Chart(
  { name, option, className, style, onChartRendered },
  ref
) {
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const renderedRef = useRef(onChartRendered);
  renderedRef.current = onChartRendered;

  // .dark 切换 → 递增 tick 触发主 effect 重建(走同一条 init/dispose 路径)
  const [darkTick, setDarkTick] = useState(0);
  useEffect(() => {
    const mo = new MutationObserver(() => setDarkTick((t) => t + 1));
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    return () => mo.disconnect();
  }, []);

  useEffect(() => {
    const dom = containerRef.current;
    if (!dom || !window.HUICharts) return;

    const isDark = document.documentElement.classList.contains("dark");
    const chart = new HUICharts();
    chart.init(dom, { renderer: "svg"});
    chart.setSimpleOption(name, {
      theme: isDark ? "hdesign-dark" : "hdesign-light",
      a2ui: true,
      ...option,
    });
    chart.render();
    chartRef.current = chart;
    if (renderedRef.current) renderedRef.current(chart);

    // 容器尺寸变化(侧栏折叠/窗口缩放/响应式) → 同步画布
    const ro = new ResizeObserver(() => {
      if (chartRef.current && !chartRef.current._disposed) chart.resize();
    });
    ro.observe(dom);

    return () => {
      ro.disconnect();
      try { chart.dispose(); } catch (e) { /* 容器已卸载时静默 */ }
      chartRef.current = null;
    };
    // JSON.stringify 作 dep:option 是 JSX 内联对象,内容不变则不重建
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [name, JSON.stringify(option), darkTick]);

  useImperativeHandle(ref, () => ({
    getEchartsInstance: () => (chartRef.current ? chartRef.current.getEchartsInstance() : null),
    resizeHandler: () => {
      if (chartRef.current) chartRef.current.resize();
    },
  }), []);

  const wrapperStyle = { width: "100%", height: "100%", ...style };
  return <div ref={containerRef} className={className} style={wrapperStyle} />;
});
  Object.assign(__export, { Chart });
})();

/* ===== src/views/chart-panel/index.jsx ===== */
(function () {
  const { useRef, useMemo } = React;
  const { Tag } = antd;
  const { Icon, useApp, DEVICES, STATUS_LIST, countByRegion, countByStatus, getDeviceTrend, getOverallTrend } = __export;
  const Chart = __export.Chart;
// 图表联动面板:
//   柱状图点击区域 → 联动筛选表格 + 饼图
//   饼图点击状态   → 联动筛选表格 + 柱状图
//   表格选中行     → 联动切换右侧趋势折线图
function useChartClick(ref, handler) {
  return () => {
    const ec = ref.current && ref.current.getEchartsInstance();
    if (!ec || ec.__linkBound) return;
    ec.__linkBound = true;
    ec.on("click", (params) => {
      if (params && params.name) handler(params.name);
    });
  };
}

function ChartPanel() {
  const {
    regionFilter,
    statusFilter,
    setStatusFilter,
    toggleRegionFilter,
    selectedDeviceCode,
    setSelectedDeviceCode
  } = useApp();

  const barRef = useRef(null);
  const pieRef = useRef(null);

  const onBarClick = useChartClick(barRef, (name) => toggleRegionFilter(name));
  const onPieClick = useChartClick(pieRef, (name) => {
    const meta = STATUS_LIST.find((item) => item.label === name);
    if (meta) setStatusFilter(meta.key);
  });

  // 柱状图:受"状态"筛选交叉联动(排除区域条件,保留区域自由度)
  const barOption = useMemo(() => {
    const scoped = statusFilter
      ? DEVICES.filter((d) => d.status === statusFilter)
      : DEVICES;
    const data = countByRegion(scoped).map((item) => ({
      区域: item.region,
      设备数: item.value
    }));
    return { data, xAxis: { data: "区域" }, yAxisTitle: "设备数 (台)" };
  }, [statusFilter]);

  // 饼图:受"区域"筛选交叉联动(排除状态条件)
  const pieOption = useMemo(() => {
    const scoped = regionFilter
      ? DEVICES.filter((d) => d.region === regionFilter)
      : DEVICES;
    const total = scoped.length;
    const data = countByStatus(scoped)
      .filter((item) => item.value > 0)
      .map((item) => ({ name: item.label, value: item.value }));
    return {
      data,
      title: { text: String(total), subtext: "设备总数" },
      legendPosition: "bottomCenter"
    };
  }, [regionFilter]);

  // 折线图:表格行选中 → 单设备趋势;未选中 → 全网趋势
  const selectedDevice = selectedDeviceCode
    ? DEVICES.find((d) => d.deviceCode === selectedDeviceCode)
    : null;

  const lineOption = useMemo(() => {
    if (selectedDevice) {
      return {
        data: getDeviceTrend(selectedDevice),
        xAxis: { data: "日期", name: "近7日" },
        yAxisTitle: "负载率 (%)",
        smooth: true,
        area: true,
        markLine: { top: 90 }
      };
    }
    return {
      data: getOverallTrend(),
      xAxis: { data: "日期", name: "近7日" },
      yAxisTitle: "负载率 (%)",
      smooth: true
    };
  }, [selectedDevice]);

  const statusLabel = statusFilter
    ? STATUS_LIST.find((item) => item.key === statusFilter).label
    : "全部";

  return (
    <section className="chart-panel">
      <div className="panel-card chart-card">
        <div className="panel-head">
          <div>
            <h3 className="panel-title">各区域设备分布</h3>
            <p className="panel-hint">
              <Icon name="mouse-pointer-click" size={12} />
              当前状态:{statusLabel} · 点击柱体按区域联动筛选
            </p>
          </div>
          {regionFilter ? (
            <Tag closable color="processing" onClose={() => toggleRegionFilter(regionFilter)}>
              区域:{regionFilter}
            </Tag>
          ) : null}
        </div>
        <div className="chart-body">
          <Chart ref={barRef} name="BarChart" option={barOption} onChartRendered={onBarClick} />
        </div>
      </div>

      <div className="panel-card chart-card">
        <div className="panel-head">
          <div>
            <h3 className="panel-title">设备状态分布</h3>
            <p className="panel-hint">
              <Icon name="mouse-pointer-click" size={12} />
              {regionFilter ? "当前区域:" + regionFilter : "全部区域"} · 点击扇区按状态联动筛选
            </p>
          </div>
        </div>
        <div className="chart-body">
          <Chart ref={pieRef} name="PieChart" option={pieOption} onChartRendered={onPieClick} />
        </div>
      </div>

      <div className="panel-card chart-card">
        <div className="panel-head">
          <div>
            <h3 className="panel-title">
              {selectedDevice ? selectedDevice.deviceName + " · 负载趋势" : "全网设备 · 负载趋势"}
            </h3>
            <p className="panel-hint">
              <Icon name="mouse-pointer-click" size={12} />
              {selectedDevice
                ? "来自表格选中行 · 点击标签返回全网视角"
                : "点击下方表格行,查看单设备近7日趋势"}
            </p>
          </div>
          {selectedDevice ? (
            <Tag
              closable
              color="processing"
              onClose={() => setSelectedDeviceCode(null)}
            >
              {selectedDevice.deviceCode}
            </Tag>
          ) : null}
        </div>
        <div className="chart-body">
          <Chart name="LineChart" option={lineOption} />
        </div>
      </div>
    </section>
  );
}
  Object.assign(__export, { ChartPanel });
})();

/* ===== src/views/device-table/index.jsx ===== */
(function () {
  const { useMemo, useState } = React;
  const { Button, Input, Table } = antd;
  const { Icon, useApp, DEVICES, REGIONS, STATUS_LIST, DEVICE_TYPE_MAP } = __export;
  const StatusTag = __export.StatusTag;
function FilterChip({ active, onClick, children }) {
  return (
    <button
      type="button"
      className={"filter-chip" + (active ? " is-active" : "")}
      aria-pressed={active}
      onClick={onClick}
    >
      {children}
    </button>
  );
}

// 设备列表:筛选条件与上方 KPI 卡片/图表双向联动;点击行联动趋势折线图
function DeviceTable() {
  const {
    regionFilter,
    statusFilter,
    setRegionFilter,
    setStatusFilter,
    toggleRegionFilter,
    toggleStatusFilter,
    selectedDeviceCode,
    setSelectedDeviceCode,
    clearFilters
  } = useApp();

  const [keyword, setKeyword] = useState("");
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);

  const filtered = useMemo(() => {
    const kw = keyword.trim().toLowerCase();
    return DEVICES.filter((d) => {
      if (regionFilter && d.region !== regionFilter) return false;
      if (statusFilter && d.status !== statusFilter) return false;
      if (
        kw &&
        d.deviceName.toLowerCase().indexOf(kw) === -1 &&
        d.deviceCode.toLowerCase().indexOf(kw) === -1 &&
        d.owner.toLowerCase().indexOf(kw) === -1
      ) {
        return false;
      }
      return true;
    });
  }, [keyword, regionFilter, statusFilter]);

  const columns = useMemo(
    () => [
      {
        title: "设备编号",
        dataIndex: "deviceCode",
        key: "deviceCode",
        width: 110,
        render: (code) => (
          <Button
            type="link"
            size="small"
            className="cell-link"
            onClick={(e) => {
              e.stopPropagation();
              setSelectedDeviceCode(code);
            }}
          >
            {code}
          </Button>
        )
      },
      { title: "设备名称", dataIndex: "deviceName", key: "deviceName", width: 200 },
      { title: "所属区域", dataIndex: "region", key: "region", width: 90 },
      {
        title: "设备类型",
        dataIndex: "deviceType",
        key: "deviceType",
        width: 140,
        render: (type) => {
          const meta = DEVICE_TYPE_MAP[type];
          return (
            <span className="cell-type">
              <Icon name={meta.icon} size={14} />
              {meta.label}
            </span>
          );
        }
      },
      {
        title: "运行状态",
        dataIndex: "status",
        key: "status",
        width: 100,
        render: (status) => <StatusTag status={status} />
      },
      {
        title: "负载率",
        dataIndex: "loadRate",
        key: "loadRate",
        width: 90,
        align: "right",
        render: (v) => (
          <span className={v > 85 ? "num-danger" : ""}>{v.toFixed(1)}%</span>
        )
      },
      {
        title: "当日告警",
        dataIndex: "alarmCount",
        key: "alarmCount",
        width: 90,
        align: "right",
        render: (v) => (v > 0 ? <span className="num-danger">{v}</span> : v)
      },
      { title: "负责人", dataIndex: "owner", key: "owner", width: 90 },
      {
        title: "最后维护",
        dataIndex: "lastMaintain",
        key: "lastMaintain",
        width: 110,
        render: (v) => <span className="cell-muted">{v}</span>
      },
      {
        title: "操作",
        key: "action",
        width: 96,
        render: (_, record) => (
          <div className="cell-actions">
            <Button
              shape="circle"
              size="small"
              aria-label="查看趋势"
              icon={<Icon name="eye" size={14} />}
              onClick={(e) => {
                e.stopPropagation();
                setSelectedDeviceCode(record.deviceCode);
              }}
            />
            <Button
              shape="circle"
              size="small"
              aria-label="设备设置"
              icon={<Icon name="settings" size={14} />}
              onClick={(e) => e.stopPropagation()}
            />
          </div>
        )
      }
    ],
    [setSelectedDeviceCode]
  );

  const hasSelection = selectedRowKeys.length > 0;

  return (
    <section className="panel-card device-table" aria-label="设备列表">
      <div className="panel-head">
        <div>
          <h3 className="panel-title">设备列表</h3>
          <p className="panel-hint">
            <Icon name="mouse-pointer-click" size={12} />
            点击行联动右侧趋势图 · 筛选条件与上方图表双向同步 · 当前匹配 {filtered.length} 台
          </p>
        </div>
        <div className="table-head-actions">
          <Button
            size="small"
            icon={<Icon name="rotate-ccw" size={14} />}
            onClick={() => {
              clearFilters();
              setKeyword("");
              setSelectedRowKeys([]);
            }}
          >
            重置
          </Button>
          <Button size="small" type="primary" icon={<Icon name="download" size={14} />}>
            导出报表
          </Button>
        </div>
      </div>

      <div className="table-toolbar">
        <Input
          className="table-search"
          allowClear
          placeholder="搜索设备名称、编号或负责人"
          suffix={<Icon name="search" size={14} />}
          value={keyword}
          onChange={(e) => setKeyword(e.target.value)}
          onPressEnter={() => setSelectedRowKeys([])}
        />
        <div className="chip-group" role="group" aria-label="区域筛选">
          <span className="chip-label">区域</span>
          <FilterChip active={!regionFilter} onClick={() => setRegionFilter(null)}>
            全部
          </FilterChip>
          {REGIONS.map((region) => (
            <FilterChip
              key={region}
              active={regionFilter === region}
              onClick={() => toggleRegionFilter(region)}
            >
              {region}
            </FilterChip>
          ))}
        </div>
        <div className="chip-group" role="group" aria-label="状态筛选">
          <span className="chip-label">状态</span>
          <FilterChip active={!statusFilter} onClick={() => setStatusFilter(null)}>
            全部
          </FilterChip>
          {STATUS_LIST.map((item) => (
            <FilterChip
              key={item.key}
              active={statusFilter === item.key}
              onClick={() => toggleStatusFilter(item.key)}
            >
              {item.label}
            </FilterChip>
          ))}
        </div>
      </div>

      {hasSelection ? (
        <div className="table-selection-bar">
          <span className="selection-text">已选 {selectedRowKeys.length} 项</span>
          <Button size="small" icon={<Icon name="download" size={12} />}>
            导出所选
          </Button>
          <Button size="small" icon={<Icon name="send" size={12} />}>
            下发指令
          </Button>
        </div>
      ) : null}

      <div className="table-wrap">
        <Table
          rowKey="deviceCode"
          columns={columns}
          dataSource={filtered}
          rowSelection={{ selectedRowKeys, onChange: setSelectedRowKeys }}
          onRow={(record) => ({
            onClick: (e) => {
              if (e.target.closest && e.target.closest(".ant-table-selection-column")) return;
              setSelectedDeviceCode(record.deviceCode);
            }
          })}
          rowClassName={(record) =>
            record.deviceCode === selectedDeviceCode ? "table-row-selected" : ""
          }
          pagination={{
            pageSize: 8,
            showSizeChanger: false,
            showTotal: (total) => "共 " + total + " 条"
          }}
          scroll={{ x: 1040 }}
        />
      </div>
    </section>
  );
}
  Object.assign(__export, { DeviceTable });
})();
