  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 页面骨架（Level 0 画布 + 内容流） */
.app-root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.app-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
  padding: var(--spacing-page);
}


.header-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  height: 48px;
  padding: 0 var(--spacing-page);
  background: var(--surface-container-highest);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.header-bar__brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  min-width: 0;
}

.header-bar__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-md);
  background: var(--primary-container);
  color: var(--primary);
}

.header-bar__name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

.header-bar__divider {
  width: var(--border-width-thin);
  height: 16px;
  background: var(--divider);
}

.header-bar__module {
  font: var(--font-body-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.header-bar__tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
}

.header-bar__search {
  width: 280px;
}

.header-bar__user {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  height: 32px;
  padding: 0 var(--spacing-2) 0 var(--spacing-1);
  border: 0;
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--on-surface);
  font: var(--font-body-m);
  cursor: pointer;
}

.header-bar__user:hover {
  background: var(--color-hover);
}

.header-bar__avatar {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-full);
  object-fit: cover;
}


.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  flex-wrap: wrap;
}

.page-heading__text {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1);
  min-width: 0;
}

.page-heading__title {
  margin: 0;
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.page-heading__desc {
  margin: 0;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
}

.page-heading__meta {
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  margin-top: var(--spacing-1);
}

.page-heading__meta-item {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.page-heading__meta-item b {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.page-heading__meta-item--critical b {
  color: var(--critical);
}

.page-heading__meta-item--error b {
  color: var(--error);
}

.page-heading__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}


.metric-filter__grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--spacing-4);
}

.metric-filter__field {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1-5);
  min-width: 0;
}

.metric-filter__label {
  font: var(--font-body-m);
  font-weight: var(--font-weight-normal);
  color: var(--on-surface-variant);
}

.metric-filter__actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--spacing-inline);
  margin-top: var(--spacing-5);
  padding-top: var(--spacing-4);
  border-top: var(--border-width-thin) solid var(--divider);
}

@media (max-width: 1280px) {
  .metric-filter__grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 1024px) {
  .metric-filter__grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}


.panel-card {
  display: flex;
  flex-direction: column;
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);

  gap: var(--spacing-inline);
}

.metric-table__body {
  padding: var(--spacing-4) 0 0;
}

.metric-table__bulk {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  margin: 0 var(--spacing-5) var(--spacing-3);

  background: var(--info-container);

}

// 达成率：正向 = 当前/目标；逆向 = 目标/当前
function computeRatio(metric) {
  const current = Number(metric.current);
  const target = Number(metric.target);
  if (!current || !target) return 0;
  const raw = metric.polarity === "lower" ? (target / current) * 100 : (current / target) * 100;
  return Math.round(raw * 10) / 10;
}

// 是否越过阈值（表格中以告警色提示）
function isBreach(metric) {
  const current = Number(metric.current);
  const target = Number(metric.target);
  if (!current || !target) return false;
  return metric.polarity === "lower" ? current > target : current < target;
}

function formatMetricValue(value, unit) {
  if (value === undefined || value === null || value === "") return "—";
  const num = Number(value);
  if (Number.isNaN(num)) return String(value);
  const text = Number.isInteger(num)
    ? num.toLocaleString("zh-CN")
    : num.toLocaleString("zh-CN", { minimumFractionDigits: 1, maximumFractionDigits: 2 });
  return unit ? text + " " + unit : text;
}

function describe(metric) {
  const owner = metric.owner || NEW_OWNER_FALLBACK;
  return "按 " + metric.dimension + " 维度采集「" + metric.name + "」，统计周期 " + metric.cycle +
    "，目标值 " + metric.target + (metric.unit || "") + "，偏离阈值 10% 时推送至 " + owner + "。";
}

// 统一补全派生字段（说明、达成率），新增/编辑后复用同一入口
function decorateMetric(metric) {
  const next = { ...metric };
  next.ratio = computeRatio(next);
  if (!next.description) next.description = describe(next);
  return next;
}

function nowStamp() {
  return dayjs().format("YYYY-MM-DD HH:mm");
}

function nextMetricId(list) {
  return "MT-" + (1000 + list.length + 1);
}

function matchMetric(metric, filters) {
  const keyword = (filters.keyword || "").trim().toLowerCase();
  if (keyword) {
    const haystack = (metric.name + " " + metric.code + " " + metric.owner).toLowerCase();
    if (haystack.indexOf(keyword) === -1) return false;
  }
  const keys = ["category", "cycle", "status", "dimension", "source", "owner", "unit"];
  return keys.every((key) => !filters[key] || metric[key] === filters[key]);
}

  const [metrics, setMetrics] = useState(INITIAL_METRICS);

  const [filters, setFilters] = useState(EMPTY_FILTERS);
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [editor, setEditor] = useState({ open: false, mode: "create", record: null });

  useEffect(() => {

function getStyleValue(styleKey) {

function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {

  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

function Icon({
  name,
  src,
  size = 16,
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
}) {
  const [plus, setPlus] = useState(plusState); // reuse already-probed result
  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${color}`) || ""
  );

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${color}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, color).then((s) => {
        if (!alive) return;
        svgCache.set(key, s);
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, color]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      width: size,
      height: size,
      className: className,
      alt: "",
      "aria-hidden": true,
      style: { ...style, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        style: { ...style, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      className,
      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });
  }
  
  return React.createElement("span", {
    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

(function () {
  const { Icon } = __export;
// Layer 3: 达成率 + 环比趋势（达成率 ≥100% 达标 / ≥90% 需关注 / 其余告警）
const RATIO_TONE = [
  { min: 100, tone: "success" },
  { min: 90, tone: "critical" },
];

function toneOf(ratio) {
  const hit = RATIO_TONE.find((item) => ratio >= item.min);
  return hit ? hit.tone : "error";
}

function RatioValue({ ratio, trend, polarity }) {
  const value = Number(ratio) || 0;
  const delta = Number(trend) || 0;
  const improving = polarity === "lower" ? delta < 0 : delta > 0;
  const trendIcon = delta === 0 ? "minus" : delta > 0 ? "trending-up" : "trending-down";
  const trendTone = delta === 0 ? "flat" : improving ? "good" : "bad";

  return (
    <div className="ratio-value">
      <span className={"ratio-value__pct ratio-value__pct--" + toneOf(value)}>
        {value.toFixed(1)}%
      </span>
      <span className={"ratio-value__trend ratio-value__trend--" + trendTone}>
        <Icon name={trendIcon} size={12} />
        {Math.abs(delta).toFixed(1)}%
      </span>
    </div>
  );
}
  Object.assign(__export, { RatioValue });
})();

  const [form] = Form.useForm();
  const isEdit = editor.mode === "edit";

  useEffect(() => {
    if (!editor.open) return;
    if (isEdit && editor.record) {
      form.setFieldsValue({
        ...editor.record,
        effectiveAt: editor.record.effectiveAt ? dayjs(editor.record.effectiveAt) : dayjs(),
      });
    } else {
      form.resetFields();
      form.setFieldsValue({
        category: "资源性能",
        cycle: "每日",
        dimension: "全局",
        unit: "%",
        polarity: "higher",
        status: "draft",
        source: "指标中台",
        owner: "张明",
        effectiveAt: dayjs(),
      });
    }
  }, [editor.open, editor.mode, editor.record]);

  const handleSubmit = async () => {
    const values = await form.validateFields().catch(() => null);
    if (!values) return;
    saveMetric(values);
    message.success(isEdit ? "指标定义已更新" : "指标定义已创建");
  };

  return (
    <Drawer
      open={editor.open}
      width={720}
      className="metric-editor"
      title={isEdit ? "编辑指标" : "新建指标"}
      onClose={closeEditor}
      maskClosable={false}
      footer={
        <div className="metric-editor__footer">
          <Button onClick={closeEditor}>取消</Button>
          <Button type="primary" onClick={handleSubmit}>
            保存
          </Button>
        </div>
      }
    >
      <Form form={form} layout="vertical" className="metric-editor__form">
        <section className="metric-editor__section">
          <h3 className="metric-editor__section-title">基本信息</h3>
          <div className="metric-editor__grid">
            <Form.Item
              label="指标名称"
              name="name"
              rules={[{ required: true, message: "请输入指标名称" }]}
            >
              <Input placeholder="例如：集群 CPU 平均使用率" />
            </Form.Item>
            <Form.Item
              label="指标编码"
              name="code"
              rules={[
                { required: true, message: "请输入指标编码" },
                { pattern: /^[a-z0-9.]+$/, message: "仅支持小写字母、数字与英文句点" },
              ]}
            >
              <Input placeholder="例如：res.cpu.usage.avg" />
            </Form.Item>
            <Form.Item label="指标分类" name="category" rules={[{ required: true, message: "请选择指标分类" }]}>
              <Select style={FULL_WIDTH} options={CATEGORY_OPTIONS} placeholder="请选择" />
            </Form.Item>
            <Form.Item label="统计周期" name="cycle" rules={[{ required: true, message: "请选择统计周期" }]}>
              <Select style={FULL_WIDTH} options={CYCLE_OPTIONS} placeholder="请选择" />
            </Form.Item>
          </div>
        </section>

        <section className="metric-editor__section">
          <h3 className="metric-editor__section-title">统计口径</h3>
          <div className="metric-editor__grid">
            <Form.Item label="统计维度" name="dimension" rules={[{ required: true, message: "请选择统计维度" }]}>
              <Select style={FULL_WIDTH} options={DIMENSION_OPTIONS} placeholder="请选择" />
            </Form.Item>
            <Form.Item label="统计单位" name="unit" rules={[{ required: true, message: "请选择统计单位" }]}>
              <Select style={FULL_WIDTH} options={UNIT_OPTIONS} placeholder="请选择" />
            </Form.Item>
            <Form.Item label="目标值" name="target" rules={[{ required: true, message: "请输入目标值" }]}>
              <InputNumber style={FULL_WIDTH} min={0} precision={2} placeholder="请输入目标值" />
            </Form.Item>
            <Form.Item label="指标极性" name="polarity" rules={[{ required: true, message: "请选择指标极性" }]}>
              <Select style={FULL_WIDTH} options={POLARITY_OPTIONS} placeholder="请选择" />
            </Form.Item>
            <Form.Item label="数据来源" name="source" rules={[{ required: true, message: "请选择数据来源" }]}>
              <Select style={FULL_WIDTH} options={SOURCE_OPTIONS} placeholder="请选择" />
            </Form.Item>
            <Form.Item label="责任人" name="owner" rules={[{ required: true, message: "请选择责任人" }]}>
              <Select style={FULL_WIDTH} options={OWNER_OPTIONS} placeholder="请选择" />
            </Form.Item>
          </div>
        </section>

        <section className="metric-editor__section">
          <h3 className="metric-editor__section-title">生效与归属</h3>
          <div className="metric-editor__grid">
            <Form.Item label="生效日期" name="effectiveAt" rules={[{ required: true, message: "请选择生效日期" }]}>
              <DatePicker style={FULL_WIDTH} placeholder="请选择生效日期" />
            </Form.Item>
            <Form.Item label="指标状态" name="status" rules={[{ required: true, message: "请选择指标状态" }]}>
              <Select style={FULL_WIDTH} options={STATUS_OPTIONS} placeholder="请选择" />
            </Form.Item>
            <Form.Item label="指标说明" name="description" className="metric-editor__col-span">
              <Input.TextArea
                rows={3}
                placeholder="说明统计口径、异常判定规则与下游联动，例如：按机房维度采集，偏差超过 10% 触发告警。"
              />
            </Form.Item>
          </div>
        </section>
      </Form>

      {isEdit && editor.record ? (
        <div className="metric-editor__meta">
          <Icon name="clock" size={14} />
          <span>
            最近更新 {editor.record.updatedAt} · 达成率 {Number(editor.record.ratio || 0).toFixed(1)}%
          </span>
        </div>
      ) : null}
    </Drawer>
  );
}
  Object.assign(__export, { MetricEditor });
})();

/* ===== app.jsx ===== */
(function () {
  const { ConfigProvider } = antd;
  const { AppProvider } = __export;
  const zhCN = __export.zhCN;
  const HeaderBar = __export.HeaderBar;
  const PageHeading = __export.PageHeading;
  const MetricFilter = __export.MetricFilter;
  const MetricTable = __export.MetricTable;
  const MetricEditor = __export.MetricEditor;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (per-domain files, e.g. metrics.js)
//   Layer 3 reusable      → src/components/{name}/ (cross-view: panel-card / status-tag / category-chip / ratio-value)
//   Layer 4 views         → src/views/{name}/      (one per section: header-bar / page-heading / metric-filter / metric-table / metric-editor)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// 场景：数据指标管理页 —— 仅表单 + 表格，无图表。











function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN}>
        <div className="app-root">
          <HeaderBar />
          <main className="app-main">
            <PageHeading />
            <MetricFilter />
            <MetricTable />
          </main>
          <MetricEditor />
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
