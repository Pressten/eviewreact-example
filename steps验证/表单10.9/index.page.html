  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 — 顶部导航 + 侧边导航 + 内容区 三区骨架 */
.app-root {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.app-body {
  flex: 1;
  display: flex;
  min-height: 0;
}

.app-main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
}


/* 顶部导航栏 48px */
.topbar {
  flex: none;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding-right: 1.5rem;
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-sm);
  position: relative;
  z-index: 10;
}

.topbar-brand {
  flex: none;
  width: 16rem;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding-left: 1rem;
  box-sizing: border-box;
}

.brand-mark {
  flex: none;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-md);
  background: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.brand-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

.topbar-nav {
  display: flex;
  align-items: center;
  height: 100%;
  gap: 1.5rem;
}

.topnav-item {
  appearance: none;
  border: 0;
  background: transparent;
  cursor: pointer;
  height: 100%;
  padding: 0 0.25rem;
  font: var(--font-body-l);
  color: var(--on-surface-variant);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}

.topnav-item:hover {
  color: var(--primary);
}

.topnav-item.is-active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: var(--font-weight-medium);
}

.topbar-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 1.25rem;
}

.topbar-search {
  width: 16rem;
}

.tool-icon {
  color: var(--on-surface-variant);
}

.tool-icon:hover {
  color: var(--primary);
}

.topbar-user {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  appearance: none;
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 0.25rem 0.5rem;
  border-radius: var(--radius-action);
}

.topbar-user:hover {
  background: var(--surface-variant);
}

.user-avatar {
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-full);
  object-fit: cover;
}

.user-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  line-height: 1.2;
}

.user-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.user-role {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.user-caret {
  color: var(--on-surface-variant);
}


/* 侧边导航栏：展开 16rem / 收起 3rem */
.sidenav {
  flex: none;
  width: 16rem;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-highest);
  transition: width 0.2s ease;
  overflow: hidden;
}

.sidenav.is-collapsed {
  width: 3rem;
}

.sidenav-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-top: 0.5rem;
}

.sidenav-menu {
  border-inline-end: 0;
  background: transparent;
}

.sidenav-fold {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  height: 2.5rem;
  margin: 0.5rem;
  border: 0;
  border-top: 1px solid var(--divider);
  background: transparent;
  cursor: pointer;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.sidenav-fold:hover {
  color: var(--primary);
}


/* 业务受理多步表单页 */
.wizard {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-5);
  padding: var(--spacing-6) var(--spacing-8);
  max-width: 1600px;
}

/* ---- 页头 ---- */
.wizard-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--spacing-4);
}

.wizard-crumb {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.wizard-title {
  margin: 0.5rem 0 0;
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.wizard-sub {
  margin: 0.25rem 0 0;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
}

.draft-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  height: 1.75rem;
  padding: 0 0.75rem;
  border-radius: var(--radius-full);
  background: var(--success-container);
  color: var(--on-success-container);
  font: var(--font-caption-m);
}

/* ---- 内容栅格 ---- */
.wizard-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 22rem;
  gap: var(--spacing-gutter);
  align-items: start;
}

.card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}

.wizard-main {
  padding: var(--spacing-6);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-6);
  min-width: 0;
}

.wizard-steps {
  padding-bottom: var(--spacing-5);
  border-bottom: 1px solid var(--divider);

const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}

const ICON_API_BASE = "https://octo.hdesign.huawei.com";

const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;

function getStyleValue(styleKey) {

      return false;
    }

    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))

    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||

    const item = Array.isArray(data) ? data[0] : data;

        if (!alive) return;

        setSvg(s);
      });
    });

      src: src,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,

    <aside className={"sidenav" + (collapsed ? " is-collapsed" : "")}>

          mode="inline"
          inlineCollapsed={collapsed}
          selectedKeys={[selected]}
          items={MENU_ITEMS}

          className="sidenav-menu"
          {...foldProps}
        />
      </div>
      <button type="button" className="sidenav-fold" onClick={() => setCollapsed((c) => !c)}>
        <Icon name={collapsed ? "panel-left-open" : "panel-left-close"} size="1rem" />

        {rows.map((row) => (
          <div className="confirm-row" key={row.label}>
            <dt>{row.label}</dt>
            <dd className={row.value ? "" : "is-empty"}>{row.value || "—"}</dd>
          </div>
        ))}
      </dl>
    </div>
  );
}

// 步骤四 — 确认提交
function StepConfirm({ form, update, errors }) {
  const val = (v) => (v === undefined || v === null || v === "" ? "" : v);

  const address = [labelOf(provinceOptions, form.province), labelOf(getCities(form.province), form.city), form.address]
    .filter(Boolean)
    .join(" ");

  const customerRows = [
    { label: "客户名称", value: val(form.custName) },
    { label: "客户类型", value: labelOf(customerTypeOptions, form.custType) },
    { label: "证件类型", value: labelOf(certTypeOptions, form.certType) },
    { label: "证件号码", value: val(form.certNo) },
    { label: "所属行业", value: labelOf(industryOptions, form.industry) },
    { label: "联系人", value: val(form.contactName) },
    { label: "联系电话", value: val(form.contactPhone) },
    { label: "电子邮箱", value: val(form.contactEmail) },
  ];

  const serviceRows = [
    { label: "业务类型", value: labelOf(serviceTypeOptions, form.serviceType) },
    { label: "产品套餐", value: labelOf(productOptions, form.product) },
    { label: "带宽规格", value: labelOf(bandwidthOptions, form.bandwidth) },
    { label: "接入方式", value: labelOf(accessModeOptions, form.accessMode) },
    { label: "申请数量", value: form.quantity ? `${form.quantity} 条` : "" },
    { label: "合约期限", value: labelOf(contractOptions, form.contract) },
    { label: "服务等级", value: labelOf(slaOptions, form.sla) },
    { label: "固定 IP", value: form.needStaticIp ? `${form.staticIpCount} 个` : "动态分配" },
    { label: "预计年费", value: form.annualFee ? `¥ ${form.annualFee}` : "" },
  ];

  const accessRows = [
    { label: "安装地址", value: address },
    { label: "接入机房", value: labelOf(roomOptions, form.room) },
    {
      label: "预约时间",
      value: form.appointDate
        ? `${form.appointDate.format("YYYY-MM-DD")} ${labelOf(appointSlotOptions, form.appointSlot)}`
        : "",
    },
    { label: "现场联系人", value: val(form.siteName) },
    { label: "现场联系电话", value: val(form.sitePhone) },
    { label: "现场勘查", value: labelOf(surveyOptions, form.survey) },
  ];

  return (
    <div className="confirm-wrap">
      <SummaryGroup icon="user-round" title="客户信息" rows={customerRows} />
      <SummaryGroup icon="package" title="业务信息" rows={serviceRows} />
      <SummaryGroup icon="map-pin" title="接入信息" rows={accessRows} />

      <div className="confirm-group">
        <h4 className="confirm-title">
          <Icon name="receipt-text" size="1rem" />
          发票与附加信息
        </h4>
        <div className="form-grid confirm-form">
          <FormField label="发票类型" required htmlFor="invoiceType">
            <Radio.Group
              id="invoiceType"
              value={form.invoiceType}
              options={invoiceTypeOptions}
              onChange={(e) => update("invoiceType", e.target.value)}
            />
          </FormField>

          <FormField label="发票抬头" required htmlFor="invoiceTitle" error={errors.invoiceTitle}>
            <Input
              id="invoiceTitle"
              value={form.invoiceTitle}
              status={errors.invoiceTitle ? "error" : undefined}
              placeholder="请输入发票抬头（须与客户名称一致）"
              onChange={(e) => update("invoiceTitle", e.target.value)}
              style={{ width: "100%" }}
            />
          </FormField>

          <FormField label="纳税人识别号" required htmlFor="taxNo" error={errors.taxNo}>
            <Input
              id="taxNo"
              value={form.taxNo}
              status={errors.taxNo ? "error" : undefined}
              placeholder="请输入纳税人识别号"
              onChange={(e) => update("taxNo", e.target.value)}
              style={{ width: "100%" }}
            />
          </FormField>

          <FormField label="附加需求" htmlFor="extraDemand" full>
            <TextArea
              id="extraDemand"
              value={form.extraDemand}
              rows={3}
              maxLength={200}
              showCount
              placeholder="如发票寄送地址、合同编号关联等信息"
              onChange={(e) => update("extraDemand", e.target.value)}
            />
          </FormField>
        </div>

        <div className="agree-block">
          <Checkbox checked={form.agree} onChange={(e) => update("agree", e.target.checked)}>
            我已阅读并同意
            <a className="link" href="#agreement" onClick={(e) => e.preventDefault()}>《政企业务服务协议》</a>
            与
            <a className="link" href="#security" onClick={(e) => e.preventDefault()}>《网络信息安全承诺书》</a>
          </Checkbox>
          {errors.agree ? <div className="field-error agree-error">{errors.agree}</div> : null}
        </div>
      </div>
    </div>
  );
}
  Object.assign(__export, { StepConfirm });
})();

(function () {
  const { useState } = React;
  const { Steps, Button, Progress } = antd;
  const { Icon, serviceTypeOptions, productOptions, provinceOptions, getCities, labelOf, draftOrders } = __export;
  const StepCustomer = __export.StepCustomer;
  const StepService = __export.StepService;
  const StepAccess = __export.StepAccess;
  const StepConfirm = __export.StepConfirm;
const STEPS = [
  { title: "客户信息", description: "主体与联系人" },
  { title: "业务信息", description: "产品与规格" },
  { title: "接入信息", description: "地址与预约" },
  { title: "确认提交", description: "信息与协议" },
];

const REQUIRED = {
  0: [
    ["custName", "请输入客户名称"],
    ["custType", "请选择客户类型"],
    ["certType", "请选择证件类型"],
    ["certNo", "请输入证件号码"],
    ["contactName", "请输入联系人姓名"],
    ["contactPhone", "请输入联系电话"],
  ],
  1: [
    ["product", "请选择产品套餐"],
    ["bandwidth", "请选择带宽规格"],
    ["accessMode", "请选择接入方式"],
    ["contract", "请选择合约期限"],
    ["quantity", "请输入申请数量"],
  ],
  2: [
    ["province", "请选择所属省份"],
    ["city", "请选择所属城市"],
    ["address", "请输入安装地址"],
    ["appointDate", "请选择预约安装日期"],
    ["siteName", "请输入现场联系人"],
    ["sitePhone", "请输入现场联系电话"],
  ],
  3: [
    ["invoiceTitle", "请输入发票抬头"],
    ["taxNo", "请输入纳税人识别号"],
  ],
};

const PHONE_RE = /^1[3-9]\d{9}$/;

const initialForm = {
  // 客户信息
  custName: "",
  custType: undefined,
  certType: "uscc",
  certNo: "",
  industry: undefined,
  manager: undefined,
  contactName: "",
  contactPhone: "",
  contactEmail: "",
  custRemark: "",
  // 业务信息
  serviceType: "leased",
  product: undefined,
  bandwidth: undefined,
  accessMode: undefined,
  contract: undefined,
  quantity: 1,
  sla: "standard",
  needStaticIp: false,
  staticIpCount: 1,
  annualFee: undefined,
  serviceDesc: "",
  // 接入信息
  province: undefined,
  city: undefined,
  address: "",
  room: undefined,
  survey: "need",
  appointDate: null,
  appointSlot: undefined,
  siteName: "",
  sitePhone: "",
  buildRemark: "",
  // 确认提交
  invoiceType: "special",
  invoiceTitle: "",
  taxNo: "",
  extraDemand: "",
  agree: false,
};

const PROGRESS_KEYS = [
  "custName",
  "custType",
  "certNo",
  "contactName",
  "contactPhone",
  "product",
  "bandwidth",
  "accessMode",
  "contract",
  "province",
  "city",
  "address",
  "appointDate",
  "siteName",
  "sitePhone",
];

function validateStep(idx, form) {
  const errs = {};
  REQUIRED[idx].forEach(([key, msg]) => {
    const v = form[key];
    if (v === undefined || v === null || v === "" || (typeof v === "string" && !v.trim())) {
      errs[key] = msg;
    }
  });
  if (idx === 0 && form.contactPhone && !PHONE_RE.test(form.contactPhone)) {
    errs.contactPhone = "请输入有效的 11 位手机号";
  }
  if (idx === 2 && form.sitePhone && !PHONE_RE.test(form.sitePhone)) {
    errs.sitePhone = "请输入有效的 11 位手机号";
  }
  if (idx === 1 && form.needStaticIp && (!form.staticIpCount || form.staticIpCount < 1)) {
    errs.staticIpCount = "固定 IP 数量至少为 1";
  }
  if (idx === 3 && !form.agree) {
    errs.agree = "请阅读并同意服务协议后再提交";
  }
  return errs;
}

function OrderWizard() {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(initialForm);
  const [errors, setErrors] = useState({});
  const [savedAt, setSavedAt] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [orderNo, setOrderNo] = useState("");

  const update = (name, value) => {
    setForm((prev) => ({ ...prev, [name]: value }));
    setErrors((prev) => {
      if (!prev[name]) return prev;
      const next = { ...prev };
      delete next[name];
      return next;
    });
  };

  const goNext = () => {
    const errs = validateStep(step, form);
    if (Object.keys(errs).length) {
      setErrors(errs);
      return;
    }
    setErrors({});
    setStep((s) => Math.min(s + 1, STEPS.length - 1));
  };

  const goPrev = () => {
    setErrors({});
    setStep((s) => Math.max(s - 1, 0));
  };

  const submit = () => {
    const errs = validateStep(3, form);
    if (Object.keys(errs).length) {
      setErrors(errs);
      return;
    }
    setErrors({});
    setOrderNo("EB" + dayjs().format("YYYYMMDDHHmmss"));
    setSubmitted(true);
  };

  const saveDraft = () => {
    setSavedAt(dayjs().format("HH:mm:ss"));
  };

  const reset = () => {
    setForm(initialForm);
    setErrors({});
    setStep(0);
    setSubmitted(false);
    setSavedAt("");
  };

  if (submitted) {
    const addressText = [
      labelOf(provinceOptions, form.province),
      labelOf(getCities(form.province), form.city),
      form.address,
    ]
      .filter(Boolean)
      .join(" ");
    return (
      <div className="wizard">
        <section className="card success-card">
          <span className="success-icon">
            <Icon name="circle-check-big" size="3rem" color="var(--success)" />
          </span>
          <h1 className="success-title">申请提交成功</h1>
          <p className="success-desc">
            工单号 <strong>{orderNo}</strong>，受理人员将在 1 个工作日内与您联系，请保持电话畅通。
          </p>
          <dl className="success-list">
            <div className="success-row">
              <dt>客户名称</dt>
              <dd>{form.custName || "—"}</dd>
            </div>
            <div className="success-row">
              <dt>产品套餐</dt>
              <dd>{labelOf(productOptions, form.product) || "—"}</dd>
            </div>
            <div className="success-row">
              <dt>安装地址</dt>
              <dd>{addressText || "—"}</dd>
            </div>
            <div className="success-row">
              <dt>预约时间</dt>
              <dd>{form.appointDate ? form.appointDate.format("YYYY-MM-DD") : "—"}</dd>
            </div>
          </dl>
          <div className="success-actions">
            <Button type="primary">查看订单进度</Button>
            <Button>返回业务受理列表</Button>
            <a className="link" href="#again" onClick={(e) => e.preventDefault()}>
              <Icon name="plus" size="0.875rem" /> 再提交一单
            </a>
          </div>
        </section>
      </div>
    );
  }

  const filled = PROGRESS_KEYS.filter((k) => {
    const v = form[k];
    return v !== undefined && v !== null && v !== "";
  }).length;
  const percent = Math.round((filled / PROGRESS_KEYS.length) * 100);

  const sideSummary = [
    { label: "客户名称", value: form.custName },
    { label: "业务类型", value: labelOf(serviceTypeOptions, form.serviceType) },
    { label: "产品套餐", value: labelOf(productOptions, form.product) },
    { label: "带宽规格", value: form.bandwidth },
    {
      label: "安装地址",
      value: [labelOf(provinceOptions, form.province), labelOf(getCities(form.province), form.city)]
        .filter(Boolean)
        .join(" "),
    },
    { label: "预约时间", value: form.appointDate ? form.appointDate.format("YYYY-MM-DD") : "" },
  ];

  return (
    <div className="wizard">
      <div className="wizard-head">
        <div className="wizard-head-main">
          <div className="wizard-crumb">
            <Icon name="clipboard-list" size="0.875rem" />
            业务受理 / 企业专线开通
          </div>
          <h1 className="wizard-title">企业专线业务开通申请</h1>
          <p className="wizard-sub">按步骤填写客户、业务与接入信息，提交后由装维团队安排勘查与安装。</p>
        </div>
        <span className="draft-badge">
          <Icon name="file-pen" size="0.875rem" />
          {savedAt ? `草稿已保存 ${savedAt}` : "草稿自动保存"}
        </span>
      </div>

      <div className="wizard-body">
        <section className="card wizard-main">
          <div className="wizard-steps">
            <Steps current={step} items={STEPS} />
          </div>

          <div className="wizard-panel">
            {step === 0 ? <StepCustomer form={form} update={update} errors={errors} /> : null}
            {step === 1 ? <StepService form={form} update={update} errors={errors} /> : null}
            {step === 2 ? <StepAccess form={form} update={update} errors={errors} /> : null}
            {step === 3 ? <StepConfirm form={form} update={update} errors={errors} /> : null}
          </div>

          <div className="wizard-actions">
            <a className="link" href="#draft" onClick={(e) => { e.preventDefault(); saveDraft(); }}>
              <Icon name="save" size="0.875rem" /> 保存草稿
            </a>
            <div className="wizard-actions-right">
              {step > 0 ? (
                <Button icon={<Icon name="arrow-left" size="0.875rem" />} onClick={goPrev}>
                  上一步
                </Button>
              ) : null}
              {step < STEPS.length - 1 ? (
                <Button type="primary" onClick={goNext}>
                  下一步
                  <Icon name="arrow-right" size="0.875rem" />
                </Button>
              ) : (
                <Button type="primary" icon={<Icon name="send" size="0.875rem" />} onClick={submit}>
                  提交申请
                </Button>
              )}
            </div>
          </div>
        </section>

        <aside className="wizard-side">
          <section className="card side-card">
            <div className="side-head">
              <h3 className="side-title">申请进度</h3>
              <span className="side-percent">{percent}%</span>
            </div>
            <Progress percent={percent} showInfo={false} size="small" />
            <dl className="summary-list">
              {sideSummary.map((row) => (
                <div className="summary-row" key={row.label}>
                  <dt>{row.label}</dt>
                  <dd className={row.value ? "" : "is-empty"}>{row.value || "待填写"}</dd>
                </div>
              ))}
            </dl>
          </section>

          <section className="card side-card">
            <h3 className="side-title">办理须知</h3>
            <ul className="notice-list">
              <li>
                <Icon name="circle-dot" size="0.75rem" />
                企业客户需提供加盖公章的营业执照复印件及经办人身份证明。
              </li>
              <li>
                <Icon name="circle-dot" size="0.75rem" />
                专线开通涉及现场施工，需提前 2 个工作日预约上门时间。
              </li>
              <li>
                <Icon name="circle-dot" size="0.75rem" />
                合约期内提前退订需按规定支付违约金，详情见服务协议。
              </li>
            </ul>
            <div className="hotline">
              <Icon name="phone-call" size="1rem" color="var(--primary)" />
              <div>
                <div className="hotline-label">政企服务热线</div>
                <div className="hotline-num">10010 转 3</div>
              </div>
            </div>
          </section>

          <section className="card side-card">
            <div className="side-head">
              <h3 className="side-title">最近草稿</h3>
              <a className="link" href="#all" onClick={(e) => e.preventDefault()}>全部</a>
            </div>
            <ul className="draft-list">
              {draftOrders.map((d) => (
                <li className="draft-item" key={d.id}>
                  <div className="draft-main">
                    <span className="draft-name">{d.name}</span>
                    <span className="draft-product">{d.product}</span>
                  </div>
                  <div className="draft-meta">
                    <span className={"pill pill-" + d.status}>{d.statusLabel}</span>
                    <span className="draft-time">{d.time}</span>
                  </div>
                </li>
              ))}
            </ul>
          </section>
        </aside>
      </div>
    </div>
  );
}
  Object.assign(__export, { OrderWizard });
})();

(function () {
  const { ConfigProvider } = antd;
  const { AppProvider } = __export;
  const zhCN = __export.zhCN;
  const HeaderBar = __export.HeaderBar;
  const SideNav = __export.SideNav;
  const OrderWizard = __export.OrderWizard;
// App entry — 运营商政企业务受理页面
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: global state + dark mode toggle)
//   Layer 2 mock data     → src/mock/              (per-domain files, e.g. order.js)
//   Layer 3 reusable      → src/components/{name}/ (cross-view, e.g. form-field)
//   Layer 4 views         → src/views/{name}/      (one per section, e.g. header-bar / side-nav)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.









function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN}>
        <div className="app-root">
          <HeaderBar />
          <div className="app-body">
            <SideNav />
            <main className="app-main">
              <OrderWizard />
            </main>
          </div>
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();

root.render(React.createElement(__export.App));
</script>
