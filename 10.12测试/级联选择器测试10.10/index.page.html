  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 应用级基础样式 */
.app-root {
  min-height: 100vh;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 顶部栏 — 仅承载页面标题与全局工具 */
.top-bar {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: 0 var(--spacing-page);
  background: var(--surface-container-highest);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.top-bar__brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  color: var(--primary);
}

.top-bar__title {
  color: var(--on-surface);
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
}

.top-bar__tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  color: var(--on-surface-variant);
}

.top-bar__hint {
  font: var(--font-body-s);
}

.page__content {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
  padding: var(--spacing-page);
}


.section-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.section-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: var(--spacing-inset);
  border-bottom: var(--border-width-thin) solid var(--divider);
}

.section-card__titles {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-1);
  min-width: 0;
}

.section-card__title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
}

.section-card__subtitle {
  margin: 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.section-card__extra {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-shrink: 0;
}

.section-card__body {
  padding: var(--spacing-inset);
}


/* 表单区：纵向单列（标签左 / 控件 / 字段说明） */
.access-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-inset);
}

.access-form__body {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-inset);
  max-width: 56rem;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-5);
}

.form-group__title {
  margin: 0;
  padding-bottom: var(--spacing-3);
  border-bottom: var(--border-width-thin) solid var(--divider);
  color: var(--on-surface);
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
}

.form-group__fields {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-6);
}

.form-row {
  display: grid;
  grid-template-columns: 7rem 22rem minmax(0, 1fr);
  column-gap: var(--spacing-4);
  align-items: center;
}

.form-label {
  position: relative;
  color: var(--on-surface);
  font: var(--font-body-m);
}

.form-label.required::before {
  content: "*";
  position: absolute;
  left: -0.5rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-error);
  font: var(--font-body-m);
}

.form-field {
  position: relative;
  min-width: 0;
}

.form-error {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 0.125rem;
  font: var(--font-caption-m);
  color: var(--color-error);
  white-space: nowrap;
}

.form-helper {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.form-unit {
  margin-left: var(--spacing-inline);
  color: var(--on-surface-variant);
  font: var(--font-body-m);
  vertical-align: middle;
}

.cascader-trigger {
  cursor: pointer;
}

/* 开关行 + 子项表单 */
.form-toggle-block {
  display: flex;
  flex-direction: column;
}

.form-switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
}

.form-switch-row__text {
  min-width: 0;
}

.form-switch-row__title {
  color: var(--on-surface);
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
}

.form-switch-row__desc {
  margin-top: var(--spacing-1);
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.form-switch-row__control {
  flex-shrink: 0;
}

.form-subpanel {
  margin-top: var(--spacing-4);
  display: flex;
  flex-direction: column;
  gap: var(--spacing-6);
  padding: var(--spacing-inset);
  border-radius: var(--radius-base);
  background: var(--surface-variant);
}

.form-subpanel__title {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
}

/* 底部操作区 */
.access-form__footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--spacing-inline);
  max-width: 56rem;
  padding-top: var(--spacing-4);
  border-top: var(--border-width-thin) solid var(--divider);
}


/* 表格区工具条与行内操作 */
.device-table__toolbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
}

.device-table__search {
  width: 16rem;
}

.toolbar-icon {
  color: var(--on-surface-variant);
  transition: color 0.2s;
}

.toolbar-icon:hover {
  color: var(--interactive-link);
}

.device-table__selection {
  display: flex;
  align-items: center;

        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

(function () {
  const { useState, useEffect, createContext, useContext } = React;
// Layer 1: 全局状态 — 主题模式与业务状态
// 换肤单轨驱动:isDark 只切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

(function () {
  const { useMemo, useState } = React;
  const { Button, Dropdown, Input, Table, message } = antd;
  const { Icon, DEVICE_STATUS, deviceTypeLabel, deviceTypeOptions, protocolLabel, protocolOptions } = __export;
  const SectionCard = __export.SectionCard;
  const StatusTag = __export.StatusTag;
function DeviceTable({ data, onDelete, onDeleteMany, onDuplicate, onAdd }) {
  const [keyword, setKeyword] = useState("");
  const [selectedKeys, setSelectedKeys] = useState([]);

  const statusFilters = Object.keys(DEVICE_STATUS).map((key) => ({
    text: DEVICE_STATUS[key].text,
    value: key,
  }));
  const typeFilters = deviceTypeOptions.map((o) => ({ text: o.label, value: o.value }));
  const protocolFilters = protocolOptions.map((o) => ({ text: o.label, value: o.value }));

  const rows = useMemo(() => {
    const kw = keyword.trim().toLowerCase();
    if (!kw) return data;
    return data.filter(
      (row) =>
        row.name.toLowerCase().indexOf(kw) >= 0 ||
        row.code.toLowerCase().indexOf(kw) >= 0 ||
        row.region.toLowerCase().indexOf(kw) >= 0
    );
  }, [data, keyword]);

  const columns = [
    {
      title: "设备名称",
      dataIndex: "name",
      key: "name",
      sorter: (a, b) => a.name.localeCompare(b.name, "zh"),
      render: (text, row) => (
        <a className="table-link" onClick={() => message.info("查看设备 " + row.code)}>
          {text}
        </a>
      ),
    },
    { title: "设备编码", dataIndex: "code", key: "code" },
    {
      title: "设备类型",
      dataIndex: "type",
      key: "type",
      filters: typeFilters,
      onFilter: (value, row) => row.type === value,
      render: (value) => deviceTypeLabel(value),
    },
    { title: "所属分组", dataIndex: "group", key: "group" },
    { title: "部署位置", dataIndex: "region", key: "region" },
    {
      title: "接入协议",
      dataIndex: "protocol",
      key: "protocol",
      filters: protocolFilters,
      onFilter: (value, row) => row.protocol === value,
      render: (value) => protocolLabel(value),
    },
    {
      title: "端口",
      dataIndex: "port",
      key: "port",
      align: "right",
      width: 90,
      sorter: (a, b) => (a.port || 0) - (b.port || 0),
      render: (value) => (value === null || value === undefined ? "—" : value),
    },
    {
      title: "采集周期(s)",
      dataIndex: "samples",
      key: "samples",
      align: "right",
      width: 120,
      sorter: (a, b) => a.samples - b.samples,
    },
    {
      title: "状态",
      dataIndex: "status",
      key: "status",
      width: 110,
      filters: statusFilters,
      onFilter: (value, row) => row.status === value,
      render: (value) => {
        const meta = DEVICE_STATUS[value] || { text: value, tone: "neutral" };
        return <StatusTag tone={meta.tone}>{meta.text}</StatusTag>;
      },
    },
    {
      title: "更新时间",
      dataIndex: "updatedAt",
      key: "updatedAt",
      width: 170,
      sorter: (a, b) => a.updatedAt.localeCompare(b.updatedAt),
    },
    {
      title: "操作",
      key: "action",
      width: 130,
      fixed: "right",
      render: (text, row) => (
        <div className="row-actions">
          <Icon
            name="pencil"
            size="0.875rem"
            className="row-action"
            title="编辑"
            onClick={() => message.info("编辑 " + row.code)}
          />
          <Icon
            name="copy"
            size="0.875rem"
            className="row-action"
            title="复制"
            onClick={() => onDuplicate(row.id)}
          />
          <Icon
            name="trash-2"
            size="0.875rem"
            className="row-action"
            title="删除"
            onClick={() => onDelete(row.id)}
          />
        </div>
      ),
    },
  ];

  const toolbar = (
    <div className="device-table__toolbar">
      <Input
        className="device-table__search"
        allowClear
        placeholder="搜索名称、编码或位置"
        value={keyword}
        suffix={<Icon name="search" size="0.875rem" />}
        onChange={(e) => setKeyword(e.target.value)}
      />
      <Icon
        name="rotate-ccw"
        size="1rem"
        className="toolbar-icon"
        title="刷新列表"
        onClick={() => {
          setKeyword("");
          message.success("列表已刷新");
        }}
      />
      <Dropdown
        menu={{
          items: [
            { key: "csv", label: "导出 CSV" },
            { key: "excel", label: "导出 Excel" },
          ],
          onClick: ({ key }) => message.success("已导出 " + rows.length + " 条记录（" + key + "）"),
        }}
      >
        <Button icon={<Icon name="file-down" size="0.875rem" />}>导出</Button>
      </Dropdown>
      <Button type="primary" icon={<Icon name="plus" size="0.875rem" />} onClick={onAdd}>
        新增配置
      </Button>
    </div>
  );

  return (
    <SectionCard
      title="设备接入列表"
      subtitle={"共 " + data.length + " 台设备 · 当前展示 " + rows.length + " 条"}
      extra={toolbar}
    >
      {selectedKeys.length > 0 ? (
        <div className="device-table__selection">
          <span className="device-table__selection-text">已选 {selectedKeys.length} 项</span>
          <div className="device-table__selection-actions">
            <a
              className="table-link"
              onClick={() => {
                message.success("已启用 " + selectedKeys.length + " 台设备");
                setSelectedKeys([]);
              }}
            >
              批量启用
            </a>
            <a
              className="table-link"
              onClick={() => {
                onDeleteMany(selectedKeys);
                setSelectedKeys([]);
              }}
            >
              批量删除
            </a>
          </div>
        </div>
      ) : null}

      <Table
        rowKey="id"
        size="middle"
        columns={columns}
        dataSource={rows}
        scroll={{ x: 1500 }}
        rowSelection={{
          selectedRowKeys: selectedKeys,
          onChange: setSelectedKeys,
          preserveSelectedRowKeys: true,
        }}
        pagination={{
          pageSize: 10,
          showSizeChanger: true,
          pageSizeOptions: ["10", "20", "50"],
          showTotal: (total) => "共 " + total + " 条",
        }}
      />
    </SectionCard>
  );
}
  Object.assign(__export, { DeviceTable });
})();

(function () {
  const { useRef, useState } = React;
  const { ConfigProvider, message } = antd;
  const { Icon, AppProvider, useApp, devices } = __export;
  const zhCN = __export.zhCN;
  const SectionCard = __export.SectionCard;
  const AccessForm = __export.AccessForm;
  const DeviceTable = __export.DeviceTable;
// App entry — ICT React page
// Layering: context.jsx(全局) → src/mock(数据) → src/components(复用组件) → src/views(视图) → app.jsx(布局骨架)











function Page() {
  const { isDark, toggleDark } = useApp();
  const [deviceList, setDevices] = useState(devices);
  const seqRef = useRef(1025);

  const addDevice = (record) => {
    const id = "D-" + seqRef.current;
    seqRef.current += 1;
    setDevices((prev) => [{ ...record, id }, ...prev]);
  };

  const duplicateDevice = (id) => {
    setDevices((prev) => {
      const hit = prev.find((row) => row.id === id);
      if (!hit) return prev;
      const copy = {
        ...hit,
        id: "D-" + seqRef.current,
        name: hit.name + "（副本）",
        code: hit.code + "-C",
        status: "pending",
      };
      seqRef.current += 1;
      return [copy, ...prev];
    });
    message.success("已复制设备配置");
  };

  const removeDevice = (id) => {
    setDevices((prev) => prev.filter((row) => row.id !== id));
    message.success("已删除 1 条配置");
  };

  const removeDevices = (ids) => {
    setDevices((prev) => prev.filter((row) => ids.indexOf(row.id) < 0));
    message.success("已删除 " + ids.length + " 条配置");
  };

  const scrollToForm = () => {
    const el = document.getElementById("access-form-anchor");
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
    message.info("请在上方表单填写新增配置");
  };

  return (
    <div className="page">
      <header className="top-bar">
        <div className="top-bar__brand">
          <Icon name="server" size="1.25rem" />
          <span className="top-bar__title">设备接入管理</span>
        </div>
        <div className="top-bar__tools">
          <span className="top-bar__hint">当前为{isDark ? "深色" : "浅色"}主题</span>
          <Icon
            name={isDark ? "sun" : "moon"}
            size="1rem"
            title="切换深色 / 浅色主题"
            onClick={toggleDark}
          />
        </div>
      </header>

      <main className="page__content">
        <div id="access-form-anchor">
          <SectionCard
            title="新增设备接入配置"
            subtitle="填写设备基础信息，并按需开启高级采集与告警通知。"
          >
            <AccessForm onSubmit={addDevice} />
          </SectionCard>
        </div>

        <DeviceTable
          data={deviceList}
          onDelete={removeDevice}
          onDeleteMany={removeDevices}
          onDuplicate={duplicateDevice}
          onAdd={scrollToForm}
        />
      </main>
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <ConfigProvider locale={zhCN} wave={{ disabled: true }}>
        <div className="app-root">
          <Page />
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
