                </div>
                <div className="md-sub">
                  {detailMember.memberId} · {detailRoleName}
                </div>
              </div>
            </div>
            <div className="md-grid">
              <div className="md-item"><span className="md-label">所属部门</span><span>{detailDept ? `${detailDept.deptName} / ${detailDept.teamName}` : "-"}</span></div>
              <div className="md-item"><span className="md-label">手机号</span><span className="mono-text">{maskPhone(detailMember.phone)}</span></div>
              <div className="md-item"><span className="md-label">加入时间</span><span>{detailMember.joinDate}</span></div>
              <div className="md-item"><span className="md-label">当前角色</span><span>{detailRoleName}</span></div>
            </div>
            <div className="md-section-title">最近操作记录</div>
            {memberAudits.length > 0 ? (
              <div className="md-audit-list">
                {memberAudits.map((a) => (
                  <div className="md-audit-row" key={a.auditId}>
                    <span className="mono-text md-audit-time">{a.time}</span>
                    <Tag color={ACTION_TAG_COLOR[a.auditAction]}>{a.auditAction}</Tag>
                    <span className="md-audit-module">{a.permModule}</span>
                    {a.result === "失败" ? <Tag color="error">失败</Tag> : <Tag color="success">成功</Tag>}
                  </div>
                ))}
              </div>
            ) : (
              <div className="md-empty">近 7 天暂无该成员的操作记录</div>
            )}
          </div>
        )}
      </Drawer>
    </section>
  );
}
  Object.assign(__export, { MemberTable });
})();

/* ===== src/views/security-policy/index.jsx ===== */
(function () {
  const { Slider, InputNumber, Checkbox, Switch, Select, Tag, message } = antd;
  const { Icon, useApp, LOGIN_METHODS, PASSWORD_VALIDITY_OPTIONS } = __export;
function SecurityPolicy() {
  const { policy, setPolicyField } = useApp();

  const enabledMethodNames = LOGIN_METHODS.filter((m) => policy.loginMethods.includes(m.methodId)).map(
    (m) => m.methodName
  );

  const toggleMethod = (methodId, checked) => {
    const next = checked
      ? [...policy.loginMethods, methodId]
      : policy.loginMethods.filter((x) => x !== methodId);
    if (next.length === 0) {
      message.warning("至少保留一种登录方式");
      return;
    }
    setPolicyField("loginMethods", next);
  };

  return (
    <section className="pc-card policy-card">
      <div className="section-head">
        <span className="section-icon"><Icon name="lock" size="1.125rem" /></span>
        <div>
          <div className="section-title">安全策略</div>
          <div className="section-sub">密码、会话与登录管控策略，调整后实时预览、统一保存生效</div>
        </div>
      </div>
      <div className="sub-cards">
        <div className="sub-card">
          <div className="sub-title">密码策略</div>
          <div className="sub-block">
            <div className="sub-label">
              密码最小长度
              <span className="sub-value">{policy.minPasswordLength} 位</span>
            </div>
            <Slider
              min={8}
              max={20}
              value={policy.minPasswordLength}
              onChange={(v) => setPolicyField("minPasswordLength", v)}
            />
            <div className="preview-text">
              <Icon name="info" size="0.875rem" className="preview-icon" />
              新密码至少 {policy.minPasswordLength} 位，须包含大小写字母与数字
            </div>
          </div>
          <div className="sub-block">
            <div className="sub-label">密码有效期</div>
            <Select
              value={policy.passwordValidityDays}
              options={PASSWORD_VALIDITY_OPTIONS}
              style={{ width: "9rem" }}
              onChange={(v) => setPolicyField("passwordValidityDays", v)}
            />
            <div className="preview-text">
              <Icon name="info" size="0.875rem" className="preview-icon" />
              每 {policy.passwordValidityDays} 天强制修改密码，到期前 7 天提醒
            </div>
          </div>
        </div>

        <div className="sub-card">
          <div className="sub-title">会话与双因子认证</div>
          <div className="sub-block">
            <div className="sub-label">会话超时</div>
            <div className="control-row">
              <InputNumber
                mode="spinner"
                variant="outlined"
                min={5}
                max={480}
                step={5}
                value={policy.sessionTimeoutMinutes}
                style={{ width: "8rem" }}
                onChange={(v) => {
                  if (v != null) setPolicyField("sessionTimeoutMinutes", v);
                }}
              />
              <span className="unit-text">分钟</span>
            </div>
            <div className="preview-text">
              <Icon name="info" size="0.875rem" className="preview-icon" />
              无操作 {policy.sessionTimeoutMinutes} 分钟后自动退出登录，需重新认证
            </div>
          </div>
          <div className="sub-block">
            <div className="sub-label">
              强制双因子认证
              <Tag className="mfa-tag" color={policy.forceMfa ? "success" : "default"}>
                {policy.forceMfa ? "已开启" : "未开启"}
              </Tag>
            </div>
            <Switch
              checked={policy.forceMfa}
              onChange={(v) => setPolicyField("forceMfa", v)}
            />
            <div className="preview-text">
              <Icon name="info" size="0.875rem" className="preview-icon" />
              {policy.forceMfa
                ? "全部成员登录时需完成短信 / 企业微信二次验证"
                : "未强制要求二次验证，建议敏感角色自行开启"}
            </div>
          </div>
        </div>

        <div className="sub-card">
          <div className="sub-title">允许登录方式</div>
          <div className="login-methods">
            {LOGIN_METHODS.map((m) => (
              <Checkbox
                key={m.methodId}
                checked={policy.loginMethods.includes(m.methodId)}
                onChange={(e) => toggleMethod(m.methodId, e.target.checked)}
              >
                {m.methodName}
              </Checkbox>
            ))}
          </div>
          <div className="preview-text">
            <Icon name="info" size="0.875rem" className="preview-icon" />
            已启用 {enabledMethodNames.length} 种：{enabledMethodNames.join("、") || "无"}
          </div>
        </div>
      </div>
    </section>
  );
}
  Object.assign(__export, { SecurityPolicy });
})();

/* ===== src/views/data-scope/index.jsx ===== */
(function () {
  const { useState } = React;
  const { Radio, Tag, Select, Checkbox, Modal, message } = antd;
  const { Icon, useApp, DEPTS, SCOPE_OPTIONS } = __export;
const DATA_TYPE_OPTIONS = ["订单数据", "会员数据", "财务报表", "库存数据", "日志数据"].map((t) => ({
  label: t,
  value: t,
}));

const VALIDITY_OPTIONS = [
  { value: 30, label: "30 天" },
  { value: 90, label: "90 天" },
  { value: 180, label: "180 天" },
];

function DataScope() {
  const { dataScope, setDataScope, exceptions, removeException, addException } = useApp();
  const disabled = dataScope === "all";

  // 新增例外授权表单
  const [addOpen, setAddOpen] = useState(false);
  const [exDept, setExDept] = useState(undefined);
  const [exTypes, setExTypes] = useState([]);
  const [exDays, setExDays] = useState(90);
  const [exErrors, setExErrors] = useState({ dept: "", types: "" });

  const openAdd = () => {
    setExDept(undefined);
    setExTypes([]);
    setExDays(90);
    setExErrors({ dept: "", types: "" });
    setAddOpen(true);
  };

  const confirmAdd = () => {
    const errors = { dept: exDept ? "" : "请选择要授权的部门", types: exTypes.length ? "" : "至少勾选一种可看数据类型" };
    setExErrors(errors);
    if (errors.dept || errors.types) return;
    const dept = DEPTS.find((d) => d.deptId === exDept);
    addException({
      deptName: dept.deptName,
      dataTypes: [...exTypes],
      validUntil: dayjs().add(exDays, "day").format("YYYY-MM-DD"),
    });
    setAddOpen(false);
    message.success(`已新增「${dept.deptName}」的跨部门授权，保存后生效`);
  };

  return (
    <section className="pc-card scope-card">
      <div className="section-head">
        <span className="section-icon"><Icon name="database" size="1.125rem" /></span>
        <div>
          <div className="section-title">数据权限范围</div>
          <div className="section-sub">控制角色可见的业务数据边界，例外授权可跨部门临时开放</div>
        </div>
      </div>
      <Radio.Group
        className="scope-group"
        value={dataScope}
        onChange={(e) => setDataScope(e.target.value)}
      >
        {SCOPE_OPTIONS.map((s) => (
          <Radio key={s.scopeId} value={s.scopeId} className="scope-radio">
            <span className="scope-name">{s.scopeName}</span>
            <span className="scope-desc">{s.scopeDesc}</span>
          </Radio>
        ))}
      </Radio.Group>
      <div className="exception-section">
        <div className="exception-head">
          <span className="exception-title">跨部门授权例外</span>
          <Tag color={disabled ? "default" : "blue"}>{exceptions.length} 条生效中</Tag>
          {disabled && <Tag color="warning">已选「全部数据」，例外配置自动失效</Tag>}
          {!disabled && (
            <a className="add-exception-link" onClick={openAdd}>
              <Icon name="plus" size="0.875rem" />
              新增例外授权
            </a>
          )}
        </div>
        <div className={"exception-list" + (disabled ? " is-disabled" : "")}>
          <div className="exc-row exc-head-row">
            <span>部门</span>
            <span>可看数据类型</span>
            <span>有效期至</span>
            <span>操作</span>
          </div>
          {exceptions.map((ex) => (
            <div className="exc-row" key={ex.exceptionId}>
              <span className="exc-dept">{ex.deptName}</span>
              <span className="exc-types">
                {ex.dataTypes.map((t) => (
                  <Tag key={t}>{t}</Tag>
                ))}
              </span>
              <span className="mono-text">{ex.validUntil}</span>
              <Icon
                name="trash-2"
                size="0.875rem"
                className="tbl-op"
                title="移除例外授权"
                onClick={() => {
                  removeException(ex.exceptionId);
                  message.info(`已移除「${ex.deptName}」的跨部门授权，保存后生效`);
                }}
              />
            </div>
          ))}
        </div>
      </div>

      {/* 新增例外授权 */}
      <Modal
        open={addOpen}
        title="新增跨部门授权例外"
        okText="确认新增"
        cancelText="取消"
        width={460}
        onOk={confirmAdd}
        onCancel={() => setAddOpen(false)}
      >
        <div className="ex-form">
          <div className="rm-field">
            <label className="form-label required" htmlFor="ex-dept">授权部门</label>
            <Select
              id="ex-dept"
              value={exDept}
              placeholder="选择要跨部门授权的部门"
              style={{ width: "100%" }}
              status={exErrors.dept ? "error" : undefined}
              options={DEPTS.filter((d) => !exceptions.some((e) => e.deptName === d.deptName)).map((d) => ({
                value: d.deptId,
                label: d.deptName,
              }))}
              onChange={(v) => {
                setExDept(v);
                setExErrors((p) => ({ ...p, dept: "" }));
              }}
            />
            {exErrors.dept && <div className="form-error">{exErrors.dept}</div>}
          </div>
          <div className="rm-field">
            <span className="form-label required">可看数据类型</span>
            <div className="ex-field">
              <Checkbox.Group
                options={DATA_TYPE_OPTIONS}
                value={exTypes}
                onChange={(vals) => {
                  setExTypes(vals);
                  setExErrors((p) => ({ ...p, types: "" }));
                }}
              />
              {exErrors.types && <div className="form-error">{exErrors.types}</div>}
            </div>
          </div>
          <div className="rm-field">
            <label className="form-label" htmlFor="ex-days">有效期</label>
            <div className="ex-validity">
              <Select id="ex-days" value={exDays} options={VALIDITY_OPTIONS} style={{ width: "8rem" }} onChange={setExDays} />
              <span className="ex-validity-hint">
                即 {dayjs().add(exDays, "day").format("YYYY-MM-DD")} 到期
              </span>
            </div>
          </div>
        </div>
      </Modal>
    </section>
  );
}
  Object.assign(__export, { DataScope });
})();

/* ===== src/views/audit-log/index.jsx ===== */
(function () {
  const { useState } = React;
  const { Table, Tag, Drawer } = antd;
  const { Icon, AUDIT_LOGS, AUDIT_ACTIONS, AUDIT_RESULTS, ACTION_TAG_COLOR, PERM_MODULES } = __export;
function AuditLog() {
  const [detail, setDetail] = useState(null);

  const columns = [
    {
      title: "时间",
      dataIndex: "time",
      key: "time",
      width: 164,
      sorter: (a, b) => a.time.localeCompare(b.time),
      defaultSortOrder: "descend",
      render: (time) => <span className="mono-text">{time}</span>,
    },
    {
      title: "操作人",
      dataIndex: "userName",
      key: "userName",
      width: 112,
      sorter: (a, b) => a.userName.localeCompare(b.userName, "zh"),
      render: (name) => (
        <div className="audit-user">
          <img className="audit-avatar" src="./assets/uploads/user.png" alt="" />
          <span>{name}</span>
        </div>
      ),
    },
    {
      title: "对象模块",
      dataIndex: "permModule",
      key: "permModule",
      filters: PERM_MODULES.map((m) => ({ text: m.moduleName, value: m.moduleName })),
      onFilter: (value, record) => record.permModule === value,
    },
    {
      title: "动作",
      dataIndex: "auditAction",
      key: "auditAction",
      width: 80,
      filters: AUDIT_ACTIONS.map((a) => ({ text: a, value: a })),
      onFilter: (value, record) => record.auditAction === value,
      render: (action) => <Tag color={ACTION_TAG_COLOR[action] || "default"}>{action}</Tag>,
    },
    {
      title: "IP 地址",
      dataIndex: "ip",
      key: "ip",
      width: 124,
      render: (ip) => <span className="mono-text">{ip}</span>,
    },
    {
      title: "结果",
      dataIndex: "result",
      key: "result",
      width: 84,
      filters: AUDIT_RESULTS.map((r) => ({ text: r, value: r })),
      onFilter: (value, record) => record.result === value,
      render: (result) => (result === "成功" ? <Tag color="success">成功</Tag> : <Tag color="error">失败</Tag>),
    },
  ];

  return (
    <section className="pc-card audit-card">
      <div className="section-head">
        <span className="section-icon"><Icon name="scroll-text" size="1.125rem" /></span>
        <div>
          <div className="section-title">操作审计日志</div>
          <div className="section-sub">2026-11-04 ~ 2026-11-09 关键操作回溯，点击行查看完整审计详情，失败记录以红色标识</div>
        </div>
      </div>
      <Table
        className="audit-table"
        size="middle"
        rowKey="auditId"
        columns={columns}
        dataSource={AUDIT_LOGS}
        sortDirections={["ascend", "descend", "ascend"]}
        showSorterTooltip={false}
        rowClassName={(record) => (record.result === "失败" ? "audit-row-fail row-click" : "row-click")}
        onRow={(record) => ({ onClick: () => setDetail(record) })}
        pagination={{
          pageSize: 8,
          showSizeChanger: true,
          showQuickJumper: { goButton: "跳转" },
          showTotal: (total) => `总记录数：${total}`,
        }}
      />
      <Drawer
        open={!!detail}
        onClose={() => setDetail(null)}
        title="审计详情"
        width={420}
      >
        {detail && (
          <div className="audit-drawer">
            <div className={"ad-head" + (detail.result === "失败" ? " fail" : "")}>
              <div className="ad-title">
                {detail.userName} · {detail.permModule}
              </div>
              <div className="ad-tags">
                <Tag color={ACTION_TAG_COLOR[detail.auditAction]}>{detail.auditAction}</Tag>
                {detail.result === "成功" ? <Tag color="success">成功</Tag> : <Tag color="error">失败</Tag>}
              </div>
            </div>
            <div className="md-grid">
              <div className="md-item"><span className="md-label">记录编号</span><span className="mono-text">{detail.auditId}</span></div>
              <div className="md-item"><span className="md-label">操作时间</span><span className="mono-text">{detail.time}</span></div>
              <div className="md-item"><span className="md-label">操作人</span><span>{detail.userName}</span></div>
              <div className="md-item"><span className="md-label">对象模块</span><span>{detail.permModule}</span></div>
              <div className="md-item"><span className="md-label">操作动作</span><span>{detail.auditAction}</span></div>
              <div className="md-item"><span className="md-label">来源 IP</span><span className="mono-text">{detail.ip}</span></div>
              <div className="md-item"><span className="md-label">执行结果</span><span>{detail.result}</span></div>
            </div>
            {detail.result === "失败" && (
              <div className="ad-note">
                <Icon name="circle-alert" size="0.875rem" className="ad-note-icon" />
                失败原因：目标对象处于锁定状态或操作人缺少对应操作权限，已记录并通知安全管理员复核。
              </div>
            )}
          </div>
        )}
      </Drawer>
    </section>
  );
}
  Object.assign(__export, { AuditLog });
})();

/* ===== src/views/footer-bar/index.jsx ===== */
(function () {
  const { Button, Badge, Tooltip, Popover, message } = antd;
  const { Icon, useApp } = __export;
const BREAKDOWN_LABELS = [
  ["matrix", "权限矩阵"],
  ["roleInfo", "角色信息"],
  ["policy", "安全策略"],
  ["scope", "数据范围"],
  ["exceptions", "例外授权"],
  ["members", "成员变更"],
];

function FooterBar() {
  const { changeCount, changeBreakdown, saveAll, resetAll } = useApp();

  const breakdownRows = BREAKDOWN_LABELS.map(([key, label]) => ({
    key,
    label,
    count: changeBreakdown[key] || 0,
  })).filter((r) => r.count > 0);

  const handleSave = () => {
    const n = changeCount;
    saveAll();
    message.success(`已保存 ${n} 项变更，权限与安全策略即时生效`);
  };

  const handleReset = () => {
    resetAll();
    message.info("已恢复至上次保存的配置，未保存变更已丢弃");
  };

  return (
    <footer className="footer-bar">
      <div className="footer-inner">
        <div className="footer-status">
          {changeCount > 0 ? (
            <>
              <Icon name="circle-alert" size="1rem" className="warn-icon" />
              <Popover
                placement="topLeft"
                title="变更明细"
                content={
                  <div className="cb-list">
                    {breakdownRows.map((r) => (
                      <div className="cb-row" key={r.key}>
                        <span>{r.label}</span>
                        <b>{r.count} 项</b>
                      </div>
                    ))}
                  </div>
                }
              >
                <span className="change-chip">
                  未保存变更 <b>{changeCount}</b> 项
                </span>
              </Popover>
              <span className="footer-note">点击可查看变更明细 · 涵盖权限矩阵 / 安全策略 / 数据权限 / 成员调整</span>
            </>
          ) : (
            <>
              <Icon name="circle-check-big" size="1rem" className="ok-icon" />
              <span className="ok-chip">全部配置已保存</span>
              <span className="footer-note">与线上策略一致</span>
            </>
          )}
          <Tooltip
            title="权限矩阵与安全策略保存后立即生效；成员在线会话将在下一次操作时应用新策略；成员角色调整与移除保存后即时同步组织架构人数。"
          >
            <span className="effect-tip">
              <Icon name="info" size="0.875rem" />
              变更生效说明
            </span>
          </Tooltip>
        </div>
        <div className="footer-actions">
          <Button icon={<Icon name="rotate-ccw" size="0.875rem" />} disabled={changeCount === 0} onClick={handleReset}>
            重置
          </Button>
          <Badge count={changeCount} offset={[-6, 6]} size="small">
            <Button
              type="primary"
              icon={<Icon name="save" size="0.875rem" />}
              disabled={changeCount === 0}
              onClick={handleSave}
            >
              保存变更
            </Button>
          </Badge>
        </div>
      </div>
    </footer>
  );
}
  Object.assign(__export, { FooterBar });
})();

/* ===== app.jsx ===== */
(function () {
  const { ConfigProvider, Empty, Breadcrumb, message } = antd;
  const { Icon, AppProvider, useApp, PERM_MODULES } = __export;
  const zhCN = __export.zhCN;
  const TopBar = __export.TopBar;
  const OrgTree = __export.OrgTree;
  const PermMatrix = __export.PermMatrix;
  const MemberTable = __export.MemberTable;
  const SecurityPolicy = __export.SecurityPolicy;
  const DataScope = __export.DataScope;
  const AuditLog = __export.AuditLog;
  const FooterBar = __export.FooterBar;
// App entry — ICT React page
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: 主题 + 权限中心业务状态)
//   Layer 2 mock data     → src/mock/              (org.js / perm.js / audit.js / policy.js)
//   Layer 3 reusable      → src/components/{name}/ (role-modal)
//   Layer 4 views         → src/views/{name}/      (top-bar / org-tree / perm-matrix / member-table /
//                                                   security-policy / data-scope / audit-log / footer-bar)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
//
// Styling: custom styles in component folder's index.css; prefer tokens for visual values.
















// 页头概览统计（置于 Provider 内，读取实时业务状态）
function PageHeadStats() {
  const { roles, members, changeCount } = useApp();
  const stats = [
    { key: "roles", label: "角色", value: roles.length, icon: "shield-check", warn: false },
    { key: "modules", label: "功能模块", value: PERM_MODULES.length, icon: "layout-grid", warn: false },
    { key: "members", label: "组织成员", value: members.length, icon: "users", warn: false },
    { key: "changes", label: "未保存变更", value: changeCount, icon: "circle-alert", warn: true },
  ];
  return (
    <div className="page-stats">
      {stats.map((s) => (
        <div className={"stat-chip" + (s.warn && s.value > 0 ? " warn" : "")} key={s.key}>
          <Icon name={s.icon} size="0.875rem" className="stat-icon" />
          <span className="stat-value">{s.value}</span>
          <span className="stat-label">{s.label}</span>
        </div>
      ))}
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <ConfigProvider
        locale={zhCN}
        wave={{ disabled: true }}
        renderEmpty={() => <Empty style={{ padding: "2rem 0" }} />}
        empty={{ image: "./assets/uploads/empty.svg" }}
        spin={{ indicator: <img src="./assets/uploads/loading.svg" alt="" className="custom-spin-indicator" /> }}
      >
        <div className="app-root">
          <TopBar />
          <div className="page-shell">
            <div className="page-head">
              <div className="page-title">
                <Breadcrumb
                  items={[
                    { title: <a onClick={() => message.info("演示原型：返回「系统设置」目录")}>系统设置</a> },
                    { title: "权限与安全" },
                  ]}
                />
                <h1>权限与安全</h1>
                <p className="page-desc">
                  集中维护组织架构、角色权限矩阵与安全策略，支持操作审计回溯与变更留痕
                </p>
              </div>
              <PageHeadStats />
            </div>
            <FooterBar />
            <main className="page-body">
              <OrgTree />
              <section className="content-col">
                <PermMatrix />
                <MemberTable />
                <div className="policy-row">
                  <SecurityPolicy />
                  <DataScope />
                </div>
                <AuditLog />
              </section>
            </main>
          </div>
        </div>
      </ConfigProvider>
    </AppProvider>
