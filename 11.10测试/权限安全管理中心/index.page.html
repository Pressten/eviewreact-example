  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}

  height: 8px;
  background: transparent;
  border: none;
}

/* Segmented 组件样式（占位，待填充 token 映射） */

  border-radius: var(--radius-md);
  padding: 0.125rem;
  background: var(--color-fill);

  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  min-height: initial;

  transition: none;

  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
  display: flex;
  flex-direction: column;
}

.page-shell {
  width: 100%;
  max-width: 112rem;
  margin: 0 auto;
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: var(--spacing-section) var(--spacing-page) var(--spacing-section);
  box-sizing: border-box;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  margin-bottom: var(--spacing-section);
  padding-bottom: var(--spacing-stack);
  border-bottom: 1px solid var(--divider);
}

.page-title h1 {
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  margin: 0.375rem 0 0;
  letter-spacing: 0.01em;
}

.page-title .ant-breadcrumb a {
  cursor: pointer;
}

.page-desc {
  margin: 0.25rem 0 0;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* 页头统计 chips */
.page-stats {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  flex: none;
  padding-bottom: 0.125rem;
}

.stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.875rem;
  background: var(--surface-container-highest);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-sm);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.stat-icon {
  color: var(--primary);
  flex: none;
}

.stat-value {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  font-variant-numeric: tabular-nums;
}

.stat-chip.warn {
  background: var(--error-container);
}

.stat-chip.warn .stat-icon,
.stat-chip.warn .stat-value {
  color: var(--error);
}

.page-body {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: stretch; /* 左侧导航面板与右侧内容列等高（锁定为屏幕剩余高度） */
  gap: var(--spacing-gutter);
  overflow: hidden;
}

.content-col {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
  overflow-y: auto; /* 内容超出屏幕高度时列内滚动 */
  overflow-x: hidden;
  padding-right: 0.25rem;
}

.policy-row {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: var(--spacing-gutter);
  align-items: stretch;
}

/* 内容卡片（Level 1）：阴影卡片，无描边 */
.pc-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: 1.25rem 1.5rem;
}

.section-head {
  display: flex;
  align-items: flex-start;
  gap: 0.625rem;
  margin-bottom: var(--spacing-stack);
}

.section-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-base);
  background: var(--primary-container);
  color: var(--primary);
  flex: none;
}

.section-title {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  line-height: 1.375;
}

.section-sub {
  margin-top: 0.125rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  line-height: 1.625;
}

@media (max-width: 90rem) {
  .policy-row {
    grid-template-columns: 1fr;
  }
}

/* 窄屏回退（px 基准，避免 rem 缩放导致断点漂移）：
   堆叠模式下由 page-body 整体滚动，content-col 不再单独滚 */
@media (max-width: 1100px) {
  .page-body {
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .org-panel {
    width: 100%;
    flex: none;
  }

  .org-panel .tree-scroll {
    max-height: 18rem;
  }

  .content-col {
    overflow: visible;
    height: auto;
    padding-right: 0;
  }
}


/* 顶部导航（原生 nav 自写，规范见 Menu.md 头部导航要求）：
   选中项品牌色 + 2px 底部下划线，未选中 transparent 占位防跳动 */
.top-bar {
  position: relative;
  z-index: 40;
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  height: 3.5rem;
  padding: 0 var(--spacing-page);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-sm);
}

/* 品牌区 */
.brand {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  flex: none;
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--on-primary);
  flex: none;
}

.brand-meta {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}

.brand-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.brand-sub {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.env-tag {
  margin-left: 0.25rem;
  margin-inline-end: 0;
  font-weight: var(--font-weight-normal);
}

/* 主导航：占满头部高度，下划线与头部底边齐平 */
.main-nav {
  display: flex;
  align-items: stretch;
  align-self: stretch;
  gap: 0.25rem;
  margin-left: 1.25rem;
}

.nav-item {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0 1.125rem;
  color: var(--on-surface-variant);
  font: var(--font-body-m);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px; /* 下划线压住头部投影起始线，避免 1px 缝隙 */
  transition: color 0.2s, border-color 0.2s;
}

.nav-icon {
  flex: none;
}

.nav-item:hover {
  color: var(--color-brand);
}

.nav-item.active {
  color: var(--color-brand);
  border-bottom-color: var(--color-brand);
  font-weight: var(--font-weight-semibold);
}

/* 右侧工具区 */
.top-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex: none;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.875rem;
  height: 1.875rem;
  border-radius: var(--radius-action);
  color: var(--on-surface-variant);
  padding: 0.25rem;
}

.icon-btn:hover {
  color: var(--color-brand);
  background: var(--surface-variant);
}

.divider-v {
  width: 1px;
  height: 1.125rem;
  background: var(--divider);
}

.operator {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.25rem 0.5rem 0.25rem 0.25rem;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: background-color 0.2s;
}

.operator:hover {
  background: var(--surface-variant);
}

.op-avatar {
  width: 1.875rem;
  height: 1.875rem;
  border-radius: var(--radius-full);
  object-fit: cover;
}

.op-meta {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}

.op-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}

.op-role {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.op-chevron {
  color: var(--on-surface-variant);
  flex: none;
}


/* 左侧组织面板：与右侧内容列等高（由 .page-body align-items:stretch 驱动），
   内部纵向弹性布局：头部/搜索固定，树区弹性滚动，部门分布与筛选状态沉底 */
.org-panel {
  width: 17.5rem;
  flex: none;
  display: flex;
  flex-direction: column;
  padding: 1.25rem;
  min-height: 0;
  align-self: stretch;
}

.tree-search {
  width: 100%;
  margin-bottom: 0.75rem;
  flex: none;
}

.search-icon {
  color: var(--text-placeholder);
}

.tree-scroll {
  flex: 0 1 auto; /* 自然高度，受限时内部滚动；剩余高度由筛选状态沉底吸收 */
  min-height: 8rem;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 0.25rem;
}

.org-tree {
  background: transparent;
  padding: 0.25rem 0;
}

.tree-node-label {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
}

.tree-node-label.root .tree-node-name {
  font-weight: var(--font-weight-semibold);
}

.tree-org-icon {
  color: var(--primary);
}

.tree-node-name {
  color: var(--on-surface);
}

/* 部门人数分布（沉底区） */
.dept-stats {
  flex: none;
  margin-top: 1rem;
  padding-top: 0.875rem;
  border-top: 1px solid var(--divider);
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
}

.dept-stats-title {
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  margin-bottom: 0.125rem;
}

.dept-stat-row {
  display: grid;
  grid-template-columns: 5rem 1fr 1.75rem;
  align-items: center;
  gap: 0.5rem;
  padding: 0.25rem 0.375rem;
  border-radius: var(--radius-base);
  cursor: pointer;
  transition: background-color 0.15s;
}

.dept-stat-row:hover {
  background: var(--surface-variant);
}

.dept-stat-row.active {
  background: var(--primary-container);
}

.dept-stat-name {
  font: var(--font-body-s);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dept-stat-bar {
  display: block;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: var(--surface-variant);
  overflow: hidden;
}

.dept-stat-row.active .dept-stat-bar {
  background: var(--surface-container-highest);
}

.dept-stat-fill {
  display: block;
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--primary);
  opacity: 0.55;
  transition: width 0.3s;
}

.dept-stat-row.active .dept-stat-fill {
  opacity: 1;
}

.dept-stat-count {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* 筛选状态（margin-top:auto 沉底，等高布局下与右列底部对齐） */
.tree-footer {
  flex: none;
  margin-top: auto;
  padding-top: 0.75rem;
  border-top: 1px solid var(--divider);
}

.tree-hint {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.tree-selected {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-body-s);
  color: var(--on-surface);
  background: var(--primary-container);
  border-radius: var(--radius-base);
  padding: 0.25rem 0.5rem;
}

.filter-icon {
  color: var(--primary);
}

.tree-selected a {
  color: var(--interactive-link);
  cursor: pointer;
  margin-left: 0.25rem;
}

.tree-selected a:hover {
  color: var(--interactive-link-hover);
}


.matrix-card .ant-tabs-content-holder {
  min-width: 0;
}

/* 页签栏右侧操作组 */
.tab-extra {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.role-tab-label {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
}

.matrix-panel {
  padding-top: 1rem;
}

.role-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 0.5rem 0.875rem;
  margin-bottom: 0.875rem;
  background: var(--primary-container);
  border-radius: var(--radius-base);
  color: var(--on-primary-container);
}

.role-desc {
  font: var(--font-body-s);
  color: var(--on-surface);
}

.role-count {
  font: var(--font-body-s);
  color: var(--primary);
  font-weight: var(--font-weight-medium);
  margin-left: auto;
  flex: none;
}

.revert-link {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  color: var(--interactive-link);
  cursor: pointer;
  font: var(--font-body-s);
  flex: none;
}

.revert-link:hover {
  color: var(--interactive-link-hover);
}

.matrix-grid {
  display: grid;
  grid-template-columns: minmax(9rem, 1.5fr) 6rem 5.5rem 5.5rem 5.5rem;
  border: 1px solid var(--divider);
  border-radius: var(--radius-base);
  overflow: hidden;
}

.mg-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 2.75rem;
  padding: 0.25rem 0.625rem;
  border-bottom: 1px solid var(--divider);
  background: var(--surface-container-highest);
  font: var(--font-body-m);
  transition: background-color 0.15s;
}

/* 列间竖向分隔（表头与表体统一） */
.matrix-grid > .mg-cell:nth-child(n+2) {
  border-left: 1px solid var(--divider);
}

.mg-body-row > .mg-cell:nth-child(n+2) {
  border-left: 1px solid var(--divider);
}

.mg-cell.mod {
  justify-content: flex-start;
}

.mg-head {
  background: var(--surface-variant);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.mg-body-row:last-child .mg-cell {
  border-bottom: none;
}

.mg-body-row.zebra .mg-cell {
  background: var(--surface-variant);
}

/* 单元格悬停反馈（行级 hover 因 display:contents 不可用，降级为单元格级） */
.mg-body-row .mg-cell:hover {
  background: var(--primary-container);
}

.module-name {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  color: var(--on-surface);
  cursor: help;
}

.module-help {
  color: var(--text-placeholder);
  flex: none;
}

.matrix-legend {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  margin-top: 0.75rem;
  flex-wrap: wrap;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.dot {
  width: 0.875rem;
  height: 0.875rem;
  border-radius: var(--radius-xs);
  flex: none;
  display: inline-block;
}

.dot-full {
  background: var(--primary);
}

.dot-half {
  background: linear-gradient(90deg, var(--primary) 50%, var(--surface-variant) 50%);
  box-shadow: inset 0 0 0 1px var(--outline);
}

.dot-empty {
  background: var(--surface-container-highest);
  box-shadow: inset 0 0 0 1px var(--outline);
}

.link-action {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  color: var(--interactive-link);
  cursor: pointer;
  font: var(--font-body-m);
}

.link-action:hover {
  color: var(--interactive-link-hover);
}


.rm-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-top: 0.5rem;
}

.rm-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
}

.rm-field {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.form-label {
  position: relative;
  font: var(--font-body-m);
  color: var(--on-surface);
  text-align: left;
}

.form-label.required::before {
  content: "*";
  position: absolute;
  left: -0.5rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--error);
  font: var(--font-body-m);
}

.form-field {
  position: relative;
}

.form-error {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 0.25rem;
  font: var(--font-caption-m);
  color: var(--error);
  white-space: nowrap;
}

.field-hint {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.perm-preview {
  border: 1px solid var(--divider);
  border-radius: var(--radius-base);
  padding: 0.25rem 0.875rem;
  max-height: 16.5rem;
  overflow: auto;
}

.pp-row {
  display: grid;
  grid-template-columns: minmax(7rem, 1fr) 3.5rem 3rem 3rem 3rem;
  align-items: center;
  min-height: 2.125rem;
  border-bottom: 1px solid var(--divider);
}

.pp-row:last-child {
  border-bottom: none;
}

.pp-row > span {
  text-align: center;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.pp-row > .ant-checkbox-wrapper {
  justify-self: center;
}

.pp-head {
  position: sticky;
  top: 0;
  background: var(--surface-container-highest);
  font-weight: var(--font-weight-medium);
  z-index: 1;
}

.pp-head > span:first-child {
  text-align: left;
}

.pp-module {
  text-align: left !important;
  color: var(--on-surface) !important;
  cursor: help;
}


.member-card .section-title {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.member-count-badge {
  margin-left: 0.25rem;
}

.member-cell {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.member-avatar {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  object-fit: cover;
  flex: none;
}

.member-cell a {
  color: var(--interactive-link);
  cursor: pointer;
}

.member-cell a:hover {
  color: var(--interactive-link-hover);
}

.mono-text {
  font-variant-numeric: tabular-nums;
  color: var(--on-surface);
}

.tbl-op {
  color: var(--on-surface-variant);
  margin-right: 1rem;
  vertical-align: middle;
}

.tbl-op:last-child {
  margin-right: 0;
}

.tbl-op:hover {
  color: var(--color-brand);
}

/* 批量操作条 */
.batch-bar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.5rem 0.875rem;
  margin-bottom: 0.75rem;
  background: var(--primary-container);
  border-radius: var(--radius-base);
  font: var(--font-body-s);
}

.batch-count b {
  color: var(--primary);
  font-weight: var(--font-weight-semibold);
  padding: 0 0.125rem;
}

.batch-bar a {
  color: var(--interactive-link);
  cursor: pointer;
}

.batch-bar a:hover {
  color: var(--interactive-link-hover);
}

.batch-bar .danger-link {
  color: var(--error);
}

.batch-bar .muted-link {
  color: var(--on-surface-variant);
  margin-left: auto;
}

/* 成员详情抽屉 */
.member-drawer {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.md-profile {
  display: flex;
  align-items: center;
  gap: 0.875rem;
  padding: 1rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
}

.md-avatar {
  width: 3.25rem;
  height: 3.25rem;
  border-radius: var(--radius-full);
  object-fit: cover;
  flex: none;
}

.md-name {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.md-sub {
  margin-top: 0.25rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.md-grid {
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.md-item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--divider);
  font: var(--font-body-m);
  color: var(--on-surface);
}

.md-label {
  color: var(--on-surface-variant);
  font: var(--font-body-s);
  flex: none;
}

.md-section-title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.md-audit-list {
  display: flex;
  flex-direction: column;
}

.md-audit-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--divider);
  font: var(--font-body-s);
}

.md-audit-row:last-child {
  border-bottom: none;
}

.md-audit-time {
  color: var(--on-surface-variant);

function makeInitialSnapshot() {

// 统计当前配置与已保存快照之间的差异数（按域拆分：矩阵单元格 / 角色信息 / 策略字段 / 数据范围 / 例外 / 成员变更）
function getChangeBreakdown(cur, snap) {
  const r = { matrix: 0, roleInfo: 0, policy: 0, scope: 0, exceptions: 0, members: 0 };
  const roleIds = new Set([...cur.roles.map((x) => x.roleId), ...snap.roles.map((x) => x.roleId)]);
  roleIds.forEach((roleId) => {
    const snapRole = snap.roles.find((x) => x.roleId === roleId);
    if (!snapRole) {
      r.roleInfo += 1; // 新建角色本身
      const p = cur.perms[roleId] || {};
      Object.keys(p).forEach((mid) => {
        const a = p[mid];
        r.matrix += (a.view ? 1 : 0) + (a.edit ? 1 : 0) + (a.delete ? 1 : 0);
      });
      return;
    }
    const curRole = cur.roles.find((x) => x.roleId === roleId);
    if (curRole.roleName !== snapRole.roleName) r.roleInfo += 1;
    if (curRole.description !== snapRole.description) r.roleInfo += 1;
    const cp = cur.perms[roleId] || {};
    const sp = snap.perms[roleId] || {};
    PERM_MODULES.forEach((m) => {
      PERM_ACTIONS.forEach((a) => {
        const now = !!(cp[m.moduleId] && cp[m.moduleId][a.actionId]);
        const was = !!(sp[m.moduleId] && sp[m.moduleId][a.actionId]);
        if (now !== was) r.matrix += 1;
      });
    });
  });
  Object.keys(cur.policy).forEach((k) => {
    if (JSON.stringify(cur.policy[k]) !== JSON.stringify(snap.policy[k])) r.policy += 1;
  });
  if (cur.dataScope !== snap.dataScope) r.scope += 1;
  const curExIds = new Set(cur.exceptions.map((e) => e.exceptionId));
  cur.exceptions.forEach((e) => {
    if (!snap.exceptions.some((s) => s.exceptionId === e.exceptionId)) r.exceptions += 1;
  });
  snap.exceptions.forEach((e) => {
    if (!curExIds.has(e.exceptionId)) r.exceptions += 1;
  });
  const snapMemberMap = new Map(snap.members.map((m) => [m.memberId, m]));
  const curMemberIds = new Set(cur.members.map((m) => m.memberId));
  cur.members.forEach((m) => {
    const s = snapMemberMap.get(m.memberId);
    if (!s) r.members += 1;
    else if (s.roleId !== m.roleId || s.status !== m.status) r.members += 1;
  });
  snap.members.forEach((m) => {
    if (!curMemberIds.has(m.memberId)) r.members += 1;
  });
  return r;
}

  const [members, setMembers] = useState(() => INITIAL_MEMBERS.map((m) => ({ ...m })));
  const [roles, setRoles] = useState(() => clone(INITIAL_ROLES));
  const [perms, setPerms] = useState(() => clone(INITIAL_PERMS));
  const [policy, setPolicy] = useState(() => clone(INITIAL_POLICY));
  const [dataScope, setDataScope] = useState("dept-sub");
  const [exceptions, setExceptions] = useState(() => clone(INITIAL_EXCEPTIONS));

  // ── 已保存快照 ──
  const [snapshot, setSnapshot] = useState(makeInitialSnapshot);

  // ── UI 联动状态 ──
  const [selectedDeptId, setSelectedDeptId] = useState(null); // 组织树选中节点（部门/小组），null 为全部
  const [activeRoleId, setActiveRoleId] = useState("role-super");

  const changeBreakdown = useMemo(
    () => getChangeBreakdown({ roles, perms, members, policy, dataScope, exceptions }, snapshot),
    [roles, perms, members, policy, dataScope, exceptions, snapshot]
  );

  const changeCount = useMemo(
    () => Object.values(changeBreakdown).reduce((sum, n) => sum + n, 0),
    [changeBreakdown]
  );

  // 各角色当前持有人数（与成员数据实时一致）
  const roleMemberCounts = useMemo(() => {
    const map = {};
    members.forEach((m) => {
      map[m.roleId] = (map[m.roleId] || 0) + 1;
    });
    return map;
  }, [members]);

  // 单个角色的未保存变更数（用于矩阵页签提示）
  const getRoleChangeCount = useCallback(
    (roleId) => {
      const snapRole = snapshot.roles.find((r) => r.roleId === roleId);
      const curRole = roles.find((r) => r.roleId === roleId);
      const cp = perms[roleId] || {};
      if (!snapRole) {
        let c = 1;
        Object.keys(cp).forEach((mid) => {
          const a = cp[mid];
          c += (a.view ? 1 : 0) + (a.edit ? 1 : 0) + (a.delete ? 1 : 0);
        });
        return c;
      }
      let c = 0;
      if (curRole.roleName !== snapRole.roleName) c += 1;
      if (curRole.description !== snapRole.description) c += 1;
      const sp = snapshot.perms[roleId] || {};
      PERM_MODULES.forEach((m) => {
        PERM_ACTIONS.forEach((a) => {
          const now = !!(cp[m.moduleId] && cp[m.moduleId][a.actionId]);
          const was = !!(sp[m.moduleId] && sp[m.moduleId][a.actionId]);
          if (now !== was) c += 1;
        });
      });
      return c;
    },
    [roles, perms, snapshot]
  );

  // ── 权限矩阵操作 ──
  const setPermCell = useCallback((roleId, moduleId, actionId, checked) => {
    setPerms((prev) => {
      const next = clone(prev);
      next[roleId] = next[roleId] || {};
      next[roleId][moduleId] = next[roleId][moduleId] || { view: false, edit: false, delete: false };
      next[roleId][moduleId][actionId] = checked;
      return next;
    });
  }, []);

  const setModuleAll = useCallback((roleId, moduleId, checked) => {
    setPerms((prev) => {
      const next = clone(prev);
      next[roleId] = next[roleId] || {};
      next[roleId][moduleId] = { view: checked, edit: checked, delete: checked };
      return next;
    });
  }, []);

  const setColumnAll = useCallback((roleId, actionId, checked) => {
    setPerms((prev) => {
      const next = clone(prev);
      next[roleId] = next[roleId] || {};
      PERM_MODULES.forEach((m) => {
        next[roleId][m.moduleId] = next[roleId][m.moduleId] || { view: false, edit: false, delete: false };
        next[roleId][m.moduleId][actionId] = checked;
      });
      return next;
    });
  }, []);

  const setRoleAll = useCallback((roleId, checked) => {
    setPerms((prev) => {
      const next = clone(prev);
      next[roleId] = {};
      PERM_MODULES.forEach((m) => {
        next[roleId][m.moduleId] = { view: checked, edit: checked, delete: checked };
      });
      return next;
    });
  }, []);

  // ── 角色 ──
  const upsertRole = useCallback((role, permMap) => {
    setRoles((prev) =>
      prev.some((r) => r.roleId === role.roleId)
        ? prev.map((r) => (r.roleId === role.roleId ? { ...r, ...role } : r))
        : [...prev, role]
    );
    setPerms((prev) => {
      const next = clone(prev);
      next[role.roleId] = clone(permMap);
      return next;
    });
    setActiveRoleId(role.roleId);
  }, []);

  // 撤销单个角色的未保存修改：恢复到快照；快照中不存在的新建角色则整体删除
  const revertRole = useCallback(
    (roleId) => {
      const snapRole = snapshot.roles.find((r) => r.roleId === roleId);
      if (!snapRole) {
        setRoles((prev) => prev.filter((r) => r.roleId !== roleId));
        setPerms((prev) => {
          const next = clone(prev);
          delete next[roleId];
          return next;
        });
        setActiveRoleId((cur) =>
          cur === roleId ? snapshot.roles[0].roleId : cur
        );
        return "removed";
      }
      setRoles((prev) => prev.map((r) => (r.roleId === roleId ? { ...snapRole } : r)));
      setPerms((prev) => {
        const next = clone(prev);
        next[roleId] = clone(snapshot.perms[roleId] || {});
        return next;
      });
      return "restored";
    },
    [snapshot]
  );

  // ── 成员 ──
  const adjustMemberRole = useCallback((memberId, roleId) => {
    setMembers((prev) => prev.map((m) => (m.memberId === memberId ? { ...m, roleId } : m)));
  }, []);

  const removeMember = useCallback((memberId) => {
    setMembers((prev) => prev.filter((m) => m.memberId !== memberId));
  }, []);

  // ── 安全策略 / 数据权限 ──
  const setPolicyField = useCallback((key, value) => {
    setPolicy((prev) => ({ ...prev, [key]: value }));
  }, []);

  const resetPolicyDefaults = useCallback(() => {
    setPolicy(clone(INITIAL_POLICY));
  }, []);

  const removeException = useCallback((exceptionId) => {
    setExceptions((prev) => prev.filter((e) => e.exceptionId !== exceptionId));
  }, []);

  const addException = useCallback((payload) => {
    setExceptions((prev) => [...prev, { exceptionId: `ex-${Date.now()}`, ...payload }]);
  }, []);

  // ── 保存 / 重置 ──
  const saveAll = useCallback(() => {
    setSnapshot({
      roles: clone(roles),
      perms: clone(perms),
      members: members.map((m) => ({ ...m })),
      policy: clone(policy),
      dataScope,
      exceptions: clone(exceptions),
    });
  }, [roles, perms, members, policy, dataScope, exceptions]);

  const resetAll = useCallback(() => {
    setRoles(clone(snapshot.roles));
    setPerms(clone(snapshot.perms));
    setMembers(snapshot.members.map((m) => ({ ...m })));
    setPolicy(clone(snapshot.policy));
    setDataScope(snapshot.dataScope);
    setExceptions(clone(snapshot.exceptions));
    if (!snapshot.roles.some((r) => r.roleId === activeRoleId)) {
      setActiveRoleId(snapshot.roles[0].roleId);
    }
  }, [snapshot, activeRoleId]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
    // 业务数据
    members, roles, perms, policy, dataScope, exceptions, snapshot,
    changeCount, changeBreakdown, roleMemberCounts, getRoleChangeCount,
    // UI 联动
    selectedDeptId, setSelectedDeptId, activeRoleId, setActiveRoleId,
    // 动作
    setPermCell, setModuleAll, setColumnAll, setRoleAll,
    upsertRole, revertRole, adjustMemberRole, removeMember,
    setPolicyField, resetPolicyDefaults, setDataScope, removeException, addException,
    saveAll, resetAll,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

(function () {
  const { useMemo, useState } = React;
  const { Tree, Input, Badge } = antd;
  const { Icon, useApp, ORG_INFO, DEPTS, TEAM_INDEX, ROOT_NODE_KEY } = __export;
function OrgTree() {
  const { members, selectedDeptId, setSelectedDeptId } = useApp();
  const [query, setQuery] = useState("");
  const [expandedKeys, setExpandedKeys] = useState([ROOT_NODE_KEY]);

  // 人数统计：与成员数据实时一致
  const counts = useMemo(() => {
    const team = {};
    const dept = {};
    let total = 0;
    members.forEach((m) => {
      const info = TEAM_INDEX[m.teamId];
      if (!info) return;
      total += 1;
      team[m.teamId] = (team[m.teamId] || 0) + 1;
      dept[info.deptId] = (dept[info.deptId] || 0) + 1;
    });
    return { team, dept, total };
  }, [members]);

  const treeData = useMemo(() => {
    const kw = query.trim();
    const match = (name) => !kw || name.includes(kw);
    const deptNodes = [];
    DEPTS.forEach((d) => {
      const teamNodes = d.teams
        .filter((t) => match(t.teamName) || match(d.deptName))
        .map((t) => ({
          key: t.teamId,
          title: (
            <span className="tree-node-label">
              <span className="tree-node-name">{t.teamName}</span>
              <Badge count={counts.team[t.teamId] || 0} overflowCount={999} size="small" style={{ backgroundColor: "var(--primary)" }} />
            </span>
          ),
        }));
      if (teamNodes.length === 0) return;
      deptNodes.push({
        key: d.deptId,
        title: (
          <span className="tree-node-label">
            <span className="tree-node-name">{d.deptName}</span>
            <Badge count={counts.dept[d.deptId] || 0} overflowCount={999} size="small" style={{ backgroundColor: "var(--primary)" }} />
          </span>
        ),
        children: teamNodes,
      });
    });
    return [
      {
        key: ROOT_NODE_KEY,
        title: (
          <span className="tree-node-label root">
            <Icon name="building-2" size="0.875rem" className="tree-org-icon" />
            <span className="tree-node-name">{ORG_INFO.orgName}</span>
            <Badge count={counts.total} overflowCount={999} size="small" style={{ backgroundColor: "var(--primary)" }} />
          </span>
        ),
        children: deptNodes,
      },
    ];
  }, [query, counts]);

  // 搜索时自动展开全部可见节点
  const effectiveExpanded = useMemo(() => {
    if (!query.trim()) return expandedKeys;
    const keys = [ROOT_NODE_KEY];
    treeData.forEach((root) =>
      (root.children || []).forEach((d) => {
        keys.push(d.key);
        (d.children || []).forEach((t) => keys.push(t.key));
      })
    );
    return keys;
  }, [query, expandedKeys, treeData]);

  const selectedName = useMemo(() => {
    if (!selectedDeptId) return "";
    if (selectedDeptId === ROOT_NODE_KEY) return ORG_INFO.orgName;
    const dept = DEPTS.find((d) => d.deptId === selectedDeptId);
    if (dept) return dept.deptName;
    const teamInfo = TEAM_INDEX[selectedDeptId];
    return teamInfo ? teamInfo.teamName : "";
  }, [selectedDeptId]);

  const maxDeptCount = Math.max(1, ...DEPTS.map((d) => counts.dept[d.deptId] || 0));

  return (
    <aside className="pc-card org-panel">
      <div className="section-head">
        <span className="section-icon"><Icon name="network" size="1.125rem" /></span>
        <div>
          <div className="section-title">组织架构</div>
          <div className="section-sub">{counts.total} 名成员 · 6 个部门 · 15 个小组</div>
        </div>
      </div>
      <Input
        className="tree-search"
        allowClear
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        placeholder="搜索部门或小组名称"
        suffix={<Icon name="search" size="0.875rem" className="search-icon" />}
      />
      <div className="tree-scroll">
        <Tree
          className="org-tree"
          treeData={treeData}
          expandedKeys={effectiveExpanded}
          selectedKeys={selectedDeptId ? [selectedDeptId] : []}
          onExpand={(keys) => setExpandedKeys(keys)}
          onSelect={(keys) => setSelectedDeptId(keys[0] || null)}
        />
      </div>
      <div className="dept-stats">
        <div className="dept-stats-title">部门人数分布</div>
        {DEPTS.map((d) => {
          const count = counts.dept[d.deptId] || 0;
          return (
            <div
              className={"dept-stat-row" + (selectedDeptId === d.deptId ? " active" : "")}
              key={d.deptId}
              onClick={() => setSelectedDeptId(selectedDeptId === d.deptId ? null : d.deptId)}
            >
              <span className="dept-stat-name" title={d.deptName}>{d.deptName}</span>
              <span className="dept-stat-bar">
                <span className="dept-stat-fill" style={{ width: `${(count / maxDeptCount) * 100}%` }} />
              </span>
              <span className="dept-stat-count">{count}</span>
            </div>
          );
        })}
      </div>
      <div className="tree-footer">
        {selectedDeptId ? (
          <span className="tree-selected">
            <Icon name="funnel" size="0.875rem" className="filter-icon" />
            已筛选：{selectedName}
            <a onClick={() => setSelectedDeptId(null)}>清除</a>
          </span>
        ) : (
          <span className="tree-hint">点击部门 / 小组节点，联动筛选右侧角色成员列表</span>
        )}
      </div>
    </aside>
  );
}
  Object.assign(__export, { OrgTree });
})();

/* ===== src/components/role-modal/index.jsx ===== */
(function () {
  const { useState } = React;
  const { Modal, Input, Select, Checkbox, Button, message } = antd;
  const { Icon, useApp, PERM_MODULES, PERM_ACTIONS, emptyPermMap } = __export;
// 新建 / 编辑角色 Modal（H5 表单骨架，规则见 Form.md）
function RoleModal({ mode, role, onClose }) {
  const { roles, perms, upsertRole } = useApp();
  const isEdit = mode === "edit";

  const [roleName, setRoleName] = useState(isEdit ? role.roleName : "");
  const [description, setDescription] = useState(isEdit ? role.description : "");
  const [copyFrom, setCopyFrom] = useState(undefined);
  const [permPreview, setPermPreview] = useState(() =>
    isEdit ? JSON.parse(JSON.stringify(perms[role.roleId] || emptyPermMap())) : emptyPermMap()
  );
  const [errors, setErrors] = useState({ roleName: "", description: "" });

  const setCell = (moduleId, actionId, checked) => {
    setPermPreview((prev) => ({
      ...prev,
      [moduleId]: { ...prev[moduleId], [actionId]: checked },
    }));
  };

  const setRowAll = (moduleId, checked) => {
    setPermPreview((prev) => ({
      ...prev,
      [moduleId]: { view: checked, edit: checked, delete: checked },
    }));
  };

  const handleCopyFrom = (value) => {
    setCopyFrom(value);
    if (value) {
      setPermPreview(JSON.parse(JSON.stringify(perms[value] || emptyPermMap())));
    } else {
      setPermPreview(emptyPermMap());
    }
  };

  const handleSubmit = () => {
    const nextErrors = { roleName: "", description: "" };
    const name = roleName.trim();
    if (!name) {
      nextErrors.roleName = "请输入角色名称";
    } else if (roles.some((r) => r.roleName === name && r.roleId !== (isEdit ? role.roleId : ""))) {
      nextErrors.roleName = "角色名称已存在，请更换";
    }
    if (!description.trim()) {
      nextErrors.description = "请输入角色描述";
    }
    setErrors(nextErrors);
    if (nextErrors.roleName || nextErrors.description) return;

    const roleId = isEdit ? role.roleId : `role-${Date.now()}`;
    upsertRole({ roleId, roleName: name, description: description.trim() }, permPreview);
    message.success(isEdit ? `角色「${name}」已更新，保存后生效` : `角色「${name}」已创建并切入该页签，保存后生效`);
    onClose();
  };

  return (
    <Modal
      open
      title={isEdit ? "编辑角色" : "新建角色"}
      width={680}
      okText={isEdit ? "保存修改" : "创建角色"}
      cancelText="取消"
      onOk={handleSubmit}
      onCancel={onClose}
    >
      <div className="rm-form">
        <div className="rm-row">
          <div className="rm-field">
            <label className="form-label required" htmlFor="rm-name">角色名称</label>
            <div className="form-field">
              <Input
                id="rm-name"
                value={roleName}
                maxLength={16}
                placeholder="如：内容运营"
                status={errors.roleName ? "error" : undefined}
                style={{ width: "100%" }}
                onChange={(e) => {
                  setRoleName(e.target.value);
                  setErrors((p) => ({ ...p, roleName: "" }));
                }}
              />
              {errors.roleName && <div className="form-error">{errors.roleName}</div>}
            </div>
          </div>
          <div className="rm-field">
            <label className="form-label" htmlFor="rm-copy">权限复制自</label>
            <Select
              id="rm-copy"
              value={copyFrom}
              allowClear
              placeholder="选择要复制权限的既有角色"
              style={{ width: "100%" }}
              disabled={isEdit}
              options={roles
                .filter((r) => !(isEdit && r.roleId === role.roleId))
                .map((r) => ({ value: r.roleId, label: r.roleName }))}
              onChange={handleCopyFrom}
            />
            <div className="field-hint">切换后将以该角色的权限覆盖下方勾选</div>
          </div>
        </div>
        <div className="rm-field">
          <label className="form-label required" htmlFor="rm-desc">角色描述</label>
          <div className="form-field">
            <Input.TextArea
              id="rm-desc"
              rows={2}
              maxLength={60}
              value={description}
              placeholder="一句话说明该角色的职责与权限边界"
              status={errors.description ? "error" : undefined}
              style={{ width: "100%" }}
              onChange={(e) => {
                setDescription(e.target.value);
                setErrors((p) => ({ ...p, description: "" }));
              }}
            />
            {errors.description && <div className="form-error">{errors.description}</div>}
          </div>
        </div>
        <div className="rm-field">
          <label className="form-label">权限预览勾选</label>
          <div className="perm-preview">
            <div className="pp-row pp-head">
              <span>功能模块</span>
              <span>全选</span>
              {PERM_ACTIONS.map((a) => (
                <span key={a.actionId}>{a.actionName}</span>
              ))}
            </div>
            {PERM_MODULES.map((m) => {
              const cell = permPreview[m.moduleId] || { view: false, edit: false, delete: false };
              const checkedCount = PERM_ACTIONS.filter((a) => cell[a.actionId]).length;
              return (
                <div className="pp-row" key={m.moduleId}>
                  <span className="pp-module" title={m.description}>{m.moduleName}</span>
                  <Checkbox
                    checked={checkedCount === 3}
                    indeterminate={checkedCount > 0 && checkedCount < 3}
                    onChange={(e) => setRowAll(m.moduleId, e.target.checked)}
                  />
                  {PERM_ACTIONS.map((a) => (
                    <Checkbox
                      key={a.actionId}
                      checked={!!cell[a.actionId]}
                      onChange={(e) => setCell(m.moduleId, a.actionId, e.target.checked)}
                    />
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </Modal>
  );
}
  Object.assign(__export, { RoleModal });
})();

/* ===== src/views/perm-matrix/index.jsx ===== */
(function () {
  const { useState } = React;
  const { Tabs, Checkbox, Badge, Button, Tag, Tooltip, message } = antd;
  const { Icon, useApp, PERM_MODULES, PERM_ACTIONS } = __export;
  const RoleModal = __export.RoleModal;
function MatrixPanel({ role }) {
  const { perms, setPermCell, setModuleAll, setColumnAll, setRoleAll, roleMemberCounts, getRoleChangeCount, revertRole } = useApp();
  const rolePerms = perms[role.roleId] || {};
  const memberCount = roleMemberCounts[role.roleId] || 0;
  const roleChangeCount = getRoleChangeCount(role.roleId);

  const cellOf = (moduleId) => rolePerms[moduleId] || { view: false, edit: false, delete: false };

  const columnState = (actionId) => {
    const checked = PERM_MODULES.filter((m) => cellOf(m.moduleId)[actionId]).length;
    return { checked: checked === PERM_MODULES.length, indeterminate: checked > 0 && checked < PERM_MODULES.length };
  };

  const rowState = (moduleId) => {
    const cell = cellOf(moduleId);
    const count = PERM_ACTIONS.filter((a) => cell[a.actionId]).length;
    return { checked: count === 3, indeterminate: count > 0 && count < 3 };
  };

  const totalChecked = PERM_MODULES.reduce(
    (sum, m) => sum + PERM_ACTIONS.filter((a) => cellOf(m.moduleId)[a.actionId]).length,
    0
  );
  const allState = {
    checked: totalChecked === PERM_MODULES.length * 3,
    indeterminate: totalChecked > 0 && totalChecked < PERM_MODULES.length * 3,
  };

  return (
    <div className="matrix-panel">
      <div className="role-meta">
        <span className="role-desc">{role.description}</span>
        {roleChangeCount > 0 && (
          <>
            <span className="role-count">{memberCount} 人持有该角色</span>
            <Tag color="warning">未保存 {roleChangeCount} 项</Tag>
            <a
              className="revert-link"
              onClick={() => {
                const result = revertRole(role.roleId);
                if (result === "removed") {
                  message.info(`已撤销新建角色「${role.roleName}」，并从页签移除`);
                } else {
                  message.info(`已撤销「${role.roleName}」的未保存修改，恢复至上次保存的配置`);
                }
              }}
            >
              <Icon name="rotate-ccw" size="0.75rem" />
              撤销修改
            </a>
          </>
        )}
        {roleChangeCount === 0 && <span className="role-count">{memberCount} 人持有该角色</span>}
      </div>
      <div className="matrix-grid">
        <div className="mg-cell mg-head mod">功能模块</div>
        <div className="mg-cell mg-head">
          <Checkbox
            checked={allState.checked}
            indeterminate={allState.indeterminate}
            onChange={(e) => setRoleAll(role.roleId, e.target.checked)}
          >
            全部
          </Checkbox>
        </div>
        {PERM_ACTIONS.map((a) => {
          const st = columnState(a.actionId);
          return (
            <div className="mg-cell mg-head" key={a.actionId}>
              <Checkbox
                checked={st.checked}
                indeterminate={st.indeterminate}
                onChange={(e) => setColumnAll(role.roleId, a.actionId, e.target.checked)}
              >
                {a.actionName}
              </Checkbox>
            </div>
          );
        })}
        {PERM_MODULES.map((m, i) => {
          const row = rowState(m.moduleId);
          return (
            <div className={"mg-body-row" + (i % 2 ? " zebra" : "")} key={m.moduleId} style={{ display: "contents" }}>
              <div className="mg-cell mod">
                <Tooltip title={m.description}>
                  <span className="module-name">
                    <Icon name="info" size="0.75rem" className="module-help" />
                    {m.moduleName}
                  </span>
                </Tooltip>
              </div>
              <div className="mg-cell">
                <Checkbox
                  checked={row.checked}
                  indeterminate={row.indeterminate}
                  onChange={(e) => setModuleAll(role.roleId, m.moduleId, e.target.checked)}
                />
              </div>
              {PERM_ACTIONS.map((a) => (
                <div className="mg-cell" key={a.actionId}>
                  <Checkbox
                    checked={!!cellOf(m.moduleId)[a.actionId]}
                    onChange={(e) => setPermCell(role.roleId, m.moduleId, a.actionId, e.target.checked)}
                  />
                </div>
              ))}
            </div>
          );
        })}
      </div>
      <div className="matrix-legend">
        <span className="legend-item"><span className="dot dot-full" />全选：模块全部操作已授权</span>
        <span className="legend-item"><span className="dot dot-half" />半选：部分操作已授权</span>
        <span className="legend-item"><span className="dot dot-empty" />空选：未授权任何操作</span>
      </div>
    </div>
  );
}

function PermMatrix() {
  const { roles, activeRoleId, setActiveRoleId, roleMemberCounts } = useApp();
  const [roleModal, setRoleModal] = useState(null); // { mode, role }

  const activeRole = roles.find((r) => r.roleId === activeRoleId) || roles[0];

  return (
    <section className="pc-card matrix-card">
      <div className="section-head">

        items={roles.map((role) => ({

          label: (
            <span className="role-tab-label">
              {role.roleName}
              <Badge
                count={roleMemberCounts[role.roleId] || 0}

                size="small"
                style={{ backgroundColor: "var(--primary)" }}

      {roleModal && (
        <RoleModal

    </section>
  );
}
  Object.assign(__export, { PermMatrix });
})();

(function () {
  const { useMemo, useState } = React;
  const { Table, Tag, Badge, Select, Modal, Drawer, message } = antd;
  const { Icon, useApp, TEAM_INDEX, DEPTS, maskPhone, AUDIT_LOGS, ACTION_TAG_COLOR } = __export;
function MemberTable() {
  const {
    members, roles, activeRoleId, selectedDeptId,
    adjustMemberRole, removeMember,
  } = useApp();

  const [adjustTarget, setAdjustTarget] = useState(null); // 单个调整角色
  const [targetRoleId, setTargetRoleId] = useState(undefined);
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [batchOpen, setBatchOpen] = useState(false); // 批量调整角色
  const [batchRoleId, setBatchRoleId] = useState(undefined);
  const [detailMember, setDetailMember] = useState(null); // 成员详情抽屉

  const activeRole = roles.find((r) => r.roleId === activeRoleId) || roles[0];

  const selectedNodeName = useMemo(() => {
    if (!selectedDeptId) return "";
    const dept = DEPTS.find((d) => d.deptId === selectedDeptId);
    if (dept) return dept.deptName;
    return TEAM_INDEX[selectedDeptId] ? TEAM_INDEX[selectedDeptId].teamName : "";
  }, [selectedDeptId]);

  const visibleMembers = useMemo(
    () =>
      members.filter((m) => {
        if (m.roleId !== activeRole.roleId) return false;
        if (!selectedDeptId) return true;
        const info = TEAM_INDEX[m.teamId];
        return info && (info.deptId === selectedDeptId || m.teamId === selectedDeptId);
      }),
    [members, activeRole.roleId, selectedDeptId]
  );

  // 当前可见且被勾选的成员（翻页/筛选后批量操作仅作用于可见勾选项）
  const selectedMembers = visibleMembers.filter((m) => selectedRowKeys.includes(m.memberId));

  const confirmRemove = (member) => {
    Modal.confirm({
      title: `确认移除成员「${member.userName}」？`,
      content: "移除后该成员将立即失去所有系统访问权限，组织架构人数同步扣减；如需恢复请重新邀请加入。",
      okText: "确认移除",
      okButtonProps: { danger: true },
      cancelText: "取消",

        message.success(`已移除成员「${member.userName}」，保存后正式生效`);
      },
    });
  };

  const confirmAdjust = () => {
    if (!adjustTarget || !targetRoleId) return;
    const role = roles.find((r) => r.roleId === targetRoleId);
    adjustMemberRole(adjustTarget.memberId, targetRoleId);
    message.success(`已将「${adjustTarget.userName}」调整为「${role.roleName}」，保存后正式生效`);
    setAdjustTarget(null);
    setTargetRoleId(undefined);
  };

  const confirmBatchRemove = () => {
    const names = selectedMembers.map((m) => m.userName);
    Modal.confirm({
      title: `确认批量移除 ${names.length} 名成员？`,
      content: `将移除：${names.join("、")}。移除后这些成员将失去所有系统访问权限，组织架构人数同步扣减。`,
      okText: "确认移除",
      okButtonProps: { danger: true },
      cancelText: "取消",
      onOk: () => {
        selectedMembers.forEach((m) => removeMember(m.memberId));
        setSelectedRowKeys([]);
        message.success(`已批量移除 ${names.length} 名成员，保存后正式生效`);
      },
    });
  };

  const confirmBatchAdjust = () => {
    if (!batchRoleId) return;
    const role = roles.find((r) => r.roleId === batchRoleId);
    selectedMembers.forEach((m) => adjustMemberRole(m.memberId, batchRoleId));
    setSelectedRowKeys([]);
    setBatchOpen(false);
    message.success(`已将 ${selectedMembers.length} 名成员批量调整为「${role.roleName}」，保存后正式生效`);
  };

  const memberAudits = useMemo(

      dataIndex: "userName",
      key: "userName",
      sorter: (a, b) => a.userName.localeCompare(b.userName, "zh"),

          <img className="member-avatar" src="./assets/uploads/user.png" alt="" />

            {name}
          </a>
        </div>
      ),
    },
    {
      title: "部门",
      key: "dept",
      filters: DEPTS.map((d) => ({ text: d.deptName, value: d.deptId })),

      },
    },
    {
      title: "手机号",
      dataIndex: "phone",
      key: "phone",
      render: (phone) => <span className="mono-text">{maskPhone(phone)}</span>,
      sorter: (a, b) => a.phone.localeCompare(b.phone),
    },
    {
      title: "加入时间",
      dataIndex: "joinDate",
      key: "joinDate",
      width: 112,
      sorter: (a, b) => a.joinDate.localeCompare(b.joinDate),
    },
    {
      title: "状态",
      dataIndex: "status",
      key: "status",
      width: 84,
      filters: [
        { text: "在职", value: "active" },
        { text: "停用", value: "disabled" },
      ],
      onFilter: (value, record) => record.status === value,
      render: (status) => (status === "active" ? <Tag color="success">在职</Tag> : <Tag>停用</Tag>),
    },
    {
      title: "操作",
      key: "ops",
      width: 80,
      render: (_, record) => (
        <>
          <Icon
            name="user-cog"
            size="0.875rem"
            className="tbl-op"
            title="调整角色"
            onClick={(e) => {
              e.stopPropagation && e.stopPropagation();
              setAdjustTarget(record);
              setTargetRoleId(undefined);
            }}
          />
          <Icon
            name="trash-2"
            size="0.875rem"
            className="tbl-op"
            title="移除"
            onClick={(e) => {
              e.stopPropagation && e.stopPropagation();
              confirmRemove(record);
            }}
          />
        </>
      ),
    },
  ];

  const detailDept = detailMember ? TEAM_INDEX[detailMember.teamId] : null;

        <span className="section-icon"><Icon name="users" size="1.125rem" /></span>
        <div>
          <div className="section-title">
            角色成员 · {activeRole.roleName}
            <Badge
              className="member-count-badge"
              count={visibleMembers.length}
              overflowCount={999}
              style={{ backgroundColor: "var(--primary)" }}
            />
          </div>
          <div className="section-sub">
            {selectedDeptId
              ? `已按组织节点「${selectedNodeName}」筛选（点击左侧组织树节点可切换或清除筛选）`
              : "勾选成员可批量调整角色或移除，点击姓名查看成员详情与操作记录"}
          </div>
        </div>
      </div>

      {selectedMembers.length > 0 && (
        <div className="batch-bar">
          <span className="batch-count">
            已选 <b>{selectedMembers.length}</b> 项
          </span>
          <a onClick={() => { setBatchOpen(true); setBatchRoleId(undefined); }}>批量调整角色</a>
          <a className="danger-link" onClick={confirmBatchRemove}>批量移除</a>
          <a className="muted-link" onClick={() => setSelectedRowKeys([])}>取消选择</a>
        </div>
      )}

      <Table
        className="member-table"
        size="middle"
        rowKey="memberId"
        columns={columns}
        dataSource={visibleMembers}
        sortDirections={["ascend", "descend", "ascend"]}
        showSorterTooltip={false}
        rowSelection={{
          selectedRowKeys,
          onChange: setSelectedRowKeys,
        }}
        pagination={{
          pageSize: 10,
          showSizeChanger: true,
          showQuickJumper: { goButton: "跳转" },
          showTotal: (total) => `总记录数：${total} 已选中行数：${selectedRowKeys.length}`,
        }}
      />

      {/* 单个调整角色 */}
      <Modal
        open={!!adjustTarget}
        title={adjustTarget ? `调整「${adjustTarget.userName}」的角色` : "调整角色"}
        okText="确认调整"
        cancelText="取消"
        width={440}
        onOk={confirmAdjust}
        onCancel={() => {
          setAdjustTarget(null);
          setTargetRoleId(undefined);
        }}
        okButtonProps={{ disabled: !targetRoleId }}
      >
        <div className="adjust-form">
          <div className="adjust-meta">
            <Icon name="user-cog" size="1rem" className="adjust-icon" />
            当前角色：
            <Tag color="blue">{activeRole.roleName}</Tag>
            调整后将离开当前成员列表并计入目标角色人数。
          </div>
          <div className="rm-field">

              value={targetRoleId}

              style={{ width: "100%" }}
              options={roles
                .filter((r) => r.roleId !== activeRole.roleId)
                .map((r) => ({ value: r.roleId, label: `${r.roleName}（${r.description.slice(0, 10)}…）` }))}
              onChange={setTargetRoleId}
            />
          </div>
        </div>
      </Modal>

      {/* 批量调整角色 */}
      <Modal
        open={batchOpen}
        title={`批量调整 ${selectedMembers.length} 名成员的角色`}
        okText="确认批量调整"
        cancelText="取消"
        width={440}
        onOk={confirmBatchAdjust}
        onCancel={() => setBatchOpen(false)}
        okButtonProps={{ disabled: !batchRoleId }}
      >
        <div className="adjust-form">
          <div className="adjust-meta">
            <Icon name="users" size="1rem" className="adjust-icon" />
            将批量调整：{selectedMembers.map((m) => m.userName).join("、")}，调整后立即计入目标角色人数。
          </div>
          <div className="rm-field">
            <label className="form-label required" htmlFor="batch-role">目标角色</label>
            <Select
              id="batch-role"
              value={batchRoleId}
              placeholder="请选择要调整到的角色"

      <Drawer

        title={detailMember ? "成员详情" : ""}
        width={420}
      >
        {detailMember && (
          <div className="member-drawer">
            <div className="md-profile">
