  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Badge 组件样式（占位，待填充 token 映射） */
.ant-badge {
  color: var(--color-text-primary);
}
.ant-badge .ant-badge-count {
  /* 单数字 16×16 正圆（半径=高度一半）；多位数字按内容+padding 撑开成胶囊；
       不设 line-height（antd 默认 20px 偏大会压偏文字），用 flex 垂直居中兜底 */
  box-sizing: border-box;
  min-width: 1rem;
  height: 1rem;
  padding: 0 0.25rem;
  border-radius: 0.5rem;
  align-items: center;
  font-size: var(--font-size-base);
  box-shadow: 0 0 0 1px var(--gray-0);
  background-color: var(--color-error);
  color: var(--color-text-inverse);

     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */

  transition: none;

  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
  overflow: hidden;
}

  display: flex;
  align-items: stretch;
}


/* 顶部导航 — 48px 高，承载全局导航 */
.top-bar {
  height: 3rem;

}

  color: var(--on-surface);
  white-space: nowrap;
}

  display: flex;
  align-items: stretch;
  align-self: stretch;
  gap: var(--spacing-2);
  margin-left: var(--spacing-4);
}

  display: inline-flex;

  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  border-bottom: 2px solid transparent;
  transition: color 0.15s;
}

.nav-item:hover {
  color: var(--primary);
}

.nav-item.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.top-tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  flex: none;
}

.ver-tag {
  margin-inline-end: 0;
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
}

.global-search {
  width: 18.75rem;
}

.search-icon {
  color: var(--on-surface-variant);
  cursor: pointer;
}

  color: var(--primary);
}

.theme-toggle {
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: color 0.15s;
}

}

  min-height: 0;
  background: var(--surface-container-highest);
  border-right: 1px solid var(--divider);
}

.sidebar-menu {
  flex: none;
  padding-top: var(--spacing-2);
  border-bottom: 1px solid var(--divider);
}

/* 去掉 antd inline 菜单的右侧竖线，与侧栏边框共存会显得厚重 */
.sidebar-menu .ant-menu {
  border-inline-end: none;
  background: transparent;
}

.tree-panel {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  padding: var(--spacing-2) var(--spacing-2) var(--spacing-6);
}

.tree-title {
  display: flex;
  align-items: center;
  gap: var(--spacing-1-5);
  padding: var(--spacing-2) var(--spacing-2) var(--spacing-1-5);
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0.06em;
  color: var(--on-surface-variant);
}

.tree-group-icon {
  color: var(--on-surface-variant);
}

/* 目录树节点标题：名称 + 计数（父节点带计数） */
.tree-node-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-2);
  width: 100%;
  padding-right: var(--spacing-1-5);
}

.tree-node-name {
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree-node-count {
  flex: none;
  font-size: var(--font-size-sm);
  color: var(--on-surface-variant);
}

/* 接口叶子节点：名称 + 等宽方法缩写 */
.tree-leaf-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-2);
  width: 100%;
  padding-right: var(--spacing-1-5);
}

.tree-leaf-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--on-surface);
}

.tree-leaf-method {
  flex: none;
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
}

.tlm-get {
  color: var(--success);
}
.tlm-post {
  color: var(--info);
}
.tlm-put {
  color: var(--critical);
}
.tlm-delete {
  color: var(--error);
}


/* 中栏文档容器 — 独立滚动区 + 文档卡 */
.doc-main {
  flex: 1 1 0;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--surface-container-lowest);
}

/* 面包屑条（页面级，置于灰底之上） */
.doc-crumb-bar {
  max-width: 58rem;
  margin: 0 auto;
  padding: var(--spacing-3) var(--spacing-4) 0;
}

.crumb-link {
  cursor: pointer;
  color: var(--on-surface-variant);
  transition: color 0.15s;
}

.crumb-link:hover {
  color: var(--interactive-link);
}

/* 文档卡 */
.doc-main-inner {
  max-width: 58rem;
  margin: var(--spacing-3) auto var(--spacing-10);
  padding: var(--spacing-6) var(--spacing-8) var(--spacing-8);
  background: var(--surface-container-highest);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

/* 版本切换行 */
.doc-version-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-4);
  flex-wrap: wrap;
  padding-bottom: var(--spacing-4);
  border-bottom: 1px solid var(--divider);
}

.version-switch {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
}

.version-label {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.version-note {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* 文档章节通用 */
.doc-section {
  padding-top: var(--spacing-8);
  scroll-margin-top: var(--spacing-4);
}

.section-head {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  margin-bottom: var(--spacing-4);
}

.section-no {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  color: var(--primary);
}

.section-title {
  margin: 0;
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.section-lead {
  margin: 0 0 var(--spacing-4);
  font: var(--font-body-m);
  color: var(--on-surface);
  max-width: 46rem;
}

.doc-footer {
  margin-top: var(--spacing-8);
  padding-top: var(--spacing-4);
  border-top: 1px solid var(--divider);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.footer-link {
  margin-left: var(--spacing-3);
  color: var(--interactive-link);
  cursor: pointer;
}

.footer-link:hover {
  color: var(--interactive-link-hover);
}


/* 概述章节 — 版本化标题 / 适用性说明横幅 / 统计 / 基础信息 */
.overview-head {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  margin-bottom: var(--spacing-4);
  flex-wrap: wrap;
}

.overview-title {
  margin: 0;
  font: var(--font-size-3xl) / var(--line-height-sm) var(--font-family);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.overview-ver-tag {
  margin-inline-end: 0;
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
}

/* 适用性说明横幅 — 无左侧色条，纯容器色 */
.banner {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-2);
  padding: var(--spacing-3) var(--spacing-4);
  border-radius: var(--radius-base);
  margin-bottom: var(--spacing-4);
}

.banner-icon {
  flex: none;
  margin-top: 0.125rem;
}

.banner-text {
  font: var(--font-body-m);
  line-height: var(--line-height-base);
}

.banner-info {
  background: var(--info-container);
  color: var(--on-info-container);
}
.banner-info .banner-icon {
  color: var(--info);
}

.banner-critical {
  background: var(--critical-container);
  color: var(--on-critical-container);
}
.banner-critical .banner-icon {
  color: var(--critical);
}

.banner-warning {
  background: var(--warning-container);
  color: var(--on-warning-container);
}
.banner-warning .banner-icon {
  color: var(--warning);
}

/* 统计行 */
.stat-row {
  display: flex;
  gap: var(--spacing-gutter);
  margin-bottom: var(--spacing-4);
  flex-wrap: wrap;
}

.stat-item {
  flex: 1 1 0;
  min-width: 8rem;
  padding: var(--spacing-3) var(--spacing-4);
  background: var(--surface-variant);
  border-radius: var(--radius-base);
}

.stat-value {
  font: var(--font-display-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  font-variant-numeric: tabular-nums;
}

.stat-label {
  margin-top: 0.25rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

/* 基础信息网格 */
.baseinfo-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--spacing-2);
}

.baseinfo-item {
  padding: var(--spacing-2) var(--spacing-3);
  border-radius: var(--radius-base);
  background: var(--surface-container-highest);
  border: 1px solid var(--outline-variant);
}

.baseinfo-label {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.baseinfo-value {
  margin-top: 0.25rem;
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  word-break: break-all;
}

.mono {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
}


/* 认证方式章节 */
.term-inline {
  color: var(--interactive-link);
  cursor: help;
  border-bottom: 1px dashed var(--interactive-link);
  padding-bottom: 0.0625rem;
  margin: 0 0.125rem;
}

/* 密钥说明卡 */
.cred-card {
  border: 1px solid var(--outline-variant);
  border-radius: var(--radius-base);
  padding: var(--spacing-3) var(--spacing-4);
  margin-bottom: var(--spacing-4);
  background: var(--surface-container-highest);
}

.cred-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--spacing-2);
}

.cred-card-title {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.cred-reset-link {
  font: var(--font-body-s);
  color: var(--interactive-link);
  cursor: pointer;
}

.cred-reset-link:hover {
  color: var(--interactive-link-hover);
}

.cred-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-2) 0;
  border-bottom: 1px dashed var(--outline-variant);
}

.cred-row:last-of-type {
  border-bottom: none;
}

.cred-label {
  flex: none;
  width: 5rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface-variant);
}

.cred-value {
  flex: 1 1 0;
  min-width: 0;
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-md);
  color: var(--on-surface);
  word-break: break-all;
}

.cred-actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

.cred-action-icon {
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: color 0.15s;
}

.cred-action-icon:hover {
  color: var(--primary);
}

.cred-action-icon.copied {
  color: var(--success);
}

.cred-tip {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-2);
  margin-top: var(--spacing-2);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  line-height: var(--line-height-md);
}

.cred-tip-icon {
  flex: none;
  margin-top: 0.1875rem;
  color: var(--critical);
}

/* 名词解释列表 */
.glossary-list {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
  margin-bottom: var(--spacing-4);
}

.glossary-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  flex-wrap: wrap;
}

.term-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1);
  padding: 0.1875rem var(--spacing-2);
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--primary);
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  cursor: help;
  white-space: nowrap;
}

.glossary-brief {
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.glossary-tip-text {
  display: block;
  max-width: 22rem;
  line-height: var(--line-height-md);
}

.auth-code-block {
  max-width: 46rem;
}


/* 等宽代码块 — 开发者文档风 */
.code-block {
  border-radius: var(--radius-base);
  overflow: hidden;
}

.code-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.375rem 0.75rem;
  background: var(--surface-variant);
  border-bottom: 1px solid var(--outline-variant);
}

.code-lang {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
}

.code-copy {
  color: var(--on-surface-variant);
  transition: color 0.15s;
}

.code-copy:hover {
  color: var(--primary);
}

.code-copy.copied {
  color: var(--success);
}

.code-pre {
  margin: 0;
  padding: 0.875rem 1rem;
  background: var(--surface-variant);
  overflow-x: auto;
}

.code-pre code {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-md);
  line-height: var(--line-height-md);
  color: var(--on-surface);
  white-space: pre;
}


/* 快速开始章节 — 折叠面板逐步展开 */
.qs-collapse {
  background: var(--surface-container-highest);
}

.qs-label {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  min-width: 0;
}

.qs-no {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  color: var(--primary);
  flex: none;
}

.qs-title {
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.qs-dur {
  margin-left: auto;
  flex: none;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.qs-body {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-3);
}

.qs-intro {
  margin: 0;
  font: var(--font-body-m);
  color: var(--on-surface);
  max-width: 46rem;
}

.qs-note {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-2);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  line-height: var(--line-height-md);
}

.qs-note-icon {
  flex: none;
  margin-top: 0.1875rem;
  color: var(--info);
}

.qs-next {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1-5);
  align-self: flex-start;
  font: var(--font-body-m);
  color: var(--interactive-link);
  cursor: pointer;
}

.qs-next:hover {
  color: var(--interactive-link-hover);
}


/* 错误码章节 — 可搜索速查表 */
.err-toolbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  margin-bottom: var(--spacing-3);
}

.err-search {
  width: 22rem;
  max-width: 100%;
}

.err-search-icon {
  color: var(--on-surface-variant);
}

.err-count {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.err-clear {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-body-s);
  color: var(--interactive-link);
  cursor: pointer;
}

.err-clear:hover {
  color: var(--interactive-link-hover);
}

.err-table {
  width: 100%;
  border-collapse: collapse;
  font: var(--font-body-m);
}

.err-table th {
  text-align: left;
  padding: var(--spacing-2) var(--spacing-3);
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface-variant);
  background: var(--surface-variant);
  border-bottom: 1px solid var(--outline-variant);
  white-space: nowrap;
}

.err-table td {
  padding: var(--spacing-2) var(--spacing-3);
  border-bottom: 1px solid var(--divider);
  color: var(--on-surface);
  vertical-align: top;
  line-height: var(--line-height-md);
}

.err-table tbody tr:hover td {
  background: var(--surface-variant);
}

.col-code,
.col-http {
  width: 6rem;
}

.col-meaning {
  width: 10rem;
}

.err-code {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-weight: var(--font-weight-semibold);
  color: var(--error);
}

.err-http {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  color: var(--on-surface-variant);
}

.err-meaning {
  font-weight: var(--font-weight-medium);
}

.err-suggestion {
  color: var(--on-surface-variant);
}

/* 空结果 */
.err-empty {
  padding: var(--spacing-8) 0;
  text-align: center;
}

.err-empty-text {
  font: var(--font-body-m);
  color: var(--on-surface-variant);
  margin-bottom: var(--spacing-3);
}

.err-clear-main {
  font: var(--font-body-m);
  color: var(--interactive-link);
  cursor: pointer;
}

.err-clear-main:hover {
  color: var(--interactive-link-hover);
}


/* 接口列表章节 — 筛选 / 表格 / 分页 */
.section-head .api-total {
  margin-left: auto;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.api-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-3);
  flex-wrap: wrap;
  margin-bottom: var(--spacing-3);
}

/* 方法筛选 chips（即时生效） */
.method-filter {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex-wrap: wrap;
}

.method-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1-5);
  padding: 0.1875rem var(--spacing-3);
  border-radius: var(--radius-full);
  border: 1px solid var(--outline);
  background: var(--surface-container-highest);
  font: var(--font-body-s);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}

.method-chip:hover {
  color: var(--on-surface);
  border-color: var(--on-surface-variant);
}

.method-chip.active {
  background: var(--primary-container);
  color: var(--primary);
  border-color: var(--primary);
  font-weight: var(--font-weight-semibold);
}

.chip-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: var(--radius-full);
  flex: none;
}

.cd-get {
  background: var(--success);
}
.cd-post {
  background: var(--info);
}
.cd-put {
  background: var(--critical);
}
.cd-delete {
  background: var(--error);
}

.chip-count {
  font-size: var(--font-size-sm);
  opacity: 0.75;
}

/* 关键词提示条 */
.kw-bar {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.kw-clear {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  color: var(--interactive-link);
  cursor: pointer;
}

.kw-clear:hover {
  color: var(--interactive-link-hover);
}

/* 接口表格 */
.api-table {
  width: 100%;
  border-collapse: collapse;
  font: var(--font-body-m);
}

.api-table th {
  text-align: left;
  padding: var(--spacing-2) var(--spacing-3);
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface-variant);
  background: var(--surface-variant);
  border-bottom: 1px solid var(--outline-variant);
  white-space: nowrap;
}

.api-table td {
  padding: var(--spacing-3);
  border-bottom: 1px solid var(--divider);
  color: var(--on-surface);
  vertical-align: top;
  line-height: var(--line-height-md);
}

.api-table tbody tr:hover td {
  background: var(--surface-variant);
}

/* 即将下线：警示行样式（critical 容器底） */
.api-table tbody tr.row-deprecating td,
.api-table tbody tr.row-deprecating:hover td {
  background: var(--critical-container);
}

/* 已下线：禁用态 */
.api-table tbody tr.row-sunset td {
  color: var(--text-disabled);
}

.api-table tbody tr.row-sunset .api-path,
.api-table tbody tr.row-sunset .api-time {
  color: var(--text-disabled);
}

/* 当前选中行（选中态优先于 hover / 警示底色） */
.api-table tbody tr.row-selected td,
.api-table tbody tr.row-selected:hover td {
  background: var(--primary-container);
}

.col-name {
  width: 11rem;
}
.col-method {
  width: 5.5rem;
}
.col-path {
  width: 13rem;
}
.col-time {
  width: 6.5rem;
}
.col-status {
  width: 6rem;
}

.api-name-link {
  color: var(--interactive-link);
  cursor: pointer;
  font-weight: var(--font-weight-medium);
}

.api-name-link:hover {
  color: var(--interactive-link-hover);
}

td .status-tag {
  margin-left: var(--spacing-1-5);
}

.api-path {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-md);
  color: var(--on-surface);
  word-break: break-all;
}

.api-desc {
  color: var(--on-surface-variant);
}

.api-time {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-base);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

/* 分页 */
.api-pagination {
  display: flex;
  justify-content: flex-end;
  padding-top: var(--spacing-4);
}

/* 空结果 */
.api-empty {
  padding: var(--spacing-6) 0;
  text-align: center;
}

.api-empty-clear {
  font: var(--font-body-m);
  color: var(--interactive-link);
  cursor: pointer;
}

.api-empty-clear:hover {
  color: var(--interactive-link-hover);
}


/* HTTP 方法分色标签 — 沿用 Swagger 语义惯例：GET 绿 / POST 蓝 / PUT 橙 / DELETE 红 */
.method-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 3.25rem;
  padding: 0.0625rem 0.375rem;
  border-radius: var(--radius-xs);
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-base);
}

.m-get {
  color: var(--success);
  background: var(--success-container);
}
.m-post {
  color: var(--info);
  background: var(--info-container);
}
.m-put {
  color: var(--critical);
  background: var(--critical-container);
}
.m-delete {
  color: var(--error);
  background: var(--error-container);
}

/* 目录树 / 紧凑场景的迷你变体 */
.method-tag-mini {
  min-width: 2.25rem;
  padding: 0 0.25rem;
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-medium);
}


/* 接口状态标签 */
.status-tag {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  padding: 0.0625rem 0.5rem;
  border-radius: var(--radius-full);
  font-size: var(--font-size-base);
  line-height: var(--line-height-base);
}

.st-active {
  color: var(--success);
  background: var(--success-container);
}

.st-deprecating {
  color: var(--critical);
  background: var(--critical-container);
  font-weight: var(--font-weight-medium);
}

.st-sunset {
  color: var(--on-surface-variant);
  background: var(--surface-variant);
}

/* 版本新增标记 */
.st-new {
  color: var(--primary);
  background: var(--primary-container);
  font-weight: var(--font-weight-medium);
}


/* 右侧调试入口卡 */
.debug-aside {
  width: 18.75rem;
  flex: none;
  min-height: 0;
  overflow-y: auto;
  background: var(--surface-container-lowest);
  border-left: 1px solid var(--divider);
  padding: var(--spacing-3);
}

.debug-card {
  position: sticky;
  top: 0;
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: var(--spacing-4);
}

.debug-head {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  margin-bottom: var(--spacing-2);
}

.debug-head-icon {
  color: var(--primary);
}

.debug-head-title {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.debug-intro {
  margin: 0 0 var(--spacing-3);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  line-height: var(--line-height-md);
}

/* 空态引导 */
.debug-empty {
  margin-top: var(--spacing-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-2);
}

.debug-empty .ant-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-1-5);
}

/* 选中接口摘要 */
.debug-summary {
  margin-top: var(--spacing-4);
}

.summary-path-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  margin-bottom: var(--spacing-2);
}

.summary-path {
  font-family: ui-monospace, "Cascadia Mono", "Source Code Pro", Consolas, "Courier New", monospace;
  font-size: var(--font-size-md);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  word-break: break-all;
}

.summary-name {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  font: var(--font-body-l);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.summary-name .status-tag {
  flex: none;
}

.summary-status {
  margin-top: var(--spacing-1-5);
}

.summary-desc {
  margin: var(--spacing-2) 0 var(--spacing-3);
  font: var(--font-body-s);
  color: var(--on-surface-variant);

.summary-meta {

// 按版本返回可用接口：v1 比 v2 少 2 个（v2 引入的订阅接口），v3 比 v2 多 2 个（数据分析）
function getApisForVersion(version) {
  return APIS.filter((api) => Boolean(api.status[version]));
}

// 接口在指定版本下的状态：active 正常 / deprecating 即将下线 / sunset 已下线
function getStatusInVersion(api, version) {
  return api.status[version] || "active";
}

// 是否标记为当前版本的「新增」接口（v1 存档不显示新增标记）
function isNewInVersion(api, version) {
  return api.since === version && version !== "v1";
}

// 接口所属分组与子分组的展示名称
function getGroupPath(api) {
  const group = API_GROUPS.find((item) => item.key === api.group);
  const sub = group ? group.subgroups.find((item) => item.key === api.subgroup) : null;
  return {
    groupName: group ? group.name : "-",
    subgroupName: sub ? sub.name : "-",
  };
}

// 构建目录树纯数据（title 渲染由视图层完成，保持 mock 层无 React 依赖）
function buildTreeData(apis) {
  return API_GROUPS.map((group) => {
    const groupApis = apis.filter((api) => api.group === group.key);
    if (groupApis.length === 0) return null;
    const children = group.subgroups
      .map((sub) => {
        const subApis = groupApis.filter((api) => api.subgroup === sub.key);
        if (subApis.length === 0) return null;
        return {
          key: `s:${group.key}/${sub.key}`,
          nodeType: "sub",
          name: sub.name,
          count: subApis.length,
          children: subApis.map((api) => ({
            key: `a:${api.apiId}`,
            nodeType: "api",
            name: api.name,
            method: api.method,
            isLeaf: true,
          })),
        };
      })
      .filter(Boolean);
    return {
      key: `g:${group.key}`,
      nodeType: "group",
      name: group.name,
      icon: group.icon,
      count: groupApis.length,
      children,
    };
  }).filter(Boolean);
}
  Object.assign(__export, { getApisForVersion, getStatusInVersion, isNewInVersion, getGroupPath, buildTreeData, VERSION_META, VERSION_ORDER, API_GROUPS, APIS });

  const [selectedApiId, setSelectedApiId] = useState(null);

(function () {
  const { useState, useEffect, useMemo } = React;
  const { Menu, Tree } = antd;
  const { Icon, useApp, buildTreeData } = __export;
// Layer 4: 左侧栏 — 文档栏目 Menu（章节滚动定位）+ 接口目录树 Tree（资源分组、≥3 层）







const SECTION_ITEMS = [
  { key: "overview", icon: "book-open", label: "概述" },
  { key: "auth", icon: "key-round", label: "认证方式" },
  { key: "quickstart", icon: "rocket", label: "快速开始" },
  { key: "errors", icon: "circle-alert", label: "错误码" },
  { key: "apis", icon: "braces", label: "接口列表" },
];

const scrollToSection = (id) => {
  const target = document.getElementById(id);
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
};

function DocSidebar() {
  const {
    versionApis,
    selectedApiId,
    setSelectedApiId,
    requestFocusApi,
    activeSection,
  } = useApp();

  // 目录树纯数据 → antd treeData（title 渲染在此层完成）
  const rawTree = useMemo(() => buildTreeData(versionApis), [versionApis]);

  const treeData = useMemo(
    () =>
      rawTree.map((group) => ({
        key: group.key,
        icon: <Icon name={group.icon} size="0.875rem" className="tree-group-icon" />,
        title: (
          <span className="tree-node-row">
            <span className="tree-node-name">{group.name}</span>
            <span className="tree-node-count">{group.count}</span>
          </span>
        ),
        children: group.children.map((sub) => ({
          key: sub.key,
          title: (
            <span className="tree-node-row">
              <span className="tree-node-name">{sub.name}</span>
              <span className="tree-node-count">{sub.count}</span>
            </span>
          ),
          children: sub.children.map((api) => ({
            key: api.key,
            isLeaf: true,
            title: (
              <span className="tree-leaf-row">
                <span className="tree-leaf-name">{api.name}</span>
                <span className={`tree-leaf-method tlm-${api.method.toLowerCase()}`}>
                  {api.method}
                </span>
              </span>
            ),
          })),
        })),
      })),
    [rawTree]
  );

  const [expandedKeys, setExpandedKeys] = useState([]);

  // 版本切换后重置为「展开全部分组」
  useEffect(() => {
    setExpandedKeys(rawTree.map((node) => node.key));
  }, [rawTree]);

  // 选中接口变化时，自动展开其父级链路（目录树联动）
  useEffect(() => {
    if (!selectedApiId) return;
    const api = versionApis.find((item) => item.apiId === selectedApiId);
    if (!api) return;
    setExpandedKeys((prev) => {
      const merged = new Set(prev);
      merged.add(`g:${api.group}`);
      merged.add(`s:${api.group}/${api.subgroup}`);
      return Array.from(merged);
    });
  }, [selectedApiId, versionApis]);

  const handleSelect = (keys) => {
    const key = keys[0];
    // 点击已选节点会触发取消选择 —— 忽略，保持选中态稳定
    if (!key) return;
    if (key.startsWith("a:")) {
      const apiId = key.slice(2);
      setSelectedApiId(apiId);
      requestFocusApi(apiId);
    } else {
      // 分组节点：滚动定位到接口列表
      scrollToSection("apis");
    }
  };

  return (
    <aside className="doc-sidebar">
      <div className="sidebar-menu">
        <Menu
          mode="inline"
          selectedKeys={[activeSection]}
          onClick={({ key }) => scrollToSection(key)}
          items={SECTION_ITEMS.map((item) => ({
            key: item.key,
            icon: <Icon name={item.icon} size="0.875rem" />,
            label: item.label,
          }))}
        />
      </div>
      <div className="tree-panel">
        <div className="tree-title">
          <Icon name="braces" size="0.75rem" />
          接口目录
        </div>
        <Tree
          className="api-tree"
          blockNode
          showIcon
          treeData={treeData}
          expandedKeys={expandedKeys}
          selectedKeys={selectedApiId ? [`a:${selectedApiId}`] : []}
          onExpand={(keys) => setExpandedKeys(keys)}
          onSelect={handleSelect}
        />
      </div>
    </aside>
  );
}
  Object.assign(__export, { DocSidebar });
})();

(function () {

  { key: "ALL", label: "全部" },
  { key: "GET", label: "GET" },
  { key: "POST", label: "POST" },
  { key: "PUT", label: "PUT" },
  { key: "DELETE", label: "DELETE" },
];

function SectionApiList() {
  const {
    version,

  const [pageSize, setPageSize] = useState(8);

  // 关键词匹配：名称 / 路径 / 描述
  const matchesKeyword = (api, kw) =>
    !kw ||
    api.name.toLowerCase().includes(kw) ||
    api.path.toLowerCase().includes(kw) ||
    api.description.toLowerCase().includes(kw);

  const keyword = apiKeyword.trim().toLowerCase();

  const filtered = useMemo(
    () =>
      versionApis.filter(
        (api) =>
          (methodFilter === "ALL" || api.method === methodFilter) &&
          matchesKeyword(api, keyword)
      ),
    [versionApis, methodFilter, keyword]
  );

  // 筛选 / 关键词 / 版本变化时回到第 1 页
  useEffect(() => {
    setPage(1);

  useEffect(() => {

    const index = versionApis.findIndex((api) => api.apiId === focusApiId);

      const target = document.getElementById("apis");
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    clearFocusApi();

  const pageItems = filtered.slice((page - 1) * pageSize, page * pageSize);
  const methodCounts = useMemo(() => {
    const counts = { ALL: versionApis.length };

      counts[m] = versionApis.filter((api) => api.method === m).length;

      <div className="api-toolbar">
        <div className="method-filter">
          {METHOD_CHIPS.map((chip) => (
            <button
              key={chip.key}
              type="button"
              className={`method-chip${methodFilter === chip.key ? " active" : ""}`}
              onClick={() => setMethodFilter(chip.key)}
            >
              {chip.key !== "ALL" && (
                <span className={`chip-dot cd-${chip.key.toLowerCase()}`} />

              {chip.label}
              <span className="chip-count">{methodCounts[chip.key]}</span>
            </button>
          ))}
        </div>
        {apiKeyword && (
          <div className="kw-bar">
            「{apiKeyword}」的搜索结果 {filtered.length} 条
            <a className="kw-clear" onClick={() => setApiKeyword("")}>
              <Icon name="x" size="0.75rem" />
              清除
            </a>
          </div>
        )}
      </div>

      {filtered.length > 0 ? (
        <>
          <table className="api-table">
            <thead>
              <tr>
                <th className="col-name">接口名称</th>
                <th className="col-method">方法</th>
                <th className="col-path">路径</th>
                <th>描述</th>
                <th className="col-time">更新时间</th>
                <th className="col-status">状态</th>
              </tr>
            </thead>
            <tbody>
              {pageItems.map((api) => {
                const status = getStatusInVersion(api, version);
                const isNew = isNewInVersion(api, version);
                const rowClass = [
                  status === "deprecating" ? "row-deprecating" : "",
                  status === "sunset" ? "row-sunset" : "",
                  api.apiId === selectedApiId ? "row-selected" : "",
                ]
                  .filter(Boolean)
                  .join(" ");
                return (
                  <tr key={api.apiId} className={rowClass}>
                    <td>
                      <a
                        className="api-name-link"
                        onClick={() => selectApi(api.apiId)}
                        title="点击选中该接口"
                      >
                        {api.name}
                      </a>
                      {isNew && <NewTag />}
                    </td>
                    <td>
                      <MethodTag method={api.method} />
                    </td>
                    <td>
                      <span className="api-path">{api.path}</span>
                    </td>
                    <td className="api-desc">{api.description}</td>
                    <td className="api-time">{api.updatedAt}</td>
                    <td>
                      <StatusTag status={status} />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          <div className="api-pagination">
            <Pagination
              current={page}
              pageSize={pageSize}
              total={filtered.length}
              showTotal={(total, range) =>

              }
              showSizeChanger
              showQuickJumper={{ goButton: "跳转" }}
              pageSizeOptions={["8", "16", "32"]}
              onChange={(nextPage, nextSize) => {
                setPage(nextPage);
                setPageSize(nextSize);
              }}
            />
          </div>
        </>
      ) : (
        <div className="api-empty">
          <Empty description={`未找到与「${apiKeyword}」匹配的接口`} />
          <a className="api-empty-clear" onClick={() => setApiKeyword("")}>
            清除关键词
          </a>
        </div>
      )}
    </section>
  );
}
  Object.assign(__export, { SectionApiList });
})();

// Layer 4: 中栏文档容器 — 面包屑 + 版本切换 + 章节组装 + 滚动联动（scroll spy）











const SECTION_IDS = ["overview", "auth", "quickstart", "errors", "apis"];

function DocBody() {
  const { version, changeVersion, setActiveSection } = useApp();
  const scrollRef = useRef(null);
  const meta = VERSION_META[version];

  const scrollToSection = (id) => {
    const target = document.getElementById(id);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // 滚动联动：当前章节同步左侧菜单高亮
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return undefined;
    const handleScroll = () => {
      let current = SECTION_IDS[0];
      SECTION_IDS.forEach((id) => {
        const node = document.getElementById(id);
        if (node && node.getBoundingClientRect().top <= 160) current = id;
      });
      setActiveSection(current);
    };
    el.addEventListener("scroll", handleScroll, { passive: true });
    handleScroll();
    return () => el.removeEventListener("scroll", handleScroll);
  }, [setActiveSection]);

  return (
    <main className="doc-main" ref={scrollRef}>
      <div className="doc-crumb-bar">
        <Breadcrumb
          items={[
            {
              title: (
                <a
                  className="crumb-link"
                  onClick={() => scrollRef.current && scrollRef.current.scrollTo({ top: 0, behavior: "smooth" })}
                >
                  文档中心
                </a>
              ),
            },
            {
              title: (
                <a className="crumb-link" onClick={() => scrollToSection("overview")}>
                  API 参考
                </a>
              ),
            },
            {
              title: (
                <a className="crumb-link" onClick={() => scrollToSection("apis")}>
                  接口列表
                </a>
              ),
            },
          ]}

      </div>

(function () {
  const { useState, useEffect } = React;

// Layer 4: 右侧调试入口 — 未选择接口时的空态引导 + 选中接口摘要 + 在线调试（curl 预览）










// 生成在线调试的 curl 请求预览（沙箱环境）
function buildCurl(api, version) {
  const base = `https://api.opencloud.example.com/${version}`;
  const lines = [`curl -X ${api.method} '${base}${api.path}' \\`];
  lines.push("  -H 'Authorization: Bearer <ACCESS_TOKEN>' \\");
  if (api.method !== "GET" && api.method !== "DELETE") {
    lines.push("  -H 'Content-Type: application/json' \\");
    lines.push("  -d '{ ...请求参数 }' \\");
  }
  if (api.requiresHmac) {
    lines.push("  -H 'X-OC-Signature: <HMAC_SHA256_SIGNATURE>' \\");
  }
  // 去掉末尾多余的续行符
  const last = lines.pop();
  lines.push(last.replace(/ \\$/, ""));
  return lines.join("\n");
}

function DebugAside() {
  const { selectedApi, selectedApiId, version } = useApp();
  const [showCurl, setShowCurl] = useState(false);

  // 切换选中接口后重置调试预览
  useEffect(() => {
    setShowCurl(false);
  }, [selectedApiId]);

  // 空态引导：滚动到接口列表去选择
  const goSelect = () => {
    const target = document.getElementById("apis");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });

          <span className="debug-head-title">在线调试</span>

        <Button
          type="primary"
          block
          icon={<Icon name="play" size="0.875rem" />}
          disabled={!selectedApi}
          onClick={() => setShowCurl(true)}
        >
          在线调试
        </Button>

        {!selectedApi ? (
          /* 未选择接口：空态引导 */
          <div className="debug-empty">
            <Empty description="请先选择接口" />
            <Button onClick={goSelect}>
              <Icon name="mouse-pointer-click" size="0.875rem" />
              去选择
            </Button>
          </div>
        ) : (
          /* 已选择接口：摘要信息（随选择实时刷新） */
          <div className="debug-summary">
            <div className="summary-path-row">
              <MethodTag method={selectedApi.method} />
              <span className="summary-path">{selectedApi.path}</span>
            </div>
            <div className="summary-name">
              {selectedApi.name}
              {isNewInVersion(selectedApi, version) && <NewTag />}
            </div>
            <div className="summary-status">
              <StatusTag status={getStatusInVersion(selectedApi, version)} />
            </div>
            <p className="summary-desc">{selectedApi.description}</p>
            <dl className="summary-meta">
              <div className="meta-row">
                <dt>所属分组</dt>
                <dd>{getGroupPath(selectedApi).groupName} / {getGroupPath(selectedApi).subgroupName}</dd>
              </div>
              <div className="meta-row">
                <dt>引入版本</dt>
                <dd>{selectedApi.since}</dd>
              </div>
              <div className="meta-row">
                <dt>更新时间</dt>
                <dd>{selectedApi.updatedAt}</dd>
              </div>
              <div className="meta-row">
                <dt>HMAC 签名</dt>
                <dd
                  className={
                    selectedApi.requiresHmac ? "meta-hmac-required" : "meta-hmac-optional"
                  }
                >

            {showCurl && (
