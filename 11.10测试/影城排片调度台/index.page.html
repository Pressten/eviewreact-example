  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Badge 组件样式（占位，待填充 token 映射） */
.ant-badge {
  color: var(--color-text-primary);
}
.ant-badge .ant-badge-count {
  /* 单数字 16×16 正圆（半径=高度一半）；多位数字按内容+padding 撑开成胶囊；
       不设 line-height（antd 默认 20px 偏大会压偏文字），用 flex 垂直居中兜底 */
  box-sizing: border-box;
  min-width: 1rem;
  height: 1rem;
  padding: 0 0.25rem;
  border-radius: 0.5rem;
  align-items: center;
  font-size: var(--font-size-base);
  box-shadow: 0 0 0 1px var(--gray-0);
  background-color: var(--color-error);
  color: var(--color-text-inverse);

  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  transition: none;

// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

function getRootFontSize() {

function rgbToHex(rgb) {
  if (!rgb) return null;
  const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if (!m) return null;
  return "#" + [1, 2, 3].map(function (i) { return parseInt(m[i], 10).toString(16).padStart(2, "0"); }).join("").toUpperCase();
}

// #RGB / #RRGGBB -> [r,g,b]；非法输入返回 null
function hexToRgb(hex) {
  if (!hex) return null;
  let h = String(hex).replace(/^#/, "").trim();
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

// getIcon 接口的 size 参数需数字 px。源 size 可能是 rem/px/数字，转 px 后吸附到 icon-plus 标准尺寸。
const API_SIZES = [12, 14, 16, 20, 24, 32, 36, 40, 48, 60];
function toApiSize(size) {
  let n = null;
  if (size != null) {
    const m = String(size).trim().match(/(-?\d+(?:\.\d+)?)\s*(rem|px)?/i);
    if (m) {
      n = Number(m[1]);
      if (m[2] && m[2].toLowerCase() === "rem") n = n * getRootFontSize();
    }
  }
  if (n == null || Number.isNaN(n)) return 16;
  let best = API_SIZES[0], bestDiff = Math.abs(n - best);
  for (const s of API_SIZES) {
    const d = Math.abs(n - s);
    if (d < bestDiff) { bestDiff = d; best = s; }
  }
  return best;
}

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
// 精确命中 → 就近匹配（RGB 欧氏距离最小）→ defaultColorId 兜底
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const target = colorHex.toUpperCase();
    // 1. 精确匹配：某个 color 的 value 列表里直接包含目标色
    const exact = colors.find((c) =>
      String(c.value).split(",").map((v) => v.trim().toUpperCase()).includes(target)
    );
    if (exact) return exact.id;
    // 2. 就近匹配：取与目标色 RGB 距离最小的 color（多色值取其中最近的）
    let best = null;
    let bestDist = Infinity;
    for (const c of colors) {
      for (const v of String(c.value).split(",")) {
        const d = colorDistance(target, v.trim());
        if (d < bestDist) { bestDist = d; best = c; }
      }
    }
    if (best) return best.id;
  }
  // 3. 兜底：线性通用色 → 该 style 下第一个 → 空串
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (结果缓存在 iconInfoMap；并发去重靠 iconInfoPromiseMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  // 同 name 并发请求共享同一个进行中 Promise，避免 N 个相同图标各发一次 getIconInfo
  if (iconInfoPromiseMap[name]) return iconInfoPromiseMap[name];
  const p = (async () => {
    try {
      const resp = await fetch(
        `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
      );
      const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
      const entry = (Array.isArray(data) ? data : [data]).find(
        (d) => d.icons?.length
      );
      const selected = selectBestIcon(entry?.icons || [], name);
      if (!selected?.url) return null;
      iconInfoMap[name] = { name: selected.name, url: selected.url };
      return iconInfoMap[name];
    } catch (e) {
      return null;
    }
  })();
  iconInfoPromiseMap[name] = p;
  // 落定后清除 in-flight 条目（失败也清除，允许下次重试，不永久缓存 rejected 结果）
  p.finally(() => {
    delete iconInfoPromiseMap[name];
  });
  return p;
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
// 结果缓存在 svgCache；并发去重靠 svgPromiseMap，相同 key 共享同一进行中 Promise
// key 含 size：不同尺寸取回的 SVG 不同，不可复用
function fetchSvg(name, variant, colorHex, size) {
  const key = `${name}&${variant}&${colorHex}&${size}`;
  if (svgCache.has(key)) return Promise.resolve(svgCache.get(key));
  if (svgPromiseMap.has(key)) return svgPromiseMap.get(key);
  const p = (async () => {
    const info = await resolveIconInfo(name);
    if (!info) return "";
    const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
    const colorId = resolveColorId(variant, colorHex);
    try {
      const resp = await fetch(
        `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=${toApiSize(size)}&style=${encodeURIComponent(
          styleValue
        )}&color=${encodeURIComponent(colorId)}&fileType=svg`
      );
      const data = await resp.json(); // { url, name, data } or array
      const item = Array.isArray(data) ? data[0] : data;
      return item?.data || ""; // raw SVG text, injected as-is
    } catch (e) {
      return "";
    }
  })();
  svgPromiseMap.set(key, p);
  // 落定后写入结果缓存并清除 in-flight 条目；空结果（失败）不缓存，允许下次重试
  p.then((s) => {
    if (s) svgCache.set(key, s);
  }).finally(() => {
    svgPromiseMap.delete(key);
  });
  return p;
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rootFontSize = getRootFontSize();
    const rem = size / rootFontSize;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
  onClick,
  title,
  id,
}) {
  const resolvedSize = resolveSize(size);
  const mergedStyle = onClick ? { cursor: "pointer", ...style } : style;
  const wrapRef = useRef(null);
  const [inheritedColor, setInheritedColor] = useState(null);
  const effectiveColor = color || inheritedColor;
  const [plus, setPlus] = useState(plusState); // reuse already-probed result

    // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才需要继承父元素颜色；
  // Lucide / img 模式颜色由 CSS（currentColor）或属性直接处理，不读计算色、不监听主题
  useLayoutEffect(function () {
    if (src || plus !== true || color) return;
    const el = wrapRef.current;
    if (!el) return; // 尚未挂载（首次 plus===null 返回 null）
    const hex = rgbToHex(getComputedStyle(el).color);
    if (hex && hex !== inheritedColor) setInheritedColor(hex);
  });

  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

// 生成票价档明细
function genPriceTiers(version, seatSold) {
  let base = 45;
  if (version === "IMAX") base = 80;
  else if (version === "激光") base = 65;
  else if (version === "3D") base = 55;
  const normalSold = Math.floor(seatSold * 0.55);
  const memberSold = Math.floor(seatSold * 0.32);
  const vipSold = Math.max(0, seatSold - normalSold - memberSold);
  return [
    { tier: "普通", price: base, sold: normalSold },
    { tier: "会员", price: Math.round(base * 0.82), sold: memberSold },
    { tier: "VIP", price: Math.round(base * 1.5), sold: vipSold },

function build(raw, cinemaId) {
  const seqByHall = {};
  const result = [];
  raw.forEach(function (r) {
    const hallNo = r[0], startTime = r[1], filmId = r[2], version = r[3], seatSold = r[4], status = r[5];
    const film = filmMap[filmId];
    const hall = hallMap[hallNo];
    seqByHall[hallNo] = (seqByHall[hallNo] || 0) + 1;
    const seq = seqByHall[hallNo];
    const startMin = toMin(startTime);
    const endMin = startMin + film.duration;
    const endTime = fmtTime(endMin);
    const seatTotal = hall.seatCount;
    const occupancy = Math.round(seatSold / seatTotal * 100);
    result.push({
      showtimeId: "ST-" + hallNo + "-" + seq,
      cinemaId: cinemaId,
      hallNo: hallNo,
      filmId: filmId,
      filmName: film.filmName,
      startTime: startTime,
      endTime: endTime,
      duration: film.duration,
      version: version,
      priceTiers: genPriceTiers(version, seatSold),
      seatSold: seatSold,
      seatTotal: seatTotal,
      occupancy: occupancy,
      status: status,
    });
  });
  return result;
}

function getShowtimes(cinemaId) {
  const raw = rawMap[cinemaId] || rawA;

function computeOverview(showtimes, hallsData) {
  const totalShowtimes = showtimes.length;
  const totalSeats = hallsData.reduce(function (s, h) { return s + h.seatCount; }, 0);
  let totalSold = 0;
  let totalCapacity = 0;
  let preSaleRevenue = 0;
  showtimes.forEach(function (st) {
    totalSold += st.seatSold;
    totalCapacity += st.seatTotal;
    st.priceTiers.forEach(function (t) {
      preSaleRevenue += t.price * t.sold;
    });
  });
  const avgOccupancy = totalCapacity > 0 ? Math.round(totalSold / totalCapacity * 100) : 0;
  return {
    totalShowtimes: totalShowtimes,
    totalSeats: totalSeats,
    preSaleBoxOffice: (preSaleRevenue / 10000).toFixed(1),
    avgOccupancy: avgOccupancy,
  };
}

function checkConflicts(target, allShowtimes) {
  if (!target) return [];
  const sameHall = allShowtimes.filter(function (st) {
    return st.hallNo === target.hallNo && st.showtimeId !== target.showtimeId;
  });
  const conflicts = [];
  const tStart = toMin(target.startTime);
  const tEnd = toMin(target.endTime);
  sameHall.forEach(function (other) {
    const oStart = toMin(other.startTime);
    const oEnd = toMin(other.endTime);
    if (tStart < oEnd && oStart < tEnd) {
      conflicts.push({
        type: "timeClash",
        message: "与「" + other.filmName + "」（" + other.startTime + "-" + other.endTime + "）时段重叠",
      });
    }
    const gapBefore = tStart - oEnd;
    if (gapBefore > 0 && gapBefore < 15) {
      conflicts.push({
        type: "gap",
        message: "与上一场「" + other.filmName + "」（" + other.startTime + "-" + other.endTime + "）间隔仅 " + gapBefore + " 分钟，建议留 20 分钟清洁时间",
      });
    }
    const gapAfter = oStart - tEnd;
    if (gapAfter > 0 && gapAfter < 15) {
      conflicts.push({
        type: "gap",
        message: "与下一场「" + other.filmName + "」（" + other.startTime + "-" + other.endTime + "）间隔仅 " + gapAfter + " 分钟，建议留 20 分钟清洁时间",
      });
    }
  });
  return conflicts;
}

function genSeatZones(occupancy) {
  const weights = [
    ["前排左", 0.3], ["前排中", 0.45], ["前排右", 0.3],
    ["中排左", 0.55], ["中排中", 0.85], ["中排右", 0.55],
    ["后排左", 0.4], ["后排中", 0.6], ["后排右", 0.4],
  ];
  return weights.map(function (w) {
    const pct = Math.min(100, Math.round(occupancy * w[1] * 1.15));
    return { zone: w[0], pct: pct };
  });
}

/* ===== assets/shared/chart.jsx ===== */
(function () {
  const { useRef, useEffect, useState, forwardRef, useImperativeHandle } = React;
// Chart — HUICharts 的 React 封装(命令式 → 声明式)
// 底层: echarts + hui-charts.umd.js(全局 HUICharts),配置项 option 原样透传给 setSimpleOption。
// 暗色联动:自动监听 <html> 的 .dark class,切换 hdesign-light / hdesign-dark 主题并重建图表。
const Chart = forwardRef(function Chart(
  { name, option, className, style, onChartRendered },
  ref
) {
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const renderedRef = useRef(onChartRendered);
  renderedRef.current = onChartRendered;

  // .dark 切换 → 递增 tick 触发主 effect 重建(走同一条 init/dispose 路径)
  const [darkTick, setDarkTick] = useState(0);
  useEffect(() => {
    const mo = new MutationObserver(() => setDarkTick((t) => t + 1));
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    return () => mo.disconnect();
  }, []);

  useEffect(() => {
    const dom = containerRef.current;
    if (!dom || !window.HUICharts) return;

    const isDark = document.documentElement.classList.contains("dark");
    const chart = new HUICharts();
    chart.init(dom, { renderer: "svg"});
    chart.setSimpleOption(name, {
      theme: isDark ? "hdesign-dark" : "hdesign-light",
      a2ui: true,
      ...option,
    });
    chart.render();
    chartRef.current = chart;
    if (renderedRef.current) renderedRef.current(chart);

    // 容器尺寸变化(侧栏折叠/窗口缩放/响应式) → 同步画布
    const ro = new ResizeObserver(() => {
      if (chartRef.current && !chartRef.current._disposed) chart.resize();
    });
    ro.observe(dom);

    return () => {
      ro.disconnect();
      try { chart.dispose(); } catch (e) { /* 容器已卸载时静默 */ }
      chartRef.current = null;
    };
    // JSON.stringify 作 dep:option 是 JSX 内联对象,内容不变则不重建
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [name, JSON.stringify(option), darkTick]);

  useImperativeHandle(ref, () => ({
    getEchartsInstance: () => (chartRef.current ? chartRef.current.getEchartsInstance() : null),
    resizeHandler: () => {
      if (chartRef.current) chartRef.current.resize();
    },
  }), []);

  const wrapperStyle = { width: "100%", height: "100%", ...style };
  return <div ref={containerRef} className={className} style={wrapperStyle} />;
});
  Object.assign(__export, { Chart });
})();

(function () {
  const { useState, useEffect } = React;
  const { Modal, Select, TimePicker, InputNumber, Tag, Button } = antd;
  const { Icon, films, filmMap, halls, toMin, fmtTime } = __export;
const VERSION_COLOR = { "2D": undefined, "3D": "blue", "IMAX": "purple", "激光": "cyan" };

function NewShowtimeModal({ open, preSelectedFilmId, cinemaId, existingShowtimes, onClose, onSave }) {
  const [form, setForm] = useState({
    filmId: undefined,
    hallNo: undefined,
    version: undefined,
    startTime: null,
    normalPrice: 45,
    memberPrice: 38,
    vipPrice: 68,
  });
  const [errors, setErrors] = useState({});
  const [conflicts, setConflicts] = useState([]);

  useEffect(function () {
    if (open) {
      setForm({
        filmId: preSelectedFilmId || undefined,
        hallNo: undefined,
        version: undefined,
        startTime: null,
        normalPrice: 45,
        memberPrice: 38,
        vipPrice: 68,
      });
      setErrors({});
      setConflicts([]);
    }
  }, [open, preSelectedFilmId]);

  function update(patch) {
    setForm(function (prev) {
      const next = Object.assign({}, prev, patch);
      if (patch.filmId) {
        next.version = undefined;
      }
      return next;
    });
    setErrors({});
    setConflicts([]);
  }

  const selectedFilm = form.filmId ? filmMap[form.filmId] : null;
  const selectedHall = form.hallNo ? halls.find(function (h) { return h.hallNo === form.hallNo; }) : null;
  const versionOptions = selectedFilm && selectedHall
    ? selectedFilm.supportedVersions.filter(function (v) { return selectedHall.supportedVersions.indexOf(v) >= 0; })
    : [];

  const endTimeText = (selectedFilm && form.startTime)
    ? fmtTime(form.startTime.hour() * 60 + form.startTime.minute() + selectedFilm.duration)
    : "--:--";

  function validate() {
    const errs = {};
    if (!form.filmId) errs.filmId = "请选择影片";
    if (!form.hallNo) errs.hallNo = "请选择影厅";
    if (!form.version) errs.version = "请选择版本";
    if (!form.startTime) errs.startTime = "请选择开始时间";
    if (!form.normalPrice && form.normalPrice !== 0) errs.normalPrice = "请输入票价";
    if (!form.memberPrice && form.memberPrice !== 0) errs.memberPrice = "请输入票价";
    if (!form.vipPrice && form.vipPrice !== 0) errs.vipPrice = "请输入票价";

    const newConflicts = [];
    if (Object.keys(errs).length === 0 && form.startTime && form.filmId && form.hallNo) {
      const startMin = form.startTime.hour() * 60 + form.startTime.minute();
      const endMin = startMin + selectedFilm.duration;
      const hallShowtimes = existingShowtimes.filter(function (st) { return st.hallNo === form.hallNo; });
      hallShowtimes.forEach(function (st) {
        const stStart = toMin(st.startTime);
        const stEnd = toMin(st.endTime);
        if (startMin < stEnd && stStart < endMin) {
          newConflicts.push("与「" + st.filmName + "」（" + st.startTime + "-" + st.endTime + "）时段重叠");
        }
        const gapBefore = startMin - stEnd;
        if (gapBefore > 0 && gapBefore < 15) {
          newConflicts.push("与上一场「" + st.filmName + "」间隔仅 " + gapBefore + " 分钟，清洁时间不足（需≥15分钟）");
        }
        const gapAfter = stStart - endMin;
        if (gapAfter > 0 && gapAfter < 15) {
          newConflicts.push("与下一场「" + st.filmName + "」间隔仅 " + gapAfter + " 分钟，清洁时间不足（需≥15分钟）");
        }
      });
    }

    setErrors(errs);
    setConflicts(newConflicts);
    return Object.keys(errs).length === 0 && newConflicts.length === 0;
  }

  function handleSubmit() {
    if (!validate()) return;
    const startMin = form.startTime.hour() * 60 + form.startTime.minute();
    const endMin = startMin + selectedFilm.duration;
    const hall = halls.find(function (h) { return h.hallNo === form.hallNo; });
    const newShowtime = {
      showtimeId: "ST-NEW-" + Date.now(),
      cinemaId: cinemaId,
      hallNo: form.hallNo,
      filmId: form.filmId,
      filmName: selectedFilm.filmName,
      startTime: fmtTime(startMin),
      endTime: fmtTime(endMin),
      duration: selectedFilm.duration,
      version: form.version,
      priceTiers: [
        { tier: "普通", price: form.normalPrice, sold: 0 },
        { tier: "会员", price: form.memberPrice, sold: 0 },
        { tier: "VIP", price: form.vipPrice, sold: 0 },
      ],
      seatSold: 0,
      seatTotal: hall.seatCount,
      occupancy: 0,
      status: "草稿",
    };
    onSave(newShowtime);
  }

  const filmOptions = films.map(function (f) {
    return { value: f.filmId, label: f.filmName + "（" + f.duration + "分钟 · " + f.genre + "）" };
  });
  const hallOptions = halls.map(function (h) {
    return { value: h.hallNo, label: h.hallName + "（" + h.seatCount + "座）" };
  });

  return (
    <Modal
      open={open}
      title="新建场次"
      width={580}
      onCancel={onClose}
      footer={[
        <Button key="cancel" onClick={onClose}>取消</Button>,
        <Button key="submit" type="primary" onClick={handleSubmit}>确认新建</Button>,
      ]}
    >
      <div className="ns-form-grid">
        <div className="ns-field">
          <label className={"ns-form-label required"}>影片</label>
          <div className="ns-form-field">
            <Select
              value={form.filmId}
              onChange={function (v) { update({ filmId: v }); }}
              options={filmOptions}
              placeholder="请选择影片"
              style={{ width: "100%" }}
              status={errors.filmId ? "error" : undefined}
            />
            {errors.filmId && <div className="ns-form-error">{errors.filmId}</div>}
          </div>
        </div>

        <div className="ns-field">
          <label className={"ns-form-label required"}>影厅</label>
          <div className="ns-form-field">
            <Select
              value={form.hallNo}
              onChange={function (v) { update({ hallNo: v }); }}
              options={hallOptions}
              placeholder="请选择影厅"
              style={{ width: "100%" }}
              status={errors.hallNo ? "error" : undefined}
            />
            {errors.hallNo && <div className="ns-form-error">{errors.hallNo}</div>}
          </div>
        </div>

        <div className="ns-field">
          <label className={"ns-form-label required"}>放映版本</label>
          <div className="ns-form-field">
            <Select
              value={form.version}
              onChange={function (v) { update({ version: v }); }}
              options={versionOptions.map(function (v) { return { value: v, label: v }; })}
              placeholder={versionOptions.length === 0 ? "请先选择影片和影厅" : "请选择版本"}
              style={{ width: "100%" }}
              disabled={versionOptions.length === 0}
              status={errors.version ? "error" : undefined}
            />
            {errors.version && <div className="ns-form-error">{errors.version}</div>}
          </div>
        </div>

        <div className="ns-field">
          <label className={"ns-form-label required"}>开始时间</label>
          <div className="ns-form-field">
            <TimePicker
              value={form.startTime}
              onChange={function (t) { update({ startTime: t }); }}

            />
            {errors.startTime && <div className="ns-form-error">{errors.startTime}</div>}
          </div>
        </div>

        <div className="ns-field">
          <label className="ns-form-label">结束时间（自动计算）</label>
          <div className="ns-end-time-display">{endTimeText}</div>
        </div>

        <div className="ns-field">
          <label className={"ns-form-label required"}>影厅座位数</label>
          <div className="ns-end-time-display">{selectedHall ? selectedHall.seatCount + " 座" : "请先选择影厅"}</div>
        </div>

        <div className="ns-field">
          <label className={"ns-form-label required"}>普通票价（元）</label>
          <div className="ns-form-field">
            <div className="ns-price-row">
              <InputNumber
                mode="spinner"
                variant="outlined"
                value={form.normalPrice}
                onChange={function (v) { update({ normalPrice: v }); }}
                min={0}
                max={500}
                placeholder="45"
                status={errors.normalPrice ? "error" : undefined}
              />
            </div>
            {errors.normalPrice && <div className="ns-form-error">{errors.normalPrice}</div>}
          </div>
        </div>

        <div className="ns-field">
          <label className={"ns-form-label required"}>会员票价（元）</label>
          <div className="ns-form-field">
            <div className="ns-price-row">
              <InputNumber
                mode="spinner"
                variant="outlined"
                value={form.memberPrice}
                onChange={function (v) { update({ memberPrice: v }); }}
                min={0}
                max={500}
                placeholder="38"
                status={errors.memberPrice ? "error" : undefined}
              />
            </div>
            {errors.memberPrice && <div className="ns-form-error">{errors.memberPrice}</div>}
          </div>
        </div>

        <div className="ns-field">
          <label className={"ns-form-label required"}>VIP 票价（元）</label>
          <div className="ns-form-field">
            <div className="ns-price-row">
              <InputNumber
                mode="spinner"
                variant="outlined"
                value={form.vipPrice}
                onChange={function (v) { update({ vipPrice: v }); }}
                min={0}
                max={500}
                placeholder="68"
                status={errors.vipPrice ? "error" : undefined}
              />
            </div>
            {errors.vipPrice && <div className="ns-form-error">{errors.vipPrice}</div>}
          </div>
        </div>
      </div>

      {conflicts.length > 0 && (
        <div className="ns-conflict-box">
          {conflicts.map(function (c, i) {
            return (
              <div key={i} className="ns-conflict-line">
                <Icon name="triangle-alert" size="0.875rem" color="#E02128" />
                <span>{c}</span>
              </div>
            );
          })}
        </div>
      )}
      {conflicts.length === 0 && form.filmId && form.hallNo && form.version && form.startTime && (
        <div className="ns-ok-box">
          <Icon name="circle-check" size="0.875rem" color="#09AA71" />
          <span>校验通过，无时段冲突</span>
        </div>
      )}
    </Modal>
  );
}
  Object.assign(__export, { NewShowtimeModal });
})();

/* ===== app.jsx ===== */
(function () {
  const { useState, Component } = React;
  const { ConfigProvider, Empty, message, Modal, Steps, Button } = antd;
  const { AppProvider, useApp, Icon, getShowtimes, computeOverview, halls } = __export;
  const zhCN = __export.zhCN;
  const Toolbar = __export.Toolbar;
  const OverviewCards = __export.OverviewCards;
  const ScheduleGrid = __export.ScheduleGrid;
  const ShowtimeDetail = __export.ShowtimeDetail;
  const BoxOfficeTrend = __export.BoxOfficeTrend;
  const FilmLibrary = __export.FilmLibrary;
  const SuggestionPanel = __export.SuggestionPanel;
  const BottomBar = __export.BottomBar;
  const NewShowtimeModal = __export.NewShowtimeModal;
// Error Boundary — catches rendering errors and displays them
class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(err) {
    return { hasError: true, error: err };
  }
  componentDidCatch(err, info) {
    console.error("Render Error:", err, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: "2rem", color: "#E02128", fontSize: "0.875rem" }}>
          <h2 style={{ marginBottom: "0.5rem" }}>页面渲染出错</h2>
          <p style={{ marginBottom: "0.5rem" }}>{String(this.state.error && this.state.error.message || this.state.error)}</p>
          <pre style={{ whiteSpace: "pre-wrap", fontSize: "0.75rem", color: "#777" }}>
            {this.state.error && this.state.error.stack ? String(this.state.error.stack).substring(0, 500) : ""}
          </pre>
        </div>
      );
    }
    return this.props.children;
  }
}

function PageContent() {
  const appCtx = useApp() || {};
  const isDark = appCtx.isDark || false;
  const toggleDark = appCtx.toggleDark || function () {};

  const [selectedCinema, setSelectedCinema] = useState("A");
  const [selectedDate, setSelectedDate] = useState(dayjs());
  const [publishStatus, setPublishStatus] = useState("草稿");
  const [extraShowtimes, setExtraShowtimes] = useState([]);
  const [selectedShowtime, setSelectedShowtime] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [modalOpen, setModalOpen] = useState(false);
  const [modalFilmId, setModalFilmId] = useState(undefined);
  const [wizardOpen, setWizardOpen] = useState(false);
  const [adoptedSuggestions, setAdoptedSuggestions] = useState({});
  const [optimizedShowtimes, setOptimizedShowtimes] = useState({});

  function safeMsg(type, text) {
    try { if (message && message[type]) message[type](text); } catch (e) { console.log("[" + type + "]", text); }
  }

  const baseShowtimes = getShowtimes(selectedCinema);
  const cinemaExtras = extraShowtimes.filter(function (st) { return st.cinemaId === selectedCinema; });
  const showtimes = baseShowtimes.concat(cinemaExtras);
  const overview = computeOverview(showtimes, halls);

  function handleCinemaChange(cinemaId) {
    setSelectedCinema(cinemaId);
    setSelectedShowtime(null);
    setDrawerOpen(false);
  }

  function handleDateChange(date) {
    setSelectedDate(date);
  }

  function handleCopyYesterday() {
    setPublishStatus("草稿");
    safeMsg("success", "已复制昨日排片，共 " + showtimes.length + " 场已生成草稿");
  }

  function handleShowtimeClick(st) {
    setSelectedShowtime(st);
    setDrawerOpen(true);
  }

  function handleNewShowtime() {
    setModalFilmId(undefined);
    setModalOpen(true);
  }

  function handleQuickNew(film) {
    setModalFilmId(film.filmId);
    setModalOpen(true);
  }

  function handleSaveShowtime(newSt) {
    setExtraShowtimes(function (prev) { return prev.concat([newSt]); });
    setModalOpen(false);
    safeMsg("success", "场次已新建：" + newSt.filmName + " " + newSt.startTime + "-" + newSt.endTime);
  }

  function handleAdoptSuggestion(s) {
    setAdoptedSuggestions(function (prev) {
      const next = {};
      Object.keys(prev).forEach(function (k) { next[k] = prev[k]; });
      next[s.suggestionId] = true;
      return next;
    });
    setOptimizedShowtimes(function (prev) {
      const next = {};
      Object.keys(prev).forEach(function (k) { next[k] = prev[k]; });
      s.affectedShowtimes.forEach(function (id) { next[id] = true; });
      return next;
    });
    safeMsg("success", "已采纳建议：" + s.title);
  }

  function handlePublish() {
    if (publishStatus === "草稿") {
      setPublishStatus("已发布");
      safeMsg("success", "排片方案已发布，各影厅终端已同步");
    } else {
      setPublishStatus("草稿");
      safeMsg("info", "已撤回发布，排片恢复草稿状态");
    }
  }

  function handleSave() {
    safeMsg("success", "排片草稿已保存（" + showtimes.length + " 场）");
  }

  function handleExport(key) {
    safeMsg("success", "正在导出 " + (key === "pdf" ? "PDF" : "Excel") + "...");
  }

  function handleAutoSchedule() {
    setWizardOpen(true);
  }

  function handleGenerate() {
    setWizardOpen(false);
    setPublishStatus("草稿");
    safeMsg("success", "智能排片已生成 " + showtimes.length + " 场草稿方案，请审核后发布");
  }

  function handleBatchSchedule() {
    safeMsg("info", "批量排片：请在网格中选中多场场次后进行批量复制/移动/删除");
  }

  return (
    <div className="app-root">
      <header className="page-header">
        <div className="page-title">
          <Icon name="clapperboard" size="1.5rem" color="#0067D1" />
          <span>排片调度台</span>
          <span className="page-title-badge">连锁影城总部 · 排片管理</span>
        </div>
        <div className="page-header-right">
          <span className="dark-toggle" onClick={toggleDark} title={isDark ? "切换浅色" : "切换深色"}>
            <Icon name={isDark ? "sun" : "moon"} size="1.25rem" />
          </span>
        </div>
      </header>

      <div className="page-container">
        <ErrorBoundary>
          <Toolbar
            selectedCinema={selectedCinema}
            onCinemaChange={handleCinemaChange}
            selectedDate={selectedDate}
            onDateChange={handleDateChange}
            onCopyYesterday={handleCopyYesterday}
            onAutoSchedule={handleAutoSchedule}
            onExport={handleExport}
          />
        </ErrorBoundary>

        <ErrorBoundary>
          <OverviewCards overview={overview} />
        </ErrorBoundary>

        <ErrorBoundary>
          <ScheduleGrid
            showtimes={showtimes}
            selectedShowtimeId={selectedShowtime ? selectedShowtime.showtimeId : null}
            optimizedShowtimes={optimizedShowtimes}
            onShowtimeClick={handleShowtimeClick}
          />
        </ErrorBoundary>

        <div className="two-col-row">
          <ErrorBoundary>
            <BoxOfficeTrend />
          </ErrorBoundary>
          <ErrorBoundary>
            <SuggestionPanel
              adoptedSet={adoptedSuggestions}
              onAdopt={handleAdoptSuggestion}
            />
          </ErrorBoundary>
        </div>

        <BottomBar
          publishStatus={publishStatus}
          onNewShowtime={handleNewShowtime}
          onBatchSchedule={handleBatchSchedule}
          onPublish={handlePublish}
          onSave={handleSave}
        />

        <ErrorBoundary>
          <FilmLibrary onQuickNew={handleQuickNew} />
        </ErrorBoundary>
      </div>

      <ShowtimeDetail
        open={drawerOpen}
        showtime={selectedShowtime}
        allShowtimes={showtimes}
        onClose={function () { setDrawerOpen(false); }}
      />

      <NewShowtimeModal
        open={modalOpen}
        preSelectedFilmId={modalFilmId}
        cinemaId={selectedCinema}
        existingShowtimes={showtimes}
        onClose={function () { setModalOpen(false); }}
        onSave={handleSaveShowtime}
      />

      <Modal
        open={wizardOpen}
        title="一键智能排片向导"
        width={520}
        onCancel={function () { setWizardOpen(false); }}
        footer={[
          <Button key="cancel" onClick={function () { setWizardOpen(false); }}>取消</Button>,
          <Button key="gen" type="primary" onClick={handleGenerate}>智能生成排片</Button>,
        ]}
      >
        <Steps
          className="wizard-steps"
          current={1}
          size="small"
          items={[
            { title: "选择日期", description: selectedDate.format("YYYY-MM-DD") },
            { title: "分析影片热度", description: "8 部在映影片" },
            { title: "生成排片", description: "待执行" },
          ]}
        />
        <p className="wizard-desc">
          系统将根据影片累计票房、场均上座率、黄金时段需求及影厅版本支持能力，自动编排今日 6 个影厅的完整排片方案。生成后排片状态为"草稿"，可在网格中逐场调整后发布。
        </p>
      </Modal>
    </div>
  );
}

function App() {
  return (
    <AppProvider>
      <ConfigProvider
        locale={zhCN}
        wave={{ disabled: true }}
        renderEmpty={function () { return <Empty style={{ padding: "2rem 0" }} />; }}
        empty={{ image: "./assets/uploads/empty.svg" }}
        spin={{ indicator: <img src="./assets/uploads/loading.svg" alt="" className="custom-spin-indicator" /> }}
      >
        <ErrorBoundary>
          <PageContent />
        </ErrorBoundary>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
