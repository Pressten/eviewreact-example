  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Badge 组件样式（占位，待填充 token 映射） */
.ant-badge {
  color: var(--color-text-primary);
}
.ant-badge .ant-badge-count {
  /* 单数字 16×16 正圆（半径=高度一半）；多位数字按内容+padding 撑开成胶囊；
       不设 line-height（antd 默认 20px 偏大会压偏文字），用 flex 垂直居中兜底 */
  box-sizing: border-box;
  min-width: 1rem;
  height: 1rem;
  padding: 0 0.25rem;
  border-radius: 0.5rem;
  align-items: center;
  font-size: var(--font-size-base);
  box-shadow: 0 0 0 1px var(--gray-0);
  background-color: var(--color-error);
  color: var(--color-text-inverse);

     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */

  transition: none;

/* 应用级基础样式 + 页面骨架 */

  color: var(--on-surface);
  font: var(--font-body-m);
}

/* 内容主轴：区块间用 section 间距，画布宽度上限保证大屏可读性 */
.noc-main {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
  padding: var(--spacing-section) var(--spacing-page) var(--spacing-page);
  max-width: 128rem;
  margin: 0 auto;
}

/* ⑦ 值班交接 + ⑧ 变更动态 并排 */
.noc-bottom-grid {
  display: grid;
  grid-template-columns: 3fr 2fr;
  gap: var(--spacing-gutter);
  align-items: stretch;
}

@media (max-width: 90rem) {
  .noc-bottom-grid {
    grid-template-columns: 1fr;
  }
}


/* ① 顶部状态栏 — 值班墙高对比 */
.noc-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-card);
}

.nh-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  padding: 0.5rem var(--spacing-page);
  flex-wrap: wrap;
}

.nh-group {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  min-width: 0;
  flex-wrap: wrap;
}

.nh-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-base);
  background: var(--color-brand);
  color: var(--color-text-inverse);
  flex: none;
}

.nh-title {
  display: flex;
  flex-direction: column;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  line-height: 1.2;
  white-space: nowrap;
}

.nh-title i {
  font: var(--font-caption-m);
  font-style: normal;
  font-weight: var(--font-weight-normal);
  color: var(--on-surface-variant);
}

.env-tag {
  margin: 0;
  border: none;
  border-radius: var(--radius-base);
  font: var(--font-caption-m);
  letter-spacing: 0.04em;
}

.env-prod {
  background: var(--color-error);
  color: var(--color-text-inverse);
}

.env-staging {
  background: var(--color-message-bg-info);
  color: var(--color-info-primary);
}

.nh-live {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-caption-m);
  color: var(--color-success);
}

.live-dot {
  width: 0.4rem;
  height: 0.4rem;
  border-radius: var(--radius-full);
  background: var(--color-success);
  animation: live-pulse 1.6s ease-in-out infinite;
}

@keyframes live-pulse {
  50% {
    opacity: 0.3;
  }
}

.nh-select {
  min-width: 7.25rem;
}

.nh-refresh {
  color: var(--color-icon-secondary);
}

.nh-refresh:hover {
  color: var(--color-brand);
}

.nh-caption {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.nh-clock {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  font-variant-numeric: tabular-nums;
  color: var(--on-surface);
  white-space: nowrap;
}

.nh-divider {
  width: 1px;
  height: 1.25rem;
  background: var(--divider);
  flex: none;
}

.nh-bell {
  appearance: none;
  border: none;
  background: transparent;
  padding: 0.25rem;
  cursor: pointer;
  display: inline-flex;
  color: var(--on-surface);
}

.nh-duty {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.nh-avatar {
  width: 2rem;
  height: 2rem;
  border-radius: var(--radius-full);
  object-fit: cover;
  display: block;
}

.nh-duty-info {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
  white-space: nowrap;
}

.nh-duty-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.nh-duty-shift {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.nh-theme {
  color: var(--color-icon-secondary);
}

.nh-theme:hover {
  color: var(--color-brand);
}

/* P0 事故横幅 — 全宽、无圆角、最高警示层级 */
.noc-incident {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  padding: 0.375rem var(--spacing-page);
  background: var(--color-message-bg-error);
  color: var(--color-error);
  cursor: pointer;
  font: var(--font-body-s);
  flex-wrap: wrap;
}

.noc-incident b {
  font: var(--font-body-s);
  font-weight: var(--font-weight-bold);
  white-space: nowrap;
}

.noc-incident span {
  color: var(--on-surface);
}

.noc-incident-more {
  color: var(--color-error);
}

.noc-incident-more {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  white-space: nowrap;
}


/* ② 服务总览 — 8 卡网格（4×2），状态色 + 24h 迷你趋势 */
.svc-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--spacing-gutter);
}

.svc-extra {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* 卡片：Level 2 内嵌区块（surface-variant 底），点击联动 */
.svc-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  background: var(--surface-variant);
  border-radius: var(--radius-container);
  padding: 0.75rem;
  cursor: pointer;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
  outline: none;
  min-width: 0;
}

.svc-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-base);
}

.svc-card:focus-visible {
  box-shadow: 0 0 0 var(--outline-width-focus) var(--focus-ring);
}

.svc-card.is-selected {
  box-shadow: 0 0 0 2px var(--color-brand);
}

/* 异常服务卡警示：状态色描环（box-shadow ring，非 border） */
.svc-card.st-warning {
  box-shadow: 0 0 0 2px var(--color-alert);
}

.svc-card.st-critical {
  box-shadow: 0 0 0 2px var(--color-error);
}

.svc-card.st-warning.is-selected {
  box-shadow: 0 0 0 2px var(--color-alert), 0 0 0 4px var(--color-message-bg-alert);
}

.svc-card.st-critical.is-selected {
  box-shadow: 0 0 0 2px var(--color-error), 0 0 0 4px var(--color-message-bg-error);
}

.svc-card.st-critical:hover,
.svc-card.st-warning:hover {
  transform: translateY(-2px);
}

.svc-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

.svc-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: var(--radius-full);
  flex: none;
}

.svc-dot.st-healthy {
  background: var(--color-success);
}

.svc-dot.st-warning {
  background: var(--color-alert);
}

.svc-dot.st-critical {
  background: var(--color-error);
  animation: svc-blink 1.6s ease-in-out infinite;
}

@keyframes svc-blink {
  50% {
    opacity: 0.3;
  }
}

.svc-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

.svc-alarm {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-caption-m);
  padding: 0 0.375rem;
  border-radius: var(--radius-base);
  white-space: nowrap;
}

.svc-alarm.st-warning {
  background: var(--color-message-bg-alert);
  color: var(--color-alert);
}

.svc-alarm.st-critical {
  background: var(--color-message-bg-error);
  color: var(--color-error);
}

.svc-domain {
  margin-left: auto;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.svc-avail-row {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

.svc-avail-block {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
  flex: none;
}

.svc-avail-label {
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
}

.svc-avail {
  font: var(--font-display-s);
  font-weight: var(--font-weight-bold);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.svc-avail i {
  font-style: normal;
  font-size: 0.5em;
  margin-left: 2px;
}

.svc-avail.st-healthy {
  color: var(--color-success);
}

.svc-avail.st-warning {
  color: var(--color-alert);
}

.svc-avail.st-critical {
  color: var(--color-error);
}

.svc-trend {
  flex: 1;
  height: 2.75rem;
  min-width: 0;
  overflow: hidden;
}

.svc-meta {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.svc-instances {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  margin-left: auto;
}

@media (max-width: 80rem) {
  .svc-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}


/* 区块卡片 — Level 1 容器：bg + 圆角 + 卡片阴影（无描边） */
.section-card {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  min-width: 0;
}

.section-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-inline);
  padding: 0.75rem 1rem 0.5rem;
}

.section-card-title {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  min-width: 0;
}

.sc-ico {
  display: inline-flex;
  color: var(--color-brand);
}

.section-card-title h3 {
  margin: 0;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}

.section-card-extra {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  flex-wrap: wrap;
  justify-content: flex-end;
  min-width: 0;
}

.section-card-body {
  padding: 0.5rem 1rem 1rem;
}


/* ③ 黄金指标行 — 4 卡 */
.gm-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--spacing-gutter);
}

.gm-extra {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.gm-card {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  background: var(--surface-variant);
  border-radius: var(--radius-container);
  padding: 0.75rem 1rem;
  min-width: 0;
}

/* 点击联动实时图表 */
.gm-card.is-clickable {
  cursor: pointer;
  outline: none;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.gm-card.is-clickable:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-base);
}

.gm-card.is-clickable:focus-visible {
  box-shadow: 0 0 0 var(--outline-width-focus) var(--focus-ring);
}

.gm-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}

.gm-value {
  font: var(--font-display-s);
  font-weight: var(--font-weight-bold);
  font-variant-numeric: tabular-nums;
  color: var(--on-surface);
  line-height: 1.1;
}

.gm-unit {
  font: var(--font-body-s);
  font-weight: var(--font-weight-normal);
  color: var(--on-surface-variant);
  margin-left: 0.375rem;
}

.gm-delta {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
}

/* 环比涨跌：按方向语义上色（涨不一定好） */
.gm-delta-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  padding: 0 0.375rem;
  border-radius: var(--radius-base);
}

.gm-delta-chip.is-good {
  background: var(--color-message-bg-success);
  color: var(--color-success);
}

.gm-delta-chip.is-bad {
  background: var(--color-message-bg-error);
  color: var(--color-error);
}

.gm-base {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

@media (max-width: 80rem) {
  .gm-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}


/* ④ 服务拓扑 — 三层泳道 + 连接总线（几何与 JS 常量严格一致，全 px） */
.topo-wrap {
  overflow-x: auto;
}

.topo-tiers,
.topo-graph {
  display: grid;
  grid-template-columns: 224px 72px 240px 72px 272px minmax(208px, 1fr);
  column-gap: 0;
  min-width: 1088px;
}

.topo-tiers {
  margin-bottom: 0.5rem;
}

.topo-tiers span {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  border-bottom: 1px solid var(--divider);
  padding: 0.125rem 0;
  white-space: nowrap;
  overflow: hidden;
}

.topo-graph {
  grid-template-rows: repeat(4, 128px);
  row-gap: 16px;
}

.topo-cell {
  position: relative;
  min-width: 0;
}

.topo-gw {
  grid-column: 1;
  grid-row: 1 / 5;
  display: flex;
  align-items: center;
}

.topo-bus {
  grid-column: 2;
  grid-row: 1 / 5;
}

.topo-core {
  grid-column: 3;
  display: flex;
  align-items: center;
}

.topo-bus2 {
  grid-column: 4;
}

.topo-dep {
  grid-column: 5;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.topo-panel {
  grid-column: 6;
  grid-row: 1 / 5;
}

.topo-extra {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

/* ── 节点卡 ── */
.tnode {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.25rem;
  width: 100%;
  height: 72px;
  box-sizing: border-box;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
  padding: 0.25rem 0.625rem;
  cursor: pointer;
  outline: none;
  transition: background 0.2s ease, box-shadow 0.2s ease;
  min-width: 0;
}

.topo-gw .tnode {
  height: 96px;
}

.topo-dep .tnode {
  height: 64px;
}

.tnode:hover {
  background: var(--color-hover);
}

.tnode:focus-visible {
  box-shadow: 0 0 0 var(--outline-width-focus) var(--focus-ring);
}

.tnode.st-warning {
  box-shadow: 0 0 0 2px var(--color-alert);
}

.tnode.st-critical {
  box-shadow: 0 0 0 2px var(--color-error);
}

.tnode.is-selected {
  box-shadow: 0 0 0 2px var(--color-brand);
}

.tnode.st-critical.is-selected {
  box-shadow: 0 0 0 2px var(--color-brand), 0 0 0 4px var(--color-error);
}

.tnode-head {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  min-width: 0;
}

.tnode-head .lucide,
.tnode-head svg {
  color: var(--color-icon-secondary);
  flex: none;
}

.tnode.st-critical .tnode-head svg,
.tnode.st-warning .tnode-head svg {
  color: var(--on-surface);
}

.tnode-name {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tnode-dot {
  margin-left: auto;
  width: 0.375rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  flex: none;
}

.tnode-dot.st-healthy {
  background: var(--color-success);
}

.tnode-dot.st-warning {
  background: var(--color-alert);
}

.tnode-dot.st-critical {
  background: var(--color-error);
  animation: topo-blink 1.6s ease-in-out infinite;
}

@keyframes topo-blink {
  50% {
    opacity: 0.3;
  }
}

.tnode-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.tnode-qps {
  font-variant-numeric: tabular-nums;
  color: var(--on-surface);
}

.tnode-qps i {
  font-style: normal;
  color: var(--on-surface-variant);
}

.tnode-err {
  font-variant-numeric: tabular-nums;
}

.tnode-err.is-bad {
  color: var(--color-error);
  font-weight: var(--font-weight-semibold);
}

/* ── 连接边 ── */
.edge-h {
  position: absolute;
  height: 2px;
}

.edge-v {
  position: absolute;
  width: 2px;
}

.edge-arrow {
  position: absolute;
  width: 0;
  height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 6px solid currentColor;
}

.ec-ok {
  background: var(--color-none-active);
  color: var(--color-none-active);
}

.ec-warn {
  background: var(--color-alert);
  color: var(--color-alert);
}

.ec-critical {
  background: var(--color-error);
  color: var(--color-error);
}

.edge-chip {
  position: absolute;
  font: var(--font-caption-m);
  padding: 0 0.25rem;
  border-radius: var(--radius-base);
  white-space: nowrap;
  z-index: 2;
  font-variant-numeric: tabular-nums;
}

.edge-chip-critical {
  background: var(--color-message-bg-error);
  color: var(--color-error);
}

.edge-chip-warn {
  background: var(--color-message-bg-alert);
  color: var(--color-alert);
}

/* ── 链路面板 ── */
.topo-panel {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.topo-panel-block {
  flex: 1;
  background: var(--surface-variant);
  border-radius: var(--radius-container);
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  min-width: 0;
}

.topo-panel-title {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.topo-panel-empty {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.topo-chain {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font: var(--font-caption-m);
  flex-wrap: wrap;
  cursor: pointer;
  border-radius: var(--radius-base);
  padding: 0.125rem 0.25rem;
  margin: 0 -0.25rem;
  transition: background 0.2s ease;
}

.topo-chain:hover {
  background: var(--color-hover);
}

.chain-level {
  flex: none;
  background: var(--color-error);
  color: var(--color-text-inverse);
  font: var(--font-caption-s);
  border-radius: var(--radius-base);
  padding: 0 0.25rem;
}

.topo-chain.is-warn .chain-level {
  background: var(--color-alert);
}

.chain-path {
  color: var(--on-surface);
  font-weight: var(--font-weight-medium);
}

.chain-latency {
  color: var(--on-surface-variant);
}

.topo-chain.is-critical .chain-latency {
  color: var(--color-error);
}

.topo-chain.is-warn .chain-latency {
  color: var(--color-alert);
}

.topo-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.375rem 0.75rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.topo-legend span {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}

.lg-dot {
  width: 0.375rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  display: inline-block;
}

.lg-dot.lg-healthy {
  background: var(--color-success);
}

.lg-dot.lg-warning {
  background: var(--color-alert);
}

.lg-dot.lg-critical {
  background: var(--color-error);
}

.lg-line {
  width: 0.875rem;
  height: 2px;
  display: inline-block;
}

.topo-note {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}


/* ⑤ 实时图表 — QPS / 错误率双图 */
.rt-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--spacing-gutter);
}

.rt-chart {
  min-width: 0;
}

.rt-chart-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  margin-bottom: 0.5rem;
  white-space: nowrap;
}

.rt-svc-tag {
  margin: 0;
  border: none;
  border-radius: var(--radius-base);
  background: var(--color-message-bg-info);
  color: var(--color-info-primary);
  font: var(--font-body-s);
}

.rt-range {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.rt-divider {
  width: 1px;
  height: 0.75rem;
  background: var(--color-border);
}

.rt-more {
  display: inline-flex;
  align-items: center;
  padding: 0.125rem;
  cursor: pointer;
  color: var(--color-icon-secondary);
}

.rt-more:hover {
  color: var(--color-brand);
}

@media (max-width: 70rem) {
  .rt-grid {
    grid-template-columns: 1fr;
  }
}


/* ⑥ 告警列表 — 工具区 + 表格 */
.alarm-toolbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  margin-bottom: 0.75rem;
  flex-wrap: wrap;
}

.alarm-search {
  width: 18rem;
}

.alarm-summary {
  display: flex;
  gap: var(--spacing-inline);
  margin-left: auto;
  flex-wrap: wrap;
}

.alarm-extra-caption {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}

.env-chip {
  font: var(--font-body-s);
  letter-spacing: 0;
}

.alarm-more {
  display: inline-flex;
  align-items: center;
  padding: 0.125rem;
  cursor: pointer;
  color: var(--color-icon-secondary);
}

.alarm-more:hover {
  color: var(--color-brand);
}

/* 链接式告警对象 */
.alarm-object {
  color: var(--interactive-link);
  cursor: pointer;
}

.alarm-object:hover {
  color: var(--interactive-link-hover);
}

/* 策略名：链接式入口，点击打开详情抽屉 */
.alarm-strategy-link {
  color: var(--interactive-link);
  cursor: pointer;
}

.alarm-strategy-link:hover {
  color: var(--interactive-link-hover);
}

.alarm-values {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.alarm-trigger {
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}

.alarm-trigger.lv-P0 {
  color: var(--color-error);
}

.alarm-trigger.lv-P1 {

    if (a.status !== "firing" && a.status !== "claimed") continue;

  const d = Math.floor(min / 1440);
  const h = Math.floor((min % 1440) / 60);

(function () {
  const { useState, useEffect, createContext, useContext } = React;
  const { ALARMS } = __export;
// Layer 1: 全局状态 — NOC 值班监控中心
// 换肤单轨驱动:isDark 只切换 <html> 的 .dark class;
// 普通 H5 元素(token 四层)与 antd 组件(ant.css 换肤层)同源跟随,无需 React 参与换肤。
// 默认深色:NOC 值班风格,异常信息最高层级。
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(true);

  // 环境切换（生产 / 预发）— 全局联动数据源
  const [env, setEnv] = useState("prod");
  // 时间范围 + 刷新频率
  const [timeRange, setTimeRange] = useState("1h");
  const [refreshRate, setRefreshRate] = useState(30);
  const [lastRefresh, setLastRefresh] = useState(() => dayjs());
  // 刷新脉冲：每次自动 / 手动刷新自增，驱动展示层 QPS 轻微跳动（不改变告警口径）
  const [refreshTick, setRefreshTick] = useState(0);
  // ⑤ 实时图表当前聚焦的服务（由 ② 服务卡 / ④ 拓扑节点联动）
  const [selectedService, setSelectedService] = useState("api-gateway");
  // ⑥ 告警列表：按策略名搜索（拓扑数据节点点击也会写入）
  const [alarmQuery, setAlarmQuery] = useState("");
  // ⑥ 告警行数据（认领 / 静默会就地变更；切环境时重载）
  const [alarms, setAlarms] = useState(() => ALARMS.prod.map((a) => ({ ...a })));
  // ①/⑥ 告警静默弹窗：{ open, target }（target 为行级静默预填对象）
  const [silence, setSilence] = useState({ open: false, target: null });
  // ⑥ 告警详情抽屉：{ open, id }（点击策略名打开）
  const [alarmDetail, setAlarmDetail] = useState({ open: false, id: null });

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  // 环境切换 → 重载该环境告警快照，并清空策略名搜索
  useEffect(() => {
    setAlarms(ALARMS[env].map((a) => ({ ...a })));
    setAlarmQuery("");
  }, [env]);

  // 自动刷新：按频率更新「最后刷新时间」
  useEffect(() => {
    const timer = setInterval(() => {
      setRefreshTick((t) => t + 1);
      setLastRefresh(dayjs());
    }, refreshRate * 1000);
    return () => clearInterval(timer);
  }, [refreshRate]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
    env,
    setEnv,
    timeRange,
    setTimeRange,
    refreshRate,
    setRefreshRate,
    lastRefresh,
    refreshTick,
    manualRefresh: () => {
      setRefreshTick((t) => t + 1);
      setLastRefresh(dayjs());
    },
    selectedService,
    setSelectedService,
    alarms,
    setAlarms,
    alarmQuery,
    setAlarmQuery,
    silence,
    openSilence: (target) => setSilence({ open: true, target: target || null }),
    closeSilence: () => setSilence({ open: false, target: null }),
    alarmDetail,
    openAlarmDetail: (rec) => setAlarmDetail({ open: true, id: rec.id }),
    closeAlarmDetail: () => setAlarmDetail({ open: false, id: null }),
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

    ref: wrapRef,

    className,

    { key: "errRate", label: "全站错误率", icon: "triangle-alert", display: "0.09", unit: "%", delta: "-0.03pp", deltaUp: false, good: true, base: "较昨日同期" },
    { key: "p99", label: "P99 延迟", icon: "gauge", display: "210", unit: "ms", delta: "-3.4%", deltaUp: false, good: true, base: "较昨日同期" },
  ],
};

const RANGE_LABELS = { "1h": "近 1 小时", "6h": "近 6 小时", "24h": "近 24 小时", "7d": "近 7 天" };

const RANGE_SPEC = {
  "1h": { points: 60, stepMin: 1, fmt: "HH:mm" },
  "6h": { points: 72, stepMin: 5, fmt: "HH:mm" },
  "24h": { points: 96, stepMin: 15, fmt: "HH:mm" },
  "7d": { points: 84, stepMin: 120, fmt: "MM-DD HH:mm" },
};

// ⑤ 异常时段注入：sinceAgo 与告警列表「持续时长」一致
//   payment-service：42 分钟前错误率爬升至 3.85%（P0 告警触发中），并持续保持
//   api-gateway：18 分钟前 5xx 升至 0.9%（P1 告警触发中，支付异常向上游传播）
const SERIES_PROFILE = {
  prod: {
    "api-gateway": { errBase: 0.06, spike: { sinceAgo: 18, rampMin: 4, peak: 0.9, qpsDip: 0.04 } },
    "order-service": { errBase: 0.42 },
    "product-service": { errBase: 0.05 },
    "user-service": { errBase: 0.06 },
    "payment-service": { errBase: 0.08, spike: { sinceAgo: 42, rampMin: 5, peak: 3.85, qpsDip: 0.08 } },
    "push-service": { errBase: 0.03 },
    "search-service": { errBase: 0.08 },
    "risk-service": { errBase: 0.02 },
  },
  staging: {
    "api-gateway": { errBase: 0.05 },
    "order-service": { errBase: 0.05 },
    "product-service": { errBase: 0.03 },
    "user-service": { errBase: 0.04 },
    "payment-service": { errBase: 0.06, spike: { sinceAgo: 22, rampMin: 4, peak: 0.9, qpsDip: 0.03 } },
    "push-service": { errBase: 0.02 },
    "search-service": { errBase: 0.05 },
    "risk-service": { errBase: 0.01 },
  },
};

function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// 生成 QPS 与错误率双序列（确定性伪随机；错误率异常时段在数据上体现）
function buildSeries(env, serviceKey, range) {
  const spec = RANGE_SPEC[range] || RANGE_SPEC["1h"];
  const svc = SERVICES[env].find((s) => s.key === serviceKey) || SERVICES[env][0];
  const profile = SERIES_PROFILE[env][svc.key] || { errBase: 0.05 };
  const rng = makeRng(hashStr(`series|${env}|${svc.key}|${range}`));
  const now = dayjs();
  const points = [];

  for (let i = spec.points - 1; i >= 0; i--) {
    const minutesAgo = i * spec.stepMin;
    const ts = now.subtract(minutesAgo, "minute");
    let err = profile.errBase * (0.75 + rng() * 0.5);
    let qps = svc.qps * (0.9 + rng() * 0.18);

    const spike = profile.spike;
    if (spike && minutesAgo <= spike.sinceAgo) {
      const rampEnd = spike.sinceAgo - spike.rampMin;
      // 爬升期 0→1，随后进入平台期（事故持续中，错误率维持峰值附近）
      const shape = minutesAgo >= rampEnd ? (spike.sinceAgo - minutesAgo) / spike.rampMin : 1;
      err = err + (spike.peak - profile.errBase) * shape * (0.94 + rng() * 0.12);
      qps = qps * (1 - spike.qpsDip * shape);
    }

    points.push({
      label: ts.format(spec.fmt),
      qps: Math.round(qps),
      err: Math.round(err * 1000) / 1000,
    });
  }

  return { points, errThreshold: svc.errThreshold };
}
  Object.assign(__export, { buildSeries, GOLDEN, RANGE_LABELS });
})();

(function () {
  const { useRef, useEffect, useState, forwardRef, useImperativeHandle } = React;
// Chart — HUICharts 的 React 封装(命令式 → 声明式)
// 底层: echarts + hui-charts.umd.js(全局 HUICharts),配置项 option 原样透传给 setSimpleOption。
// 暗色联动:自动监听 <html> 的 .dark class,切换 hdesign-light / hdesign-dark 主题并重建图表。
const Chart = forwardRef(function Chart(
  { name, option, className, style, onChartRendered },
  ref
) {
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const renderedRef = useRef(onChartRendered);
  renderedRef.current = onChartRendered;

  // .dark 切换 → 递增 tick 触发主 effect 重建(走同一条 init/dispose 路径)
  const [darkTick, setDarkTick] = useState(0);
  useEffect(() => {
    const mo = new MutationObserver(() => setDarkTick((t) => t + 1));
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    return () => mo.disconnect();
  }, []);

  useEffect(() => {
    const dom = containerRef.current;
    if (!dom || !window.HUICharts) return;

    const isDark = document.documentElement.classList.contains("dark");
    const chart = new HUICharts();
    chart.init(dom, { renderer: "svg"});
    chart.setSimpleOption(name, {
      theme: isDark ? "hdesign-dark" : "hdesign-light",
      a2ui: true,
      ...option,
    });
    chart.render();
    chartRef.current = chart;
    if (renderedRef.current) renderedRef.current(chart);

    // 容器尺寸变化(侧栏折叠/窗口缩放/响应式) → 同步画布
    const ro = new ResizeObserver(() => {
      if (chartRef.current && !chartRef.current._disposed) chart.resize();
    });
    ro.observe(dom);

    return () => {
      ro.disconnect();
      try { chart.dispose(); } catch (e) { /* 容器已卸载时静默 */ }
      chartRef.current = null;
    };
    // JSON.stringify 作 dep:option 是 JSX 内联对象,内容不变则不重建
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [name, JSON.stringify(option), darkTick]);

  useImperativeHandle(ref, () => ({
    getEchartsInstance: () => (chartRef.current ? chartRef.current.getEchartsInstance() : null),
    resizeHandler: () => {
      if (chartRef.current) chartRef.current.resize();
    },
  }), []);

  const wrapperStyle = { width: "100%", height: "100%", ...style };
  return <div ref={containerRef} className={className} style={wrapperStyle} />;
});
  Object.assign(__export, { Chart });
})();

(function () {
  const { Fragment, useMemo } = React;
  const { Icon, useApp, TOPOLOGY, worstActiveLevel, fmtNum, liveQps } = __export;
  const SectionCard = __export.SectionCard;
// 画布几何（px，与 CSS 网格严格一致）：4 条泳道 × 128px，行距 16px。
// bus1 单元纵向贯通整个画布（top 从 0 起算，用画布坐标）；
// bus2 单元仅占一格泳道（top 用泳道内相对坐标：核心 64 / MySQL 32 / Redis 96）。
const LANE_H = 128;
const LANE_GAP = 16;
const SPLIT_X = 36;
const STUB_W = 30;
const REL_CORE = 64;
const REL_DEP_TOP = 32;
const REL_DEP_BOTTOM = 96;
const laneTop = (i) => i * (LANE_H + LANE_GAP);
const laneCenter = (i) => laneTop(i) + 64;
const GW_CENTER = (3 * (LANE_H + LANE_GAP) + LANE_H) / 2; // 280px，网关垂直居中

const KIND_ICON = { gateway: "waypoints", service: "server", mysql: "database", redis: "zap" };
const KIND_LABEL = { gateway: "入口网关", service: "核心服务", mysql: "MySQL 主库", redis: "Redis 缓存" };

// 节点状态由告警列表推导：活动 P0 → 严重；活动 P1 → 告警；否则正常（异常节点必有对应告警）
function nodeStatus(node, alarms) {
  const worst = worstActiveLevel(alarms, node.id);
  if (worst && worst.level === "P0") return "critical";
  if (worst && worst.level === "P1") return "warning";
  return "healthy";
}

function TopoNode({ node, selected, onClick, big, tick }) {
  const st = node.status;
  const qps = liveQps(node.qps, node.id, tick);
  return (
    <div
      className={`tnode kind-${node.kind} st-${st}${selected ? " is-selected" : ""}${big ? " is-big" : ""}`}
      role="button"
      tabIndex={0}
      title={`${node.name} · ${KIND_LABEL[node.kind]} · QPS ${fmtNum(qps)} · 错误率 ${node.errRate}%`}
      onClick={() => onClick(node)}
      onKeyDown={(e) => {
        if (e.key === "Enter" || e.key === " ") onClick(node);
      }}
    >
      <div className="tnode-head">
        <Icon name={KIND_ICON[node.kind]} size="0.875rem" />
        <span className="tnode-name">{node.name}</span>
        <span className={`tnode-dot st-${st}`} />
      </div>
      <div className="tnode-meta">
        <span className="tnode-qps">
          {fmtNum(qps)}
          <i> QPS</i>
        </span>
        <span className={node.errRate > 0.5 ? "tnode-err is-bad" : "tnode-err"}>错误率 {node.errRate}%</span>
      </div>
    </div>
  );
}

// ④ 服务拓扑（主视觉）：入口 → 4 核心服务 → 各自 MySQL/Redis，13 节点 12 边；
// 异常调用链路警示色高亮并标注延迟毫秒数；QPS 随刷新频率实时跳动。
function ServiceTopology() {
  const app = useApp();
  const topo = TOPOLOGY[app.env];

  const nodes = useMemo(
    () => topo.nodes.map((n) => ({ ...n, status: nodeStatus(n, app.alarms) })),
    [topo, app.alarms]
  );

  const gw = nodes.find((n) => n.kind === "gateway");
  const cores = nodes.filter((n) => n.kind === "service");
  const edgeOf = (from, to) => topo.edges.find((e) => e.from === from && e.to === to);
  const depOf = (lane, kind) => nodes.find((n) => n.kind === kind && n.lane === lane);
  const nodeById = (id) => nodes.find((n) => n.id === id);

  // 节点点击联动：服务/网关 → 联动 ⑤ 实时图表；数据节点 → 联动 ⑥ 告警列表搜索
  const onNodeClick = (node) => {
    if (node.kind === "mysql" || node.kind === "redis") {
      app.setAlarmQuery(node.id);
      const el = document.getElementById("alarm-section");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    app.setSelectedService(node.id);
    const el = document.getElementById("realtime-section");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // 异常链路行点击 → 检索该对象告警
  const jumpChain = (e) => {
    app.setAlarmQuery(e.to);
    const el = document.getElementById("alarm-section");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // 总线 1（画布坐标）：网关干线 → 垂直分配 → 各核心服务（方向：左 → 右）
  const bus1 = [
    <div key="trunk" className="edge-h ec-ok" style={{ left: 0, top: GW_CENTER - 1, width: SPLIT_X }} />,
    <div
      key="rail"
      className="edge-v ec-ok"
      style={{ left: SPLIT_X - 1, top: laneCenter(0) - 1, height: laneCenter(3) - laneCenter(0) + 2 }}
    />,
  ];
  cores.forEach((core, i) => {
    const e = edgeOf("api-gateway", core.id);
    const y = laneCenter(i);
    bus1.push(
      <div key={`h-${core.id}`} className={`edge-h ec-${e.status}`} style={{ left: SPLIT_X, top: y - 1, width: STUB_W }} />
    );
    bus1.push(
      <span key={`a-${core.id}`} className={`edge-arrow ec-${e.status}`} style={{ left: SPLIT_X + STUB_W, top: y - 4 }} />
    );
    if (e.status !== "ok") {
      bus1.push(
        <span
          key={`c-${core.id}`}
          className={`edge-chip edge-chip-${e.status}`}
          style={{ left: 2, top: y - 4, transform: "translateY(-100%)" }}
        >
          {fmtNum(e.latencyMs)} ms
        </span>
      );
    }
  });

  // 总线 2（泳道内相对坐标）：核心服务 → 垂直分叉 → 各自 MySQL / Redis
  const renderBus2 = (core, i) => {
    const mysql = depOf(i, "mysql");
    const redis = depOf(i, "redis");
    const eM = edgeOf(core.id, mysql.id);
    const eR = edgeOf(core.id, redis.id);
    const worst =
      eM.status === "critical" || eR.status === "critical"
        ? "critical"
        : eM.status === "warn" || eR.status === "warn"
          ? "warn"
          : "ok";
    const yCore = REL_CORE;
    const yM = REL_DEP_TOP;
    const yR = REL_DEP_BOTTOM;
    const items = [
      <div key="trunk" className={`edge-h ec-${worst}`} style={{ left: 0, top: yCore - 1, width: SPLIT_X }} />,
      <div key="rail" className={`edge-v ec-${worst}`} style={{ left: SPLIT_X - 1, top: yM - 1, height: yR - yM + 2 }} />,
    ];
    [
      [yM, eM, "m"],
      [yR, eR, "r"],
    ].forEach(([y, e, k]) => {
      items.push(
        <div key={`h-${k}`} className={`edge-h ec-${e.status}`} style={{ left: SPLIT_X, top: y - 1, width: STUB_W }} />
      );
      items.push(
        <span key={`a-${k}`} className={`edge-arrow ec-${e.status}`} style={{ left: SPLIT_X + STUB_W, top: y - 4 }} />
      );
      if (e.status !== "ok") {
        items.push(
          <span
            key={`c-${k}`}
            className={`edge-chip edge-chip-${e.status}`}
            style={{ left: 2, top: y - 4, transform: "translateY(-100%)" }}
          >
            {fmtNum(e.latencyMs)} ms
          </span>
        );
      }
    });
    return items;
  };

  const abnormal = topo.edges.filter((e) => e.status !== "ok");

  return (
    <SectionCard
      id="topology-section"
      icon="network"
      title="服务拓扑 · 实时调用链"
      className="topo-section"
      extra={
        <span className="topo-extra">
          {topo.nodes.length} 节点 · {topo.edges.length} 条调用边 · 每 {app.refreshRate} 秒自动刷新
        </span>
      }
    >
      <div className="topo-wrap">
        <div className="topo-tiers">
          <span>入口层</span>
          <span aria-hidden="true" />
          <span>核心服务层</span>
          <span aria-hidden="true" />
          <span>数据与缓存层</span>
          <span>链路面板</span>
        </div>
        <div className="topo-graph">
          <div className="topo-cell topo-gw">
            <TopoNode node={gw} selected={app.selectedService === gw.id} onClick={onNodeClick} big tick={app.refreshTick} />
          </div>
          <div className="topo-cell topo-bus">{bus1}</div>
          {[0, 1, 2, 3].map((i) => {
            const core = cores[i];
            return (
              <Fragment key={core.id}>
                <div className="topo-cell topo-core">
                  <TopoNode
                    node={core}
                    selected={app.selectedService === core.id}
                    onClick={onNodeClick}
                    tick={app.refreshTick}
                  />
                </div>
                <div className="topo-cell topo-bus2">{renderBus2(core, i)}</div>
                <div className="topo-cell topo-dep">
                  <TopoNode node={depOf(i, "mysql")} selected={false} onClick={onNodeClick} tick={app.refreshTick} />
                  <TopoNode node={depOf(i, "redis")} selected={false} onClick={onNodeClick} tick={app.refreshTick} />
                </div>
              </Fragment>
            );
          })}
          <div className="topo-cell topo-panel">
            <div className="topo-panel-block">
              <div className="topo-panel-title">
                <Icon name="octagon-alert" size="0.875rem" />
                异常调用链
              </div>
              {abnormal.length === 0 ? (
                <div className="topo-panel-empty">当前环境调用链路全部正常</div>
              ) : (
                abnormal.map((e) => (
                  <div
                    key={`${e.from}-${e.to}`}
                    className={`topo-chain is-${e.status}`}
                    onClick={() => jumpChain(e)}
                    title="点击检索该对象的告警"
                  >
                    <span className="chain-level">{e.status === "critical" ? "P0" : "P1"}</span>
                    <span className="chain-path">
                      {nodeById(e.from).name} → {nodeById(e.to).name}
                    </span>
                    <span className="chain-latency">
                      {fmtNum(e.latencyMs)} ms{e.label ? ` · ${e.label}` : ""}
                    </span>
                  </div>
                ))
              )}
            </div>
            <div className="topo-panel-block">
              <div className="topo-panel-title">
                <Icon name="list-checks" size="0.875rem" />
                图例
              </div>
              <div className="topo-legend">
                <span>
                  <i className="lg-dot lg-healthy" />
                  节点正常
                </span>
                <span>
                  <i className="lg-dot lg-warning" />
                  节点告警
                </span>
                <span>
                  <i className="lg-dot lg-critical" />
                  节点严重
                </span>
                <span>
                  <i className="lg-line ec-ok" />
                  正常调用
                </span>
                <span>
                  <i className="lg-line ec-warn" />
                  延迟告警
                </span>
                <span>
                  <i className="lg-line ec-critical" />
                  异常链路
                </span>
              </div>
              <div className="topo-note">
                节点显示实时 QPS 与错误率，QPS 随刷新频率轻微跳动；异常链路高亮并标注调用延迟（ms）。点击服务节点联动实时图表，点击数据节点或异常链路检索其告警。
              </div>
            </div>
          </div>
        </div>
      </div>
    </SectionCard>
  );
}
  Object.assign(__export, { ServiceTopology });
})();

/* ===== src/views/silence-modal/index.jsx ===== */
(function () {
  const { useEffect, useState } = React;
  const { Input, Modal, Select, message } = antd;
  const { Icon, useApp, TOPOLOGY } = __export;
const DURATIONS = [
  { value: "30", label: "30 分钟" },
  { value: "60", label: "1 小时" },
  { value: "120", label: "2 小时" },
  { value: "240", label: "4 小时" },
  { value: "1440", label: "24 小时" },
];

// ①/⑥ 告警静默弹窗：对象 + 时长 + 原因（必填校验，H5 表单骨架）
function SilenceModal() {
  const app = useApp();
  const { silence } = app;
  const [target, setTarget] = useState(null);
  const [duration, setDuration] = useState("60");
  const [reason, setReason] = useState("");
  const [errors, setErrors] = useState({});

  useEffect(() => {
    if (silence.open) {
      setTarget(silence.target || null);
      setDuration("60");
      setReason("");
      setErrors({});
    }
  }, [silence.open, silence.target]);

  const options = TOPOLOGY[app.env].nodes.map((n) => ({ value: n.id, label: `${n.name}（${n.id}）` }));
  const targetName = (id) => {
    const node = TOPOLOGY[app.env].nodes.find((n) => n.id === id);
    return node ? node.name : id;
  };
  const durationLabel = (v) => {
    const item = DURATIONS.find((d) => d.value === v);
    return item ? item.label : v;
  };

  const clearErr = (k) => setErrors((e) => ({ ...e, [k]: undefined }));

  const submit = () => {
    const errs = {};
    if (!target) errs.target = "请选择静默对象";
    if (!duration) errs.duration = "请选择静默时长";
    if (!reason.trim()) errs.reason = "请填写静默原因";
    if (Object.keys(errs).length) {
      setErrors(errs);
      return;
    }
    const reasonText = reason.trim();
    // 静默生效：该对象「触发中 / 已认领」告警转入已静默
    app.setAlarms((list) =>
      list.map((a) =>
        a.targetKey === target && (a.status === "firing" || a.status === "claimed")
          ? { ...a, status: "silenced", claimBy: null, silenceReason: reasonText }
          : a
      )
    );
    message.success(`已静默「${targetName(target)}」· ${durationLabel(duration)} · 原因：${reasonText}`);
    app.closeSilence();
  };

  return (
    <Modal
      title="告警静默配置"
      open={silence.open}
      onCancel={app.closeSilence}
      onOk={submit}
      okText="确认静默"
      cancelText="取消"
      okButtonProps={{ danger: true }}
      width={480}
    >
      <form
        className="silence-form"
        onSubmit={(e) => {
          e.preventDefault();
          submit();
        }}
      >
        <div className="sf-row">
          <label className="sf-label required" htmlFor="sil-target">
            静默对象
          </label>
          <div className="sf-field">
            <Select
              id="sil-target"
              style={{ width: "100%" }}
              placeholder="选择服务或数据节点"
              value={target}
              showSearch
              optionFilterProp="label"
              status={errors.target ? "error" : undefined}
              onChange={(v) => {
                setTarget(v);
                clearErr("target");
              }}
              options={options}
            />
            {errors.target ? <div className="sf-error">{errors.target}</div> : null}
          </div>
        </div>
        <div className="sf-row">
          <label className="sf-label required" htmlFor="sil-duration">
            静默时长
          </label>
          <div className="sf-field">
            <Select
              id="sil-duration"
              style={{ width: "9rem" }}
              value={duration}
              status={errors.duration ? "error" : undefined}
              onChange={(v) => {
                setDuration(v);
                clearErr("duration");
              }}
              options={DURATIONS}
            />
            {errors.duration ? <div className="sf-error">{errors.duration}</div> : null}
          </div>
        </div>
        <div className="sf-row">
          <label className="sf-label required" htmlFor="sil-reason">
            静默原因
          </label>
          <div className="sf-field">
            <Input.TextArea
              id="sil-reason"
              rows={3}
              maxLength={80}
              showCount
              value={reason}
              placeholder="例如：变更窗口内预期告警，临时静默以降噪"
              status={errors.reason ? "error" : undefined}
              onChange={(e) => {
                setReason(e.target.value);
                if (e.target.value.trim()) clearErr("reason");
              }}
            />
            {errors.reason ? <div className="sf-error">{errors.reason}</div> : null}
          </div>
        </div>
        <div className="sf-tip">
          <span className="sf-tip-ico">
            <Icon name="triangle-alert" size="0.875rem" />
          </span>
          静默期间，该对象「触发中 / 已认领」的告警将停止通知；已恢复告警不受影响。静默操作将记录值班人与原因。
        </div>
      </form>
    </Modal>
  );
}
  Object.assign(__export, { SilenceModal });
})();

  "payment-redis": "连接池 98%：排查慢查询导致的连接占用，必要时临时调大连接池上限。",
  "order-service": "P99 1240ms 与订单导出任务相关，评估任务限流；实例已扩容至 12 个。",
  "order-redis": "内存 92%：检查大 Key 与过期策略，必要时清理临时缓存。",
  "api-gateway": "5xx 升高由下游支付服务传播引起，优先恢复支付链路；网关证书 15 天后过期，请安排轮换。",
};

// 告警详情抽屉：基本信息 / 处置建议 / 事件轨迹 / 同对象关联告警 / 快捷操作
function AlarmDetailDrawer() {
  const app = useApp();
  const rec = app.alarms.find((a) => a.id === app.alarmDetail.id);
  if (!rec) return null;

  const open = app.alarmDetail.open;
  const start = dayjs().subtract(rec.durationMin, "minute");
  const fmtTs = (d) => d.format(rec.durationMin >= 1440 ? "MM-DD HH:mm" : "HH:mm");

  const related = app.alarms.filter((a) => a.targetKey === rec.targetKey && a.id !== rec.id);

  // 事件轨迹：按持续时长与状态推导
  const trail = [
    {
      key: "t0",
      t: start,
      tone: "var(--color-error)",
      label: "告警首次触发",
      desc: `${rec.strategyName}：触发值 ${rec.triggerValue} 超过阈值 ${rec.threshold}`,
    },
    {
      key: "t1",
      t: start.add(2, "minute"),
      tone: "var(--color-alert)",
      label: "连续 3 个评估周期超阈值",
      desc: `告警级别确认为 ${rec.level}`,
    },
    {
      key: "t2",
      t: start.add(3, "minute"),
      tone: "var(--color-brand)",
      label: "电话 + IM 通知值班",
      desc: "通知对象：张伟（白班）、李婧（夜班交接）",
    },
  ];
  if (rec.claimBy) {
    trail.push({
      key: "t3",
      t: start.add(6, "minute"),
      tone: "var(--color-info-primary)",
      label: "值班工程师认领",
      desc: `认领人：${rec.claimBy}`,
    });
  }
  if (rec.status === "silenced") {
    trail.push({
      key: "t4",
      t: start.add(10, "minute"),
      tone: "var(--color-text-secondary)",
      label: "告警被静默",
      desc: rec.silenceReason ? `静默原因：${rec.silenceReason}` : "静默原因见静默记录",
    });
  }
  if (rec.status === "resolved") {
    trail.push({
      key: "t5",
      t: dayjs().subtract(8, "minute"),
      tone: "var(--color-success)",
      label: "指标恢复正常，告警自动关闭",
      desc: "连续 3 个评估周期低于阈值后自动关闭",
    });
  } else {
    trail.push({
      key: "t5",
      t: dayjs().subtract(1, "minute"),
      tone: "var(--color-error)",
      label: "最近一次评估仍超阈值",
      desc: `当前触发值 ${rec.triggerValue} 仍高于阈值 ${rec.threshold}`,
    });
  }

  const claimHere = () => {
    app.setAlarms((list) =>
      list.map((a) => (a.id === rec.id ? { ...a, status: "claimed", claimBy: "张伟" } : a))
    );
    message.success(`已认领告警：${rec.strategyName}（${rec.targetName}）· 值班人 张伟`);
  };

  const jumpTarget = () => {
    const isService = SERVICES[app.env].some((s) => s.key === rec.targetKey);
    if (isService) app.setSelectedService(rec.targetKey);
    app.closeAlarmDetail();
    const el = document.getElementById("topology-section");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    message.info(`已跳转对象：${rec.targetName}（见服务拓扑）`);
  };

  return (
    <Drawer
      open={open}
      onClose={app.closeAlarmDetail}
      width={520}
      title={
        <div className="adw-title">
          <LevelTag level={rec.level} />
          <span className="adw-name">{rec.strategyName}</span>
          <AlarmStatusTag status={rec.status} />
        </div>
      }
    >
      <div className="adw-body">
        <section className="adw-block">
          <h4>告警信息</h4>
          <div className="adw-grid">
            <div className="adw-cell">
              <span>告警对象</span>
              <b>{rec.targetName}</b>
            </div>
            <div className="adw-cell">
              <span>触发值 / 阈值</span>
              <b>
                {rec.triggerValue} / {rec.threshold}
              </b>
            </div>
            <div className="adw-cell">
              <span>持续时长</span>
              <b>{fmtDur(rec.durationMin)}</b>
            </div>
            <div className="adw-cell">
              <span>首次触发</span>
              <b>{fmtTs(start)}</b>
            </div>
            <div className="adw-cell">
              <span>认领人</span>
              <b>{rec.claimBy || "—"}</b>
            </div>
            <div className="adw-cell">
              <span>告警编号</span>
              <b>{rec.id}</b>
            </div>
          </div>
        </section>

        <section className="adw-block">
          <h4>处置建议</h4>
          <p className="adw-runbook">{TARGET_HINT[rec.targetKey] || RUNBOOK[rec.level]}</p>
          {TARGET_HINT[rec.targetKey] ? <p className="adw-runbook adw-runbook-sub">{RUNBOOK[rec.level]}</p> : null}
        </section>

        <section className="adw-block">
          <h4>事件轨迹</h4>
          <Timeline
            className="adw-trail"
            items={trail.map((ev) => ({
              key: ev.key,
              color: ev.tone,
              children: (
                <div className="adw-ev">
                  <div className="adw-ev-head">
                    <span className="adw-ev-time">{fmtTs(ev.t)}</span>
                    <b>{ev.label}</b>
                  </div>
                  <div className="adw-ev-desc">{ev.desc}</div>
                </div>
              ),
            }))}
          />
        </section>

        <section className="adw-block">
          <h4>同对象关联告警（{related.length}）</h4>
          {related.length === 0 ? (
            <p className="adw-empty">暂无其他关联告警</p>
          ) : (
            related.map((r) => (
              <div className="adw-related" key={r.id} onClick={() => app.openAlarmDetail(r)} title="点击查看该告警">
                <LevelTag level={r.level} />
                <span className="adw-related-name">{r.strategyName}</span>
                <AlarmStatusTag status={r.status} />
              </div>
            ))
          )}
        </section>

        <div className="adw-actions">
          {rec.status === "firing" ? (
            <a onClick={claimHere}>
              <Icon name="user-check" size="0.875rem" />
              认领
            </a>
          ) : null}
          <a
            onClick={() => {
              app.closeAlarmDetail();
              app.openSilence(rec.targetKey);
            }}
          >
            <Icon name="volume-x" size="0.875rem" />
            静默该对象
          </a>
          <a onClick={jumpTarget}>
            <Icon name="external-link" size="0.875rem" />
            跳转对象
          </a>
        </div>
      </div>
    </Drawer>
  );
}
  Object.assign(__export, { AlarmDetailDrawer });
})();

(function () {
  const { ConfigProvider, Empty } = antd;

  const zhCN = __export.zhCN;
  const HeaderBar = __export.HeaderBar;
  const ServiceOverview = __export.ServiceOverview;
  const GoldenMetrics = __export.GoldenMetrics;
  const ServiceTopology = __export.ServiceTopology;
  const RealtimeCharts = __export.RealtimeCharts;
  const AlarmTable = __export.AlarmTable;

  const SilenceModal = __export.SilenceModal;
  const AlarmDetailDrawer = __export.AlarmDetailDrawer;
// App entry — NOC 监控中心（互联网 IT 运维监控告警）
// Layering convention (one folder per component, kebab-case + index.jsx/index.css):
//   Layer 1 global state  → src/context.jsx        (AppProvider: 环境/时间范围/刷新/聚焦服务/告警/静默)

//                            service-topology / realtime-charts / alarm-table / handover-timeline /
//                            change-feed / silence-modal)
//   Layer 5 layout        → app.jsx                (Provider + root container assembly)
















function App() {
  return (
    <AppProvider>
      <ConfigProvider
        locale={zhCN}
        wave={{ disabled: true }}
        renderEmpty={() => <Empty style={{ padding: "2rem 0" }} />}
        empty={{ image: "./assets/uploads/empty.svg" }}
        spin={{ indicator: <img src="./assets/uploads/loading.svg" alt="" className="custom-spin-indicator" /> }}
      >
        <div className="app-root">
          <HeaderBar />
          <main className="noc-main">
            <ServiceOverview />
            <GoldenMetrics />
            <ServiceTopology />
            <RealtimeCharts />
            <AlarmTable />
            <div className="noc-bottom-grid">
              <HandoverTimeline />
              <ChangeFeed />
            </div>
          </main>
          <SilenceModal />
          <AlarmDetailDrawer />
        </div>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
