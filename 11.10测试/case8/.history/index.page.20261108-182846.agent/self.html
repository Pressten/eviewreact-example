  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Badge 组件样式（占位，待填充 token 映射） */
.ant-badge {
  color: var(--color-text-primary);
}
.ant-badge .ant-badge-count {
  /* 单数字 16×16 正圆（半径=高度一半）；多位数字按内容+padding 撑开成胶囊；
       不设 line-height（antd 默认 20px 偏大会压偏文字），用 flex 垂直居中兜底 */
  box-sizing: border-box;
  min-width: 1rem;
  height: 1rem;
  padding: 0 0.25rem;
  border-radius: 0.5rem;
  align-items: center;
  font-size: var(--font-size-base);
  box-shadow: 0 0 0 1px var(--gray-0);
  background-color: var(--color-error);
  color: var(--color-text-inverse);

/* Segmented 组件样式（占位，待填充 token 映射） */
.ant-segmented {
  border-radius: var(--radius-md);
  padding: 0.125rem;
  background: var(--color-fill);
  width: initial !important;
  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  transition: none;

/* 应用级基础样式 —— AOC 运行控制中心: 高信息密度、9 区块工作台 */
.app-root {
  min-height: 100vh;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

.aoc-root { display: flex; flex-direction: column; min-width: 76rem; }

/* 主体工作区: 左列(主表 + 登机口网格) + 右列(波及链 + 机组执勤 + 运行质量)
   注意: 高度必须由内容撑开(不设 flex:1 1 0 / min-height:0)——
   否则在 min-height:100vh 的纵向容器里主区会按视口截断, 内容溢出叠压下方区块 */
.aoc-main {
  display: flex;
  gap: var(--spacing-gutter);
  padding: var(--spacing-gutter);
  align-items: flex-start;
}

.aoc-table-region {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-gutter);
}

.aoc-side-region {
  flex: 0 0 23.5rem;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-gutter);
}

/* 次级工作区: 气象流量 + 不正常事件(等高对齐) */
.aoc-sub-row {
  display: flex;
  gap: var(--spacing-gutter);
  padding: 0 var(--spacing-gutter) var(--spacing-gutter);
  align-items: stretch;
}


/* 区块① 顶部运行栏 —— 双层: 主操作行 + 运行摘要条 */
.ops-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-r-sm);
}

/* 上层: 主操作行 */
.oh-main {
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  height: 3.5rem;
  padding: 0 var(--spacing-gutter);
  white-space: nowrap;
}

.brand { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--on-primary);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name { font: var(--font-headline-s); font-weight: var(--font-weight-semibold); color: var(--on-surface); }
.brand-sub { font: var(--font-caption-m); color: var(--on-surface-variant); }

.hdr-sep { width: 1px; height: 1.5rem; background: var(--divider); flex-shrink: 0; }
.hdr-flex { flex: 1 1 0; min-width: 0.5rem; }

/* 机场/运行日切换触发器 */
.ops-trigger {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  height: 2rem;
  padding: 0 0.5rem;
  border: var(--border-width-thin) solid var(--outline);
  border-radius: var(--radius-base);
  background: var(--surface);
  color: var(--on-surface);
  cursor: pointer;
  flex-shrink: 0;
}
.ops-trigger:hover { border-color: var(--primary); color: var(--primary); }
.trigger-main {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  font-variant-numeric: tabular-nums;
}
.trigger-sub { font: var(--font-caption-m); color: var(--on-surface-variant); }

/* 机场下拉项 */
.airport-item { display: inline-flex; align-items: center; gap: 0.5rem; }
.airport-code { font-variant-numeric: tabular-nums; font-weight: var(--font-weight-semibold); }
.airport-tag {
  font: var(--font-caption-s);
  padding: 0 0.25rem;
  border-radius: var(--radius-badge);
  background: var(--primary-container);
  color: var(--on-primary-container);
}

/* 运行时钟 —— 等宽数字 */
.ops-clock { display: flex; flex-direction: column; line-height: 1.25; margin-left: 0.25rem; flex-shrink: 0; }
.clock-main {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  font-variant-numeric: tabular-nums;
  font-family: "Cascadia Mono", Consolas, "HarmonyOS Sans SC", monospace;
  color: var(--on-surface);
}
.clock-sub { font: var(--font-caption-m); color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }

/* 图标按钮(预警/换肤) */
.ops-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border: var(--border-width-thin) solid var(--outline);
  border-radius: var(--radius-base);
  background: var(--surface);
  color: var(--on-surface);
  cursor: pointer;
  flex-shrink: 0;
}
.ops-icon-btn:hover { border-color: var(--primary); color: var(--primary); }

/* 值班签派员头像组 */
.duty-crew { display: flex; align-items: center; gap: 0.375rem; flex-shrink: 0; }
.crew-avatar {
  width: 1.75rem;
  height: 1.75rem;
  border-radius: var(--radius-full);
  border: var(--border-width-thin) solid var(--outline);
  overflow: hidden;
  cursor: pointer;
  display: inline-flex;
}
.crew-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.crew-avatar:hover { border-color: var(--primary); }

/* 下层: 运行摘要条 —— 计数口径与主表联动 */
.oh-summary {
  display: flex;
  align-items: center;
  gap: var(--spacing-gutter);
  height: 2.5rem;
  padding: 0 var(--spacing-gutter);
  border-top: var(--border-width-thin) solid var(--divider);
  white-space: nowrap;
  overflow: hidden;
}
.sum-label { font: var(--font-body-s); font-weight: var(--font-weight-medium); color: var(--on-surface); flex-shrink: 0; }
.sum-chip { font: var(--font-body-s); color: var(--on-surface-variant); flex-shrink: 0; }
.sum-value {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  font-variant-numeric: tabular-nums;
  font-family: "Cascadia Mono", Consolas, "HarmonyOS Sans SC", monospace;
  color: var(--on-surface);
}
.sum-ok { color: var(--success); }
.sum-warn { color: var(--critical); }
.sum-err { color: var(--error); }
.sum-note { margin-left: auto; font: var(--font-caption-m); color: var(--on-surface-variant); flex-shrink: 0; }


/* 区块② 航班动态主表格 —— 运控高密度风格 */
.flight-table {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: var(--spacing-inset);
  min-width: 0;
}

/* 工具条: 页签 + 搜索/刷新 */
.ft-toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--spacing-inline); flex-wrap: wrap; }
.flight-table .ant-tabs-nav { margin-bottom: 0.75rem; }
.ft-toolbar-right { display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.5rem; }
.ft-search { width: 16.5rem; }

.tab-label { display: inline-flex; align-items: baseline; gap: 0.25rem; }
.tab-count {
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  font-variant-numeric: tabular-nums;
  color: var(--on-surface-variant);
}
.tab-count.tab-warn { color: var(--critical); }
.tab-count.tab-err { color: var(--error); }

/* 单元格 —— 等宽数字 */
.cell-mono {
  font-variant-numeric: tabular-nums;
  font-family: "Cascadia Mono", Consolas, "HarmonyOS Sans SC", monospace;
  white-space: nowrap;
}
.cell-dim { color: var(--text-disabled); }
.flight-link { color: var(--interactive-link); cursor: pointer; font-variant-numeric: tabular-nums; }
.flight-link:hover { color: var(--interactive-link-hover); }

.route-cell { color: var(--on-surface); display: inline-flex; align-items: center; gap: 0.125rem; }
.route-cell svg { color: var(--on-surface-variant); }
.time-cell { display: inline-flex; align-items: center; gap: 0.25rem; }
.time-cell sup { font-size: var(--font-caption-s); color: var(--on-surface-variant); }

/* 预计/实际 标记: 实=已发生(绿) / 预=推算(灰) */
.tp-flag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1rem;
  height: 1rem;
  font-size: var(--font-caption-s);
  border-radius: var(--radius-xs);
  border: var(--border-width-thin) solid var(--outline);
  color: var(--on-surface-variant);
  line-height: 1;
}
.tp-flag.tp-act { border-color: var(--success); color: var(--success); }
.tp-time.tp-mid { color: var(--critical); font-weight: var(--font-weight-semibold); }
.tp-time.tp-high { color: var(--error); font-weight: var(--font-weight-semibold); }
.tp-alt { color: var(--critical); font-weight: var(--font-weight-semibold); }

/* 关舱门倒计时: <15 分钟橙色强调 */
.cd {
  font-variant-numeric: tabular-nums;
  font-family: "Cascadia Mono", Consolas, "HarmonyOS Sans SC", monospace;
  white-space: nowrap;
}
.cd-na { color: var(--text-disabled); }
.cd-closed { color: var(--on-surface-variant); }
.cd-soon {
  color: var(--critical);
  font-weight: var(--font-weight-bold);
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}
.cd-soon::before {
  content: "";
  width: 0.375rem;
  height: 0.375rem;
  border-radius: var(--radius-full);
  background: var(--critical);
  animation: cd-blink 1s ease-in-out infinite;
}
@keyframes cd-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

/* 行状态: 选中(波及链联动) / 取消弱化 */
.flight-table .ant-table-tbody > tr.row-selected > td { background: var(--primary-container); }
.flight-table .ant-table-tbody > tr.st-cancelled > td { color: var(--on-surface-variant); }
.flight-table .ant-table-tbody > tr.ant-table-row:hover { cursor: pointer; }
.flight-table .ant-table-tbody > tr.ant-table-row.row-selected:hover > td { background: var(--primary-container); }

/* 波及链节点定位 → 行闪烁高亮 */
@keyframes row-flash-anim {
  0%, 100% { background: transparent; }
  30%, 60% { background: var(--primary-container); }
}
.flight-table .ant-table-tbody > tr.row-flash > td { animation: row-flash-anim 1.1s ease-in-out 2; }

/* 行悬浮简要信息卡 —— 19rem, 延迟弹出, 不遮挡常规浏览 */
.hover-card {
  position: fixed;
  z-index: 60;
  width: 19rem;
  box-sizing: border-box;
  padding: 0.75rem 0.875rem;
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-popover);
  pointer-events: none;
}
.hc-head { display: flex; align-items: center; gap: 0.5rem; }
.hc-no { font: var(--font-headline-s); font-weight: var(--font-weight-semibold); color: var(--on-surface); }
.hc-tail { font: var(--font-caption-m); color: var(--on-surface-variant); margin-right: auto; }
.hc-route {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  margin: 0.375rem 0 0.625rem;
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}
.hc-route svg { color: var(--on-surface-variant); }
.hc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.375rem 0.75rem;
  padding: 0.625rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
}
.hc-item { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
.hc-k { font: var(--font-caption-s); color: var(--on-surface-variant); }
.hc-v { font: var(--font-body-s); color: var(--on-surface); }
.hc-reason {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  margin-top: 0.625rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
}
.hc-reason svg { color: var(--critical); flex-shrink: 0; }


/* 航班状态 Tag —— 等宽数字 + 语义色软底标签 */
.flight-status {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  margin-right: 0;
  margin-inline-end: 0;
  padding: 0 0.4rem;
  line-height: 1.25rem;
  font-size: var(--font-size-md);
  white-space: nowrap;
}

.flight-status-scheduled { background: var(--surface-variant); color: var(--on-surface-variant); }
.flight-status-boarding { background: var(--info-container); color: var(--info); }
.flight-status-departed { background: var(--success-container); color: var(--success); }
.flight-status-arrived { background: var(--success); color: var(--on-success); }
.flight-status-delayed {
  background: var(--warning-container);
  color: var(--on-warning-container);
  border: var(--border-width-thin) solid var(--warning);
}
.flight-status-diverted {
  background: var(--critical-container);
  color: var(--on-critical-container);
  border: var(--border-width-thin) solid var(--critical);
}
.flight-status-cancelled { background: var(--error-container); color: var(--error); }


/* 延误分钟数 —— 等宽数字右对齐, 阈值分级着色 */
.delay-min {
  font-variant-numeric: tabular-nums;
  font-family: "Cascadia Mono", Consolas, "HarmonyOS Sans SC", monospace;
  font-weight: var(--font-weight-semibold);
  white-space: nowrap;
}

.delay-min-zero { color: var(--text-disabled); font-weight: var(--font-weight-normal); }
.delay-min-low { color: var(--on-surface); }
.delay-min-mid { color: var(--critical); }
.delay-min-high { color: var(--error); }


/* 区块③ 延误波及链 —— 同机接力链条侧栏 */
.delay-chain {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  box-sizing: border-box;
  padding: var(--spacing-inset);
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
}

.dc-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.dc-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.dc-head-link {
  font: var(--font-body-s);
  color: var(--interactive-link);
  cursor: pointer;
  white-space: nowrap;
}
.dc-head-link:hover { color: var(--interactive-link-hover); }

.dc-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 12rem;
}

/* 当前延误航班头卡(可点击定位) */
.chain-head-flight {
  padding: 0.75rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
  cursor: pointer;
}
.chain-head-flight:hover { background: var(--primary-container); }
.chf-top { display: flex; align-items: center; gap: 0.5rem; }
.chf-no { font: var(--font-headline-s); font-weight: var(--font-weight-bold); color: var(--on-surface); }
.chf-delay { margin-left: auto; font: var(--font-body-s); color: var(--critical); font-weight: var(--font-weight-semibold); }
.chf-route {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  margin-top: 0.375rem;
  font: var(--font-body-m);
  font-weight: var(--font-weight-medium);
  color: var(--on-surface);
}
.chf-route svg { color: var(--on-surface-variant); }
.chf-meta {
  margin-top: 0.25rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  display: flex;
  align-items: center;
  gap: 0.375rem;
  flex-wrap: wrap;
}
.chf-meta sup { font-size: var(--font-caption-s); }
.chf-reason {
  margin-top: 0.5rem;
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* 接力链条节点(时刻并入节点内容, 不再使用标签列) */
.chain-timeline { margin-top: 0.5rem; }

.chain-dot {
  display: inline-block;
  width: 0.625rem;
  height: 0.625rem;
  border-radius: var(--radius-full);
}
.chain-dot.d-low { background: var(--warning); }
.chain-dot.d-mid { background: var(--critical); }
.chain-dot.d-high { background: var(--error); }
.chain-dot.d-proj { background: transparent; border: 2px solid var(--outline); }

.chain-node {
  padding: 0.5rem 0.625rem;
  border-radius: var(--radius-base);
  cursor: pointer;
  transition: background 0.15s ease;
}
.chain-node:hover { background: var(--primary-container); }
.cn-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.cn-time {
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  font-variant-numeric: tabular-nums;
}
.cn-time sup { font-size: var(--font-caption-s); }
.cn-no { font: var(--font-body-m); font-weight: var(--font-weight-semibold); color: var(--on-surface); }
.cn-route {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.cn-route svg { color: var(--on-surface-variant); }
.cn-projected {
  font: var(--font-caption-s);
  padding: 0 0.375rem;
  line-height: 1.125rem;
  border-radius: var(--radius-xs);
  border: var(--border-width-thin) dashed var(--outline);
  color: var(--on-surface-variant);
  white-space: nowrap;
}
.cn-stats {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  margin-top: 0.375rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  flex-wrap: wrap;
}
.cn-stat b {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.cn-stat b.cn-prop { color: var(--on-surface); }
.cn-stat b.c-low { color: var(--warning); }
.cn-stat b.c-mid { color: var(--critical); }
.cn-stat b.c-high { color: var(--error); }

/* 波及汇总 */
.dc-summary {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.625rem 0.75rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
  font: var(--font-body-s);
  color: var(--on-surface-variant);
  flex-wrap: wrap;
}
.dc-summary b {
  font: var(--font-body-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.dc-summary b.dc-peak { color: var(--error); }

.dc-hint {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}


/* 区块④ 登机口调度网格 —— C01-C08 × 08:00-22:00 时间刻度 */
.gate-grid {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: 0.75rem 1rem;
  min-width: 0;
}

.gg-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
.gg-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
}
.gg-meta { font: var(--font-caption-m); font-weight: var(--font-weight-normal); color: var(--on-surface-variant); }

.gg-legend { display: inline-flex; align-items: center; gap: 0.5rem; font: var(--font-caption-m); color: var(--on-surface-variant); white-space: nowrap; }
.lg { display: inline-flex; align-items: center; gap: 0.25rem; white-space: nowrap; }
.lg::before { content: ""; width: 0.5rem; height: 0.5rem; border-radius: var(--radius-xs); flex-shrink: 0; }
.lg-dep::before { background: var(--primary-container); border: var(--border-width-thin) solid var(--primary); }
.lg-arr::before { background: var(--info-container); border: var(--border-width-thin) solid var(--info); }
.lg-delayed::before { background: var(--warning-container); border: var(--border-width-thin) solid var(--warning); }
.lg-conflict::before { background: var(--error-container); border: var(--border-width-thin) solid var(--error); }

/* 时间刻度行 —— 首尾刻度贴边对齐, 不外溢 */
.gg-gate-slot { width: 2.75rem; flex-shrink: 0; }
.gg-scale { display: flex; align-items: center; margin-bottom: 0.125rem; }
.gg-scale-track { position: relative; flex: 1 1 0; height: 1rem; min-width: 0; }
.gg-tick {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  font: var(--font-caption-s);
  color: var(--on-surface-variant);
  white-space: nowrap;
}
.gg-tick.first { transform: none; }
.gg-tick.last { transform: translateX(-100%); }

/* 口位行 */
.gg-body { display: flex; flex-direction: column; }
.gg-row { display: flex; align-items: stretch; }
.gg-gate {
  width: 2.75rem;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: var(--font-caption-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface-variant);
  border-top: var(--border-width-thin) solid var(--divider);
}
.gg-lane {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  height: 2.75rem;
  border-top: var(--border-width-thin) solid var(--divider);
  background-image: repeating-linear-gradient(
    90deg,
    var(--outline-variant) 0,
    var(--outline-variant) 1px,
    transparent 1px,
    transparent calc(100% / 14)
  );
}

/* 航班占用条块 */
.gg-block {
  position: absolute;
  top: 0.25rem;
  bottom: 0.25rem;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0 0.375rem;
  border-radius: var(--radius-xs);
  overflow: hidden;
  cursor: pointer;
  min-width: 0;
  z-index: 2;
}
.gg-block:hover { filter: brightness(0.96); }
.gg-b-no { font-size: var(--font-size-base); line-height: 1; font-weight: var(--font-weight-semibold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gg-b-route { font-size: var(--font-caption-s); line-height: 1; white-space: nowrap; flex-shrink: 0; }
.gg-b-turn { font-size: var(--font-caption-s); line-height: 1; white-space: nowrap; margin-left: auto; flex-shrink: 0; }
.gg-b-warn { flex-shrink: 0; }

/* 窄条块自适应: 中等宽度隐藏周转时长, 极窄只显示航班号 */
.gg-block.w-md .gg-b-turn { display: none; }
.gg-block.w-md .gg-b-route { display: none; }
.gg-block.w-sm .gg-b-route, .gg-block.w-sm .gg-b-turn { display: none; }

.gg-dep { background: var(--primary-container); color: var(--on-primary-container); border: var(--border-width-thin) solid var(--primary); }
.gg-dep .gg-b-route, .gg-dep .gg-b-turn { color: var(--on-surface-variant); }
.gg-arr { background: var(--info-container); color: var(--info); border: var(--border-width-thin) solid var(--info); }
.gg-arr .gg-b-route, .gg-arr .gg-b-turn { color: var(--on-surface-variant); }
.gg-delayed { background: var(--warning-container); color: var(--on-warning-container); border: var(--border-width-thin) solid var(--warning); }
.gg-delayed .gg-b-route, .gg-delayed .gg-b-turn { color: var(--on-surface-variant); }
.gg-conflict {
  background: var(--error-container);
  color: var(--error);
  border: var(--border-width-thin) solid var(--error);
  font-weight: var(--font-weight-semibold);
}
.gg-conflict .gg-b-route, .gg-conflict .gg-b-turn { color: var(--error); }
.gg-dim {
  background: transparent;
  color: var(--text-disabled);
  border: var(--border-width-thin) dashed var(--outline);
}
.gg-dim .gg-b-no { text-decoration: line-through; }

/* 双轨口位: 时间重叠条块上下分层, 只显示航班号 */
.gg-lane.dual .gg-b-no { font-size: var(--font-caption-s); }
.gg-lane.dual .gg-b-route,
.gg-lane.dual .gg-b-turn,
.gg-lane.dual .gg-b-warn { display: none; }

/* 冲突表达: 相邻对条块整体红框高亮 + 条块内嵌警示图标(不使用悬浮芯片, 避免压字) */

/* 当前时刻线(实时走秒) */
.gg-now {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: -1px;
  background: var(--critical);
  z-index: 1;
}

.gg-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding-top: 0.5rem;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  flex-wrap: wrap;
}
.gg-conflict-count b { font-weight: var(--font-weight-semibold); color: var(--on-surface); }
.gg-conflict-count.bad b { color: var(--error); }

/* 悬浮周转详情 */
.gg-tip { font: var(--font-body-s); max-width: 17.5rem; }
.gt-title { color: var(--on-surface); font-weight: var(--font-weight-semibold); margin-bottom: 0.25rem; }
.gt-line { color: var(--on-surface-variant); line-height: 1.5; }
.gt-dim { color: var(--text-disabled); }
.gt-warn { color: var(--error); margin-top: 0.25rem; font-weight: var(--font-weight-medium); }


/* 区块⑤ 机组执勤面板 */
.crew-panel {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: 0.75rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.cp-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.cp-tail { font: var(--font-caption-m); font-weight: var(--font-weight-normal); color: var(--on-surface-variant); margin-left: auto; }

.cp-empty { display: flex; align-items: center; justify-content: center; min-height: 8rem; }

.cp-flight { display: flex; align-items: center; gap: 0.5rem; font: var(--font-body-s); color: var(--on-surface-variant); }
.cp-f-no { font: var(--font-body-m); font-weight: var(--font-weight-semibold); color: var(--on-surface); }
.cp-f-tag {
  margin-left: auto;
  font-size: var(--font-caption-s);
  padding: 0 0.25rem;
  border-radius: var(--radius-xs);
  background: var(--surface-variant);
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.cp-crew { display: grid; grid-template-columns: 1fr 1fr; gap: 0.375rem; }
.cp-member {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.375rem 0.5rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
  min-width: 0;
}
.cp-role { font: var(--font-caption-s); color: var(--on-surface-variant); flex-shrink: 0; }
.cp-member b { font: var(--font-body-s); font-weight: var(--font-weight-semibold); color: var(--on-surface); }

.cp-legs { display: flex; align-items: center; gap: 0.25rem; flex-wrap: wrap; }
.cp-leg {
  font: var(--font-caption-m);
  padding: 0 0.375rem;
  line-height: 1.375rem;
  border-radius: var(--radius-xs);
  background: var(--primary-container);
  color: var(--on-primary-container);
  font-variant-numeric: tabular-nums;
}
.cp-legs-label { font: var(--font-caption-s); color: var(--on-surface-variant); margin-left: auto; white-space: nowrap; }

/* 执勤进度 —— 14h 上限刻度线 */
.cp-duty { display: flex; flex-direction: column; gap: 0.375rem; }
.cp-duty-head { display: flex; align-items: baseline; justify-content: space-between; font: var(--font-body-s); color: var(--on-surface-variant); }
.cp-duty-value { font: var(--font-headline-m); font-weight: var(--font-weight-bold); font-variant-numeric: tabular-nums; }
.cp-duty-value.v-ok { color: var(--success); }
.cp-duty-value.v-warn { color: var(--critical); }
.cp-duty-value.v-err { color: var(--error); }

.cp-bar { position: relative; }
.cp-limit-mark {
  position: absolute;
  top: -0.1875rem;
  bottom: -0.1875rem;
  width: 2px;
  background: var(--error);
  z-index: 2;
}
.cp-duty-meta { display: flex; gap: 0.75rem; font: var(--font-caption-m); color: var(--on-surface-variant); font-variant-numeric: tabular-nums; flex-wrap: wrap; }

.cp-warning {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.375rem 0.5rem;
  border-radius: var(--radius-base);
  font: var(--font-body-s);
}
.cp-warning.w-warn { background: var(--critical-container); color: var(--on-critical-container); }
.cp-warning.w-err { background: var(--error-container); color: var(--error); }


/* 区块⑥ 气象与流量 */
.weather-flow {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: 0.75rem 1rem;
  flex: 0 0 30rem;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.wf-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.wf-airport { font: var(--font-caption-m); font-weight: var(--font-weight-normal); color: var(--on-surface-variant); margin-left: auto; }

.wf-body { display: flex; flex-direction: column; gap: 0.75rem; }

/* 本场天气 */
.wf-wx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.375rem; }
.wf-item {
  display: flex;
  flex-direction: column;
  gap: 0.125rem;
  padding: 0.4375rem 0.625rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
  min-width: 0;
}
.wf-k { display: inline-flex; align-items: center; gap: 0.25rem; font: var(--font-caption-s); color: var(--on-surface-variant); }
.wf-k svg { flex-shrink: 0; }
.wf-v { font: var(--font-body-m); font-weight: var(--font-weight-semibold); color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-v em { font-style: normal; font-weight: var(--font-weight-normal); font-size: var(--font-caption-s); color: var(--on-surface-variant); margin-left: 0.375rem; }

.wf-alerts-label { font: var(--font-caption-m); color: var(--on-surface-variant); }
.wf-alerts-label b { font-weight: var(--font-weight-semibold); color: var(--on-surface); }
.wf-alerts { display: flex; flex-direction: column; gap: 0.25rem; }
.wf-alert {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.3125rem 0.5rem;
  border-radius: var(--radius-base);
  background: var(--surface-variant);
  min-width: 0;
}
.wf-alert-title { font: var(--font-body-s); font-weight: var(--font-weight-semibold); color: var(--on-surface); white-space: nowrap; flex-shrink: 0; }
.wf-alert-detail { font: var(--font-caption-m); color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 流量控制 */
.wf-flow { display: flex; flex-direction: column; gap: 0.25rem; }
.wf-flow-head {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.wf-flow-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.3125rem 0.5rem;
  border-radius: var(--radius-base);
  background: var(--surface-variant);
  min-width: 0;
}
.wf-flow-content { font: var(--font-body-s); color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf-flow-period { font: var(--font-caption-m); color: var(--on-surface-variant); margin-left: auto; white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums; }


/* 等级 Tag —— 三色(紧急/重要/一般) */
.level-tag {
  display: inline-flex;
  align-items: center;
  padding: 0 0.375rem;
  line-height: 1.125rem;
  font-size: var(--font-size-base);
  border-radius: var(--radius-xs);
  white-space: nowrap;
  flex-shrink: 0;
  font-weight: var(--font-weight-medium);
}

.level-urgent {
  background: var(--error-container);
  color: var(--error);
  border: var(--border-width-thin) solid var(--error);
}
.level-major {
  background: var(--critical-container);
  color: var(--on-critical-container);
  border: var(--border-width-thin) solid var(--critical);
}
.level-minor {
  background: var(--warning-container);
  color: var(--on-warning-container);
  border: var(--border-width-thin) solid var(--warning);
}


/* 区块⑦ 不正常事件列表 */
.event-list {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: 0.75rem 1rem;
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.ev-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.ev-meta { font: var(--font-caption-m); font-weight: var(--font-weight-normal); color: var(--on-surface-variant); margin-left: auto; }
.ev-meta b { font-weight: var(--font-weight-semibold); }
.ev-meta b.v-warn { color: var(--critical); }
.ev-meta b.v-ok { color: var(--success); }

.ev-list { display: flex; flex-direction: column; gap: 0.375rem; }

.ev-item {
  border: var(--border-width-thin) solid var(--outline-variant);
  border-radius: var(--radius-base);
  overflow: hidden;
}
.ev-item.open { border-color: var(--outline); }

.ev-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.375rem 0.5rem;
  cursor: pointer;
  min-width: 0;
}
.ev-head:hover { background: var(--surface-variant); }

.ev-type {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font: var(--font-body-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  white-space: nowrap;
  flex-shrink: 0;
}
.ev-type svg { color: var(--on-surface-variant); }

.ev-flight {
  font-size: var(--font-size-base);
  color: var(--interactive-link);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.ev-flight:hover { color: var(--interactive-link-hover); }

.ev-summary {
  flex: 1 1 0;
  min-width: 0;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ev-time { font: var(--font-caption-m); color: var(--on-surface-variant); flex-shrink: 0; font-variant-numeric: tabular-nums; }

.ev-status {
  font-size: var(--font-caption-s);
  padding: 0 0.375rem;
  line-height: 1.125rem;
  border-radius: var(--radius-xs);
  white-space: nowrap;
  flex-shrink: 0;
}
.ev-status.st-handling { background: var(--info-container); color: var(--info); }
.ev-status.st-closed { background: var(--success-container); color: var(--success); }

/* 展开的处置记录 */
.ev-records {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.5rem 0.75rem 0.625rem;
  background: var(--surface-variant);
}
.ev-records-label { font: var(--font-caption-s); color: var(--on-surface-variant); margin-bottom: 0.125rem; }
.ev-record { display: flex; align-items: baseline; gap: 0.625rem; min-width: 0; }
.ev-rec-time { font: var(--font-caption-m); color: var(--on-surface-variant); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.ev-rec-text { font: var(--font-body-s); color: var(--on-surface); line-height: 1.5; }


/* 区块⑧ 运行质量 —— 两行式指标(数值行 + 昨日对比行), 2×2 网格避免挤压 */
.ops-quality {
  background: var(--surface-container-highest);
  border-radius: var(--radius-container);
  box-shadow: var(--shadow-card);
  padding: 0.75rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.625rem;
}

.oq-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.oq-sub { font: var(--font-caption-m); font-weight: var(--font-weight-normal); color: var(--on-surface-variant); margin-left: auto; }

.oq-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
}

.oq-item {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.5rem 0.625rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
  min-width: 0;
}

.oq-row { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; min-width: 0; }
.oq-label { font: var(--font-body-s); color: var(--on-surface-variant); white-space: nowrap; }
.oq-value {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-bold);
  color: var(--on-surface);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.oq-value em { font-style: normal; font-size: var(--font-caption-s); font-weight: var(--font-weight-normal); color: var(--on-surface-variant); margin-left: 0.125rem; }

.oq-row-delta { justify-content: flex-start; flex-wrap: nowrap; }
.oq-row-delta b { font: var(--font-body-s); font-variant-numeric: tabular-nums; white-space: nowrap; }
.oq-base { font: var(--font-caption-s); color: var(--on-surface-variant); font-weight: var(--font-weight-normal); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto; }
.oq-up-good { color: var(--success); }
.oq-up-good b { color: var(--success); }
.oq-down-bad { color: var(--error); }
.oq-down-bad b { color: var(--error); }
.oq-flat { color: var(--on-surface-variant); }
.oq-flat b { color: var(--on-surface-variant); font-weight: var(--font-weight-normal); }


/* 区块⑨ 底部操作栏 + 延误向导/换机/取消弹窗 */
.action-bar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--spacing-inline);
  height: 3.25rem;
  padding: 0 var(--spacing-gutter);
  background: var(--surface-container-highest);
  box-shadow: var(--shadow-t-sm);
  white-space: nowrap;
  overflow: hidden;
}

.ab-title {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
  margin-right: 0.5rem;
}
.ab-log {
  margin-left: auto;
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
  overflow: hidden;
  text-overflow: ellipsis;
}
.ab-log .mono { font-variant-numeric: tabular-nums; color: var(--on-surface-variant); }

/* —— 延误发布向导 —— */
.wz-step-head {
  display: flex;
  align-items: baseline;
  gap: 0.625rem;
  padding: 0.5rem 0.75rem;
  margin-bottom: 0.75rem;
  border-radius: var(--radius-base);
  background: var(--surface-variant);
}
.wz-step-count {
  font: var(--font-caption-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface-variant);
  font-variant-numeric: tabular-nums;
}
.wz-step-name {
  font: var(--font-headline-s);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.wz-step-hint { margin-left: auto; font: var(--font-caption-m); color: var(--on-surface-variant); }
.wz-step { display: flex; flex-direction: column; gap: 0.5rem; min-height: 15rem; }
.wz-field-label { font: var(--font-body-s); font-weight: var(--font-weight-semibold); color: var(--on-surface); margin-top: 0.25rem; }

.wz-reasons { display: flex; flex-direction: column; gap: 0.375rem; }
.wz-reason { margin-inline-start: 0; }

.wz-minutes { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.wz-unit { font: var(--font-body-s); color: var(--on-surface-variant); }
.wz-quick { display: inline-flex; gap: 0.375rem; align-items: center; margin-left: 0.5rem; }
.wz-quick-item {
  font-size: var(--font-size-base);
  padding: 0 0.4375rem;
  line-height: 1.375rem;
  border-radius: var(--radius-base);
  border: var(--border-width-thin) solid var(--outline);
  color: var(--on-surface-variant);
  cursor: pointer;
}
.wz-quick-item:hover { border-color: var(--primary); color: var(--primary); }
.wz-quick-item.on { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); font-weight: var(--font-weight-semibold); }

.wz-flights {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  max-height: 15rem;
  overflow-y: auto;
  padding: 0.375rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
}
.wz-flight {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.25rem 0.5rem;
  border-radius: var(--radius-xs);
  cursor: pointer;
  min-width: 0;
}
.wz-flight:hover { background: var(--surface-container-highest); }
.wz-f-no { font: var(--font-body-m); font-weight: var(--font-weight-semibold); color: var(--on-surface); }
.wz-f-route { font: var(--font-caption-m); color: var(--on-surface-variant); }
.wz-f-time { font: var(--font-caption-m); color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
.wz-f-pax { font: var(--font-caption-m); color: var(--on-surface-variant); margin-left: auto; font-variant-numeric: tabular-nums; }

.wz-select-all { display: flex; align-items: center; gap: 0.875rem; font: var(--font-caption-m); color: var(--on-surface-variant); }
.wz-select-all a { color: var(--interactive-link); cursor: pointer; }
.wz-select-all a:hover { color: var(--interactive-link-hover); }

.wz-preview {
  margin-top: 0.25rem;
  border: var(--border-width-thin) solid var(--outline-variant);
  border-radius: var(--radius-base);
  overflow: hidden;
}
.wz-preview-head {
  padding: 0.375rem 0.75rem;
  background: var(--surface-variant);
  font: var(--font-caption-m);
  color: var(--on-surface-variant);
}
.wz-preview-body {
  padding: 0.75rem;
  font: var(--font-body-s);
  color: var(--on-surface);
  line-height: 1.75;
  background: var(--surface-container-highest);
}

.wz-confirm { display: flex; flex-direction: column; gap: 0.375rem; }
.wz-c-row {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.4375rem 0.625rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
}
.wz-c-row span { font: var(--font-body-s); color: var(--on-surface-variant); flex-shrink: 0; }
.wz-c-row b { font: var(--font-body-s); font-weight: var(--font-weight-semibold); color: var(--on-surface); word-break: break-all; }
.wz-c-warn {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  margin-top: 0.5rem;
  padding: 0.4375rem 0.625rem;
  border-radius: var(--radius-base);
  background: var(--info-container);
  color: var(--info);
  font: var(--font-body-s);
}

/* —— 更换飞机 —— */
.sw-flight {
  font: var(--font-body-s);
  color: var(--on-surface);
  padding: 0.5rem 0.625rem;
  background: var(--surface-variant);
  border-radius: var(--radius-base);
  margin-bottom: 0.625rem;
}
.sw-list { display: flex; flex-direction: column; gap: 0.25rem; }
.sw-item {
  display: flex;
  align-items: center;

// 组装某一机场 × 运行日的完整数据集
// overrides: 运行处置覆盖(⑨ 操作栏发布) —— 按航班 id 覆盖 status/delayMinutes/tailNo/delayReason
function buildDataset(airportCode, dayKey, overrides) {
  const schedule = SCHEDULES[airportCode];
  const variant = VARIANTS[airportCode][dayKey];
  const finished = dayKey === "yesterday";
  const rows = schedule.map((s) => {
    const status = (variant.status && variant.status[s.id]) || (finished ? "arrived" : "scheduled");
    const delay = (variant.delay && variant.delay[s.id]) || 0;
    const projected = (variant.projected && variant.projected[s.id]) || 0;
    const divert = variant.divert && variant.divert[s.id];
    const row = {
      ...s,
      status,
      delayMinutes: status === "delayed" ? delay : 0,
      projectedDelay: projected,
      divertTo: divert ? divert.to : null,
      divertAt: divert ? divert.at : null,
      delayReason: (variant.reasons && variant.reasons[s.id]) || "",
      finished,
    };
    const ov = overrides && overrides[s.id];
    if (ov) {
      if (ov.status) row.status = ov.status;
      if (typeof ov.delayMinutes === "number") row.delayMinutes = row.status === "delayed" ? ov.delayMinutes : 0;
      if (ov.tailNo) row.tailNo = ov.tailNo;
      if (ov.delayReason) row.delayReason = ov.delayReason;
    }
    return row;
  });

}

// 预计/实际起降时间对 —— dep/arr: { t 分钟, act 是否实际值, late 延误分钟, alt 备降机场 }
function getTimePair(row) {
  switch (row.status) {
    case "cancelled":
      return null;
    case "diverted":
      return { dep: { t: row.schedDep, act: true }, arr: { t: row.divertAt, act: true, alt: row.divertTo } };
    case "arrived":
      return { dep: { t: row.schedDep, act: true }, arr: { t: row.schedArr, act: true } };
    case "departed":
      return { dep: { t: row.schedDep, act: true }, arr: { t: row.schedArr, act: false } };
    case "delayed": {
      const d = row.delayMinutes;
      return { dep: { t: row.schedDep + d, act: row.finished, late: d }, arr: { t: row.schedArr + d, act: row.finished, late: d } };
    }
    default:
      return { dep: { t: row.schedDep, act: false }, arr: { t: row.schedArr, act: false } };
  }
}

// 延误波及链 —— 同注册号、当日后续(最多 3 段)接力航班
// node: { leg 航班, cumulative 累计延误, propagated 本段传导, projected 是否为预计推算 }
function buildChain(dataset, flightId) {
  const head = dataset.find((r) => r.id === flightId);
  if (!head) return null;
  const legs = dataset
    .filter((r) => r.tailNo === head.tailNo && r.schedDep > head.schedDep)
    .sort((a, b) => a.schedDep - b.schedDep)
    .slice(0, 3);
  let prev = head.delayMinutes || 0;
  const nodes = legs.map((leg) => {
    const cumulative = leg.status === "delayed" ? leg.delayMinutes : leg.projectedDelay || 0;
    const node = {
      leg,
      cumulative,
      propagated: Math.max(cumulative - prev, 0),
      projected: leg.status !== "delayed" && !!leg.projectedDelay,
    };
    prev = cumulative;
    return node;
  });
  return { head, nodes };
}

// 动态获取当前 rem 基准 px（html font-size 随视口媒体查询变化：12/14/16/20px）

// #RGB / #RRGGBB -> [r,g,b]；非法输入返回 null

  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");

    let best = null;

    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))

    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||

(function () {

// 区块① 顶部运行栏 —— 双层结构:

  { name: "王志远", role: "A 席签派员", avatar: "./assets/uploads/avatar-wang.jpg" },
  { name: "莫琳", role: "B 席签派员", avatar: "./assets/uploads/avatar-momo.jpg" },
  { name: "维琪", role: "值班经理", avatar: "./assets/uploads/avatar-vicky.jpg" },
];

function OpsHeader() {
  const { isDark, toggleDark, airport, setAirport, opDay, setOpDay, dayKey, dataset } = useApp();
  const now = useOpsNow();
  // 气象预警条数与⑥气象流量区内容联动
  const weather = WEATHER[airport];
  const airportMeta = AIRPORTS.find((a) => a.code === airport);
  const dayLabel = dayKey === "yesterday" ? "昨日" : dayKey === "tomorrow" ? "明日" : "今日";

  // 机场/运行日切换联动主表数据集(经由 context 重算), 摘要计数与主表统计口径一致
  const summary = {
    total: dataset.length,
    executed: dataset.filter((r) => ["arrived", "departed", "diverted"].includes(r.status) || (dayKey === "yesterday" && r.status === "delayed")).length,
    delayed: dataset.filter((r) => r.status === "delayed").length,
    cancelled: dataset.filter((r) => r.status === "cancelled").length,
  };

  const airportItems = {
    items: AIRPORTS.map((a) => ({
      key: a.code,
      label: (
        <span className="airport-item">

    selectedKeys: [airport],
    onClick: ({ key }) => setAirport(key),
  };

  const dayItems = {
    items: [
      { key: "yesterday", label: `昨日 · ${dayjs().add(-1, "day").format("MM-DD")}` },

      { key: "tomorrow", label: `明日 · ${dayjs().add(1, "day").format("MM-DD")}` },
    ],
    selectedKeys: [dayKey],
    onClick: ({ key }) => setOpDay(dayjs().add(key === "yesterday" ? -1 : key === "tomorrow" ? 1 : 0, "day")),
  };

  const disableDate = (current) => {
    const diff = current.startOf("day").diff(dayjs().startOf("day"), "day");
    return diff < -1 || diff > 1;
  };

  return (
    <header className="ops-header">
      <div className="oh-main">
        <div className="brand">
          <span className="brand-mark">
            <Icon name="plane-takeoff" size="1.25rem" />

            <span className="brand-sub">运行控制中心</span>
          </span>
        </div>

        <span className="hdr-sep" />

          <button type="button" className="ops-trigger">
            <Icon name="map-pin" size="0.875rem" />
            <span className="trigger-main">{airport}</span>
            <span className="trigger-sub">{airportMeta.fullName}</span>
            <Icon name="chevron-down" size="0.75rem" />
          </button>
        </Dropdown>

        <Dropdown menu={dayItems} trigger={["click"]}>
          <button type="button" className="ops-trigger">
            <Icon name="calendar-days" size="0.875rem" />
            <span className="trigger-main">{dayLabel}</span>
            <span className="trigger-sub">{opDay.format("MM-DD")}</span>
            <Icon name="chevron-down" size="0.75rem" />
          </button>
        </Dropdown>

        <DatePicker
          value={opDay}
          onChange={(d) => d && setOpDay(d)}
          disabledDate={disableDate}
          allowClear={false}
        />

        <span className="hdr-sep" />

        <div className="ops-clock">
          <span className="clock-main">{now.format("HH:mm:ss")}</span>
          <span className="clock-sub">
            {now.format("YYYY-MM-DD dddd")} · UTC {now.subtract(8, "hour").format("HH:mm:ss")}Z
          </span>
        </div>

        <div className="hdr-flex" />

        <Tooltip
          title={
            `${weather.alerts.length} 条气象预警生效：${weather.alerts.map((a) => a.title).join(" / ")} —— ` +
            `详情见「气象与流量」区`
          }
        >
          <Badge count={weather.alerts.length} size="small" offset={[-2, 4]}>
            <button type="button" className="ops-icon-btn" title="气象预警">
              <Icon name="cloud-lightning" size="1rem" />
            </button>
          </Badge>
        </Tooltip>

        <span className="hdr-sep" />

        <div className="duty-crew">
          {DUTY_CREW.map((c) => (
            <Tooltip key={c.name} title={`${c.name} · ${c.role}`}>
              <span className="crew-avatar">
                <img src={c.avatar} alt={c.name} />

            </Tooltip>

        </div>

        <button type="button" className="ops-icon-btn" onClick={toggleDark} title="切换深浅模式">
          <Icon name={isDark ? "sun" : "moon"} size="1rem" />

      </div>

      <div className="oh-summary">
        <span className="sum-label">
          {airportMeta.fullName} · {dayLabel}运行摘要

        <span className="sum-chip">计划 <b className="sum-value">{summary.total}</b> 班</span>

        <span className="sum-note">计数口径与航班动态主表一致</span>
      </div>
    </header>
  );
}
  Object.assign(__export, { OpsHeader });

const estArrivalOf = (leg) => {
  const pair = getTimePair(leg);
  if (pair && pair.arr) return pair.arr.t;
  return leg.schedArr;
};

// 机组执勤面板数据 —— 随主表选中航班联动
// 返回: 机组信息 + 执勤段航班 + 计划/预计执勤分钟 + 与上限的余量
function buildCrewPanel(dataset, flightId) {
  const flight = dataset.find((r) => r.id === flightId);
  if (!flight) return null;

  const pairing = PAIRINGS.find((p) => p.legIds.includes(flightId));
  if (pairing) {
    const legs = dataset.filter((r) => pairing.legIds.includes(r.id)).sort((a, b) => a.schedDep - b.schedDep);
    const estRelease = Math.max(...legs.map(estArrivalOf)) + 30;
    return {
      flight,
      captain: pairing.captain,
      firstOfficer: pairing.firstOfficer,
      purser: pairing.purser,
      cabinCount: pairing.cabinCount,
      legs,
      report: pairing.report,
      planMin: pairing.release - pairing.report,
      estMin: Math.max(estRelease - pairing.report, 0),
      pairing: true,
    };
  }

  // 单段航班 —— 按航段自动配组(报到提前 60 分, 解除延后 30 分)
  const seed = hashCode(flight.flightNo + flight.tailNo);
  const report = flight.schedDep - 60;
  const estMin = estArrivalOf(flight) + 30 - report;
  return {
    flight,
    captain: CAPTAINS[seed % CAPTAINS.length],
    firstOfficer: FIRST_OFFICERS[seed % FIRST_OFFICERS.length],
    purser: PURSERS[seed % PURSERS.length],
    cabinCount: CABIN_BY_TYPE[flight.acType] || 5,
    legs: [flight],
    report,
    planMin: estMin,
    estMin,
    pairing: false,
  };
}

// 关舱门倒计时 —— 出港未起飞航班显示距关舱门的剩余时间, <15 分钟橙色强调
function DoorCountdown({ record, tick }) {
  if (record.dir !== "dep" || record.status === "cancelled" || record.status === "delayed") {
    return <span className="cd cd-na">—</span>;
  }
  const doorClose = record.schedDep - 15; // 关舱门 = 计划起飞前 15 分钟
  const awayMin = doorClose - OPS_MOMENT_MIN;
  if (awayMin > 60) return <span className="cd cd-na">—</span>;
  const secondsLeft = awayMin * 60 - tick;
  if (secondsLeft <= 0) return <span className="cd cd-closed">已关闭</span>;
  const mm = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
  const ss = String(secondsLeft % 60).padStart(2, "0");
  return <span className={`cd${secondsLeft < 900 ? " cd-soon" : ""}`}>{mm}:{ss}</span>;
}

            hoverTimer.current = setTimeout(() => setHover({ flight: record, x, y }), 220);
          },
          onMouseLeave: () => {
            clearTimeout(hoverTimer.current);
            setHover(null);
          },
        })}
        sortDirections={["ascend", "descend", "ascend"]}
        showSorterTooltip={false}
        scroll={{ x: 1168, y: "31rem" }}
        pagination={{
          current: page,
          pageSize,
          total: rows.length,
          showSizeChanger: true,
          showQuickJumper: { goButton: "跳转" },
          showTotal: (total, range) => `总记录数：${total}`,
          onChange: (p, ps) => { setPage(p); setPageSize(ps); },
        }}
      />

      {hover ? <HoverCard flight={hover.flight} x={hover.x} y={hover.y} /> : null}
    </section>
  );
}
  Object.assign(__export, { FlightTable });
})();

/* ===== src/views/gate-grid/index.jsx ===== */
(function () {
  const { useMemo } = React;
  const { Tooltip } = antd;
  const { Icon, GATE_LIST, fmt, getTimePair, OPS_MOMENT_MIN, useApp, useOpsTick } = __export;
// 时间刻度: 08:00 – 22:00(分)
const DAY_START = 480;
const DAY_END = 1320;
const SPAN = DAY_END - DAY_START;
const MIN_TURNAROUND = 45; // 最低安全周转(分) —— 相邻航班对低于此值判定冲突
const DEP_WINDOW = 60;     // 出港航班登机占用窗口(分)
const ARR_WINDOW = 45;     // 进港航班到站下客占用窗口(分)

const pct = (min) => ((min - DAY_START) / SPAN) * 100;
const HOURS = [480, 600, 720, 840, 960, 1080, 1200, 1320];

// 由主表数据推导登机口占用条块 —— 登机口字段与主表严格一致
// 延误航班条块随预计时刻右移; 取消/备降航班按计划时刻渲染弱化占位(机位已释放)
// 同一口位时间重叠的条块分配到上下两条子轨道(track), 避免视觉叠压
function buildGateBlocks(dataset) {
  const raw = [];
  dataset.forEach((r) => {
    if (r.status === "cancelled" || r.status === "diverted") {
      const start = r.dir === "dep" ? r.schedDep - DEP_WINDOW : r.schedArr;
      raw.push({ flight: r, start, end: start + (r.dir === "dep" ? DEP_WINDOW : ARR_WINDOW), dim: true });
      return;
    }
    const pair = getTimePair(r);
    if (r.dir === "dep") {
      raw.push({ flight: r, start: pair.dep.t - DEP_WINDOW, end: pair.dep.t, dim: false });
    } else {
      raw.push({ flight: r, start: pair.arr.t, end: pair.arr.t + ARR_WINDOW, dim: false });
    }
  });
  const blocks = raw.filter((b) => b.end > DAY_START + 15 && b.start < DAY_END);

  const byGate = {};
  const trackCounts = {};
  GATE_LIST.forEach((g) => { byGate[g] = []; });
  blocks.forEach((b) => { if (byGate[b.flight.gate]) byGate[b.flight.gate].push(b); });

  const conflicts = [];
  GATE_LIST.forEach((g) => {
    const list = byGate[g].sort((a, b) => a.start - b.start);

    // 轨道分配: 与本轨道已有条块时间重叠的, 顺延到下一条子轨道
    const trackEnds = [];
    list.forEach((b) => {
      let ti = trackEnds.findIndex((end) => end <= b.start);
      if (ti === -1) { trackEnds.push(b.end); ti = trackEnds.length - 1; }
      else trackEnds[ti] = b.end;
      b.track = ti;
    });
    trackCounts[g] = Math.max(1, trackEnds.length);

    // 相邻航班对周转 < 45 分 → 冲突高亮(仅统计有效占用, 弱化占位不计)
    const active = list.filter((b) => !b.dim);
    for (let i = 1; i < active.length; i++) {
      const gap = active[i].start - active[i - 1].end;
      if (gap < MIN_TURNAROUND) {
        active[i].conflict = true;
        active[i - 1].conflict = true;
        active[i].prevGap = gap;
        active[i - 1].nextGap = gap;
        conflicts.push({ gate: g, gap, prev: active[i - 1], next: active[i] });
      }
    }
    // 非冲突的相邻周转间隔(悬浮详情)
    for (let i = 1; i < active.length; i++) {
      if (active[i].prevGap === undefined) active[i].prevGap = active[i].start - active[i - 1].end;
      if (active[i - 1].nextGap === undefined) active[i - 1].nextGap = active[i].start - active[i - 1].end;
    }
  });
  return { byGate, trackCounts, conflicts };
}

function blockClass(b, widthPct) {
  const narrow = widthPct < 4.5 ? " w-sm" : widthPct < 7 ? " w-md" : " w-lg";
  if (b.conflict) return `gg-block gg-conflict${narrow}`;
  if (b.dim) return `gg-block gg-dim${narrow}`;
  if (b.flight.status === "delayed") return `gg-block gg-delayed${narrow}`;
  return b.flight.dir === "dep" ? `gg-block gg-dep${narrow}` : `gg-block gg-arr${narrow}`;
}

const gapText = (gap) => (gap >= 0 ? `${gap} 分` : `重叠 ${-gap} 分`);

// 区块④ 登机口调度网格 —— C01-C08 × 08:00-22:00
function GateGrid() {
  const { dataset, setSelectedFlightId, requestLocate } = useApp();
  const tick = useOpsTick();
  const { byGate, trackCounts, conflicts } = useMemo(() => buildGateBlocks(dataset), [dataset]);

  const nowMin = OPS_MOMENT_MIN + tick / 60;
  const nowPct = nowMin <= DAY_END ? pct(nowMin) : null;
  const minGap = conflicts.length ? Math.min(...conflicts.map((c) => c.gap)) : null;
  const blockCount = GATE_LIST.reduce((s, g) => s + byGate[g].length, 0);

  const tooltipFor = (b) => {
    const f = b.flight;
    return (
      <div className="gg-tip">
        <div className="gt-title">
          <b className="mono">{f.flightNo}</b> {f.from} → {f.to} · {f.acType} · 登机口 {f.gate}
        </div>
        <div className="gt-line">机位占用：{fmt(b.start)} – {fmt(b.end)}（{b.end - b.start} 分）</div>
        <div className="gt-line">{f.dir === "dep" ? "出港登机窗口" : "进港下客窗口"} · {f.status === "delayed" ? `预计${f.dir === "dep" ? "起飞" : "到达"}已顺延` : "计划时刻"}</div>
        {!b.dim && b.prevGap !== undefined ? <div className="gt-line">与前段周转：{gapText(b.prevGap)}</div> : null}
        {!b.dim && b.nextGap !== undefined ? <div className="gt-line">与后段周转：{gapText(b.nextGap)}</div> : null}
        {b.conflict ? <div className="gt-warn">周转不足 45 分最低标准，已冲突高亮</div> : null}
        {b.dim ? (
          <div className="gt-line gt-dim">
            {f.status === "cancelled" ? "航班已取消 · 计划机位已释放" : `已备降 ${f.divertTo} · 计划机位已释放`}
          </div>
        ) : null}
        {f.delayReason ? <div className="gt-line">处置：{f.delayReason}</div> : null}
      </div>
    );
  };

  const renderBlock = (b, gate) => {
    const f = b.flight;
    const left = Math.max(pct(b.start), 0);
    const right = Math.min(pct(b.end), 100);
    const widthPct = right - left;
    const dur = b.end - b.start;
    // 双轨口位: 重叠条块上下分层渲染, 避免叠压
    const dual = trackCounts[gate] > 1;
    const posStyle = dual
      ? b.track === 0
        ? { top: "0.125rem", height: "calc(50% - 0.1875rem)", bottom: "auto" }
        : { top: "50%", height: "calc(50% - 0.1875rem)", bottom: "auto" }
      : {};
    return (
      <Tooltip key={f.id} title={tooltipFor(b)} mouseEnterDelay={0.12}>
        <div
          className={blockClass(b, widthPct)}
          style={{ left: `${left}%`, width: `${widthPct}%`, ...posStyle }}
          onClick={(e) => { e.stopPropagation(); setSelectedFlightId(f.id); requestLocate(f.id); }}
          title="点击定位主表航班行"
        >
          <span className="gg-b-no mono">{f.flightNo}</span>
          <span className="gg-b-route mono">{f.from}→{f.to}</span>
          <span className="gg-b-turn mono">{b.dim ? "已释放" : `${dur} 分`}</span>
          {b.conflict ? <Icon name="triangle-alert" size="0.75rem" className="gg-b-warn" /> : null}
        </div>
      </Tooltip>
    );
  };

  return (
    <section className="gate-grid">
      <div className="gg-header">
        <span className="gg-title">
          <Icon name="door-open" size="1rem" />
          登机口调度网格
          <span className="gg-meta mono">C01–C08 · 08:00 – 22:00 · {blockCount} 班占用</span>
        </span>
        <span className="gg-legend">
          <span className="lg lg-dep">出港</span>
          <span className="lg lg-arr">进港</span>
          <span className="lg lg-delayed">延误</span>
          <span className="lg lg-conflict">冲突</span>
        </span>
      </div>

      <div className="gg-scale">
        <span className="gg-gate-slot" />
        <div className="gg-scale-track">
          {HOURS.map((h) => (
            <span
              key={h}
              className={`gg-tick mono ${h === DAY_START ? "first" : h === DAY_END ? "last" : ""}`}
              style={{ left: `${pct(h)}%` }}
            >
              {fmt(h)}
            </span>
          ))}
        </div>
      </div>

      <div className="gg-body">
        {GATE_LIST.map((gate) => (
          <div className="gg-row" key={gate}>
            <span className="gg-gate mono">{gate}</span>
            <div className={`gg-lane${trackCounts[gate] > 1 ? " dual" : ""}`}>
              {byGate[gate].map((b) => renderBlock(b, gate))}
              {nowPct !== null ? <span className="gg-now" style={{ left: `${nowPct}%` }} title="当前时刻" /> : null}
            </div>
          </div>
        ))}
      </div>

      <div className="gg-footer">
        <span className={`gg-conflict-count ${conflicts.length ? "bad" : ""}`}>
          冲突对 <b className="mono">{conflicts.length}</b> 组{minGap !== null ? ` · 最低周转 ${gapText(minGap)}` : ""}
        </span>
        <span className="gg-hint">悬浮查看周转详情 · 点击条块定位主表航班</span>
      </div>
    </section>
  );
}
  Object.assign(__export, { GateGrid });
})();

(function () {
  const { useMemo } = React;
  const { Empty, Progress } = antd;

// 进度条满刻度 16h —— 14h 上限刻度线位于 87.5%
const DUTY_SCALE_MIN = 960;
const NEAR_LIMIT_MIN = 720; // 12h 起进入预警色

// 区块⑤ 机组执勤面板 —— 随主表选中航班联动刷新
function CrewPanel() {
  const { dataset, selectedFlightId } = useApp();
  const tick = useOpsTick();

  if (!panel) {
    return (
      <section className="crew-panel">
        <div className="cp-title">
          <Icon name="users" size="1rem" />

        </div>

        </div>
      </section>
    );
  }

  const nowMin = OPS_MOMENT_MIN + tick / 60;
  const elapsed = Math.max(0, Math.min(nowMin - panel.report, panel.estMin));
  const percent = Math.min((panel.estMin / DUTY_SCALE_MIN) * 100, 100);
  const limitPos = (DUTY_LIMIT_MIN / DUTY_SCALE_MIN) * 100;
  const overLimit = panel.estMin > DUTY_LIMIT_MIN;
  const nearLimit = !overLimit && panel.estMin >= NEAR_LIMIT_MIN;

  return (

        <span className="mono">{f.from}→{f.to}</span>
        <span className="cp-f-tag">{panel.pairing ? "接力配组" : "单段配组"}</span>
      </div>

      <div className="cp-crew">
        <span className="cp-member"><span className="cp-role">机长</span><b>{panel.captain}</b></span>
        <span className="cp-member"><span className="cp-role">副驾驶</span><b>{panel.firstOfficer}</b></span>
        <span className="cp-member"><span className="cp-role">乘务长</span><b>{panel.purser}</b></span>

      </div>

      <div className="cp-legs">
        {panel.legs.map((l) => (
          <span key={l.id} className="cp-leg mono" title={`${l.from}→${l.to} ${fmt(l.schedDep)}`}>{l.flightNo}</span>
        ))}
        <span className="cp-legs-label">当日执飞航段</span>
      </div>

      <div className="cp-duty">
        <div className="cp-duty-head">
          <span>当日执勤时长（上限 14h）</span>
          <span className={`cp-duty-value mono ${overLimit ? "v-err" : nearLimit ? "v-warn" : "v-ok"}`}>
            {(panel.estMin / 60).toFixed(1)}h
          </span>
        </div>
        <div className="cp-bar">
          <Progress percent={percent} showInfo={false} strokeColor={strokeColor} trailColor="var(--surface-variant)" size={["100%", "0.5rem"]} />
          <span className="cp-limit-mark" style={{ left: `${limitPos}%` }} title="14 小时执勤上限" />
        </div>
        <div className="cp-duty-meta mono">
          <span>已执勤 {(elapsed / 60).toFixed(1)}h</span>
          <span>计划 {(panel.planMin / 60).toFixed(1)}h</span>
          <span>报到 {fmt(panel.report)}</span>
        </div>
      </div>

      {overLimit || nearLimit ? (
        <div className={`cp-warning ${overLimit ? "w-err" : "w-warn"}`}>
          <Icon name="triangle-alert" size="0.75rem" />
          {overLimit
            ? `预计执勤超上限 ${((panel.estMin - DUTY_LIMIT_MIN) / 60).toFixed(1)}h，延误已传导至机组，需启动机组替换`
            : "接近执勤上限，关注后续延误传导风险"}
        </div>
      ) : null}
    </section>
  );
}
  Object.assign(__export, { CrewPanel });
})();

(function () {
  const { useMemo } = React;
  const { Icon, buildDataset, useApp } = __export;
// 运行质量口径 —— 与主表延误/取消统计完全一致
// 放行正常率 = 出港非延误非取消 / 出港总数
// 起飞正常率 = 已执行出港中准点(延误=0)占比
// 平均延误 = 延误航班的延误分钟均值; 旅客不满意度 = (延误旅客 + 取消旅客×1.2) / 总旅客
function qualityMetrics(ds) {
  const dep = ds.filter((r) => r.dir === "dep");
  const depDelayed = dep.filter((r) => r.status === "delayed").length;
  const depCancelled = dep.filter((r) => r.status === "cancelled").length;
  const releaseRate = dep.length ? Math.round(((dep.length - depDelayed - depCancelled) / dep.length) * 100) : 100;

  const executedDep = dep.filter(
    (r) => ["departed", "arrived"].includes(r.status) || (r.finished && r.status === "delayed")
  );
  const onTimeDep = executedDep.filter((r) => r.delayMinutes === 0);
  const departureRate = executedDep.length ? Math.round((onTimeDep.length / executedDep.length) * 100) : 100;

  const delayedRows = ds.filter((r) => r.delayMinutes > 0);
  const avgDelay = delayedRows.length
    ? Math.round(delayedRows.reduce((s, r) => s + r.delayMinutes, 0) / delayedRows.length)
    : 0;

  const totalPax = ds.reduce((s, r) => s + r.paxCount, 0);
  const affectedPax =
    delayedRows.reduce((s, r) => s + r.paxCount, 0) +
    ds.filter((r) => r.status === "cancelled").reduce((s, r) => s + r.paxCount, 0) * 1.2;
  const dissatisfaction = totalPax ? Math.round((affectedPax / totalPax) * 100) : 0;

  return { releaseRate, departureRate, avgDelay, dissatisfaction };
}

// 区块⑧ 运行质量 —— 4 项指标(两行式: 数值行 + 对比行), 环比昨日箭头分色
function OpsQuality() {
  const { airport, dataset } = useApp();
  const current = useMemo(() => qualityMetrics(dataset), [dataset]);
  // 环比基准: 昨日数据(不受今日运行处置覆盖影响)
  const baseline = useMemo(() => qualityMetrics(buildDataset(airport, "yesterday", {})), [airport]);

  const items = [
    { key: "release", label: "放行正常率", value: current.releaseRate, base: baseline.releaseRate, unit: "%", goodUp: true },
    { key: "departure", label: "起飞正常率", value: current.departureRate, base: baseline.departureRate, unit: "%", goodUp: true },
    { key: "avgDelay", label: "平均延误分钟", value: current.avgDelay, base: baseline.avgDelay, unit: " 分", goodUp: false },
    { key: "dissatisfaction", label: "旅客不满意度", value: current.dissatisfaction, base: baseline.dissatisfaction, unit: "%", goodUp: false },
  ];

  return (
    <section className="ops-quality">
      <div className="oq-title">
        <Icon name="gauge" size="1rem" />
        运行质量
        <span className="oq-sub">环比昨日</span>
      </div>
      <div className="oq-grid">
        {items.map((it) => {
          const delta = it.value - it.base;
          const flat = delta === 0;
          const good = it.goodUp ? delta > 0 : delta < 0;
          const cls = flat ? "oq-flat" : good ? "oq-up-good" : "oq-down-bad";
          return (
            <div className="oq-item" key={it.key}>
              <div className="oq-row oq-row-value">
                <span className="oq-label">{it.label}</span>
                <span className="oq-value mono">{it.value}<em>{it.unit}</em></span>
              </div>
              <div className={`oq-row oq-row-delta ${cls}`}>
                <Icon name={flat ? "minus" : delta > 0 ? "trending-up" : "trending-down"} size="0.875rem" />
                <b className="mono">{flat ? "持平" : `${delta > 0 ? "+" : ""}${delta}${it.unit}`}</b>
                <span className="oq-base mono">昨日 {it.base}{it.unit}</span>
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}
  Object.assign(__export, { OpsQuality });
})();

(function () {
  const { useEffect, useMemo, useState } = React;
  const { Button, Checkbox, Empty, InputNumber, Modal, Radio, Select, message } = antd;
  const { Icon, fmt, useApp } = __export;

// 发布延误 · 四步向导: 原因分类 → 影响航班多选 → 通知模板预览 → 确认发布
// 发布后主表对应行状态与延误分钟同步更新(经 context overrides)
const REASONS = [

  { value: "flow", label: "流量控制（空域 / 机场容量）", text: "受航路流量控制影响" },

const TEMPLATES = [
  { value: "sms", label: "旅客短信通知" },
  { value: "counter", label: "值机柜台广播" },
  { value: "agent", label: "地服代理通知" },
];

const QUICK_MINUTES = [30, 45, 60, 90, 120];

function DelayWizard({ open, onClose, onLog }) {
  const { dataset, selectedFlightId, applyOverride } = useApp();
  const [step, setStep] = useState(0);
  const [reason, setReason] = useState("weather");
  const [delayMin, setDelayMin] = useState(45);
  const [affected, setAffected] = useState([]);
  const [template, setTemplate] = useState("sms");

  // 可发布航班: 出港且尚未执行(计划/登机中/已延误)
  const candidates = useMemo(
    () =>
      dataset
        .filter((r) => r.dir === "dep" && ["scheduled", "boarding", "delayed"].includes(r.status))
        .sort((a, b) => a.schedDep - b.schedDep),
    [dataset]
  );

  useEffect(() => {
    if (open) {
      setStep(0);
      setAffected(
        selectedFlightId && candidates.some((c) => c.id === selectedFlightId) ? [selectedFlightId] : []
      );
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open]);

  const reasonMeta = REASONS.find((r) => r.value === reason) || REASONS[0];
  const templateMeta = TEMPLATES.find((t) => t.value === template) || TEMPLATES[0];
  const affectedFlights = dataset.filter((r) => affected.includes(r.id));
  const firstFlight = affectedFlights[0];

  const toggleAffected = (id, checked) => {
    setAffected((prev) => (checked ? [...prev, id] : prev.filter((x) => x !== id)));
  };

  const canNext =
    step === 0 ? delayMin >= 5 && delayMin <= 240 : step === 1 ? affected.length > 0 : step === 2 ? !!template : true;

  const estDep = firstFlight ? fmt(firstFlight.schedDep + delayMin) : "--:--";

  const previewText = () => {
    const f = firstFlight;
    if (!f) return "请先在第二步选择影响航班";
