      return `尊敬的旅客：您乘坐的 ${f.flightNo} 航班（${f.from}—${f.to}）${reasonMeta.text}，预计延误 ${delayMin} 分钟，最新预计起飞时刻 ${estDep}。请您留意登机口 ${f.gate} 的信息变化，感谢您的理解与配合。——华翼航空运控中心`;

    if (template === "counter") {

    applyOverride(

        id,
        patch: { status: "delayed", delayMinutes: delayMin, delayReason: `${reasonMeta.text} · 运控发布` },
      }))
    );
    message.success(`延误发布成功：${affected.length} 班航班延误 ${delayMin} 分钟（${reasonMeta.label}）`);
    onLog(`发布延误 · ${affected.length} 班 +${delayMin} 分（${reasonMeta.label.split("（")[0]}）`);
    onClose();
  };

  const stepContent = [
    <div className="wz-step" key="s0">
      <div className="wz-field-label">延误原因分类</div>
      <Radio.Group value={reason} onChange={(e) => setReason(e.target.value)} className="wz-reasons">
        {REASONS.map((r) => (
          <Radio key={r.value} value={r.value} className="wz-reason">
            {r.label}
          </Radio>
        ))}
      </Radio.Group>
      <div className="wz-field-label">预计延误时长（5 – 240 分钟）</div>
      <div className="wz-minutes">
        <InputNumber
          mode="spinner"
          variant="outlined"
          min={5}
          max={240}
          step={5}
          value={delayMin}
          onChange={(v) => setDelayMin(Math.min(Math.max(Number(v) || 45, 5), 240))}
        />
        <span className="wz-unit">分钟</span>
        <span className="wz-quick">
          {QUICK_MINUTES.map((m) => (
            <a key={m} className={`wz-quick-item mono ${delayMin === m ? "on" : ""}`} onClick={() => setDelayMin(m)}>
              {m}
            </a>
          ))}
        </span>
      </div>
    </div>,
    <div className="wz-step" key="s1">
      <div className="wz-field-label">选择受影响的出港航班（已执行航班不可发布）</div>
      <div className="wz-flights">
        {candidates.map((r) => (
          <label key={r.id} className="wz-flight">
            <Checkbox checked={affected.includes(r.id)} onChange={(e) => toggleAffected(r.id, e.target.checked)} />
            <span className="mono wz-f-no">{r.flightNo}</span>
            <span className="mono wz-f-route">{r.from}→{r.to}</span>
            <span className="mono wz-f-time">{fmt(r.schedDep)}</span>
            <StatusTag status={r.status} showIcon={false} />
            <span className="mono wz-f-pax">{r.paxCount} 人</span>
          </label>
        ))}
        {candidates.length === 0 ? <Empty description="当前无待发布的出港航班" /> : null}
      </div>
      <div className="wz-select-all">
        <a onClick={() => setAffected(candidates.map((c) => c.id))}>全选</a>
        <a onClick={() => setAffected([])}>清空</a>
        <span className="mono">已选 {affected.length} 班 · 涉及旅客 {affectedFlights.reduce((s, f) => s + f.paxCount, 0)} 人</span>
      </div>
    </div>,
    <div className="wz-step" key="s2">
      <div className="wz-field-label">通知模板</div>
      <Select value={template} onChange={setTemplate} options={TEMPLATES} style={{ width: "16rem" }} />
      <div className="wz-preview">
        <div className="wz-preview-head">{templateMeta.label} · 内容预览</div>
        <div className="wz-preview-body">{previewText()}</div>
      </div>
    </div>,
    <div className="wz-step" key="s3">
      <div className="wz-confirm">
        <div className="wz-c-row"><span>原因分类</span><b>{reasonMeta.label}</b></div>
        <div className="wz-c-row"><span>延误时长</span><b className="mono">{delayMin} 分钟</b></div>
        <div className="wz-c-row"><span>影响航班</span><b className="mono">{affectedFlights.map((f) => f.flightNo).join(" / ") || "—"}</b></div>
        <div className="wz-c-row"><span>涉及旅客</span><b className="mono">{affectedFlights.reduce((s, f) => s + f.paxCount, 0)} 人</b></div>
        <div className="wz-c-row"><span>通知模板</span><b>{templateMeta.label}</b></div>
      </div>
      <div className="wz-c-warn">
        <Icon name="triangle-alert" size="0.75rem" />
        发布后将同步更新主表状态与延误分钟、顶部运行摘要、登机口网格、波及链与机组执勤。
      </div>
    </div>,
  ];

  return (
    <Modal
      open={open}
      title="发布延误 · 四步向导"
      width={720}
      onCancel={onClose}
      footer={[
        <Button key="cancel" onClick={onClose}>取消</Button>,

          <Button key="prev" onClick={() => setStep(step - 1)}>上一步</Button>
        ) : null,

          <Button key="next" type="primary" disabled={!canNext} onClick={() => setStep(step + 1)}>下一步</Button>
        ) : (
          <Button key="go" type="primary" disabled={affected.length === 0} onClick={handlePublish}>确认发布</Button>

    >
      <div className="wz-step-head">

        <span className="wz-step-hint">按「下一步」逐步完成</span>
      </div>
      {stepContent[step]}
    </Modal>
  );
}
  Object.assign(__export, { DelayWizard });
})();

(function () {
  const { useEffect, useState } = React;
  const { Button, Modal, Radio, message } = antd;
  const { Icon, SPARES, useApp } = __export;
// 更换飞机 · Modal: 备用机列表 + 剩余运力(容量 - 航班旅客数)
// 二次确认: 操作栏触发 → 弹窗内选定备用机 → 确认更换
function SwapModal({ open, onClose, onLog }) {
  const { airport, dataset, selectedFlightId, applyOverride } = useApp();
  const flight = dataset.find((r) => r.id === selectedFlightId);
  const [picked, setPicked] = useState(null);

  useEffect(() => {
    if (open) setPicked(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, selectedFlightId]);

  if (!flight) return null;

  const spares = SPARES[airport];
  const margin = (sp) => sp.capacity - flight.paxCount;
  const usable = (sp) => sp.status === "可用" && margin(sp) >= 0;

  const handleSwap = () => {
    const sp = spares.find((s) => s.tailNo === picked);
    if (!sp) return;
    applyOverride([{ id: flight.id, patch: { tailNo: sp.tailNo } }]);
    message.success(`${flight.flightNo} 已更换飞机 ${sp.tailNo}（${sp.acType} · 剩余运力 ${margin(sp)} 座）`);
    onLog(`更换飞机 · ${flight.flightNo} → ${sp.tailNo}`);
    onClose();
  };

  return (
    <Modal
      open={open}
      title={`更换飞机 · ${flight.flightNo}`}
      width={600}
      onCancel={onClose}
      footer={[
        <Button key="cancel" onClick={onClose}>取消</Button>,
        <Button key="go" type="primary" disabled={!picked} onClick={handleSwap}>确认更换</Button>,
      ]}
    >
      <div className="sw-flight mono">
        {flight.flightNo} · {flight.from}→{flight.to} · 当前 {flight.tailNo}（{flight.acType}） · 旅客 {flight.paxCount} 人
      </div>
      <div className="sw-list">
        {spares.map((sp) => (
          <label key={sp.tailNo} className={`sw-item ${usable(sp) ? "" : "sw-disabled"}`}>
            <Radio checked={picked === sp.tailNo} disabled={!usable(sp)} onChange={() => setPicked(sp.tailNo)} />
            <span className="mono sw-tail">{sp.tailNo}</span>
            <span className="sw-type">{sp.acType}</span>
            <span className="mono sw-cap">{sp.capacity} 座</span>
            <span className={`sw-margin mono ${margin(sp) < 0 ? "bad" : ""}`}>
              {margin(sp) >= 0 ? `余 ${margin(sp)} 座` : `缺 ${-margin(sp)} 座`}
            </span>
            <span className="sw-status">{sp.status}</span>
            <span className="sw-note" title={sp.note}>{sp.note}</span>
          </label>
        ))}
      </div>
      <div className="sw-warn">
        <Icon name="triangle-alert" size="0.75rem" />
        确认后主表注册号、延误波及链与机组执勤面板将按新机号同步刷新。
      </div>
    </Modal>
  );
}
  Object.assign(__export, { SwapModal });
})();

  const { dataset, selectedFlightId, applyOverride } = useApp();
  const flight = dataset.find((r) => r.id === selectedFlightId);
  const [plans, setPlans] = useState([]);

  useEffect(() => {
    if (open) setPlans([]);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open, selectedFlightId]);

  if (!flight) return null;

  const handleCancel = () => {
    applyOverride([
      {
        id: flight.id,
        patch: { status: "cancelled", delayMinutes: 0, delayReason: "运控取消 · 旅客补偿方案已下发" },
      },
    ]);
    message.warning(`${flight.flightNo} 已取消，${flight.paxCount} 名旅客补偿方案已下发（${plans.length} 项）`);
    onLog(`取消航班 · ${flight.flightNo}（补偿 ${plans.length} 项）`);
    onClose();
  };

  return (
    <Modal
      open={open}
      title={
        <span className="cm-title">
          <Icon name="circle-x" size="1rem" />
          取消航班 · {flight.flightNo}
        </span>
      }
      width={560}
      onCancel={onClose}
      footer={[
        <Button key="close" onClick={onClose}>关闭</Button>,
        <Button key="go" danger disabled={plans.length === 0} onClick={handleCancel}>
          确认取消航班
        </Button>,
      ]}
    >
      <div className="cm-info mono">
        {flight.flightNo} · {flight.from}→{flight.to} · 计划 {fmt(flight.schedDep)} 起飞 · 登机口 {flight.gate}
      </div>
      <div className="cm-impact">
        <span className="cm-impact-item">旅客 <b className="mono">{flight.paxCount}</b> 人</span>
        <span className="cm-impact-item">中转旅客 <b className="mono">{flight.transferPax}</b> 人</span>
        <span className="cm-impact-item">当前状态 <b>{STATUS_META[flight.status] ? STATUS_META[flight.status].label : flight.status}</b></span>
      </div>
      <div className="cm-label">旅客补偿方案（至少勾选一项后方可确认）</div>
      <Checkbox.Group className="cm-plans" value={plans} onChange={setPlans}>
        {COMPENSATIONS.map((c) => (
          <Checkbox key={c.value} value={c.value} className="cm-plan">
            {c.label}
          </Checkbox>
        ))}
      </Checkbox.Group>
      <div className="cm-warn">
        <Icon name="triangle-alert" size="0.75rem" />
        确认后主表该行状态置为「取消」，延误分钟清零，顶部运行摘要「已执行/延误/取消」计数同步扣减更新。
      </div>
    </Modal>
  );
}
  Object.assign(__export, { CancelModal });
})();

/* ===== src/views/action-bar/index.jsx ===== */
(function () {
  const { useState } = React;
  const { Button, message } = antd;
  const { Icon, EVENTS, useOpsNow, useApp } = __export;
  const DelayWizard = __export.DelayWizard;
  const SwapModal = __export.SwapModal;
  const CancelModal = __export.CancelModal;
// 区块⑨ 底部操作栏 —— 发布延误(四步向导) / 更换飞机 / 取消航班 / 导出运行日报
// 延误发布与取消均经 context.applyOverride 同步主表、摘要、网格、波及链与机组面板
function ActionBar() {
  const { airport, dataset, selectedFlightId } = useApp();
  const now = useOpsNow();
  const [wizardOpen, setWizardOpen] = useState(false);
  const [swapOpen, setSwapOpen] = useState(false);
  const [cancelOpen, setCancelOpen] = useState(false);
  const [lastAction, setLastAction] = useState(null);

  const selected = dataset.find((r) => r.id === selectedFlightId) || null;

  const requireSelected = () => {
    if (!selected) {
      message.warning("请先在主表选择一个航班");
      return false;
    }
    return true;
  };

  const openSwap = () => {
    if (!requireSelected()) return;
    if (selected.status === "cancelled") {
      message.warning("该航班已取消，无需更换飞机");
      return;
    }
    setSwapOpen(true);
  };

  const openCancel = () => {
    if (!requireSelected()) return;
    if (selected.status === "cancelled") {
      message.warning("该航班已取消");
      return;
    }
    setCancelOpen(true);
  };

  const handleExport = () => {
    message.loading({ content: "运行日报生成中……", key: "export", duration: 0 });
    setTimeout(() => {
      message.success({
        content: `运行日报已导出（PDF）：${airport} ${dataset.length} 班航班 · ${EVENTS[airport].length} 条不正常事件 · 3 条流控`,
        key: "export",
        duration: 3,
      });
      setLastAction(`${now.format("HH:mm")} 导出运行日报（PDF）`);
    }, 1200);
  };

  return (
    <footer className="action-bar">
      <span className="ab-title">
        <Icon name="zap" size="1rem" />
        运行处置
      </span>
      <Button type="primary" icon={<Icon name="megaphone" size="0.875rem" />} onClick={() => setWizardOpen(true)}>
        发布延误
      </Button>
      <Button icon={<Icon name="plane" size="0.875rem" />} onClick={openSwap}>
        更换飞机
      </Button>
      <Button danger icon={<Icon name="circle-x" size="0.875rem" />} onClick={openCancel}>
        取消航班
      </Button>
      <Button icon={<Icon name="download" size="0.875rem" />} onClick={handleExport}>
        导出运行日报
      </Button>
      <div className="ab-log">
        {lastAction ? (
          <span className="mono" title="最近一次处置动作">{lastAction}</span>
        ) : (
          <span>目标航班：{selected ? `${selected.flightNo} · ${selected.tailNo}` : "未选择（在主表点击航班）"}</span>
        )}
      </div>

      <DelayWizard open={wizardOpen} onClose={() => setWizardOpen(false)} onLog={(t) => setLastAction(`${now.format("HH:mm")} ${t}`)} />
      <SwapModal open={swapOpen} onClose={() => setSwapOpen(false)} onLog={(t) => setLastAction(`${now.format("HH:mm")} ${t}`)} />
      <CancelModal open={cancelOpen} onClose={() => setCancelOpen(false)} onLog={(t) => setLastAction(`${now.format("HH:mm")} ${t}`)} />
    </footer>
  );
}
  Object.assign(__export, { ActionBar });
})();

      >
        <div className="app-root aoc-root">
          {/* 区块① 顶部运行栏 */}
          <OpsHeader />

          {/* 主体工作区: 左列(② 航班动态主表 + ④ 登机口调度网格) / 右列(③ 延误波及链 + ⑤ 机组执勤 + ⑧ 运行质量) */}
          <main className="aoc-main">
            <div className="aoc-table-region">
              <FlightTable />
              <GateGrid />
            </div>
            <aside className="aoc-side-region">
              <DelayChain />
              <CrewPanel />
              <OpsQuality />
            </aside>
          </main>

          {/* 次级工作区: ⑥ 气象与流量 + ⑦ 不正常事件 */}
          <div className="aoc-sub-row">

          </div>

          {/* 区块⑨ 底部操作栏: 发布延误 / 更换飞机 / 取消航班 / 导出运行日报 */}

    </AppProvider>
  );
}

})();

root.render(React.createElement(__export.App));
