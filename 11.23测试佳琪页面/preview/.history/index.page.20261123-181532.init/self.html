  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);
  --on-critical: var(--color-text-inverse);
  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);

  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;
  --border-width-thick: 2px;
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

  /* 功能色-成功 */

  /* 功能色-信息 */

  --color-info-secondary-hover: var(--blue-40);

/* ICT 公共组件样式，裁剪至独立报告使用的范围。 */

/* Button 组件样式（token 映射） */
.ant-btn {
  font-size: var(--font-size-md);
  border-radius: var(--radius-base);
  font-weight: var(--font-weight-normal);
  padding-left: 1rem;
  padding-right: 1rem;
  height: 2rem;
  box-shadow: none !important;
  gap: 0.25rem;
}
.ant-btn.ant-btn-color-default {
  color: var(--color-text-primary);
}
.ant-btn.ant-btn-color-default:not(:disabled):hover {
  color: var(--color-text-primary);
  border-color: var(--gray-90);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:not(:disabled):active {
  color: var(--color-text-primary);
  border-color: var(--border-primary);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:disabled {
  color: var(--color-text-disabled);
  background-color: var(--gray-10);
}
.ant-btn.ant-btn-color-primary {
  color: var(--gray-0);
  background-color: var(--color-brand);
}
.ant-btn.ant-btn-color-primary:not(:disabled):hover {
  color: var(--gray-0);
  background-color: var(--brand-40);
}
.ant-btn.ant-btn-color-primary:not(:disabled):active {
  color: var(--gray-0);
  background-color: var(--brand-60);
}
.ant-btn.ant-btn-color-primary:disabled {
  color: var(--gray-0);
  background-color: var(--brand-20);
  border-color: var(--brand-20);
}
.ant-btn.ant-btn-dangerous {
  color: var(--gray-0);
  background-color: var(--red-50);
}
.ant-btn.ant-btn-dangerous:not(:disabled):hover {
  color: var(--gray-0);
  background-color: var(--red-40);
}
.ant-btn.ant-btn-dangerous:not(:disabled):active {
  color: var(--gray-0);
  background-color: var(--red-60);
}
.ant-btn.ant-btn-dangerous:disabled {
  color: var(--gray-0);
  background-color: var(--red-10);
  border-color: var(--red-10);
}
.ant-btn.ant-btn-sm {
  height: 1.75rem;
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  font-size: var(--font-size-base);
}
.ant-btn.ant-btn-lg {
  height: 2.25rem;
  padding-left: 1.25rem;
  padding-right: 1.25rem;
  font-size: var(--font-size-md);
}
.ant-btn.ant-btn-icon-only {
  width: 2rem !important;
  height: 2rem !important;
  min-width: auto !important;
  border: none !important;
  background-color: transparent !important;
  padding: var(--spacing-0);
}
.ant-btn.ant-btn-icon-only .anticon {
  font-size: var(--font-size-2xl);
}
.ant-btn.ant-btn-icon-only.ant-btn-sm {
  width: 1.5rem !important;
  height: 1.5rem !important;
}
.ant-btn.ant-btn-icon-only.ant-btn-sm .anticon {
  font-size: var(--font-size-md);
}
.ant-btn.ant-btn-icon-only:hover,
.ant-btn.ant-btn-icon-only:focus {
  background-color: transparent !important;
}
.ant-btn.ant-btn-variant-link {
  min-width: unset;
  line-height: var(--line-height-sm);
  padding: var(--spacing-0);
  border: none !important;
  background-color: transparent;
  color: var(--color-brand);
}
.ant-btn.ant-btn-variant-link:not(:disabled):hover {
  color: var(--brand-40);
}
.ant-btn.ant-btn-variant-link:not(:disabled):active {
  color: var(--brand-60);
}
.dark .ant-btn.ant-btn-color-default {
  border-color: var(--gray-50);
  background-color: rgb(from var(--gray-100) r g b / 0);
}
.dark .ant-btn.ant-btn-color-default:not(:disabled):hover {
  background-color: rgb(from var(--gray-100) r g b / 0);
  border-color: var(--gray-05);
}
.dark .ant-btn.ant-btn-color-default:not(:disabled):active {
  color: var(--color-text-primary);
  border-color: var(--brand-40);
  background-color: rgb(from var(--gray-100) r g b / 0);
}
.dark .ant-btn.ant-btn-color-default:disabled {
  background-color: rgb(from var(--gray-05) r g b / 0.2);
  border-color: var(--gray-60);
}
.dark .ant-btn.ant-btn-color-primary:not(:disabled):hover {
  background-color: var(--brand-40);
}
.dark .ant-btn.ant-btn-color-primary:not(:disabled):active {
  background-color: var(--brand-60);
}
.dark .ant-btn.ant-btn-color-primary:disabled {
  color: rgb(from var(--gray-05) r g b / 0.3);
  background-color: var(--brand-70);
  border-color: var(--brand-70);
}
.dark .ant-btn.ant-btn-color-dangerous {
  background-color: var(--red-40);
}
.dark .ant-btn.ant-btn-color-dangerous:not(:disabled):hover {
  background-color: var(--red-30);
}
.dark .ant-btn.ant-btn-color-dangerous:not(:disabled):active {
  background-color: var(--red-50);
}
.dark .ant-btn.ant-btn-color-dangerous:disabled {
  color: var(--gray-0);
  background-color: var(--red-80);
  border-color: var(--red-80);
}
.dark .ant-btn.ant-btn-variant-link {
  color: var(--brand-30);
}
.dark .ant-btn.ant-btn-variant-link:not(:disabled):hover {
  color: var(--brand-20);
}
.dark .ant-btn.ant-btn-variant-link:not(:disabled):active {
  color: var(--brand-40);
}
.dark .ant-btn.ant-btn-icon-only {
  color: var(--gray-10);
}
.dark .ant-btn.ant-btn-icon-only:hover .anticon {
  color: var(--brand-20);
}
.dark .ant-btn.ant-btn-icon-only:active .anticon {
  color: var(--brand-40);
}

/* Input 组件样式（占位，待填充 token 映射） */
.ant-input {
  border-radius: var(--radius-base);
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-input::placeholder {
  color: var(--color-text-placeholder);
}
input.ant-input {
  padding: 0 0.75rem;
  height: 2rem;
  font-size: var(--font-size-md);
  line-height: 1.5rem;
  border-radius: var(--radius-base);
  color: var(--color-text-primary);
  border-color: var(--color-border);
  background-color: var(--color-fill-subtle);
  caret-color: var(--brand-50);
}
input.ant-input::placeholder {
  color: var(--color-text-placeholder);
}
input.ant-input.ant-input-lg {
  height: 2.5rem;
  font-size: var(--font-size-md);
  border-radius: var(--radius-base);
}
input.ant-input.ant-input-sm {
  height: 1.75rem;
  font-size: var(--font-size-base);
  border-radius: var(--radius-base);
}
.ant-input-affix-wrapper {
  padding: 0 0.75rem;
  height: 2rem;
  border-radius: var(--radius-base);
  font-size: var(--font-size-md);
}
.ant-input-affix-wrapper.ant-input-affix-wrapper-sm {
  height: 1.75rem;

/* Checkbox 组件样式（token 映射，antd 5 结构：可视框为 .ant-checkbox-inner，
   状态类以 .ant-checkbox 为准（defaultChecked 时 wrapper-checked 不会更新）） */
.ant-checkbox-wrapper {
  color: var(--color-text-primary);
  font-size: var(--font-size-md);
}
.ant-checkbox-wrapper .ant-checkbox-inner {
  width: 1rem;
  height: 1rem;
  border-radius: 0.125rem;
}
.ant-checkbox-wrapper .ant-checkbox-inner::after {
  width: 0.357rem;
  height: 0.571rem;
}
.ant-checkbox-wrapper:hover .ant-checkbox:not(.ant-checkbox-checked) .ant-checkbox-inner {
  border-color: var(--brand-40) !important;
}
.ant-checkbox-wrapper .ant-checkbox.ant-checkbox-disabled:not(.ant-checkbox-checked) .ant-checkbox-inner {
  background-color: rgb(from var(--gray-100) r g b / 0.05);
  border-color: var(--color-border-disabled) !important;
}
.ant-checkbox-wrapper .ant-checkbox.ant-checkbox-disabled:not(.ant-checkbox-checked) + .ant-checkbox-label {
  color: var(--color-text-disabled);
}
.ant-checkbox-wrapper .ant-checkbox:not(.ant-checkbox-checked) .ant-checkbox-inner {
  border-color: var(--gray-40);
  background-color: var(--gray-0);
}
.ant-checkbox-wrapper:hover .ant-checkbox-checked:not(.ant-checkbox-disabled) .ant-checkbox-inner {
  background-color: var(--brand-40) !important;
}
.ant-checkbox-wrapper .ant-checkbox-checked.ant-checkbox-disabled .ant-checkbox-inner {
  background-color: var(--brand-20) !important;
}
.ant-checkbox-wrapper .ant-checkbox-checked.ant-checkbox-disabled .ant-checkbox-inner:after {
  border-color: var(--gray-0);
}
.ant-checkbox-wrapper .ant-checkbox-checked.ant-checkbox-disabled + .ant-checkbox-label {
  color: var(--color-text-disabled);
}
.ant-checkbox-wrapper .ant-checkbox-checked .ant-checkbox-inner {
  background-color: var(--brand-50);
  border-color: transparent ;
}
.ant-checkbox-wrapper .ant-checkbox-indeterminate.ant-checkbox-indeterminate .ant-checkbox-inner {
  background-color: var(--brand-50) !important;
  border-color: transparent !important;
}
.ant-checkbox-wrapper .ant-checkbox-indeterminate.ant-checkbox-indeterminate .ant-checkbox-inner::after {
  width: 10px;
  height: 2px;
  background-color: var(--gray-0);
  border: 0;
  border-radius: 2px;
}
.ant-checkbox-wrapper .ant-checkbox-indeterminate.ant-checkbox-indeterminate:hover .ant-checkbox-inner {
  background-color: var(--brand-40) !important;
}
.ant-checkbox-wrapper .ant-checkbox-indeterminate.ant-checkbox-indeterminate.ant-checkbox-disabled .ant-checkbox-inner {
  background-color: var(--brand-20) !important;
  border-color: transparent !important;
}
.dark .ant-checkbox-wrapper .ant-checkbox:not(.ant-checkbox-checked) .ant-checkbox-inner {
  border-color: var(--gray-50);
  background-color: var(--gray-100);
}
.dark .ant-checkbox-wrapper .ant-checkbox.ant-checkbox-disabled:not(.ant-checkbox-checked) .ant-checkbox-inner {
  background-color: rgb(from var(--gray-05) r g b / 0.2);
  border-color: var(--gray-60) !important;
}
.dark .ant-checkbox-wrapper .ant-checkbox-checked.ant-checkbox-disabled .ant-checkbox-inner {
  background-color: var(--brand-70) !important;
  border-color: transparent !important;
}
.dark .ant-checkbox-wrapper .ant-checkbox-checked.ant-checkbox-disabled .ant-checkbox-inner:after {
  border-color: rgb(from var(--gray-05) r g b / 0.3);
}
.dark .ant-checkbox-wrapper .ant-checkbox-indeterminate.ant-checkbox-indeterminate .ant-checkbox-inner {
  border-color: transparent !important;
}
.dark .ant-checkbox-wrapper .ant-checkbox-indeterminate.ant-checkbox-indeterminate .ant-checkbox-inner::after {
  background-color: rgb(from var(--gray-05) r g b / 0.3);
}
.dark .ant-checkbox-wrapper .ant-checkbox-indeterminate.ant-checkbox-indeterminate.ant-checkbox-disabled .ant-checkbox-inner {
  background-color: var(--brand-70) !important;
  border-color: transparent !important;
}

/* 固定表头使用 header/body，普通表格使用 content；三种容器共享同一 ICT 皮肤。 */
/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 :is(.ant-table-content,.ant-table-header,.ant-table-body)；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body) {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 :is(.ant-table-content,.ant-table-header,.ant-table-body)，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body)::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body)::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;
  border: 2px solid transparent;
  background-color: var(--color-scrollbar);
  background-clip: padding-box;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body)::-webkit-scrollbar-thumb:hover {
  background-color: var(--color-scrollbar-hover);
  background-clip: border-box;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body)::-webkit-scrollbar-track {
  background: transparent;
  border: none;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body)::-webkit-scrollbar-button {
  display: none;
  width: 0;
  height: 0;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body)::-webkit-scrollbar-corner {
  background: transparent;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body) .ant-table-thead > tr > th[style*="text-align: right"] .ant-table-column-sorters {
  justify-content: flex-end;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body) .ant-table-column-sorters {
  justify-content: flex-start;
  max-width: 100%;
}
.ant-table :is(.ant-table-content,.ant-table-header,.ant-table-body) .ant-table-column-sorters .ant-table-column-title {
  flex: 0 1 auto;
