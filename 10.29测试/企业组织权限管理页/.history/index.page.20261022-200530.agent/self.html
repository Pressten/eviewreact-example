  --surface-container-lowest: var(--color-bg-1);
  --surface-container-low: var(--color-bg-2);
  --surface-container: var(--color-bg-2);
  --surface-container-high: var(--color-bg-2);
  --surface-container-highest: var(--color-bg-2);

  --inverse-surface: var(--color-text-primary);
  --inverse-on-surface: var(--color-text-inverse);
  --inverse-on-surface-variant: var(--color-text-inverse-disabled);
  --inverse-primary: var(--color-brand);

  --error: var(--color-error);
  --on-error: var(--color-text-inverse);
  --error-container: var(--color-message-bg-error);
  --on-error-container: var(--color-text-primary);

  --success: var(--color-success);
  --on-success: var(--color-text-inverse);
  --success-container: var(--color-message-bg-success);
  --on-success-container: var(--color-text-primary);

  --critical: var(--color-alert);

  --critical-container: var(--color-message-bg-alert);
  --on-critical-container: var(--color-text-primary);

  --warning: var(--color-warning);
  --on-warning: var(--color-text-inverse);
  --warning-container: var(--color-message-bg-warning);
  --on-warning-container: var(--color-text-primary);

  --info: var(--color-info-primary);
  --on-info: var(--color-text-inverse);
  --info-container: var(--color-message-bg-info);
  --on-info-container: var(--color-text-primary);

  --text-placeholder: var(--color-text-placeholder);
  --text-disabled: var(--color-text-disabled);
  --text-inverse-disabled: var(--color-text-inverse-disabled);

  --interactive-link: var(--color-link);
  --interactive-link-hover: var(--color-link-hover);
  --interactive-link-active: var(--color-link-active);
  --interactive-link-visited: var(--color-link-visited);
  --interactive-link-disabled: var(--color-link-disabled);
  
  --scrim: var(--color-bg-mask);
  --outline: var(--color-border);
  --outline-variant: var(--color-border-separator);
  --divider: var(--color-border-separator);
  --focus-ring: var(--color-border-focus);
  --selected: var(--color-border-focus);

  /* ── spacing → --spacing-* ── */
  --spacing-inline: var(--spacing-2);   /* 8px */
  --spacing-stack: var(--spacing-3);    /* 12px */
  --spacing-gutter: var(--spacing-4);  /* 16px */
  --spacing-inset: var(--spacing-6);    /* 24px */
  --spacing-section: var(--spacing-4); /* 16px */
  --spacing-page: var(--spacing-8);      /* 32px */

  /* ── boxShadow ── */
  --shadow-card: var(--shadow-sm);
  --shadow-popover: var(--shadow-lg);
  --shadow-modal: var(--shadow-xl);

  /* ── borderRadius → --radius-* ── */
  --radius-badge: var(--radius-base);  /* 4px */
  --radius-action: var(--radius-base); /* 4px */
  --radius-container: var(--radius-lg); /* 8px */
  --radius-overlay: var(--radius-lg);  /* 8px */

  /* ── border & outline width ── */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* ── typography → --font-*（角色化 font 简写：字号/行高 字族；字重另行用 --font-weight-* 组合）── */
  /* Display 展示文本 — 英雄标语、数据看板大数字 */
  --font-display-l: var(--font-size-7xl)/var(--line-height-xs) var(--font-family);    /* 60px/1.25 */
  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 标题 — 页面区块标题(H3)→卡片标题→表单区标题 */
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 正文 — 表单标签/按钮文字→表格正文→辅助说明 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 注释 — 时间戳/表格附加信息→底部免责声明 */
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* Cascader 组件样式（占位，待填充 token 映射） */
.ant-cascader-dropdown .ant-cascader-menu {
  height: auto;
  padding: 0.25rem;
  gap: 0.25rem;
  display: flex;
  flex-direction: column;
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item {
  padding: 0 0.5rem;
  height: 2rem;
  font-size: var(--font-size-md);
  color: var(--color-text-primary);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item:hover {
  background-color: var(--color-hover);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-expand .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-primary);
  font-size: var(--font-size-sm);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu .ant-cascader-menu-item.ant-cascader-menu-item-disabled .ant-cascader-menu-item-expand-icon {
  color: var(--color-text-disabled);
}
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled),
.ant-cascader-dropdown .ant-cascader-menu-item-active:not(.ant-cascader-menu-item-disabled):hover {
  font-weight: normal;
  color: var(--color-text-on);
  background-color: var(--color-select);
}

.ant-select:not(.ant-select-customize-input) .ant-select-selector {
  border-color: var(--color-border);
}
.ant-tree-select-dropdown {
  padding: 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree {
  color: var(--color-text-primary);
  background-color: var(--color-bg-4);
  font-size: var(--font-size-md);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode {
  align-items: center;
  margin-bottom: unset;
  padding: 0.25rem 0;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox {
  margin-block-start: unset;
  align-self: unset;
  border: 1px solid var(--color-icon-tertiary);
  border-radius: var(--radius-xs);
  background-color: var(--color-fill-subtle);
  color: var(--color-text-primary);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox .ant-select-tree-checkbox-inner {
  border: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked {
  background-color: var(--color-brand);
  border-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-checked + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate:after {
  background-color: var(--color-brand);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-indeterminate + .ant-select-tree-node-content-wrapper:hover {
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-checkbox.ant-select-tree-checkbox-disabled {
  border: 1px solid var(--color-border-disabled);
  background-color: var(--color-fill-disabled-subtle);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode.ant-select-tree-treenode-disabled .ant-select-tree-node-content-wrapper {
  color: var(--color-text-disabled);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper.ant-select-tree-node-selected:hover {
  color: var(--color-text-on);
  background-color: var(--color-select);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode:not(.ant-select-tree-treenode-disabled) .ant-select-tree-node-content-wrapper:hover {
  color: var(--color-text-primary);
  background-color: var(--color-hover);
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper {
  min-height: unset;
  border-radius: var(--radius-base);
  padding: 0.1875rem 0.5rem 0.1875rem 0.25rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-node-content-wrapper .ant-select-tree-iconEle {
  width: 0.875rem;
  height: 0.875rem;
  vertical-align: baseline;
  margin-right: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode::before {
  display: none;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher {
  width: 1rem;
  height: 1rem;
  display: inline-flex;
  justify-content: center;
  align-self: unset;
  margin-inline-end: 0.5rem;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher .ant-select-tree-switcher-icon {
  height: 0.625rem;
  margin: auto;
}
.ant-tree-select-dropdown .ant-select-tree .ant-select-tree-treenode .ant-select-tree-switcher:before {
  display: none;
}

/* TimePicker/DatePicker 组件样式（antd 5 常规属性覆盖，原 --ant-* 变量方案改写） */
.ant-picker.ant-picker {
  color: var(--color-text-primary);
  border-color: var(--gray-20);
  border-radius: var(--radius-base);
  padding-left: 0.75rem;
  padding-right: 0.75rem;
  height: 2rem;
}
.ant-picker.ant-picker:not(.ant-picker-disabled):hover {
  border-color: var(--gray-90);
}
.ant-picker.ant-picker:focus-within,
.ant-picker.ant-picker.ant-picker-focused {
  border-color: var(--brand-50) !important;
  box-shadow: 0 0 0 1px var(--brand-10);
}

/* Table 组件样式（token 映射；单元格高度按尺寸区分，rem：大 2.5rem / 中 2rem / 小 1.75rem） */
.ant-table {
  font-family: var(--font-family) !important;
  /* antd 5.29 在 .ant-table 上设置了 scrollbar-color（ant-design#47486），且该属性会继承到 .ant-table-content；
     Chrome 121+ 中滚动元素上非 auto 的标准滚动条属性会让 ::-webkit-scrollbar 自定义样式全部失效，
     重置为 auto 以恢复 6px 自定义滚动条（含 base.css 的全局规则） */
  scrollbar-color: auto !important;
}
.ant-table .ant-table-content {
  border-start-start-radius: 0 !important;
  border-start-end-radius: 0 !important;
  /* 滚动条下移：横向滚动条渲染在 padding 之下，这里留出与表格的间距；负 margin 抵消无滚动条表格多占的空间 */
  padding-bottom: 2px;
  margin-bottom: -2px;
  /* 横向滚动条（scroll.x 的滚动容器就是 .ant-table-content，规则生效依赖上方 .ant-table 的 scrollbar-color 重置）
		   注意：Chromium 中 hover 改 ::-webkit-scrollbar 高度存在渲染滞后（需交互才刷新且不还原），
		   故轨道固定 8px；滑块用固定 2px 透明边框把可视区缩到 4px（内半径 = 4-2 = 2px，圆角生效），
		   hover 只切换 background-clip/颜色（纯绘制属性，即时生效）铺满 8px */
  /* 隐藏两端三角按钮与角落 */
  /* 右对齐列（rc-table 以内联 text-align 标记，对 flex 表头无效）：
		   排序表头的 [标题+图标] 组改用 flex-end 整体靠右 */
  /* antd 的 .ant-table-column-sorters::after 是覆盖整个表头单元格的透明点击遮罩（整格可点击排序），
		   它会拦截指针事件导致排序图标自身的 :hover 失效；关闭遮罩指针事件后（点击排序仍经 th 冒泡正常触发），
		   hover 高亮只响应图标区域，悬停标题文字不再变色 */
  /* 排序列：手型光标只在排序图标上，表头其余区域恢复默认箭头（点击任意位置仍可排序） */
}
.ant-table .ant-table-content::-webkit-scrollbar {
  width: 8px;
  height: 8px;
  background: transparent;
  border: none;
}
.ant-table .ant-table-content::-webkit-scrollbar-thumb {
  cursor: pointer;
  border-radius: 4px;

  background-color: #dfdfdf;
  background-clip: padding-box;
}

}

}

/* Segmented 组件样式（占位，待填充 token 映射） */
.ant-segmented {
  border-radius: var(--radius-md);

  background: var(--color-fill);
  /* 尺寸变体：label 基础样式固定了行高/字号，需按 antd 的 lg/sm 类分别覆盖
     规格高度为最外层（.ant-segmented）高度 = label 行高 + 轨道上下内边距 4px：大 40 = 36+4，小 28 = 24+4 */
}
.ant-segmented .ant-segmented-group {
  gap: 0.25rem;
  color: var(--color-text-secondary);
  border-radius: var(--radius-md);
  /* 点击的选项当帧立即呈现选中样式（radio 的 checked 与点击同步更新，
       不必等动效链结束才落地的 item-selected 类，配合完全无动效方案） */
  /* 完全无动效之滑块处理：
       1) 过渡压到 0.01ms —— rc-motion 依赖滑块的 transitionend 结束动效并应用选中类，
          不能用 display:none / transition:none（会卡死内部状态，选中类永不落地）；
       2) 滑块隐形（透明背景、无阴影）—— 残余 2~4 帧里 antd 白色滑块会透过旧选项闪现 */
}

  transition: none;

/* 应用级布局 — 企业后台三栏结构 */
.app-root {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 100vh;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
  overflow: hidden;
}

/* 三栏主区域：组织树 | 中部内容 | 权限面板 */
.app-main {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  align-items: stretch;
  gap: 1rem;
  padding: 0 1.5rem 1.5rem;
  overflow: hidden;
}
.app-main__left {
  width: 18.75rem;
  flex-shrink: 0;
  min-height: 0;
}
.app-main__center {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.app-main__table {
  flex: 1 1 0;
  min-height: 0;
}
.app-main__bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  flex-shrink: 0;
  height: 22rem;
}
.app-main__bottom-item {
  min-height: 0;
  min-width: 0;
}
.app-main__right {
  width: 24rem;
  flex-shrink: 0;
  min-height: 0;
}

/* 自定义 Spin 指示器（loading.svg）尺寸 */
.custom-spin-indicator {
  width: 1.5rem;
  height: 1.5rem;
}

/* 响应式：窄屏下底部双卡改单列 */
@media (max-width: 1280px) {
  .app-main__bottom {
    grid-template-columns: 1fr;
    height: auto;
  }
  .app-main__bottom-item {
    height: 18rem;
  }
}


.top-nav {
  height: 3rem;
  background: var(--surface-container-highest);
  border-bottom: 1px solid var(--divider);
  display: flex;
  align-items: center;
  padding: 0 1.5rem;
  gap: 1.5rem;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.top-nav__brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}
.top-nav__brand-icon {
  color: var(--primary);
}
.top-nav__brand-name {
  font: var(--font-headline-m);
  font-weight: var(--font-weight-semibold);
  color: var(--on-surface);
}
.top-nav__brand-tag {
  margin: 0 !important;
}
.top-nav__menu {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  flex: 1 1 auto;
  justify-content: center;
}
.top-nav__item {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.625rem 0.875rem;
  font: var(--font-body-m);
  color: var(--on-surface-variant);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  border-radius: var(--radius-base);
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  transition: color 0.15s ease;
}
.top-nav__item:hover {
  color: var(--primary);
}
.top-nav__item.is-active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: var(--font-weight-medium);
}
.top-nav__tools {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}
.top-nav__tool-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  border: none;
  background: transparent;
  color: var(--on-surface-variant);
  border-radius: var(--radius-base);
  cursor: pointer;

const orgNodeMap = (() => {
  const map = {};
  const walk = (nodes) => {
    nodes.forEach((n) => {
      map[n.key] = n;
      if (n.children) walk(n.children);
    });
  };
  walk(orgTreeData);
  return map;
})();

// 部门路径文案 — 拼接祖先 title
function getDeptPath(key) {
  const path = [];
  let cur = orgNodeMap[key];
  while (cur) {
    path.unshift(cur.title);
    cur = cur.parentKey ? orgNodeMap[cur.parentKey] : null;
  }
  return path.join(" / ");
}

    ],
  },

// 按角色生成默认权限集（与角色匹配）
function getDefaultPermissions(role) {
  const all = permissionGroups.flatMap((g) => g.items.map((i) => i.key));
  switch (role) {
    case "super_admin":
      // 全部勾选
      return new Set(all);
    case "dept_admin": {
      // 部门级管理：除删除类、下架、删除日志、修改设置、权限配置外
      const exclude = ["user:delete", "org:delete", "app:offline", "audit:delete", "system:edit", "system:perm"];
      return new Set(all.filter((k) => !exclude.includes(k)));
    }
    case "editor": {
      // 编辑：查看 + 编辑/创建/邀请/导出/配置应用
      const include = [
        "user:view", "user:invite", "user:edit",
        "org:view", "org:create",
        "app:view", "app:config", "app:publish",
        "audit:view", "audit:export",
        "system:view",
      ];
      return new Set(include);
    }
    case "external_collaborator": {
      // 外部协作：仅应用模块的查看与配置 + 基础查看
      const include = [
        "user:view", "org:view",
        "app:view", "app:config",
        "audit:view",
        "system:view",
      ];
      return new Set(include);
    }
    case "member":
    default:
      // 普通成员：仅基础查看
      return new Set(["user:view", "org:view", "app:view", "audit:view", "system:view"]);
  }
}

        `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
      );
      const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
      const entry = (Array.isArray(data) ? data : [data]).find(
        (d) => d.icons?.length
      );
      const selected = selectBestIcon(entry?.icons || [], name);
      if (!selected?.url) return null;
      iconInfoMap[name] = { name: selected.name, url: selected.url };
      return iconInfoMap[name];
    } catch (e) {
      return null;
    }
  })();
  iconInfoPromiseMap[name] = p;
  // 落定后清除 in-flight 条目（失败也清除，允许下次重试，不永久缓存 rejected 结果）
  p.finally(() => {
    delete iconInfoPromiseMap[name];
  });
  return p;
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
// 结果缓存在 svgCache；并发去重靠 svgPromiseMap，相同 key 共享同一进行中 Promise
// key 含 size：不同尺寸取回的 SVG 不同，不可复用
function fetchSvg(name, variant, colorHex, size) {
  const key = `${name}&${variant}&${colorHex}&${size}`;
  if (svgCache.has(key)) return Promise.resolve(svgCache.get(key));
  if (svgPromiseMap.has(key)) return svgPromiseMap.get(key);
  const p = (async () => {
    const info = await resolveIconInfo(name);
    if (!info) return "";
    const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
    const colorId = resolveColorId(variant, colorHex);
    try {
      const resp = await fetch(
        `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=${toApiSize(size)}&style=${encodeURIComponent(
          styleValue
        )}&color=${encodeURIComponent(colorId)}&fileType=svg`
      );
      const data = await resp.json(); // { url, name, data } or array
      const item = Array.isArray(data) ? data[0] : data;
      return item?.data || ""; // raw SVG text, injected as-is
    } catch (e) {
      return "";
    }
  })();
  svgPromiseMap.set(key, p);
  // 落定后写入结果缓存并清除 in-flight 条目；空结果（失败）不缓存，允许下次重试
  p.then((s) => {
    if (s) svgCache.set(key, s);
  }).finally(() => {
    svgPromiseMap.delete(key);
  });
  return p;
}

// size → rem 字符串;数字(设计画布 px)兜底转换为 rem
function resolveSize(size) {
  if (typeof size === "number") {
    console.warn(`[Icon] size={${size}} is a number — use rem string instead (e.g. size="${(size / 16).toFixed(4).replace(/\.?0+$/, "")}rem")`);
    const rootFontSize = getRootFontSize();
    const rem = size / rootFontSize;
    return `${parseFloat(rem.toFixed(4))}rem`;
  }
  return size;
}

function Icon({
  name,
  src,
  size = "1rem",
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
  onClick,
  title,
  id,
}) {
  const resolvedSize = resolveSize(size);
  const mergedStyle = onClick ? { cursor: "pointer", ...style } : style;
  const wrapRef = useRef(null);
  const [inheritedColor, setInheritedColor] = useState(null);
  const effectiveColor = color || inheritedColor;
  const [plus, setPlus] = useState(plusState); // reuse already-probed result

    // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才需要继承父元素颜色；
  // Lucide / img 模式颜色由 CSS（currentColor）或属性直接处理，不读计算色、不监听主题
  useLayoutEffect(function () {
    if (src || plus !== true || color) return;
    const el = wrapRef.current;
    if (!el) return; // 尚未挂载（首次 plus===null 返回 null）
    const hex = rgbToHex(getComputedStyle(el).color);
    if (hex && hex !== inheritedColor) setInheritedColor(hex);
  });

  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${effectiveColor}&${size}`) || ""
  );

    // 主题切换时 <html> class 变化不会触发 React 重渲染，需 MutationObserver 主动监听。
  // antd Button 等组件有 transition: color 0.2s，getComputedStyle 在 transition 期间返回中间色值；
  // 立即读一次覆盖无 transition 的图标，200ms 后再读一次覆盖 Button 等带 transition 的图标。
  // 仅 icon-plus 模式（plus 就绪、非 src 资源、无显式 color）才挂观察者，依赖变化时重建
  useEffect(() => {
    if (src || plus !== true || color) return;
    const readColor = () => {
      const el = wrapRef.current;
      if (!el) return;
      const hex = rgbToHex(getComputedStyle(el).color);
      if (hex) setInheritedColor(function (prev) { return hex !== prev ? hex : prev; });
    };
    let timer = null;
    const observer = new MutationObserver(() => {
      readColor();
      if (timer) clearTimeout(timer);
      timer = setTimeout(readColor, 300);
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    return function () {
      observer.disconnect();
      if (timer) clearTimeout(timer);
    };
  }, [plus, src, color]);

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${effectiveColor}&${size}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, effectiveColor, size).then((s) => {
        if (!alive || !s) return; // 空结果（失败）不写入 state，允许下次重试
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, effectiveColor, size]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      id,
      width: resolvedSize,
      height: resolvedSize,
      className: className,
      alt: "",
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: resolvedSize,
        height: resolvedSize,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        id,
        onClick,
        title,
        style: { ...mergedStyle, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      ref: wrapRef,
      id,
      className,
      "aria-hidden": true,
      onClick,
      title,
      style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    });
  }

  return React.createElement("span", {
    ref: wrapRef,
    id,
    className,
    "aria-hidden": true,
    onClick,
    title,
    style: { ...mergedStyle, width: resolvedSize, height: resolvedSize },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

(function () {
  const { useMemo, useState } = React;
  const { Input, Tree, Badge } = antd;
  const { useApp, orgTreeData, orgNodeMap, membersByDept, Icon } = __export;
// 左侧组织树 — 4 层结构、节点带人数 Badge、搜索可过滤
function highlightTitle(title, kw) {
  if (!kw) return title;
  const idx = title.indexOf(kw);
  if (idx === -1) return title;
  return (
    <>
      {title.slice(0, idx)}
      <span className="org-tree__hit">{kw}</span>
      {title.slice(idx + kw.length)}
    </>
  );
}

// 递归构建 antd treeData：title 自定义为「文本 + Badge」
function buildTreeData(nodes, kw, expandedKeys) {
  return nodes.map((n) => {
    const directCount = (membersByDept[n.key] || []).length;
    const hasChild = n.children && n.children.length > 0;
    // 子树人数（包含所有后代直接归属）
    let totalCount = directCount;
    if (hasChild) {
      const sumChildren = (arr) => arr.reduce((acc, c) => {
        const cDirect = (membersByDept[c.key] || []).length;
        const cChildren = c.children ? sumChildren(c.children) : 0;
        return acc + cDirect + cChildren;
      }, 0);
      totalCount = directCount + sumChildren(n.children);
    }
    const titleEl = (
      <span className="org-tree__title">
        <span className="org-tree__title-text">{highlightTitle(n.title, kw)}</span>
        <Badge
          count={totalCount}
          overflowCount={999}
          className="org-tree__count"
          style={{
            backgroundColor: "var(--surface-variant)",
            color: "var(--on-surface-variant)",
            boxShadow: "none",
            fontSize: "0.6875rem",
            height: "1.0625rem",
            lineHeight: "1.0625rem",
            minWidth: "1.5rem",
            padding: "0 0.3125rem",
          }}
        />
      </span>
    );
    return {
      key: n.key,
      title: titleEl,
      icon: hasChild ? null : <Icon name="users" size="0.75rem" color="var(--on-surface-variant)" />,
      children: hasChild ? buildTreeData(n.children, kw, expandedKeys) : undefined,
    };
  });
}

// 过滤树 — 保留命中节点或含命中后代的节点
function filterTree(nodes, kw) {
  if (!kw) return nodes;
  const result = [];
  nodes.forEach((n) => {
    const self = n.title.includes(kw);
    const children = n.children ? filterTree(n.children, kw) : [];
    if (self || children.length > 0) {
      result.push({ ...n, children: children.length > 0 ? children : undefined });
    }
  });
  return result;
}

// 收集命中路径上所有需要展开的祖先 key
function collectExpandKeys(nodes, kw, acc = []) {
  nodes.forEach((n) => {
    const self = n.title.includes(kw);
    const children = n.children || [];
    const childHit = collectExpandKeys(children, kw, acc).length > 0;
    if ((self && children.length > 0) || childHit) acc.push(n.key);
  });
  return acc;
}

function OrgTree() {
  const { selectedDeptKey, selectDept, currentDeptPath } = useApp();
  const [search, setSearch] = useState("");
  const [expandedKeys, setExpandedKeys] = useState([
    "org-root",

    "org-admin",
    "org-tech-rd",
    "org-tech-infra",
    "org-tech-qa",
  ]);

  // 默认展开：根 + 全部事业部 + 技术研发事业部的部门
  const filtered = useMemo(() => filterTree(orgTreeData, search.trim()), [search]);
  const treeData = useMemo(() => buildTreeData(filtered, search.trim(), expandedKeys), [filtered, search, expandedKeys]);

  // 搜索时自动展开命中路径
  const effectiveExpandedKeys = useMemo(() => {
    const kw = search.trim();
    if (!kw) return expandedKeys;
    const auto = [];
    collectExpandKeys(orgTreeData, kw, auto);
    return Array.from(new Set([...expandedKeys, ...auto]));
  }, [search, expandedKeys]);

  const onSelect = (keys) => {
    if (keys.length > 0) selectDept(keys[0]);
  };

  return (
    <div className="org-tree">
      <div className="org-tree__head">
        <h3 className="org-tree__title-label">
          <Icon name="folder-tree" size="1rem" />
          组织架构

        <Input

          suffix={<Icon name="search" size="0.875rem" color="var(--on-surface-variant)" />}
        />
      </div>
      <div className="org-tree__body">
        {filtered.length === 0 ? (
          <div className="org-tree__empty">
            <Icon name="search-x" size="1.5rem" color="var(--on-surface-variant)" />

        ) : (

  Object.assign(__export, { OrgTree });
})();

/* ===== assets/shared/chart.jsx ===== */
(function () {
  const { useRef, useEffect, useState, forwardRef, useImperativeHandle } = React;
// Chart — HUICharts 的 React 封装(命令式 → 声明式)
// 底层: echarts + hui-charts.umd.js(全局 HUICharts),配置项 option 原样透传给 setSimpleOption。
// 暗色联动:自动监听 <html> 的 .dark class,切换 hdesign-light / hdesign-dark 主题并重建图表。
const Chart = forwardRef(function Chart(
  { name, option, className, style, onChartRendered },
  ref
) {
  const containerRef = useRef(null);
  const chartRef = useRef(null);
  const renderedRef = useRef(onChartRendered);
  renderedRef.current = onChartRendered;

  // .dark 切换 → 递增 tick 触发主 effect 重建(走同一条 init/dispose 路径)
  const [darkTick, setDarkTick] = useState(0);
  useEffect(() => {
    const mo = new MutationObserver(() => setDarkTick((t) => t + 1));
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    return () => mo.disconnect();
  }, []);

  useEffect(() => {
    const dom = containerRef.current;
    if (!dom || !window.HUICharts) return;

    const isDark = document.documentElement.classList.contains("dark");
    const chart = new HUICharts();
    chart.init(dom, { renderer: "svg"});
    chart.setSimpleOption(name, {
      theme: isDark ? "hdesign-dark" : "hdesign-light",
      a2ui: true,
      ...option,
    });
    chart.render();
    chartRef.current = chart;
    if (renderedRef.current) renderedRef.current(chart);

    // 容器尺寸变化(侧栏折叠/窗口缩放/响应式) → 同步画布
    const ro = new ResizeObserver(() => {
      if (chartRef.current && !chartRef.current._disposed) chart.resize();
    });
    ro.observe(dom);

    return () => {
      ro.disconnect();
      try { chart.dispose(); } catch (e) { /* 容器已卸载时静默 */ }
      chartRef.current = null;
    };
    // JSON.stringify 作 dep:option 是 JSX 内联对象,内容不变则不重建
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [name, JSON.stringify(option), darkTick]);

  useImperativeHandle(ref, () => ({
    getEchartsInstance: () => (chartRef.current ? chartRef.current.getEchartsInstance() : null),
    resizeHandler: () => {
      if (chartRef.current) chartRef.current.resize();
    },
  }), []);

  const wrapperStyle = { width: "100%", ...style };
  return <div ref={containerRef} className={className} style={wrapperStyle} />;
});
  Object.assign(__export, { Chart });
})();

function AuditLog() {
  const { logs } = useApp();
  const [actionFilter, setActionFilter] = useState("all");

  const filtered = useMemo(() => {
    if (actionFilter === "all") return logs;
    return logs.filter((l) => l.action === actionFilter);
  }, [logs, actionFilter]);

  const successCount = filtered.filter((l) => l.result === "success").length;
  const failedCount = filtered.length - successCount;

  return (
    <SectionCard
      title="审计日志"
      subtitle={`最近权限变更记录 · 共 ${logs.length} 条`}
      icon="scroll-text"
      action={
        <div className="audit-log__stats">
          <Tag bordered={false} color="success">成功 {successCount}</Tag>
          <Tag bordered={false} color="error">失败 {failedCount}</Tag>
        </div>
      }
      bodyClassName="audit-log__body"
    >
      <div className="audit-log__filter">
        <Segmented
          size="small"
          value={actionFilter}
          onChange={(v) => setActionFilter(v)}
          options={auditActionOptions.map((o) => ({ label: o.label, value: o.value }))}
        />
      </div>
      <ul className="audit-log__list">
        {filtered.length === 0 ? (
          <li className="audit-log__empty">
            <Icon name="inbox" size="1.5rem" color="var(--on-surface-variant)" />
            <span>当前筛选条件下无日志记录</span>
          </li>
        ) : (
          filtered.map((l, idx) => (
            <li key={l.id} className={`audit-log__item ${idx === 0 ? "is-latest" : ""}`}>
              <div className="audit-log__item-head">
                <span className="audit-log__time">{l.time}</span>
                <Tag bordered={false} className="audit-log__action-tag">
                  <Icon name="git-commit-vertical" size="0.625rem" />
                  {l.actionLabel}
                </Tag>
                <Tag
                  bordered={false}
                  color={l.result === "success" ? "success" : "error"}
                  className="audit-log__result"
                >
                  {l.result === "success" ? "成功" : "失败"}
                </Tag>
                {idx === 0 && (
                  <span className="audit-log__latest-flag">最新</span>
                )}
              </div>
              <div className="audit-log__item-body">
                <div className="audit-log__row">
                  <Icon name="user-cog" size="0.75rem" color="var(--on-surface-variant)" />
                  <span className="audit-log__operator">{l.operator}</span>
                  <span className="audit-log__sep">→</span>
                  <span className="audit-log__target" title={l.target}>{l.target}</span>
                </div>
                <p className="audit-log__detail">{l.detail}</p>
              </div>
            </li>
          ))
        )}
      </ul>
    </SectionCard>
  );
}
  Object.assign(__export, { AuditLog });
})();

(function () {
  const { useState } = React;
  const { Modal, Input, Select, Cascader, Checkbox, Tag, DatePicker, message } = antd;
  const { useApp, Icon, parentLevelOptions } = __export;
const { RangePicker } = DatePicker;

// 邀请成员表单 — H5 骨架（不使用 antd Form/Form.Item）
// 字段：邮箱、姓名、部门级联选择、角色、有效期日期范围、电话（可选）、发送邀请邮件
const EMPTY = {
  email: "",
  name: "",
  deptPath: ["org-root", "org-tech", "org-tech-rd"],
  deptLabel: "星辰科技 / 技术研发事业部 / 技术研发部",
  role: "member",
  validity: null,
  phone: "",
  sendInvite: true,
};

// Cascader 选项（仅 0/1/2 层，3 层为叶子）
const cascaderOptions = parentLevelOptions.map((root) => ({
  value: root.value,
  label: root.label,
  children: root.children.map((b) => ({
    value: b.value,
    label: b.label,
    children: b.children ? b.children.map((d) => ({ value: d.value, label: d.label })) : undefined,
  })),
}));

function InviteModal() {
  const { modal, setModal, roleConfig } = useApp();
  const [form, setForm] = useState(EMPTY);
  const [errors, setErrors] = useState({});

  const close = () => {
    setForm(EMPTY);
    setErrors({});
    setModal(null);
  };

  const set = (k, v) => {
    setForm((f) => ({ ...f, [k]: v }));
    if (errors[k]) setErrors((e) => ({ ...e, [k]: undefined }));
  };

  const validate = () => {
    const errs = {};
    if (!form.name.trim()) errs.name = "请输入成员姓名";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) errs.email = "请输入有效邮箱地址";
    if (!form.deptPath || form.deptPath.length === 0) errs.deptPath = "请选择所属部门";
    if (!form.role) errs.role = "请选择角色";
    if (!form.validity || form.validity.length !== 2) errs.validity = "请选择有效期范围";
    const ok = Object.keys(errs).length === 0;
    setErrors(errs);
    return ok;
  };

  const onSubmit = () => {
    if (!validate()) return;
    const range = form.validity;
    const fmt = (d) => (d ? d.format("YYYY-MM-DD") : "");
    message.success(`邀请已发送至 ${form.email}（有效期 ${fmt(range[0])} 至 ${fmt(range[1])}）`);
    close();
  };

  return (
    <Modal
      title={
        <span className="modal-title">
          <Icon name="user-plus" size="1rem" /> 邀请成员
        </span>
      }
      open={modal === "invite"}
      onCancel={close}
      onOk={onSubmit}
      okText="发送邀请"
      cancelText="取消"
      width={560}
      destroyOnClose
    >
      <p className="modal-sub">填写成员基本信息与有效期，系统将向其邮箱发送加入邀请。</p>
      <form className="invite-form" onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
        <div className="form-row">
          <div className="form-cell">
            <label className="form-label required" htmlFor="f-email">邮箱</label>
            <div className="form-field">
              <Input
                id="f-email"
                value={form.email}
                status={errors.email ? "error" : undefined}
                onChange={(e) => set("email", e.target.value)}
                placeholder="name@xingchen.com"
                style={{ width: "100%" }}
              />
              {errors.email && <div className="form-error">{errors.email}</div>}
            </div>
          </div>
          <div className="form-cell">
            <label className="form-label required" htmlFor="f-name">姓名</label>
            <div className="form-field">
              <Input
                id="f-name"
                value={form.name}
                status={errors.name ? "error" : undefined}
                onChange={(e) => set("name", e.target.value)}
                placeholder="请输入成员姓名"
                style={{ width: "100%" }}
              />
              {errors.name && <div className="form-error">{errors.name}</div>}
            </div>
          </div>
        </div>

        <div className="form-row">
          <div className="form-cell">
            <label className="form-label required">部门级联选择</label>
            <div className="form-field">
              {/* Cascader 包裹形态：children 作为触发器（按规范要求） */}
              <Cascader
                options={cascaderOptions}
                changeOnSelect
                value={form.deptPath}
                onChange={(value, labels) => {
                  set("deptPath", value || []);
                  set("deptLabel", (labels || []).join(" / "));
                }}
              >
                <Input
                  readOnly
                  value={form.deptLabel}
                  status={errors.deptPath ? "error" : undefined}
                  placeholder="请选择所属部门"
                  suffix={<Icon name="chevron-down" size="0.875rem" color="var(--on-surface-variant)" />}
                  style={{ width: "100%", cursor: "pointer" }}
                />
              </Cascader>
              {errors.deptPath && <div className="form-error">{errors.deptPath}</div>}
            </div>
          </div>
          <div className="form-cell">
            <label className="form-label required" htmlFor="f-role">角色</label>
            <div className="form-field">
              <Select
                id="f-role"
                value={form.role}
                status={errors.role ? "error" : undefined}
                onChange={(v) => set("role", v)}
                style={{ width: "100%" }}
                options={Object.entries(roleConfig).map(([k, v]) => ({
                  value: k,
                  label: (
                    <span className="form-option">
                      <Tag bordered={false} color={v.color}>{v.label}</Tag>
                      <span className="form-option-desc">{v.desc.slice(0, 18)}…</span>
                    </span>
                  ),
                }))}
              />
              {errors.role && <div className="form-error">{errors.role}</div>}
            </div>
          </div>
        </div>

        <div className="form-row form-row--full">
          <div className="form-cell">
            <label className="form-label required" htmlFor="f-validity">有效期日期范围</label>
            <div className="form-field">
              <RangePicker
                id="f-validity"
                value={form.validity}
                status={errors.validity ? "error" : undefined}
                onChange={(v) => set("validity", v)}
                style={{ width: "100%" }}
                placeholder={["开始日期", "结束日期"]}
              />
              {errors.validity && <div className="form-error">{errors.validity}</div>}
            </div>
          </div>
        </div>

        <div className="form-row form-row--full">
          <div className="form-cell">
            <label className="form-label" htmlFor="f-phone">联系电话（可选）</label>
            <Input
              id="f-phone"
              value={form.phone}
              onChange={(e) => set("phone", e.target.value)}
              placeholder="如 138-0010-0099"
              style={{ width: "100%" }}
            />
          </div>
        </div>

        <div className="form-row form-row--full">
          <Checkbox checked={form.sendInvite} onChange={(e) => set("sendInvite", e.target.checked)}>
            同时向成员邮箱发送邀请邮件
          </Checkbox>
        </div>
      </form>
    </Modal>
  );
}
  Object.assign(__export, { InviteModal });
})();

(function () {
  const { useState } = React;
  const { Modal, Input, Select, Cascader, Tag, message } = antd;
  const { useApp, Icon, parentLevelOptions, orgNodeMap, memberList } = __export;
// 新建部门 — 名称 + 父级层级选择（Cascader）+ 部门负责人
const EMPTY = { name: "", parentPath: ["org-root", "org-tech", "org-tech-rd"], managerId: undefined };

function DepartmentModal() {
  const { modal, setModal, selectedDeptKey } = useApp();
  const [form, setForm] = useState({ ...EMPTY, parentPath: pathFromKey(selectedDeptKey) });
  const [errors, setErrors] = useState({});

  const close = () => {
    setForm({ ...EMPTY, parentPath: pathFromKey(selectedDeptKey) });
    setErrors({});
    setModal(null);
  };

  // 把选中的 dept key 转换成到根的路径数组
  function pathFromKey(key) {
    const path = [];
    let cur = orgNodeMap[key];
    while (cur) {
      path.unshift(cur.key);
      cur = cur.parentKey ? orgNodeMap[cur.parentKey] : null;
    }
    return path.length ? path : ["org-root"];
  }

  const cascaderOptions = parentLevelOptions.map((root) => ({
    value: root.value,
    label: root.label,
    children: root.children.map((b) => ({
      value: b.value,
      label: b.label,
      children: b.children ? b.children.map((d) => ({ value: d.value, label: d.label })) : undefined,
    })),
  }));

  const parentKey = form.parentPath[form.parentPath.length - 1];
  const parentLevel = orgNodeMap[parentKey]?.level ?? 0;
  const newLevel = parentLevel + 1;
  const levelLabel = ["一级（事业部）", "二级（部门）", "三级（小组）", "四级（小队）"][newLevel] || "子级";

  const managerOptions = memberList
    .filter((m) => m.deptKey === parentKey || m.deptKey === selectedDeptKey)
    .slice(0, 8)
    .map((m) => ({ value: m.id, label: `${m.name} · ${m.title}` }));

  const validate = () => {
    const errs = {};
    if (!form.name.trim()) errs.name = "请输入部门名称";
    if (!form.parentPath || form.parentPath.length === 0) errs.parentPath = "请选择父级";
    const ok = Object.keys(errs).length === 0;
    setErrors(errs);
    return ok;
  };

  const onSubmit = () => {
    if (!validate()) return;
    const parentName = orgNodeMap[parentKey]?.title || "—";
    message.success(`已在「${parentName}」下创建 ${levelLabel} 部门「${form.name}」`);
    close();
  };

  return (
    <Modal
      title={
        <span className="modal-title">
          <Icon name="folder-plus" size="1rem" /> 新建部门
        </span>
      }
      open={modal === "department"}
      onCancel={close}
      onOk={onSubmit}
      okText="创建"
      cancelText="取消"
      width={520}
      destroyOnClose
    >
      <p className="modal-sub">选择父级层级并命名新部门，可指定部门负责人。</p>
      <form className="invite-form" onSubmit={(e) => { e.preventDefault(); onSubmit(); }}>
        <div className="form-row form-row--full">
          <div className="form-cell">
            <label className="form-label required" htmlFor="d-name">部门名称</label>
            <div className="form-field">
              <Input
                id="d-name"
                value={form.name}
                status={errors.name ? "error" : undefined}
                onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))}
                placeholder="如 数据中台组"
                style={{ width: "100%" }}
              />
              {errors.name && <div className="form-error">{errors.name}</div>}
            </div>
          </div>
        </div>

        <div className="form-row form-row--full">
          <div className="form-cell">
            <label className="form-label required" htmlFor="d-parent">父级层级</label>
            <div className="form-field">
              <Cascader
                id="d-parent"
                value={form.parentPath}
                status={errors.parentPath ? "error" : undefined}
                onChange={(v) => setForm((f) => ({ ...f, parentPath: v }))}
                options={cascaderOptions}
                changeOnSelect
                style={{ width: "100%" }}
                placeholder="请选择父级部门"
              />
              {errors.parentPath && <div className="form-error">{errors.parentPath}</div>}
            </div>
          </div>
        </div>

        <div className="dept-modal__level">
          <Icon name="git-branch" size="0.875rem" color="var(--primary)" />
          <span>新节点将创建为 <Tag bordered={false} color="blue">{levelLabel}</Tag>，挂在「{orgNodeMap[parentKey]?.title || "—"}」之下</span>
        </div>

        <div className="form-row form-row--full">
          <div className="form-cell">
            <label className="form-label" htmlFor="d-mgr">部门负责人（可选）</label>
            <Select
              id="d-mgr"
              value={form.managerId}
              onChange={(v) => setForm((f) => ({ ...f, managerId: v }))}
              options={managerOptions}
              allowClear
              showSearch
              placeholder="从父级部门成员中选择"
              style={{ width: "100%" }}
            />
          </div>
        </div>
      </form>
    </Modal>
  );
}
  Object.assign(__export, { DepartmentModal });
})();

                <span className="transfer-modal__name">{m.name}</span>
                <span className="transfer-modal__from">来自：{orgNodeMap[m.deptKey]?.title || "—"}</span>
                <Icon name="move-right" size="0.875rem" color="var(--on-surface-variant)" />
              </li>
            ))
          )}
        </ul>
      </div>

      <div className="transfer-modal__target">
        <label className="form-label required">目标部门</label>
        <TreeSelect
          value={targetDept}
          onChange={setTargetDept}
          treeData={treeData}
          treeDefaultExpandAll
          style={{ width: "100%", marginTop: "0.5rem" }}
        />
        <div className="transfer-modal__hint">
          <Icon name="info" size="0.75rem" color="var(--on-surface-variant)" />
          <span>调岗后成员将继承目标部门的默认权限策略，原有自定义权限保留。</span>
        </div>
      </div>
    </Modal>
  );
}
  Object.assign(__export, { TransferModal });
})();
