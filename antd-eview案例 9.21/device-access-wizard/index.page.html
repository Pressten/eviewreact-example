// ---- Lucide (offline fallback, table injected at build time) ----
const ICONS = typeof LUCIDE !== "undefined" ? LUCIDE : {};

function camelToKebab(s) {
  return s.replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase();
}

function lookupIcon(name) {
  if (!name) return null;
  return (
    ICONS[name] ||
    ICONS[camelToKebab(name)] ||
    ICONS[name.replace(/-([a-z])/g, (_m, c) => c.toUpperCase())] ||
    null
  );
}

// ---- icon-plus (联通) online flow, same as packages/previewpc ----
const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url }
const svgCache = new Map(); // "name&variant&color" -> svg text

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (cached in iconInfoMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  try {
    const resp = await fetch(
      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length
    );
    const selected = selectBestIcon(entry?.icons || [], name);
    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };
    return iconInfoMap[name];
  } catch (e) {
    return null;
  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

function Icon({
  name,
  src,
  size = 16,
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
}) {
  const [plus, setPlus] = useState(plusState); // reuse already-probed result
  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${color}`) || ""
  );

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${color}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, color).then((s) => {
        if (!alive) return;
        svgCache.set(key, s);
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, color]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      width: size,
      height: size,
      className: className,
      alt: "",
      "aria-hidden": true,
      style: { ...style, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        style: { ...style, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      className,
      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });
  }
  
  return React.createElement("span", {
    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

(function () {
  const { useState, useRef } = React;
  const { Icon, stepItems } = __export;
  const BasicInfoForm = __export.BasicInfoForm;
  const NetworkForm = __export.NetworkForm;
  const ConfirmForm = __export.ConfirmForm;

// Layer 4: 步骤流编排 — 步骤条 + 当前步骤表单 + 底部操作按钮
// 原库: hook 实例 + Promise 校验;eview-react: useRef + ref.submit() → onSuccess 回调
function StepFlow() {
  const [current, setCurrent] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [allValues, setAllValues] = useState({});
  const basicFormRef = useRef(null);
  const networkFormRef = useRef(null);

  // Steps: data=[{text,value}],currentStep 对应 data[].value(非下标)
  const stepData = stepItems.map((s) => ({ text: s.title, value: s.key }));
  const isLast = current === stepItems.length - 1;

  // 每步 onSuccess 回调:存值 + 推进(校验通过才走到这里;onFailed 停本步)
  const handleBasicSuccess = (values) => {
    setAllValues((prev) => ({ ...prev, basic: values }));
    setCurrent((c) => c + 1);
  };
  const handleNetworkSuccess = (values) => {
    setAllValues((prev) => ({ ...prev, network: values }));
    setCurrent((c) => c + 1);
  };

  // 下一步:调用当前步 Form 的 submit(触发校验 → onSuccess 推进)
  function goNext() {
    if (current === 0) {
      basicFormRef.current && basicFormRef.current.submit();
    } else if (current === 1) {
      networkFormRef.current && networkFormRef.current.submit();
    } else {
      setSubmitted(true);
    }
  }

  function goPrev() {
    setCurrent((c) => Math.max(0, c - 1));
  }

  function restart() {
    setSubmitted(false);
    setCurrent(0);
    setAllValues({});
    basicFormRef.current && basicFormRef.current.resetFields();
    networkFormRef.current && networkFormRef.current.resetFields();
  }

  if (submitted) {
    // TODO(eview-react): 结果页组件未覆盖,用 Empty type="success" + 手写内容替代
    return (
      <section className="panel step-panel">
        <Empty
          type="success"
          description={
            <div style={{ textAlign: "center" }}>
              <div
                style={{
                  fontWeight: "var(--font-weight-medium)",
                  color: "var(--on-surface)",
                }}
              >
                设备接入任务已提交
              </div>
              <div style={{ color: "var(--on-surface-variant)", marginTop: "8px" }}>
                {"设备「" + ((allValues.basic && allValues.basic.deviceName) || "未命名") + "」已进入接入调试队列,预计 2 分钟内完成首轮采集"}
              </div>
              <Button
                status="primary"
                text="再配置一台"
                leftIcon={<Icon name="rotate-ccw" size={14} />}
                onClick={restart}
                style={{ marginTop: "16px" }}
              />
            </div>
          }
        />
      </section>
    );
  }

  return (
    <section className="panel step-panel">
      <Steps data={stepData} currentStep={stepData[current].value} />

      <div className="step-content">
        {current === 0 && (
          <BasicInfoForm
            formRef={basicFormRef}
            initialValues={allValues.basic || {}}
            onSuccess={handleBasicSuccess}
          />
        )}
        {current === 1 && (
          <NetworkForm
            formRef={networkFormRef}
            initialValues={allValues.network || {}}
            onSuccess={handleNetworkSuccess}
          />
        )}
        {current === 2 && (
          <ConfirmForm values={{ ...allValues.basic, ...allValues.network }} />
        )}
      </div>

      <div className="step-footer">
        <Button
          onClick={goPrev}
          disabled={current === 0}
          leftIcon={<Icon name="arrow-left" size={14} />}
          text="上一步"
        />
        <Button
          status="primary"
          onClick={goNext}
          text={isLast ? "提交配置" : "下一步"}
          rightIcon={isLast ? undefined : <Icon name="arrow-right" size={14} />}
        />
      </div>
    </section>
  );
}
  Object.assign(__export, { StepFlow });
})();

  return (
    <div className="shell">
      <header className="shell-header">
        <div className="shell-brand">
          <Icon name="zap" size={22} className="shell-brand-icon" />
          <span className="shell-brand-text">电力接入平台</span>
        </div>
        <div className="shell-tools">
          <SearchInput
            placeholder="搜索设备 / 站点"
            className="shell-search"
          />
          <Button
            onClick={toggleDark}
            leftIcon={<Icon name={isDark ? "sun" : "moon"} size={14} />}
          />
          <div className="shell-avatar" title={isDark ? "切换浅色" : "切换深色"}>
            王
          </div>
        </div>
      </header>

      <div className="shell-body">
        <aside className="shell-sider">
          <nav className="app-menu">
            {menuItems.map((m) => (
              <button
                key={m.key}
                type="button"
                className={"app-menu-item" + (activeKey === m.key ? " active" : "")}
                onClick={() => setActiveKey(m.key)}
              >
                <Icon name={m.icon} size={14} className="app-menu-icon" />
                <span>{m.label}</span>
              </button>
            ))}
          </nav>
        </aside>

        <main className="shell-content">
          <Crumbs
            data={breadcrumbs.map((b) => ({ title: b }))}
            className="shell-breadcrumb"
          />
          <StepFlow />
        </main>
      </div>
    </div>
  );
}
  Object.assign(__export, { AppShell });
})();

/* ===== app.jsx ===== */
(function () {
  const { AppProvider } = __export;
  const AppShell = __export.AppShell;
// 应用入口 — ICT React 页面
// Layer 5 布局骨架:组装 Provider + AppShell;视图组件见 src/views/
// IntlProvider 必须是 ConfigProvider 的直接子级,否则弹层 portal 取不到组件文案

const APP_TITLE = "设备接入配置向导";

function App() {
  return (
    <AppProvider>
      <ConfigProvider>
        <IntlProvider locale="zh" messages={componentsLocales.zh}>
          <AppShell />
        </IntlProvider>
      </ConfigProvider>
    </AppProvider>
  );
}
  Object.assign(__export, { App, APP_TITLE });
})();
/* ===== render ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(__export.App));
</script>
</body>
</html>
