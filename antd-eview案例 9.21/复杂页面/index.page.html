  /* 鈹€鈹€ border & outline width 鈹€鈹€ */
  --border-width-thin: 1px;    
  --border-width-thick: 2px;  
  --outline-width-focus: 1px;
  --outline-offset-gap: 2px;

  /* 鈹€鈹€ typography 鈫?--font-*锛堣鑹插寲 font 绠€鍐欙細瀛楀彿/琛岄珮 瀛楁棌锛涘瓧閲嶅彟琛岀敤 --font-weight-* 缁勫悎锛夆攢鈹€ */
  /* Display 灞曠ず鏂囨湰 鈥?鑻遍泟鏍囪銆佹暟鎹湅鏉垮ぇ鏁板瓧 */

  --font-display-m: var(--font-size-6xl)/var(--line-height-sm) var(--font-family);    /* 48px/1.375 */
  --font-display-s: var(--font-size-5xl)/var(--line-height-sm) var(--font-family);    /* 36px/1.375 */
  /* Headline 鏍囬 鈥?椤甸潰鍖哄潡鏍囬(H3)鈫掑崱鐗囨爣棰樷啋琛ㄥ崟鍖烘爣棰?*/
  --font-headline-l: var(--font-size-2xl)/var(--line-height-sm) var(--font-family);   /* 20px/1.375 */
  --font-headline-m: var(--font-size-xl)/var(--line-height-sm) var(--font-family);    /* 18px/1.375 */
  --font-headline-s: var(--font-size-lg)/var(--line-height-base) var(--font-family);  /* 16px/1.5 */
  /* Body 姝ｆ枃 鈥?琛ㄥ崟鏍囩/鎸夐挳鏂囧瓧鈫掕〃鏍兼鏂団啋杈呭姪璇存槑 */
  --font-body-l: var(--font-size-lg)/var(--line-height-base) var(--font-family);      /* 16px/1.5 */
  --font-body-m: var(--font-size-md)/var(--line-height-base) var(--font-family);      /* 14px/1.5 */
  --font-body-s: var(--font-size-base)/var(--line-height-md) var(--font-family);      /* 12px/1.625 */
  /* Caption 娉ㄩ噴 鈥?鏃堕棿鎴?琛ㄦ牸闄勫姞淇℃伅鈫掑簳閮ㄥ厤璐ｅ０鏄?*/
  --font-caption-m: var(--font-size-base)/var(--line-height-md) var(--font-family);   /* 12px/1.625 */
  --font-caption-s: var(--font-size-sm)/var(--line-height-lg) var(--font-family);    /* 10px/1.8 */
}

/* 缁勪欢鏍峰紡姹囨€伙細鐢?npm run build:css 鐢熸垚锛屽嬁鎵嬫敼 */
.ant-table {

  font-size: var(--font-size-md);
}

/* Divider 缁勪欢鏍峰紡锛堝崰浣嶏紝寰呭～鍏?token 鏄犲皠锛?*/
.ant-divider {
  border-color: var(--gray-10);
}
.dark .ant-divider {
  border-color: var(--color-border-separator);
}

/* Button 缁勪欢鏍峰紡锛坱oken 鏄犲皠锛?*/
.ant-btn {
  font-size: var(--font-size-md);
  border-radius: var(--radius-base);
  font-weight: var(--font-weight-normal);
  min-width: calc(var(--spacing-4) * 5.5);
  box-shadow: none !important;
  gap: 4px;
}
.ant-btn.ant-btn-color-default {
  color: var(--color-text-primary);
}
.ant-btn.ant-btn-color-default:not(:disabled):hover {
  color: var(--color-text-primary);
  border-color: var(--gray-90);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:not(:disabled):active {
  color: var(--color-text-primary);
  border-color: var(--border-primary);
  background-color: var(--color-bg-2);
}
.ant-btn.ant-btn-color-default:disabled {
  color: var(--color-text-disabled);
  background-color: var(--gray-10);
}
.ant-btn.ant-btn-color-primary {
  color: var(--gray-0);
  background-color: var(--color-brand);
}
.ant-btn.ant-btn-color-primary:not(:disabled):hover {
  color: var(--gray-0);
  background-color: var(--brand-40);
}
.ant-btn.ant-btn-color-primary:not(:disabled):active {
  color: var(--gray-0);
  background-color: var(--brand-60);
}

  color: var(--gray-0);
  background-color: var(--brand-20);
  border-color: var(--brand-20);
}
.ant-btn.ant-btn-dangerous {
  color: var(--gray-0);
  background-color: var(--red-50);
}
.ant-btn.ant-btn-dangerous:not(:disabled):hover {
  color: var(--gray-0);
  background-color: var(--red-40);
}
.ant-btn.ant-btn-dangerous:not(:disabled):active {
  color: var(--gray-0);
  background-color: var(--red-60);
}
.ant-btn.ant-btn-dangerous:disabled {
  color: var(--gray-0);
  background-color: var(--red-10);
  border-color: var(--red-10);
}
.ant-btn.ant-btn-sm {
  height: 28px;
}

  height: 36px;
  padding: var(--spacing-0) var(--spacing-5);

  border: none !important;

}

}

  font-size: var(--font-size-md);
}
.ant-btn.ant-btn-icon-only:hover,
.ant-btn.ant-btn-icon-only:focus {
  background-color: transparent !important;
}
.ant-btn.ant-btn-variant-link {
  min-width: unset;
  line-height: 22px;

  border: none !important;
  background-color: transparent;

}

.app-root {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--surface-container-lowest);
  color: var(--on-surface);
  font: var(--font-body-m);
}

/* 鈹€鈹€ 涓讳綋楠ㄦ灦锛氫晶杈瑰鑸?+ 鍐呭鍖?鈹€鈹€ */
.app-body {
  display: flex;
  flex: 1;
  min-height: 0;
}

.app-main {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: var(--spacing-page);
  background: var(--surface-container-lowest);
}

.app-main__stack {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-section);
}

/* 鈹€鈹€ 椤靛ご锛氭爣棰?+ 涓绘搷浣?鈹€鈹€ */
.app-page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--spacing-gutter);
  margin-bottom: var(--spacing-6);
}

.app-page-head__text {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-0-5);
  min-width: 0;
}

.app-page-head__crumb {
  color: var(--on-surface-variant);
  font: var(--font-caption-m);
}

.app-page-head__title {
  margin: 0;
  color: var(--on-surface);
  font: var(--font-headline-l);
  font-weight: var(--font-weight-semibold);
}

.app-page-head__desc {
  margin: 0;
  color: var(--on-surface-variant);
  font: var(--font-body-s);
}

.app-page-head__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  flex: none;
}

.app-page-head__btn {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-inline);
  height: 32px;
  padding: 0 var(--spacing-4);
  border: var(--border-width-thin) solid var(--outline);
  border-radius: var(--radius-action);
  background: var(--surface-container-highest);
  color: var(--on-surface);
  font: var(--font-body-m);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}

.app-page-head__btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.app-page-head__btn--primary {
  border-color: transparent;
  background: var(--primary);
  color: var(--on-primary);
  font-weight: var(--font-weight-medium);
}

.app-page-head__btn--primary:hover {
  background: var(--primary-hover);

          </p>
        </div>
        <SelectCard
          value={view}
          data={[
            { text: t("table.filter.all"), value: "all" },
            { text: t("table.filter.enabled"), value: "enabled" },
            { text: t("table.filter.disabled"), value: "disabled" },
          ]}
          onChange={(v) => setView(v)}
        />
      </header>

      <div className="strategy-table__toolbar">
        <TextField
          className="strategy-table__search"
          placeholder={t("table.search.ph")}
          value={keyword}
          onChange={(v) => setKeyword(v)}
        />
        <span className="strategy-table__count">
          {selectedRowKeys.length
            ? intl.formatMessage({ id: "table.selected" }, { count: selectedRowKeys.length })
            : `${dataset.length} / ${strategyRows.length}`}
        </span>
        <div className="strategy-table__toolbar-ops">
          <Button
            leftIcon={<Icon name="play" size={14} />}
            disabled={!selectedRowKeys.length}
            onClick={() => batch("enable")}
          >
            {t("table.batch.enable")}
          </Button>
          <Button
            leftIcon={<Icon name="pause" size={14} />}
            disabled={!selectedRowKeys.length}
            onClick={() => batch("disable")}
          >
            {t("table.batch.disable")}
          </Button>
          <TipBox content={t("table.refresh")}>
            <Button
              leftIcon={<Icon name="refresh-cw" size={14} />}
              onClick={() => showToast(t("table.refresh"))}
            />
          </TipBox>
        </div>
      </div>

      <Table
        keyIndex="id"
        columns={columns}
        dataset={dataset}
        scroll={{ x: 1290 }}
        emptyTableMsg={
          <div className="strategy-table__empty">
            <Icon name="file-text" size={24} />
            <strong>{t("table.empty")}</strong>
            <span>{t("table.emptyHint")}</span>
          </div>
        }
        enableCheckBox
        onRowCheck={(keys) => setSelectedRowKeys(keys)}
        enablePagination
        pagingProps={{
          defaultPageSize: 8,
          showSizeChanger: true,
          showQuickJumper: true,
          pageSizeOptions: [8, 16, 24],
        }}
        expandable={{
          expandedRowRender: (row) => (
            <div className="strategy-table__expand">
              <div className="strategy-table__expand-item">
                <span className="strategy-table__expand-k">{t("table.expand.threshold")}</span>
                <span className="strategy-table__expand-v">{row.threshold}%</span>
              </div>
              <div className="strategy-table__expand-item">
                <span className="strategy-table__expand-k">{t("table.expand.retry")}</span>
                <span className="strategy-table__expand-v">
                  {row.retry} {t("form.retry.unit")}
                </span>
              </div>
              <div className="strategy-table__expand-item">
                <span className="strategy-table__expand-k">{t("table.expand.notify")}</span>
                <span className="strategy-table__expand-v">
                  {row.notify
                    .map((n) => translator(notifyOptions.find((o) => o.value === n).labelId))
                    .join(" / ")}
                </span>
              </div>
              <div className="strategy-table__expand-item">
                <span className="strategy-table__expand-k">{t("table.expand.flap")}</span>
                <span className="strategy-table__expand-v">
                  {row.flap ? t("table.expand.on") : t("table.expand.off")}
                </span>
              </div>
            </div>
          ),
        }}
      />

      {toast ? (
        <DivMessage key={toast.key} display type={toast.type}>
          {toast.msg}
        </DivMessage>
      ) : null}
    </section>
  );
}
  Object.assign(__export, { StrategyTable });
})();

/* ===== src/views/strategy-modal/index.jsx ===== */
(function () {
  const { useEffect, useRef, useState } = React;
  const { Dialog, Form, Toggle, Button, DivMessage } = window.EviewReact || {};
  const { useIntl } = ReactIntl;
  const { Icon } = __export;
  const StrategyFields = __export.StrategyFields;
// Layer 4: 绛栫暐寮圭獥琛ㄥ崟 鈥?椤甸潰澶?琛ㄦ牸琛屽潎鍙敜璧凤紝澶嶇敤鍚屼竴濂楀弬鏁板瓧娈?function StrategyModal({ open, record, onClose }) {
  const formRef = useRef(null);
  const [enableNow, setEnableNow] = useState(true);
  const [toast, setToast] = useState(null);
  const intl = useIntl();
  const t = (id, fallback) => intl.formatMessage({ id, defaultMessage: fallback || id });

  const showToast = (msg) => setToast({ key: Date.now(), msg });

  useEffect(() => {
    if (!open) return;
    if (record) {
      setEnableNow(record.status === "enabled");
      formRef.current && formRef.current.setFieldsValue({
        name: record.name,
        deviceType: record.deviceType,
        intervalSec: record.intervalSec,
        level: record.level,
      });
    } else {
      setEnableNow(true);
      formRef.current && formRef.current.resetFields();
    }
  }, [open, record]);

  const handleSuccess = (values) => {
    showToast(record ? t("toast.updated") : t("toast.created"));
    onClose();
  };

  const handleDraft = () => {
    showToast(t("toast.draft"));
    onClose();
  };

  return (
    <>
      <Dialog
        isOpen={open}
        onClose={onClose}
        title={
          <span className="strategy-modal__title">
            <Icon name="circle-plus" size={16} />
            {record ? t("modal.title.edit") : t("modal.title.new")}
          </span>
        }
        buttons={[
          { text: t("modal.cancel"), onClick: () => onClose() },
          { text: t("modal.draft"), onClick: handleDraft },
          { text: t("modal.ok"), status: "primary", onClick: () => formRef.current && formRef.current.submit() },
        ]}
      >
        <p className="strategy-modal__desc">{t("modal.desc")}</p>

        <Form
          ref={formRef}
          layout="vertical"
          validateErrorType="tip"
          onSuccess={handleSuccess}
          onFailed={() => {}}
          initialValues={{ level: "warning", intervalSec: 60, flap: true }}
        >
          <StrategyFields advanced={false} />

          <div className="switch-row">
            <div className="switch-row__text">
              <span className="switch-row__label">{t("modal.enableNow")}</span>
              <span className="switch-row__desc">{t("modal.enableNowDesc")}</span>
            </div>
            <Toggle toggled={enableNow} onToggle={(v) => setEnableNow(v)} />
          </div>

          <p className="strategy-modal__status">
            <Icon name={enableNow ? "circle-check" : "pencil-line"} size={12} />
            {enableNow ? t("opt.status.enabled") : t("opt.status.draft")}
          </p>
        </Form>
      </Dialog>

      {toast ? (
        <DivMessage key={toast.key} display type="success">
          {toast.msg}
        </DivMessage>
      ) : null}
    </>
  );
}
  Object.assign(__export, { StrategyModal });
})();
